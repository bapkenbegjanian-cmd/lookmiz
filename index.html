<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="google-site-verification" content="tPkA79ZQCeMVM4kRewvgCNKZUg0uWoztpdDwAbVpFfc" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lookmiz — invitations et cartes animées</title>
<meta name="description" content="Crée des invitations et des cartes de vœux animées : anniversaire, mariage, baptême, Noël, Aïd… Une enveloppe qui s'ouvre, des réponses des invités, en quelques minutes.">
<meta name="theme-color" content="#fbf6ef">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Cinzel:wght@500;700&family=Fredoka:wght@500;700&family=Great+Vibes&family=Pacifico&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Mise en page : une boutique de cartes. Accueil → catégorie → occasion (galerie de modèles) → personnalisation → partage.
   Le destinataire reçoit une enveloppe qui s'ouvre, puis la carte animée. */
:root {
  --bg: #f4f0ea; --paper: #ffffff; --ink: #0e0e10; --muted: #77716a; --line: #e2dcd2;
  --acc: #b8965a; --acc2: #0e0e10; --gold: #b8965a; --night: #0e0e10; --champ: #d8bd8a;
  --ui: "Inter", system-ui, sans-serif; --title: "Instrument Serif", "Playfair Display", Georgia, serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--ui); }
body { min-height: 100vh; }
button, input, textarea, select { font: inherit; color: inherit; }
img { display: block; max-width: 100%; }
[hidden] { display: none !important; }
.app { max-width: 1120px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 10px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 40px) max(20px, env(safe-area-inset-left, 0px)); }
.top { display: flex; align-items: center; gap: 12px; height: 56px; margin-bottom: 10px; border-bottom: 1px solid var(--line); }
.logo { font: 400 30px/1 var(--title); letter-spacing: 0; color: var(--ink); background: none; border: 0; cursor: pointer; padding: 0; }
.logo span { font-style: italic; color: var(--acc); }
.back { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); cursor: pointer; font-size: 17px; }
.top .sp { flex: 1; }
.mine { border: 0; background: none; padding: 8px 2px; font-weight: 600; font-size: 14px; cursor: pointer; letter-spacing: .02em; border-bottom: 1px solid var(--ink); }
.screen { display: grid; gap: 26px; animation: in .5s cubic-bezier(.2,.8,.2,1) both; }
@keyframes in { from { opacity: 0; transform: translateY(10px); } }
h1, h2 { font-family: var(--title); font-weight: 400; margin: 0; line-height: 1; letter-spacing: -.015em; text-wrap: balance; }
h1 { font-size: clamp(52px, 13vw, 104px); }
h2 { font-size: clamp(36px, 8vw, 56px); }
h1 i, h2 i { font-style: italic; color: var(--acc); }
.sub { color: var(--muted); margin: 0; max-width: 44ch; font-size: 16.5px; }
.kicker { font-size: 11.5px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
.cta { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 0; border-radius: 99px; padding: 16px 26px; font-weight: 600; font-size: 15.5px; letter-spacing: .02em; color: #fff; background: var(--ink); cursor: pointer; text-decoration: none; transition: transform .15s, background .2s; }
.cta:hover { background: #2b2723; }
.cta:active { transform: scale(.97); }
.cta.full { width: 100%; }
.ghost { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--ink); border-radius: 99px; padding: 14px 22px; font-weight: 600; background: transparent; cursor: pointer; text-decoration: none; color: var(--ink); }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--acc); outline-offset: 3px; }

/* --- accueil --- */
.bleed { margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw); }
.home { gap: 56px; }
.night { background: var(--night); color: #f4f0ea; margin-top: -86px; padding-top: 70px; overflow: hidden; position: relative; }
.night::before { content: ""; position: absolute; inset: 0; background: radial-gradient(600px 400px at 80% 40%, rgba(216,189,138,.16), transparent 70%); pointer-events: none; }
.nin { position: relative; max-width: 1120px; margin: 0 auto; padding: 44px max(20px, env(safe-area-inset-right, 0px)) 64px max(20px, env(safe-area-inset-left, 0px)); display: grid; gap: 40px; align-items: center; }
.htxt { display: grid; gap: 20px; }
.night .kicker { color: var(--champ); }
.night h1 { color: #f8f4ec; } .night h1 i { color: var(--champ); }
.night p { margin: 0; color: #b9b2a7; font-size: 17px; max-width: 36ch; }
.acts { display: flex; gap: 10px; flex-wrap: wrap; }
.cta.lt { background: var(--champ); color: #17130c; } .cta.lt:hover { background: #e6cfa2; }
.ghost.lt { border-color: rgba(244,240,234,.4); color: #f4f0ea; }
.from { font-size: 13px; color: #8c857a; letter-spacing: .04em; }
.ishome .top { position: relative; z-index: 3; border-color: rgba(255,255,255,.12); }
.ishome .logo { color: #f4f0ea; } .ishome .logo span { color: var(--champ); }
.ishome .mine { color: #f4f0ea; border-color: rgba(244,240,234,.6); }
body.ishome { background: linear-gradient(var(--night) 0 400px, var(--bg) 400px); }
/* enveloppe de démonstration, qui s'ouvre en boucle */
.loopenv { position: relative; width: min(84vw, 400px); aspect-ratio: 1.45; margin: 70px auto 10px; }
.loopenv .eback, .loopenv .front, .loopenv .flap { position: absolute; inset: 0; background: var(--e-paper); border-radius: 8px; }
.loopenv .eback { box-shadow: 0 40px 80px rgba(0,0,0,.5); }
.loopenv .front { clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%); z-index: 4; background: linear-gradient(170deg, color-mix(in srgb, var(--e-paper) 94%, #fff), var(--e-paper)); }
.loopenv .flap { clip-path: polygon(0 0, 100% 0, 50% 58%); transform-origin: top; z-index: 5; background: color-mix(in srgb, var(--e-paper) 86%, #000); animation: lflap 7s cubic-bezier(.5,0,.3,1) infinite; }
.loopenv .seal { position: absolute; left: 50%; top: 52%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; z-index: 6; display: grid; place-items: center; font: 400 26px var(--title); color: #fff7e8; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--e-seal) 75%, #fff), var(--e-seal) 60%, color-mix(in srgb, var(--e-seal) 70%, #000)); box-shadow: 0 4px 10px rgba(0,0,0,.35); animation: lseal 7s ease infinite; }
.loopenv .inner { position: absolute; left: 7%; right: 7%; top: 6%; bottom: 6%; z-index: 3; border-radius: 6px; overflow: hidden; animation: linner 7s cubic-bezier(.3,.7,.2,1) infinite; }
@keyframes lseal { 0%, 12% { transform: scale(1); opacity: 1; } 20%, 86% { transform: scale(1.5); opacity: 0; } 96%, 100% { transform: scale(1); opacity: 1; } }
@keyframes lflap { 0%, 16% { transform: rotateX(0); z-index: 5; } 30%, 84% { transform: rotateX(180deg); z-index: 1; } 96%, 100% { transform: rotateX(0); z-index: 5; } }
@keyframes linner { 0%, 30% { transform: translateY(0); } 50%, 80% { transform: translateY(-62%); } 94%, 100% { transform: translateY(0); } }
/* les deux choix */
.cats { display: grid; gap: 18px; }
.catc { position: relative; overflow: hidden; border: 0; padding: 0; border-radius: 22px; cursor: pointer; color: #fff; text-align: left; aspect-ratio: 4 / 4.4; isolation: isolate; }
.catc .pic { position: absolute; inset: 0; z-index: -2; }
.catc img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s cubic-bezier(.2,.8,.2,1); }
.catc::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(14,14,16,0) 35%, rgba(14,14,16,.82)); }
.catc:hover img { transform: scale(1.06); }
.catc .cap { position: absolute; left: 24px; right: 24px; bottom: 24px; display: grid; gap: 6px; }
.catc b { font: 400 44px/1 var(--title); }
.catc small { font-size: 14.5px; color: rgba(255,255,255,.82); }
.catc .go { margin-top: 10px; width: max-content; font-size: 14px; font-weight: 600; padding: 11px 20px; border-radius: 99px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.4); backdrop-filter: blur(8px); transition: background .2s, color .2s; }
.catc:hover .go { background: #fff; color: var(--ink); }
/* défilement continu des modèles */
.sec { display: grid; gap: 16px; }
.sec .head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.home .sec h3 { margin: 0; font: 400 clamp(34px, 7vw, 46px)/1 var(--title); }
.marq { overflow: hidden; margin: 0 calc(50% - 50vw); padding: 8px 0 14px; -webkit-mask: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); mask: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
.mtrack { display: flex; gap: 18px; width: max-content; animation: marq 60s linear infinite; padding-left: 18px; }
.marq:hover .mtrack { animation-play-state: paused; }
.mtrack .mdl { width: 170px; }
.mtrack .mdl b { font: 400 19px var(--title); }
@keyframes marq { to { transform: translateX(-50%); } }
.closing { text-align: center; display: grid; justify-items: center; gap: 16px; padding: 20px 0 10px; }
/* apparition au défilement */
.rv { opacity: 0; transform: translateY(26px); transition: opacity .9s cubic-bezier(.2,.8,.2,1) var(--d, 0ms), transform .9s cubic-bezier(.2,.8,.2,1) var(--d, 0ms); }
.rv.on { opacity: 1; transform: none; }
.mdl .card { box-shadow: 0 16px 34px rgba(14,14,16,.16); transition: transform .4s cubic-bezier(.2,.8,.2,1), box-shadow .4s; }
.mdl:hover .card { transform: translateY(-8px); box-shadow: 0 26px 46px rgba(14,14,16,.22); }
.occs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.occ { border: 0; background: none; padding: 0; cursor: pointer; display: grid; gap: 8px; text-align: left; }
.occ img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 4px; transition: transform .6s; }
.occ:hover img { transform: scale(1.03); }
.occ b { font: 400 22px var(--title); }

/* --- galerie --- */
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.mdl { border: 0; padding: 0; background: none; cursor: pointer; text-align: left; display: grid; gap: 8px; }
.mdl .card { box-shadow: 0 12px 26px rgba(28,23,18,.14); transition: transform .25s; }
.mdl:hover .card { transform: translateY(-4px) rotate(-1deg); }
.mdl b { font-size: 14px; }
.mdl small { color: var(--muted); font-size: 12px; }

/* --- la carte --- */
.card { position: relative; width: 100%; aspect-ratio: 3 / 4.2; border-radius: 6px; overflow: hidden; container-type: inline-size; background: var(--c-bg); color: var(--c-ink); isolation: isolate; }
.card::before { content: ""; position: absolute; inset: 4.5cqw; border: .7cqw solid color-mix(in srgb, var(--c-acc) 70%, transparent); border-radius: 3cqw; pointer-events: none; z-index: 2; }
.card::after { content: ""; position: absolute; inset: 6.5cqw; border: .25cqw solid color-mix(in srgb, var(--c-acc) 45%, transparent); border-radius: 2cqw; pointer-events: none; z-index: 2; }
.card canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
.card .ph { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
.card .ph img { width: 100%; height: 100%; object-fit: cover; }
.card .orn { width: 34cqw; height: auto; color: var(--c-acc); margin: -1cqw 0; }
/* plein : photo plein cadre, texte en bas sur un voile */
.card.l-plein .ph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.1) 20%, rgba(0,0,0,.55) 55%, rgba(0,0,0,.85)); }
.card.l-plein .ct, .card.l-cadre .ct { color: #fff; }
.card.l-plein .ct { inset: auto 10cqw 12cqw; align-content: end; text-shadow: 0 .6cqw 2cqw rgba(0,0,0,.45); }
.card.l-plein::before, .card.l-plein::after { border-color: rgba(255,255,255,.55); }
/* arche : papier, photo dans une arche en haut */
.card.l-arche .ph { inset: 9cqw 14cqw auto; height: 62cqw; border-radius: 40cqw 40cqw 2cqw 2cqw; box-shadow: 0 2cqw 5cqw rgba(0,0,0,.18); }
.card.l-arche .ct { inset: 74cqw 10cqw 10cqw; align-content: start; gap: 1.6cqw; }
.card.l-arche .tt { font-size: 8.6cqw; } .l-arche.f-script .tt { font-size: 11cqw; } .l-arche .msg { font-size: 3.6cqw; }
/* polaroid : photo tirage blanc penché */
.card.l-polaroid .ph { inset: 9cqw 16cqw auto; height: 60cqw; padding: 2.6cqw 2.6cqw 9cqw; background: #fff; transform: rotate(-4deg); box-shadow: 0 2.4cqw 6cqw rgba(0,0,0,.22); border-radius: 1cqw; }
.card.l-polaroid .ph img { border-radius: .5cqw; }
.card.l-polaroid .ct { inset: 76cqw 10cqw 10cqw; align-content: start; gap: 1.4cqw; }
.card.l-polaroid .tt { font-size: 8.4cqw; } .l-polaroid.f-script .tt { font-size: 10.6cqw; } .l-polaroid .msg { font-size: 3.5cqw; }
.card.l-polaroid::before, .card.l-polaroid::after { display: none; }
/* médaillon : photo plein cadre, carte de texte au centre */
.card.l-medaillon .ct { inset: 18cqw 11cqw; background: rgba(255,255,255,.9); backdrop-filter: blur(1.5cqw); border-radius: 3cqw; padding: 6cqw; box-shadow: 0 2cqw 6cqw rgba(0,0,0,.2); --c-ink: #2a2118; color: #2a2118; }
.card.l-medaillon .tt { font-size: 9cqw; } .l-medaillon.f-script .tt { font-size: 11.5cqw; }
.card.l-medaillon::before { border-color: rgba(255,255,255,.7); }
/* bandeau : photo en haut avec bord en vague */
.card.l-bandeau .ph { inset: 0 0 auto; height: 58%; clip-path: path('M0 0H1000V560C800 640 620 520 420 590C240 650 120 560 0 600Z'); clip-path: polygon(0 0, 100% 0, 100% 86%, 82% 92%, 62% 87%, 40% 94%, 20% 88%, 0 93%); }
.card.l-bandeau .ct { inset: 60% 10cqw 9cqw; align-content: start; gap: 1.6cqw; }
.card.l-bandeau .tt { font-size: 8.6cqw; } .l-bandeau.f-script .tt { font-size: 11cqw; } .l-bandeau .msg { font-size: 3.6cqw; }
.card.l-bandeau::before, .card.l-bandeau::after { display: none; }
/* cadre : photo plein cadre, double cadre doré, texte au centre */
.card.l-cadre .ph::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(0,0,0,.62), rgba(0,0,0,.3)); }

.card.l-cadre::before { inset: 5cqw; border: .9cqw solid #e5c27a; border-radius: 1cqw; }
.card.l-cadre::after { inset: 7.5cqw; border: .3cqw solid #e5c27a; border-radius: .6cqw; }
.card.l-cadre .ct { text-shadow: 0 .5cqw 2cqw rgba(0,0,0,.5); }
.card.l-cadre .pre, .card.l-cadre .nm, .card.l-cadre .sig, .card.l-cadre .orn { color: #f1d38f; }
.card.l-plein .pre, .card.l-plein .nm, .card.l-plein .sig, .card.l-plein .orn { color: #f6dc9b; }
.card .mot { position: absolute; z-index: 1; font-size: 11cqw; filter: drop-shadow(0 1cqw 1.5cqw rgba(0,0,0,.18)); animation: drift 6s ease-in-out infinite; }
.card .mot.m1 { top: 8cqw; left: 9cqw; } .card .mot.m2 { top: 9cqw; right: 9cqw; animation-delay: -2s; } .card .mot.m3 { bottom: 9cqw; left: 50%; margin-left: -5.5cqw; animation-delay: -4s; font-size: 9cqw; }
@keyframes drift { 50% { transform: translateY(-2.5cqw) rotate(6deg); } }
.card .ct { position: absolute; inset: 15cqw 11cqw 20cqw; z-index: 3; display: grid; align-content: center; justify-items: center; text-align: center; gap: 2.6cqw; }
.card .pre { font: 700 3.2cqw var(--ui); letter-spacing: .3em; text-transform: uppercase; color: var(--c-acc); }
.card .tt { font-size: 10.5cqw; line-height: 1.02; margin: 0; }
.card .nm { font-size: 6.2cqw; font-weight: 600; color: var(--c-acc); }
.card .msg { font: 500 4.1cqw/1.45 var(--ui); opacity: .92; max-width: 62cqw; white-space: pre-line; }
.card .info { font: 700 3.8cqw/1.5 var(--ui); padding-top: 2cqw; border-top: .3cqw solid color-mix(in srgb, var(--c-acc) 50%, transparent); }
.card .sig { font-size: 6.2cqw; color: var(--c-acc); }
.f-script .tt, .f-script .nm, .f-script .sig { font-family: "Great Vibes", cursive; font-weight: 400; }
.f-script .tt { font-size: 13.5cqw; }
.f-serif .tt { font-family: "Playfair Display", Georgia, serif; font-style: italic; }
.f-serif .nm, .f-serif .sig { font-family: "Playfair Display", Georgia, serif; }
.f-royal .tt { font-family: "Cinzel", Georgia, serif; font-size: 8.6cqw; letter-spacing: .04em; }
.f-royal .nm, .f-royal .sig { font-family: "Cinzel", Georgia, serif; font-size: 5cqw; }
.f-fun .tt, .f-fun .nm, .f-fun .sig { font-family: "Fredoka", sans-serif; font-weight: 700; }
.f-brush .tt, .f-brush .nm, .f-brush .sig { font-family: "Pacifico", cursive; font-weight: 400; }
.f-brush .tt { font-size: 9.6cqw; }
.f-arab .tt, .f-arab .nm, .f-arab .sig { font-family: "Amiri", Georgia, serif; font-weight: 700; }
.f-arab .tt { font-size: 11cqw; }

/* --- éditeur --- */
.editor { display: grid; gap: 20px; }
.prev { position: relative; max-width: 330px; width: 100%; margin: 0 auto; }
.prev .card { box-shadow: 0 24px 50px rgba(28,23,18,.2); }
.form { display: grid; gap: 12px; }
.form label { display: grid; gap: 5px; font-size: 13px; font-weight: 700; color: var(--muted); }
.form input, .form textarea { width: 100%; padding: 13px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--paper); font-size: 15px; color: var(--ink); }
.form textarea { min-height: 90px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 520px) { .row2 { grid-template-columns: 1fr; } }
.form input[type=datetime-local] { min-width: 0; }
.switch { display: flex !important; align-items: center; justify-content: space-between; gap: 10px; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; color: var(--ink) !important; font-size: 15px !important; }
.switch input { width: 46px; height: 26px; appearance: none; background: #ddd2c4; border-radius: 99px; position: relative; cursor: pointer; transition: background .2s; padding: 0; border: 0; flex: none; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch input:checked { background: var(--ink); }
.switch input:checked::after { transform: translateX(20px); }
.others { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; }
.others button { flex: none; width: 64px; padding: 0; border: 2px solid transparent; border-radius: 12px; background: none; cursor: pointer; }

.others .card { border-radius: 10px; }
.prev .openbtn { position: relative; display: block; margin: 14px auto 0; width: 100%; z-index: 5; border: 1px solid var(--ink); border-radius: 99px; padding: 13px 16px; font-weight: 600; font-size: 14.5px; color: var(--ink); background: transparent; cursor: pointer; }
@keyframes bob { 50% { transform: translateY(-4px); } }
.note { font-size: 13px; color: var(--muted); text-align: center; margin: 0; }

/* --- partage --- */
.sharebox { background: var(--paper); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: grid; gap: 12px; }
.linkrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.linkrow input { padding: 13px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); min-width: 0; font-size: 14px; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
#qr { display: grid; place-items: center; padding: 10px; background: #fff; border-radius: 14px; }
#qr img, #qr canvas { width: 150px !important; height: 150px !important; }
.resp { display: grid; gap: 8px; }
.resp .r { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; background: var(--bg); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.tagbox { display: grid; gap: 8px; } .tlab { font-size: 13px; font-weight: 700; color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 8px; } .tags:empty { display: none; }
.tag { display: inline-flex; align-items: center; gap: 6px; background: var(--ink); color: #fff; border-radius: 99px; padding: 7px 8px 7px 14px; font-size: 14px; font-weight: 600; animation: in .3s both; }
.tag button { width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgba(255,255,255,.18); color: #fff; cursor: pointer; font-size: 14px; line-height: 1; padding: 0; }
.tadd { display: grid; grid-template-columns: minmax(0, 1fr) 50px; gap: 8px; }
.tadd input { width: 100%; padding: 13px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--paper); font-size: 15px; }

        <div class="eback"></div><div class="inner">${cardHTML(env, demo(defaults(envO), envO.id))}</div><div class="front"></div><div class="flap"></div><div class="seal">C</div>
      </div></div></div>
    <div class="cats">${CATS.map((c, i) => `<button class="catc rv" type="button" data-go="cat-${c.id}" style="--d:${i * 120}ms"><span class="pic"><img src="${bg[c.id].u}&w=1000&h=1200&q=74&fm=jpg&fit=crop" alt=""></span>
      <span class="cap"><b>${c.nom}</b><small>${c.sous}</small><span class="go">Découvrir</span></span></button>`).join('')}</div>
    <div class="sec rv"><div class="head"><h3>Les plus choisis</h3><span class="kicker">Faites défiler</span></div>
      <div class="marq"><div class="mtrack">${pk}${pk}</div></div></div>
    <div class="closing rv"><h2>Prête en <i>deux minutes.</i></h2><p class="sub">1,20 € la carte, puis 0,60 € par personne ajoutée. Sans abonnement.</p><button class="cta" type="button" data-go="cat-inv">Commencer</button></div>
  </section>`;
}
function catPage(id) {
  const c = CATS.find(x => x.id === id);
  return `<section class="screen"><span class="kicker">${c.nom}</span><h2>Quelle <i>occasion</i> ?</h2>${occGrid(OCC.filter(o => o.cat === id))}</section>`;
}
function occPage(id) {
  const o = occOf(id), ms = MODELES.filter(m => m.occ === id), f = demo(defaults(o), id);
  return `<section class="screen"><span class="kicker">${esc(o.nom)}</span><h2>Choisis ton <i>modèle</i></h2><p class="sub">${ms.length} modèles animés. Touche celui qui te plaît pour le personnaliser.</p>
    <div class="grid">${ms.map(m => `<button class="mdl" type="button" data-go="m-${m.id}">${cardHTML(m, f, { live: true })}<b>${esc(m.nom)}</b><small>Animation : ${m.anim}</small></button>`).join('')}</div></section>`;
}
function editor(mid) {
  const m = mdlOf(mid), o = occOf(m.occ), inv = o.cat === 'inv';
  if (!state.f || state.mid !== mid) { const keep = state.f && state.f.occ === o.id ? state.f : null; state.f = keep || { ...defaults(o), occ: o.id }; state.mid = mid; }
  const f = state.f;
  return `<section class="screen editor">
    <div class="prev"><div id="pv">${cardHTML(m, f, { live: true })}</div>
      <button class="openbtn" type="button" data-preview>Voir l'ouverture</button></div>
    <div class="form"><span class="kicker">${esc(o.nom)} · ${esc(m.nom)}</span><h2>Personnalise <i>ta carte</i></h2>
      <label>Titre<input data-f="titre" value="${esc(f.titre)}" maxlength="60"></label>
      <label>${inv ? 'Qui invite ? (ex. Sarah fête ses 30 ans)' : 'Pour qui ? (ex. Pour Maman)'}<input data-f="noms" value="${esc(f.noms)}" maxlength="60" placeholder="${inv ? 'Sarah & Yanis' : 'Pour toi'}"></label>
      <label>Message<textarea data-f="msg" maxlength="300">${esc(f.msg)}</textarea></label>
      ${inv ? `<div class="row2"><label>Date et heure<input type="datetime-local" data-f="date" value="${esc(f.date)}"></label><label>Lieu<input data-f="lieu" value="${esc(f.lieu)}" maxlength="60" placeholder="Salle des fêtes"></label></div>
        <label>Adresse (pour le GPS)<input data-f="adresse" value="${esc(f.adresse)}" maxlength="120" placeholder="12 rue des Lilas, Lyon"></label>
        <label class="switch">Les invités répondent (je viens / je ne viens pas)<input type="checkbox" data-f="rsvp" ${f.rsvp ? 'checked' : ''}></label>`
      : `<label>Signature<input data-f="de" value="${esc(f.de)}" maxlength="40" placeholder="Bisous, Sarah"></label>`}
      ${GROUPE.has(o.id) ? `<div class="tagbox"><span class="tlab">${inv ? 'Invités' : 'Destinataires'}</span>
        <div class="tags" id="tags">${tagsHTML(f)}</div>
        <div class="tadd"><input id="tagin" maxlength="60" placeholder="Prénom ou famille" aria-label="Ajouter une personne"><button type="button" class="plus" data-addtag aria-label="Ajouter">+</button></div>
        <small>Chacun reçoit son propre lien, avec son prénom sur l'enveloppe.</small></div>` : ''}
      <label>De la part de (affiché sur l'enveloppe)<input data-f="exp" value="${esc(f.exp || '')}" maxlength="40" placeholder="Sarah"></label>
      <div class="total"><span>Total <small id="pdet">${destList(f).length > 1 ? '1,20 € + ' + (destList(f).length - 1) + ' × 0,60 €' : 'pour 1 personne'}</small></span><b id="ptot">${euros(prix(f))}</b></div>
      <button class="cta full" type="button" data-save>Créer et envoyer</button>
      <p class="note" id="smsg" role="status"></p>
    </div></section>`;
}
function sharePage(id, cle, url) {
  const mine = (store.get('mine') || []).find(x => x.id === id), inv = mine && occOf(mine.occ).cat === 'inv' && mine.rsvp;
  return `<section class="screen" style="max-width:620px;margin:0 auto;width:100%">
    <span class="kicker">C'est prêt</span><h2>Envoie ta <i>carte</i></h2>
    <div class="sharebox">
      <div class="linkrow"><input id="lnk" readonly value="${esc(url)}" aria-label="Lien de la carte"><button class="cta" type="button" data-copy>Copier</button></div>
      <div class="btns"><button class="ghost" type="button" data-share>Partager</button><a class="ghost" href="mailto:?subject=${encodeURIComponent('Tu as reçu une carte')}&body=${encodeURIComponent('Ouvre ton enveloppe : ' + url)}">Par e-mail</a></div>
      <a class="ghost" href="${esc(url)}" target="_blank" rel="noopener">Voir comme l'invité</a>
      ${mine && destList(mine.f).length ? `<h3 style="margin:6px 0 0;font:700 20px var(--title)">Un lien par invité</h3><div class="guests">${destList(mine.f).map(n => `<div class="guest"><span>${esc(n)}</span><button type="button" data-gcopy="${esc(linkFor(url, n))}">Copier</button><button type="button" data-gshare="${esc(linkFor(url, n))}" data-gname="${esc(n)}">Envoyer</button></div>`).join('')}</div>` : ''}
      <div id="qr" aria-label="QR code de la carte"></div><p class="note">QR code à imprimer ou à afficher le jour J.</p>
    </div>
    ${inv ? `<div class="sharebox"><h3 style="margin:0;font:700 22px var(--title)">Réponses des invités</h3><div class="resp" id="resp"><p class="note">Chargement…</p></div><button class="ghost" type="button" data-reload="${id}">Actualiser</button></div>` : ''}
    <button class="ghost" type="button" data-go="">Créer une autre carte</button>
  </section>`;
}
function myCards() {
  const L = store.get('mine') || [];
  return `<section class="screen" style="max-width:620px;margin:0 auto;width:100%"><h2>Mes <i>cartes</i></h2>
    ${L.length ? `<div class="mylist">${L.map(x => { const m = mdlOf(x.mid); return m ? `<button type="button" data-open-mine="${x.id}">${cardHTML(m, x.f)}<span><b>${esc(x.f.titre)}</b><br><small style="color:var(--muted)">${esc(occOf(x.occ).nom)}</small></span><span>›</span></button>` : ''; }).join('')}</div>`
      : `<p class="sub">Tu n'as pas encore créé de carte. Elles apparaîtront ici, sur ce téléphone.</p><button class="cta" type="button" data-go="">Créer ma première carte</button>`}</section>`;
}

function render() {
  FX.forEach(x => x.stop()); FX.clear();
  let r = state.route;
  if (r.startsWith('ok-') && !state.share) { const x = (store.get('mine') || []).find(y => 'ok-' + y.id === r); if (x) state.share = [x.id, x.cle, x.url]; else r = state.route = ''; }
  $('#app').innerHTML = r.startsWith('cat-') ? catPage(r.slice(4)) : r.startsWith('o-') && occOf(r.slice(2)) ? occPage(r.slice(2)) : r.startsWith('m-') && mdlOf(r.slice(2)) ? editor(r.slice(2))
    : r.startsWith('ok-') ? sharePage(...state.share) : r === 'mes-cartes' ? myCards() : home();
  $('#back').hidden = !r; document.body.classList.toggle('ishome', !r);
  scrollTo(0, 0); liveCards(); reveal();
  if (r.startsWith('ok-')) { try { new QRCode($('#qr'), { text: state.share[2], width: 150, height: 150, correctLevel: QRCode.CorrectLevel.M }); } catch (_) { $('#qr').hidden = true; } loadResp(state.share[0], state.share[1]); }
}
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add('on'); io.unobserve(x.target); } }), { threshold: .12 }) : null;
function reveal() { document.querySelectorAll('.rv:not(.on)').forEach(el => io ? io.observe(el) : el.classList.add('on')); }
function go(r) { if (r === state.route) return; state.route = r; history.pushState({ r }, '', r ? '#' + r : location.pathname); render(); }
addEventListener('popstate', e => { const o = $('#open'); if (!o.hidden) { closeOpen(); return; } state.route = (e.state && e.state.r) || location.hash.slice(1); render(); });

/* ---------- personnalisation ---------- */
function refreshTags() {
  const f = state.f, n = destList(f).length; $('#tags').innerHTML = tagsHTML(f);
  $('#ptot').textContent = euros(prix(f)); $('#pdet').textContent = n > 1 ? '1,20 € + ' + (n - 1) + ' × 0,60 €' : 'pour 1 personne';
}
function addTag() {
  const i = $('#tagin'), v = i.value.trim(); if (!v) { i.focus(); return; }
  const L = destList(state.f); if (L.length < 200 && !L.includes(v)) L.push(v); state.f.dest = L; i.value = ''; i.focus(); refreshTags();
}
document.addEventListener('keydown', e => { if (e.target.id === 'tagin' && e.key === 'Enter') { e.preventDefault(); addTag(); } });
document.addEventListener('input', e => {
  const k = e.target.dataset.f; if (!k || !state.f) return;
  state.f[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  const m = mdlOf(state.mid); $('#pv').innerHTML = cardHTML(m, state.f, { live: true }); liveCards($('#pv'));
});
const rid = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => 'abcdefghjkmnpqrstuvwxyz23456789'[b % 31]).join('');
const b64 = o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64 = s => JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/')))));
async function save() {
  const m = mdlOf(state.mid), f = state.f, data = { mid: m.id, f }, msg = $('#smsg'), base = location.origin + location.pathname;
  msg.textContent = 'Création de ta carte…';
  const id = rid(12), cle = rid(16); let url;
  try { const r = await sb('cartes', { id, cle, data }); if (!r.ok) throw 0; url = base + '?c=' + id; }
  catch (_) { url = base + '?d=' + b64(data); }   // sans serveur : la carte voyage dans le lien
  const L = store.get('mine') || []; L.unshift({ id, cle, mid: m.id, occ: m.occ, f: { ...f }, rsvp: !!f.rsvp && url.includes('?c='), url, at: Date.now() }); store.set('mine', L.slice(0, 50));
  state.share = [id, cle, url]; go('ok-' + id);
}
async function loadResp(id, cle) {
  const box = $('#resp'); if (!box) return;
  try {
    const r = await fetch(SB + 'rpc/voir_reponses', { method: 'POST', headers: { apikey: SBK, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_id: id, p_cle: cle }) });
    const L = await r.json(); if (!Array.isArray(L)) throw 0;
    if (!L.length) { box.innerHTML = '<p class="note">Pas encore de réponse. Elles s\'afficheront ici.</p>'; return; }
    const n = k => L.filter(x => x.reponse === k).reduce((a, x) => a + (k === 'oui' ? (x.nb || 1) : 1), 0);
    box.innerHTML = `<div class="tot"><span>${n('oui')} viennent</span><span>${n('peut-etre')} peut-être</span><span>${n('non')} non</span></div>` +
      L.map(x => `<div class="r"><span class="dot ${x.reponse}"></span><span><b>${esc(x.nom)}</b>${x.message ? `<br><small>${esc(x.message)}</small>` : ''}</span><span>${x.reponse === 'oui' && x.nb > 1 ? '×' + x.nb : ''}</span></div>`).join('');
  } catch (_) { box.innerHTML = '<p class="note">Les réponses ne sont pas encore disponibles.</p>'; }
}

/* ---------- ouverture de l'enveloppe ---------- */
const POUR = (new URLSearchParams(location.search).get('n') || '').slice(0, 60);
function openCard(data, { id = null, preview = false } = {}) {
  const m = mdlOf(data.mid); if (!m) return false;
  const o = occOf(m.occ), f = data.f, [, ink, acc, paper] = PAL[m.pal], inv = o.cat === 'inv';
  const el = $('#open'); el.hidden = false; document.body.style.overflow = 'hidden'; document.querySelector('.app').hidden = true;
  el.style.setProperty('--o-bg', `radial-gradient(900px 700px at 50% 30%, color-mix(in srgb, ${paper} 60%, #fff), ${paper})`);
  el.style.setProperty('--o-ink', ink);
  const ini = (f.exp || f.noms || 'L').trim().charAt(0).toUpperCase();
  el.innerHTML = `<div class="ostage"><div class="env" id="env" style="--e-paper:${paper};--e-seal:${acc}" role="button" tabindex="0" aria-label="Ouvrir l'enveloppe">
      <div class="eback"></div><div class="inner">${cardHTML(m, f)}</div><div class="front"></div><div class="flap"></div><div class="seal">${esc(ini)}</div>
      <div class="ohint">Touche pour ouvrir<small>${POUR ? 'Pour ' + esc(POUR) + (f.exp ? ' · de la part de ' + esc(f.exp) : '') : f.exp ? 'De la part de ' + esc(f.exp) : 'Tu as reçu une carte'}</small></div></div></div>
    ${preview ? '<button class="back" type="button" data-close style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;z-index:60">×</button>' : ''}`;
  const env = $('#env');
  const doOpen = () => {
    if (env.classList.contains('opened')) return; env.classList.add('opened');
    setTimeout(() => {
      const when = f.date ? new Date(f.date) : null, addr = f.adresse || f.lieu;
      el.innerHTML = `${preview ? '<button class="back" type="button" data-close style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;z-index:60">×</button>' : ''}
        <div class="reveal">${cardHTML(m, f, { live: true })}
        ${inv && when && !isNaN(when) && when > Date.now() ? `<div class="panel"><h3>Plus que…</h3><div class="count" id="cnt"></div></div>` : ''}
        ${inv && (addr || when) ? `<div class="panel">${addr ? `<a class="ghost" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr)}" target="_blank" rel="noopener">Itinéraire vers ${esc(f.lieu || 'le lieu')}</a>` : ''}
          ${when && !isNaN(when) ? `<a class="ghost" href="${icsHref(f, o)}" download="invitation.ics">Ajouter à mon agenda</a>` : ''}</div>` : ''}
        ${inv && f.rsvp && id ? `<div class="panel" id="rsvp"><h3>Tu viens ?</h3>
          <input id="rn" maxlength="60" value="${esc(POUR)}" placeholder="Ton prénom et nom" style="padding:13px;border-radius:12px;border:1px solid var(--line)">
          <div class="choice3"><button type="button" data-rv="oui" aria-pressed="false">Oui</button><button type="button" data-rv="peut-etre" aria-pressed="false">Peut-être</button><button type="button" data-rv="non" aria-pressed="false">Non</button></div>
          <label style="display:flex;align-items:center;gap:10px;font-weight:700">Nombre de personnes <input id="rnb" type="number" min="1" max="20" value="1" style="width:70px;padding:10px;border-radius:10px;border:1px solid var(--line)"></label>
          <textarea id="rm" maxlength="300" placeholder="Un petit mot (facultatif)" style="padding:12px;border-radius:12px;border:1px solid var(--line);min-height:70px"></textarea>
          <button class="cta" type="button" data-send-rsvp="${id}">Envoyer ma réponse</button><p class="note" id="rmsg" role="status"></p></div>` : ''}
        <p class="made">Carte créée avec <a href="${location.origin + location.pathname}">Lookmiz</a> · <a href="${location.origin + location.pathname}">Crée la tienne</a></p></div>`;
      liveCards(el); tickCount(when);
    }, 2100);
  };
  env.addEventListener('click', doOpen); env.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); doOpen(); } });
  return true;
}
function closeOpen() { const el = $('#open'); el.hidden = true; el.innerHTML = ''; document.body.style.overflow = ''; document.querySelector('.app').hidden = false; liveCards(); }
let cntT;
function tickCount(when) {
  clearInterval(cntT); if (!when || isNaN(when)) return;
  const t = () => { const box = $('#cnt'); if (!box) return clearInterval(cntT); let s = Math.max(0, (when - Date.now()) / 1000);
    const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), ss = Math.floor(s % 60);
    box.innerHTML = [[d, 'jours'], [h, 'heures'], [m, 'min'], [ss, 'sec']].map(([v, l]) => `<div><b>${v}</b><small>${l}</small></div>`).join(''); };
  t(); cntT = setInterval(t, 1000);
}
function icsHref(f, o) {
  const d = new Date(f.date), e = new Date(+d + 3 * 3600000), z = x => x.toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const ics = `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Lookmiz//FR\r\nBEGIN:VEVENT\r\nUID:${Date.now()}@lookmiz.com\r\nDTSTAMP:${z(new Date())}\r\nDTSTART:${z(d)}\r\nDTEND:${z(e)}\r\nSUMMARY:${(f.titre || o.titre).replace(/[,;\n]/g, ' ')}\r\nLOCATION:${(f.adresse || f.lieu || '').replace(/[,;\n]/g, ' ')}\r\nEND:VEVENT\r\nEND:VCALENDAR`;
  return 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
}

/* ---------- clics ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('button, a'); if (!t) return;
  if (t.id === 'back') { history.back(); return; }
  if (t.dataset.go !== undefined) { go(t.dataset.go); return; }
  if (t.dataset.swap) { state.route = 'm-' + t.dataset.swap; history.replaceState({ r: state.route }, '', '#' + state.route); render(); return; }
  if ('preview' in t.dataset) { openCard({ mid: state.mid, f: state.f }, { preview: true }); history.pushState({ r: state.route, open: 1 }, ''); return; }
  if ('close' in t.dataset) { history.back(); return; }
  if ('save' in t.dataset) { save(); return; }
  if ('copy' in t.dataset) { const i = $('#lnk'); try { await navigator.clipboard.writeText(i.value); t.textContent = 'Copié'; } catch (_) { i.select(); } return; }
  if ('share' in t.dataset) { const u = $('#lnk').value; if (navigator.share) navigator.share({ title: 'Tu as reçu une carte', text: 'Ouvre ton enveloppe :', url: u }).catch(() => {}); else { try { await navigator.clipboard.writeText(u); t.textContent = 'Lien copié'; } catch (_) {} } return; }
  if ('addtag' in t.dataset) { addTag(); return; }
  if (t.dataset.untag !== undefined) { const L = destList(state.f); L.splice(+t.dataset.untag, 1); state.f.dest = L; refreshTags(); return; }
  if (t.dataset.gcopy) { try { await navigator.clipboard.writeText(t.dataset.gcopy); t.textContent = 'Copié'; } catch (_) {} return; }
  if (t.dataset.gshare) { const u = t.dataset.gshare; if (navigator.share) navigator.share({ title: t.dataset.gname + ', tu as reçu une carte', url: u }).catch(() => {}); else { try { await navigator.clipboard.writeText(u); t.textContent = 'Copié'; } catch (_) {} } return; }
  if (t.dataset.reload) { const x = (store.get('mine') || []).find(y => y.id === t.dataset.reload); if (x) loadResp(x.id, x.cle); return; }
  if (t.dataset.openMine) { const x = (store.get('mine') || []).find(y => y.id === t.dataset.openMine); if (x) { state.share = [x.id, x.cle, x.url]; go('ok-' + x.id); } return; }
  if (t.dataset.rv) { document.querySelectorAll('[data-rv]').forEach(b => b.setAttribute('aria-pressed', b === t)); return; }
  if (t.dataset.sendRsvp) {
    const nom = $('#rn').value.trim(), rep = (document.querySelector('[data-rv][aria-pressed="true"]') || {}).dataset?.rv, m = $('#rmsg');
    if (!nom) { m.textContent = 'Indique ton prénom.'; return; } if (!rep) { m.textContent = 'Choisis Oui, Peut-être ou Non.'; return; }
    t.disabled = true; m.textContent = 'Envoi…';
    try { const r = await sb('reponses', { carte: t.dataset.sendRsvp, nom, reponse: rep, nb: Math.max(1, Math.min(20, +$('#rnb').value || 1)), message: $('#rm').value.trim() || null }); if (!r.ok) throw 0;
      $('#rsvp').innerHTML = `<h3>Merci ${esc(nom)} !</h3><p style="margin:0">Ta réponse a bien été envoyée.</p>`; }
    catch (_) { m.textContent = 'L\'envoi n\'a pas marché. Réessaie dans un instant.'; t.disabled = false; }
  }
});

/* ---------- démarrage ---------- */
(async () => {
  const q = new URLSearchParams(location.search);
  if (q.get('d')) { try { if (openCard(unb64(q.get('d')))) return; } catch (_) {} }
  if (q.get('c')) {
    try { const r = await fetch(SB + 'rpc/lire_carte', { method: 'POST', headers: { apikey: SBK, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_id: q.get('c') }) });
      const data = await r.json(); if (data && openCard(data, { id: q.get('c') })) return; } catch (_) {}
    $('#app').innerHTML = '<section class="screen"><h2>Carte <i>introuvable</i></h2><p class="sub">Le lien est peut-être incomplet. Demande à la personne de te le renvoyer.</p><button class="cta" type="button" data-go="">Découvrir Lookmiz</button></section>';
    return;
  }
  state.route = location.hash.slice(1); history.replaceState({ r: state.route }, '', location.href); render();
})();
</script>
