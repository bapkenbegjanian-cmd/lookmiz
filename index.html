<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lookmiz — essaie les looks sur ta photo</title>
<meta name="description" content="Essayage virtuel : mets ta photo, importe un habit ou un lien Vinted, et vois-le porté par toi.">
<meta name="theme-color" content="#f7f6f3">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com"><link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --ink: #0f0f12; --muted: #66666e; --line: #e6e5e1; --glass: #ffffff;
  --pink: #3b5bff; --violet: #8a5cff; --peach: #ffcf4a; --mint: #22c58b;
  --grad: linear-gradient(120deg, var(--pink), var(--violet));
  --display: "Anton", "Impact", "Arial Narrow", sans-serif; --body: "Plus Jakarta Sans", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; color: var(--ink); font: 16px/1.5 var(--body); background: radial-gradient(900px 600px at 0% 0%, #e3e8ff, transparent 60%), radial-gradient(800px 600px at 100% 30%, #ffe1ef, transparent 60%), radial-gradient(800px 600px at 30% 100%, #fff1d6, transparent 60%), #fbfaf8; background-attachment: fixed; }
button { font: inherit; color: inherit; }
img { display: block; max-width: 100%; }

/* Fond animé : dégradé vivant */
.bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: linear-gradient(160deg, #f6f8fb, #eef4f6 55%, #f7f5f0); }
.bg i { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .7; animation: blob 16s ease-in-out infinite alternate; }
.bg i:nth-child(1) { width: 380px; height: 380px; background: #cddcff; top: -120px; left: -100px; }
.bg i:nth-child(2) { width: 340px; height: 340px; background: #c6efe7; top: 30%; right: -140px; animation-delay: -6s; }
.bg i:nth-child(3) { width: 300px; height: 300px; background: #ebe4d6; bottom: -100px; left: 10%; animation-delay: -11s; }
@keyframes blob { 50% { transform: translate(60px, 50px) scale(1.15); } 100% { transform: translate(-30px, 80px) scale(.95); } }

.app { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; min-height: 100vh; min-height: 100dvh;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 32px) max(18px, env(safe-area-inset-left, 0px)); }
.top { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; margin-bottom: 14px; }
.logo { grid-column: 2; text-align: center; font: 800 26px/1 var(--body); letter-spacing: -.04em; }
.logo span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.back { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(12px); cursor: pointer; font-size: 18px; }

.screen { display: grid; gap: 18px; animation: screenin .6s cubic-bezier(.2,.8,.2,1) both; }
@keyframes screenin { from { opacity: 0; transform: translateY(16px) scale(.99); } }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; letter-spacing: .005em; text-transform: uppercase; text-wrap: balance; }
h1 { font-size: clamp(40px, 11.5vw, 60px); line-height: .95; }
h2 { font-size: clamp(30px, 8.5vw, 40px); line-height: 1; }
.hl { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { color: var(--muted); margin: 0; max-width: 36ch; }
.pill { display: inline-flex; align-items: center; gap: 8px; width: max-content; font-size: 13px; font-weight: 700; padding: 7px 12px; border-radius: 99px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(12px); }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 4px rgba(61,214,181,.2); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(61,214,181,0); } }

.cta { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; border: 0; border-radius: 18px; padding: 18px 24px; cursor: pointer; font-weight: 800; font-size: 17px; text-decoration: none;
  color: #fff; background: var(--grad); background-size: 200% 100%; box-shadow: 0 14px 30px rgba(47,107,255,.28); animation: gradmove 5s ease infinite; transition: transform .15s; }
@keyframes gradmove { 50% { background-position: 100% 0; } }
.cta:active { transform: scale(.97); }
.cta[disabled] { opacity: .4; pointer-events: none; }
.ghost { display: flex; align-items: center; justify-content: center; width: 100%; border: 1px solid var(--line); border-radius: 18px; padding: 16px 20px; background: var(--glass); backdrop-filter: blur(12px); cursor: pointer; font-weight: 700; text-align: center; text-decoration: none; color: var(--ink); }
button:focus-visible, a:focus-visible, label:focus-visible { outline: 3px solid var(--violet); outline-offset: 3px; }

/* Accueil */
.showcase { position: relative; height: 380px; margin: 6px 0; }
.showcase .card { position: absolute; width: 58%; aspect-ratio: 3 / 4; border-radius: 26px; overflow: hidden; box-shadow: 0 24px 50px rgba(29,21,48,.18); border: 4px solid #fff; background: #fff; transition: all .9s cubic-bezier(.2,.8,.2,1); }
.showcase .card img { width: 100%; height: 100%; object-fit: cover; }
.showcase .c0 { left: 21%; top: 0; z-index: 3; transform: rotate(0); }
.showcase .c1 { left: 0; top: 40px; z-index: 2; transform: rotate(-9deg) scale(.86); opacity: .9; }
.showcase .c2 { left: 42%; top: 40px; z-index: 1; transform: rotate(9deg) scale(.86); opacity: .9; }
.float { position: absolute; z-index: 5; font-size: 13px; font-weight: 800; padding: 9px 13px; border-radius: 14px; background: #fff; box-shadow: 0 10px 24px rgba(29,21,48,.14); animation: bob 4s ease-in-out infinite; white-space: nowrap; }
.float.a { left: -4px; top: 18px; } .float.b { right: -4px; top: 170px; animation-delay: -1.3s; } .float.c { left: 8px; bottom: 6px; animation-delay: -2.6s; }
@keyframes bob { 50% { transform: translateY(-10px); } }
.marquee { overflow: hidden; margin: 0 -18px; padding: 12px 0; background: var(--ink); color: #fff; transform: rotate(-2deg); }
.marquee div { display: flex; gap: 28px; width: max-content; animation: slide 22s linear infinite; font: 800 15px var(--display); letter-spacing: .04em; text-transform: uppercase; }
.marquee b { color: var(--peach); }
@keyframes slide { to { transform: translateX(-50%); } }
.how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.linkbox { display: grid; gap: 6px; background: var(--glass); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
.linkbox small { color: var(--muted); }
.lrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.lrow input, .loginbox input { font: inherit; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: #fff; color: var(--ink); min-width: 0; }
.lrow .ghost { width: auto; padding: 12px 16px; }
.loginbox { display: grid; gap: 10px; }
.plans { display: grid; gap: 10px; }
.plan { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 16px; border-radius: 20px; background: var(--glass); backdrop-filter: blur(12px); border: 2px solid var(--line); color: var(--ink); cursor: pointer; transition: border-color .2s, box-shadow .2s, background .2s; }
.plan .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); background: #fff; transition: all .2s; }
.plan.on { border-color: var(--pink); background: #fff; box-shadow: 0 10px 26px rgba(47,107,255,.15); }
.plan.on .dot { border: 7px solid var(--pink); }
.plan .pinfo { display: grid; gap: 2px; min-width: 0; }
.plan .pinfo b { font: 800 18px var(--display); }
.plan small { color: var(--muted); font-size: 13px; }
.plan em { font-style: normal; font-size: 12px; font-weight: 800; color: #fff; background: var(--grad); padding: 3px 9px; border-radius: 99px; width: max-content; margin-top: 4px; }
.plan .pprice { text-align: right; display: grid; }
.plan .pprice b { font: 800 22px var(--display); white-space: nowrap; }
.recap { background: var(--glass); border: 1px dashed var(--line); border-radius: 16px; padding: 12px 14px; font-size: 14px; color: var(--muted); }
.recap b { color: var(--ink); }
a.cta[aria-disabled] { opacity: .5; pointer-events: none; }
.plan[aria-disabled] { opacity: .55; pointer-events: none; }
.demo { display: grid; justify-items: center; gap: 10px; margin: 6px 0; }
.dlabel { font: 800 15px var(--display); }
.phone { width: min(78%, 290px); aspect-ratio: 390 / 664; border-radius: 34px; padding: 8px; background: var(--ink); box-shadow: 0 24px 50px rgba(18,20,30,.28); }
.phone video { width: 100%; height: 100%; display: block; border-radius: 27px; object-fit: cover; background: #eef1f5; }
.screen.home { max-width: 1000px; margin: 0 auto; gap: 26px; }
.hero { display: grid; gap: 18px; }
.kicker { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--pink); }
.home h1 { font-size: clamp(52px, 15vw, 96px); line-height: .92; margin-top: 8px; }
.stage { position: relative; border-radius: 30px; overflow: hidden; height: 520px; background: #222; box-shadow: 0 30px 60px rgba(59,91,255,.25); }
.first .stage { animation: pop .8s cubic-bezier(.2,.8,.2,1) both; }
@keyframes pop { from { opacity: 0; transform: scale(.96); } }
.slides img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform: scale(1.12); transition: opacity 1.4s ease; }
.slides img.on { opacity: 1; animation: kb 6s ease-out forwards; }
@keyframes kb { from { transform: scale(1.12); } to { transform: scale(1); } }
.veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,10,20,0) 35%, rgba(10,10,20,.78) 100%); }
.stext { position: absolute; left: 22px; right: 22px; bottom: 24px; color: #fff; display: grid; gap: 8px; }
.stext .kicker { color: #fff; opacity: .9; }
.stext h1 { color: #fff; font-size: clamp(54px, 15vw, 96px); line-height: .9; }
.stext h1 .hl { background: linear-gradient(90deg, #ffd84d, #ff7ac6, #8fa2ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stext p { margin: 0; font-size: 16px; opacity: .92; max-width: 32ch; }
.sdots { display: flex; gap: 6px; margin-top: 6px; }
.sdots i { width: 18px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.4); transition: all .4s; }
.sdots i.on { width: 32px; background: #fff; }
.scredit { position: absolute; top: 12px; right: 14px; font-size: 10px; color: rgba(255,255,255,.75); }
.choices { display: grid; gap: 14px; }
.choice { position: relative; display: block; overflow: hidden; height: 200px; padding: 0; border: 0; border-radius: 26px; cursor: pointer; color: #fff; text-align: left; isolation: isolate; transition: transform .2s; }
.first .choice { animation: rise .7s cubic-bezier(.2,.8,.2,1) both; }
.first .choice + .choice { animation-delay: .12s; }
@keyframes rise { from { opacity: 0; transform: translateY(24px); } }
.choice img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; transition: transform .6s; }
.choice::before { content: ""; position: absolute; inset: 0; z-index: -1; }
.choice.c1::before { background: linear-gradient(100deg, rgba(59,91,255,.95) 20%, rgba(138,92,255,.55) 70%, rgba(138,92,255,.1)); }
.choice.c2::before { background: linear-gradient(100deg, rgba(255,62,140,.95) 20%, rgba(255,140,60,.55) 70%, rgba(255,140,60,.1)); }
.choice:hover img { transform: scale(1.06); }
.choice:active { transform: scale(.98); }
.cbody { position: absolute; left: 22px; top: 50%; transform: translateY(-50%); width: 64%; display: grid; gap: 6px; }
.choice b { font: 400 34px/1 var(--display); text-transform: uppercase; }
.choice small { font-size: 14px; line-height: 1.4; opacity: .95; }
.choice .go { margin-top: 6px; font-weight: 800; font-size: 14px; background: #fff; color: var(--ink); padding: 10px 16px; border-radius: 99px; width: max-content; position: relative; overflow: hidden; }
.choice .go::after { content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%; background: linear-gradient(90deg, transparent, rgba(59,91,255,.25), transparent); transform: skewX(-20deg); animation: shine 2.8s ease-in-out infinite; }
@keyframes shine { 60%, 100% { left: 130%; } }
  .choice.solo1 { height: 220px; }
@media (min-width: 900px) {
  .stage { height: 600px; }
  .stext { left: 48px; bottom: 44px; }
  .choices { grid-template-columns: 1fr; }
  .choice { height: 260px; }
}
@media (prefers-reduced-motion: reduce) { .slides img.on, .stage, .choice, .choice .go::after { animation: none; } }
.vt .sub { margin-top: -8px; }
label.media .frame { max-width: 320px; margin: 0 auto; }
@media (min-width: 900px) { .vt .duo { max-width: 520px; margin: 0 auto; width: 100%; } }
.pick2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { display: grid; justify-items: center; gap: 2px; padding: 16px 6px; border-radius: 20px; background: #fff; border: 1px solid var(--line); cursor: pointer; text-align: center; color: var(--ink); font: inherit; box-shadow: 0 8px 20px rgba(15,15,18,.06); transition: transform .15s, border-color .2s; }
.tile:active { transform: scale(.96); }
.tile.on { border: 2px solid var(--pink); }
.tile span { font-size: 28px; line-height: 1.1; }
.tile b { font-size: 15px; }
.tile small { font-size: 12px; color: var(--muted); }
.duo { display: grid; grid-template-columns: 1fr 28px 1fr; align-items: center; gap: 6px; }
.duo figure { margin: 0; display: grid; gap: 6px; }
.duo img, .duo .empty > span { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 18px; background: #fff; box-shadow: 0 10px 24px rgba(15,15,18,.1); }
.duo .empty > span { display: grid; place-items: center; font-size: 40px; border: 2px dashed var(--line); box-shadow: none; opacity: .7; }
.duo figcaption { text-align: center; font-size: 13px; color: var(--muted); }
.plusx { text-align: center; font: 400 26px var(--display); color: var(--pink); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; border-radius: 18px; background: var(--glass); border: 1px solid var(--line); }
.seg button { border: 0; background: none; padding: 13px; border-radius: 13px; font-weight: 800; font-size: 15px; color: var(--muted); cursor: pointer; }
.seg button[aria-selected="true"] { background: var(--ink); color: #fff; }
.linkbox small b { color: var(--ink); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions .ghost { font-size: 14px; padding: 13px 10px; }
.mephoto { display: grid; grid-template-columns: 54px 1fr; gap: 12px; align-items: center; background: var(--glass); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 18px; padding: 10px 12px; font-size: 14px; }
.mephoto b { display: block; font: 800 15px var(--display); }
.mephoto img { width: 54px; height: 70px; object-fit: cover; border-radius: 12px; }
.tabbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); z-index: 20; display: flex; gap: 4px; padding: 5px; border-radius: 20px;
  background: rgba(18,20,30,.92); backdrop-filter: blur(14px); box-shadow: 0 14px 34px rgba(18,20,30,.3); }
.tabbar button { border: 0; background: none; color: rgba(255,255,255,.65); font-weight: 800; font-size: 14px; padding: 11px 18px; border-radius: 15px; cursor: pointer; white-space: nowrap; }
.tabbar button[aria-pressed="true"] { background: #fff; color: var(--ink); }

.steps3 { display: grid; gap: 10px; }
.steps3 div { display: grid; grid-template-columns: 46px 1fr; gap: 12px; align-items: center; background: var(--glass); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; font-size: 14.5px; }
.steps3 span { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 22px; background: #fff; }
.steps3 b { display: block; font: 800 16px var(--display); }
.shophero { position: relative; border-radius: 28px; overflow: hidden; background: var(--ink); color: #fff; padding: 22px 20px; display: grid; gap: 8px; }
.shophero::after { content: "🛍️"; position: absolute; right: -6px; bottom: -14px; font-size: 96px; opacity: .25; transform: rotate(-12deg); }
.shophero h2 { color: #fff; }
.shopcard { background: var(--ink); color: #fff; border-radius: 22px; padding: 16px 18px; font-size: 14px; display: grid; gap: 4px; }
.shopcard b { font: 800 17px var(--display); }
.how div { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 18px; padding: 12px 10px; text-align: center; font-size: 12.5px; font-weight: 700; }
.how span { display: block; font-size: 24px; margin-bottom: 4px; }

/* Cadre photo : la photo entière, jamais coupée */
.frame { position: relative; width: 100%; aspect-ratio: 3 / 4; border-radius: 28px; overflow: hidden; background: #fff; box-shadow: 0 24px 50px rgba(29,21,48,.16); border: 4px solid #fff; }
.frame .blur { position: absolute; inset: -20px; background-size: cover; background-position: center; filter: blur(24px) saturate(1.2); opacity: .55; }
.frame > img, .frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.frame .empty { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 10px; text-align: center; padding: 24px; color: var(--muted); font-size: 14px;
  background: repeating-linear-gradient(135deg, rgba(47,107,255,.04) 0 12px, transparent 12px 24px); border: 2px dashed rgba(47,107,255,.35); border-radius: 24px; }
.frame .empty b { font: 800 22px var(--display); color: var(--ink); }
.frame .plus { width: 72px; height: 72px; border-radius: 22px; background: var(--grad); color: #fff; display: grid; place-items: center; font-size: 34px; box-shadow: 0 12px 26px rgba(47,107,255,.3); }
.frame .badge { position: absolute; left: 12px; top: 12px; z-index: 3; font-size: 12.5px; font-weight: 800; padding: 7px 11px; border-radius: 12px; background: rgba(255,255,255,.9); }
.frame.scan::after { content: ""; position: absolute; left: 0; right: 0; height: 3px; top: 0; background: var(--grad); box-shadow: 0 0 22px 6px rgba(47,107,255,.4); animation: scanline 2.2s ease-in-out infinite alternate; z-index: 2; }
@keyframes scanline { to { top: 100%; } }
.reveal { animation: reveal 1.3s cubic-bezier(.2,.8,.2,1) both; }
@keyframes reveal { from { clip-path: inset(0 0 100% 0); filter: blur(12px); } to { clip-path: inset(0); filter: none; } }
.tips { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.tips span { font-size: 13px; font-weight: 600; background: var(--glass); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; }

/* Choix de l'occasion */
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.opt { position: relative; overflow: hidden; background: var(--glass); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.8); border-radius: 22px; padding: 18px 14px; display: grid; gap: 4px; cursor: pointer; text-align: left;
  box-shadow: 0 8px 22px rgba(29,21,48,.07); opacity: 0; transform: translateY(14px); animation: up .55s cubic-bezier(.2,.8,.2,1) forwards; transition: transform .2s, box-shadow .2s; }
.opt::before { content: ""; position: absolute; width: 90px; height: 90px; border-radius: 50%; right: -30px; top: -30px; background: var(--c); opacity: .35; filter: blur(4px); }
.opt:hover { box-shadow: 0 14px 30px rgba(47,107,255,.18); }
.opt:active { transform: scale(.97); }
.opt .e { font-size: 32px; line-height: 1.1; }
.opt b { font: 800 19px var(--display); }
.opt small { color: var(--muted); font-size: 12.5px; }
@keyframes up { to { opacity: 1; transform: none; } }

/* Analyse IA */
.log { display: grid; gap: 8px; background: rgba(29,21,48,.92); color: #fff; border-radius: 22px; padding: 16px 18px; font-size: 14px; min-height: 120px; box-shadow: 0 18px 40px rgba(29,21,48,.25); }
.log p { margin: 0; position: relative; padding-left: 24px; animation: logline .4s ease both; }
.log p::before { content: "✓"; position: absolute; left: 0; color: var(--mint); font-weight: 800; }
.log p.wait::before { content: "•"; color: var(--peach); animation: blink 1s infinite; }
.log p b { color: var(--peach); font-weight: 700; }
@keyframes logline { from { opacity: 0; transform: translateX(-8px); } }
@keyframes blink { 50% { opacity: .2; } }
.log .choice { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.log .choice button { border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: #fff; border-radius: 12px; padding: 8px 12px; cursor: pointer; font-weight: 700; font-size: 13px; }

/* Résultat */
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 6px; border-radius: 18px; background: var(--glass); backdrop-filter: blur(12px); border: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 11px 4px; border-radius: 13px; cursor: pointer; color: var(--muted); font-weight: 800; font-size: 14px; transition: all .3s; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.tabs .ld { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--pink); margin-left: 6px; vertical-align: middle; animation: blink 1s infinite; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { font-size: 12.5px; font-weight: 700; padding: 6px 10px; border-radius: 10px; background: #fff; border: 1px solid var(--line); }
.piece { display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 14px; align-items: center; background: var(--glass); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.8); border-radius: 22px; padding: 12px; box-shadow: 0 10px 26px rgba(29,21,48,.08); }

      const big = Math.max(S, Hi);

  } catch (e) { console.warn('profil erreur', e && e.message); }
  return out;
}

const BONES = [[11, 12], [11, 13], [13, 15], [12, 14], [14, 16], [11, 23], [12, 24], [23, 24], [23, 25], [25, 27], [24, 26], [26, 28]];
async function drawScan(cv, img, a) {

  cv.width = r.width * dpr; cv.height = r.height * dpr;

  const sc = Math.min(r.width / img.naturalWidth, r.height / img.naturalHeight), ox = (r.width - img.naturalWidth * sc) / 2, oy = (r.height - img.naturalHeight * sc) / 2;
  const X = x => ox + x * sc, Y = y => oy + y * sc, L = i => ({ x: X(a.lm[i].x * img.naturalWidth), y: Y(a.lm[i].y * img.naturalHeight) });
  const pts = [0, 11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28];
  const grad = c.createLinearGradient(0, 0, r.width, r.height); grad.addColorStop(0, '#2f6bff'); grad.addColorStop(1, '#12b3a6');
  for (let k = 1; k <= 30; k++) {          // les os se dessinent progressivement
    c.clearRect(0, 0, r.width, r.height);
    c.strokeStyle = grad; c.lineWidth = 3; c.lineCap = 'round'; c.shadowColor = 'rgba(47,107,255,.6)'; c.shadowBlur = 10;

    pts.forEach((i, n) => { if (n / pts.length > k / 30) return; const P = L(i); c.beginPath(); c.fillStyle = '#fff'; c.arc(P.x, P.y, 5, 0, 7); c.fill(); c.lineWidth = 2; c.stroke(); });
    await wait(28);

}
async function drawMeasure(ctx, a, label, y, w, color) {
  const { c, X, Y } = ctx, g = a.geo, yy = Y(y), x1 = X(g.cx - w / 2), x2 = X(g.cx + w / 2);
  for (let k = 1; k <= 14; k++) {
    const t = k / 14, m = (x1 + x2) / 2;
    c.save(); c.shadowBlur = 0; c.strokeStyle = color; c.lineWidth = 2; c.setLineDash([5, 4]);
    c.beginPath(); c.moveTo(m - (m - x1) * t, yy); c.lineTo(m + (x2 - m) * t, yy); c.stroke(); c.restore();

}

        <div><span>🔓</span><p style="margin:0"><b>Sans engagement</b>Résiliable à tout moment, en un clic.</p></div></div>
      ${state.quota && state.quota.pro ? '' : `<div class="plans" role="radiogroup" aria-label="Choisis ta formule">
        ${[['an', 'Annuel', '79,99 €', 'par an', 'Soit 6,67 € par mois', 'Le plus avantageux · −33 %'], ['mois', 'Mensuel', '9,99 €', 'par mois', 'Sans engagement', '']].map(([k, n, p, per, sub, tag]) =>
          `<button type="button" class="plan ${state.plan === k ? 'on' : ''}" role="radio" aria-checked="${state.plan === k}" data-plan="${k}">
            <span class="dot"></span><span class="pinfo"><b>${n}</b><small>${sub}</small>${tag ? `<em>${tag}</em>` : ''}</span><span class="pprice"><b>${p}</b><small>${per}</small></span></button>`).join('')}
        </div>
        <div class="recap">${state.plan === 'an' ? 'Aujourd\'hui : <b>79,99 €</b>, puis renouvelé chaque année.' : 'Aujourd\'hui : <b>9,99 €</b>, puis renouvelé chaque mois.'}<br>Résiliable à tout moment depuis « Gérer mon abonnement », sans frais.</div>
        <a class="cta" ${payHref(state.plan)}>🔒 Continuer vers le paiement</a>
        <p class="note">Paiement sécurisé par Stripe. L'abonnement s'arrête à la fin de la période payée si tu le résilies. En continuant, tu acceptes les <a href="cgv.html">conditions générales de vente</a>.</p>`}
      ${PAY.portail && session ? `<a class="ghost" href="${PAY.portail}?prefilled_email=${encodeURIComponent(session.user.email)}" target="_blank" rel="noopener">Gérer mon abonnement</a>` : ''}
      <button class="link" type="button" data-tab="look">Retour à l'accueil</button>
    </section>`
];
// Liens de paiement Stripe (Payment Links) et espace client pour résilier
const PAY = { mois: 'https://buy.stripe.com/dRm4gzbGU6tybcw1FO0sU00', an: 'https://buy.stripe.com/aFadR9h1eg48dkE2JS0sU01', portail: 'https://billing.stripe.com/p/login/dRm4gzbGU6tybcw1FO0sU00' };
function payHref(k) {
  if (!PAY[k]) return 'aria-disabled="true" title="Bientôt disponible"';
  if (!session) return 'href="#" data-start="shop"';
  return `href="${PAY[k]}?client_reference_id=${session.user.id}&prefilled_email=${encodeURIComponent(session.user.email)}"`;
}
function account() {
  if (!sb) return `<p class="note"><button class="link" type="button" data-plus>Lookmiz+ : essais illimités dès 6,67 €/mois</button></p>`;
  return session ? `<p class="note">Connecté : ${session.user.email.replace(/[<>&"]/g, '')} · <button class="link" type="button" data-plus>${state.quota && state.quota.pro ? 'Mon abonnement' : 'Lookmiz+'}</button> · <button class="link" type="button" data-logout>Se déconnecter</button></p>`
    : `<p class="note"><button class="link" type="button" data-plus>Lookmiz+ : essais illimités dès 6,67 €/mois</button></p>`;
}

// Retour du téléphone : une entrée d'historique « sentinelle » ; chaque retour remonte à l'écran parent, jamais en avant
let skipPop = false;
const parentOf = st => st === 7 || st === 8 || st === 1 || st === 5 ? 0 : st === 9 ? (state.prev ?? 0) : st === 4 || st === 3 ? 2 : st === 6 ? 5 : Math.max(0, st - 1);
function goUp() { state.step = parentOf(state.step); if (state.step === 8 && session) state.step = 0; }
function syncHistory() {
  const has = history.state && history.state.lk;
  if (state.step !== 0 && !has) history.pushState({ lk: 1 }, '');
  else if (state.step === 0 && has) { skipPop = true; history.back(); }   // de retour à l'accueil : on retire la sentinelle
}
addEventListener('popstate', () => {
  if (skipPop) { skipPop = false; return; }
  if (state.step !== 0) { goUp(); render(); }
});
let slideT;
function startSlides() {
  clearInterval(slideT); const im = document.querySelectorAll('.slides img'), dots = document.querySelectorAll('.sdots i'); if (!im.length) return;
  let i = 0; slideT = setInterval(() => { if (!document.body.contains(im[0])) return clearInterval(slideT);
    im[i].classList.remove('on'); dots[i].classList.remove('on'); i = (i + 1) % im.length; im[i].classList.add('on'); dots[i].classList.add('on');
    const c = $('#scredit'); if (c) c.textContent = 'Photo ' + AMB[i].by + ' / Unsplash'; }, 4500);
}
const wide = matchMedia('(min-width: 900px)');
wide.addEventListener('change', () => render(true));
function render(soft) {
  const y = scrollY;
  $('#app').innerHTML = S[state.step]();
  const sc = $('#app .screen'), m = sc && sc.querySelector(':scope > .media');
  if (wide.matches && m && !sc.classList.contains('solo')) {
    const col = document.createElement('div'); col.className = 'col';
    [...sc.children].filter(c => c !== m).forEach(c => col.appendChild(c));
    sc.appendChild(col); sc.classList.add('split');
  }
  if (soft) { const sc = $('#app .screen'); if (sc) sc.style.animation = 'none'; scrollTo(0, y); } else scrollTo(0, 0);
  $('#back').hidden = state.step === 0;
  if (state.step === 0) { startSlides(); if (!soft && !window.__homeShown) { window.__homeShown = 1; $('#app .home').classList.add('first'); } }
  syncHistory();


}

/* Analyse animée, puis lancement des essayages */
let waitingTry = false;
function say(html, cls = '') { const p = document.createElement('p'); p.className = cls; p.innerHTML = html; $('#log').appendChild(p); return p; }
async function runAnalysis() {
  const log = $('#log'), img = await imgOf(state.photo);
  await new Promise(r => $('#simg').complete ? r() : $('#simg').onload = r);
  const a = await Promise.race([analyse(img), wait(25000).then(() => ({ ok: false, slow: true }))]);
  if (state.step !== 3) return;
  log.innerHTML = '';
  if (!a.ok) {
    say('Je ne vois pas bien ta silhouette sur la photo. 👉 <b>Choisis celle qui te ressemble :</b>');
    return askManual(a.g);
  }
  $('#sframe').classList.remove('scan');
  const ctx = await drawScan($('#cv'), img, a);
  say('Silhouette détectée'); await wait(450);
  await drawMeasure(ctx, a, 'Épaules', a.geo.shY + (a.geo.hpY - a.geo.shY) * .06, a.geo.S, '#2f6bff');
  await drawMeasure(ctx, a, 'Taille', a.geo.waY, a.geo.Wa, '#12b3a6');
  await drawMeasure(ctx, a, 'Hanches', a.geo.hiY, a.geo.Hi, '#e8a23a');
  say(`Épaules / hanches : <b>${a.ratio.toFixed(2).replace('.', ',')}</b>`); await wait(500);
  say(`Silhouette : <b>${MORPHS[a.m].n}</b>, ${MORPHS[a.m].d}`); await wait(600);
  say(`Allure : <b>${a.build}</b>${a.legs ? ` · ${a.legs}` : ''}`); await wait(600);
  if (!a.legs) { say('⚠️ Tes jambes ne sont pas entièrement visibles : le bas des tenues sera moins précis. Pour un meilleur résultat, mets une photo en entier.'); await wait(900); }
  state.m = a.m; state.info = [MORPHS[a.m].n, 'Allure ' + a.build, ...(a.legs ? [a.legs.charAt(0).toUpperCase() + a.legs.slice(1)] : [])];
  if (!a.g) return askGender();
  say(`Profil : <b>${a.g === 'f' ? 'Femme' : 'Homme'}</b> <button class="link" type="button" data-fix style="color:#bbb;font-size:12px">corriger</button>`);
  state.g = a.g; await wait(500); startTries();
}
function askGender() {
  const p = say('👉 <b>Touche ton profil pour continuer :</b> <span class="choice"><button type="button" data-gender="f">Femme</button><button type="button" data-gender="h">Homme</button></span>', 'wait');
  p.dataset.ask = 1;
}
function askManual(g) {
  say(`<span class="choice">${Object.entries(MORPHS).map(([k, v]) => `<button type="button" data-morph="${k}">${v.n}</button>`).join('')}</span>`, 'wait');
  state.g = g || null;
}
function startTries() {
  const L = looks();
  say(`3 pièces choisies : <b>${L.map(x => x.n).join(', ')}</b>`);
  const p = say('Essayage des 3 looks sur ta photo… <b id="secs">0 s</b>', 'wait'), t0 = Date.now();
  lookGroup = 'look' + Date.now() + Math.random().toString(36).slice(2, 8);
  waitingTry = true; L.forEach(tryOn);
  const tick = setInterval(() => {
    if (!waitingTry || state.step !== 3) return clearInterval(tick);
    const s = Math.round((Date.now() - t0) / 1000), el = $('#secs'); if (el) el.textContent = s + ' s';
    if (s >= 100) {   // trop long : on le dit clairement, avec une solution
      clearInterval(tick); waitingTry = false;
      say('Ça prend plus de temps que prévu. <span class="choice-row"><button type="button" class="link" data-restart-look>Réessayer</button></span>');
    }
  }, 1000);
}
function onTryDone() {
  if (!waitingTry) return;
  const st = looks().map(x => (tries[tkey(x)] || {}).st);
  if (st.some(x => x && x !== 'run')) { waitingTry = false; state.step = 4; state.pick = Math.max(0, st.indexOf('ok')); render(); }
}

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'back') goUp();
  else if (t.dataset.tab) { state.mode = 'look'; state.step = 0; }
  else if ('restartLook' in t.dataset) { for (const k in tries) if (tries[k].st !== 'ok') delete tries[k]; state.step = 2; }
  else if (t.dataset.src) { state.src = t.dataset.src; render(true); return; }
  else if ('forget' in t.dataset) { try { localStorage.removeItem('cabine-photo'); } catch (_) {} state.photo = null; state.saved = false; }
  else if (t.dataset.mode) { state.mode = t.dataset.mode; state.step = 1; }
  else if (t.dataset.start) { state.mode = t.dataset.start; if (sb && !session) { try { localStorage.setItem('cabine-next', state.mode); } catch (_) {} state.step = 8; } else state.step = 1; }
  else if ('switch' in t.dataset) { state.signup = !state.signup; }
  else if ('plus' in t.dataset) { state.prev = state.step === 9 ? state.prev : state.step; state.step = 9; }
  else if (t.dataset.plan) { state.plan = t.dataset.plan; render(true); return; }
  else if ('logout' in t.dataset) { sb.auth.signOut(); session = null; state.quota = null; }
  else if ('trylook' in t.dataset) { const l = looks()[state.pick]; tryOn(l); if ((tries[tkey(l)] || {}).st === 'quota') { state.step = 9; render(); } else render(true); return; }
  else if ('import' in t.dataset) { importLink(); return; }
  else if ('shoptry' in t.dataset) { const k = 'shop' + state.pv + '-' + state.gid; delete tries[k]; runTry(k, state.garment, 'shop' + Date.now() + state.gid); state.step = tries[k].st === 'quota' ? 9 : 6; }
  else if (t.dataset.go) { state.step = +t.dataset.go; if (t.dataset.newg) state.garment = null; if (state.step === 2) { loadPose().catch(() => {}); loadSeg().catch(() => {}); loadFace().catch(() => {}); } }
  else if (t.dataset.occ) { state.o = t.dataset.occ; state.step = 3; render(); runAnalysis(); return; }
  else if (t.dataset.gender) { state.g = t.dataset.gender; t.closest('p').remove(); say(`Profil : <b>${state.g === 'f' ? 'Femme' : 'Homme'}</b>`); if (!state.m) state.m = 'H'; startTries(); return; }
  else if (t.dataset.morph) { state.m = t.dataset.morph; state.info = [MORPHS[state.m].n]; t.closest('p').remove(); say(`Silhouette : <b>${MORPHS[state.m].n}</b>`); if (state.g) { say(`Profil : <b>${state.g === 'f' ? 'Femme' : 'Homme'}</b>`); startTries(); } else askGender(); return; }
  else if ('fix' in t.dataset) { state.g = state.g === 'f' ? 'h' : 'f'; for (const k in tries) delete tries[k]; waitingTry = false; t.closest('p').innerHTML = `Profil : <b>${state.g === 'f' ? 'Femme' : 'Homme'}</b>`; startTries(); return; }
  else if (t.dataset.pick) { state.pick = +t.dataset.pick; render(true); return; }
  else if ('retry' in t.dataset) { tryOn(looks()[state.pick]); render(true); return; }
  else if ('restart' in t.dataset) { state.step = 2; }
  else return;
  render();
});
document.addEventListener('keydown', e => { if (e.target.matches('label[for=photo]') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); $('#photo').click(); } });
$('#photo').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  shrink(f).then(d => { e.target.value = ''; if (!d) return;
    state.photo = d; state.pv++; state.g = state.m = null; for (const k in tries) delete tries[k];
    try { localStorage.setItem('cabine-photo', d); state.saved = true; } catch (_) {}
    if (state.step === 6) { runTry('shop' + state.pv + '-' + state.gid, state.garment, 'shop' + Date.now() + state.gid); render(); return; }
    loadPose().catch(() => {}); loadSeg().catch(() => {}); loadFace().catch(() => {});
    if (state.step === 4) { state.step = 3; render(); runAnalysis(); } else render(); });
});
['#garment', '#garment2'].forEach(id => $(id).addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  shrink(f).then(d => { e.target.value = ''; if (!d) return; state.garment = d; state.gid++; render(); });
}));
async function importLink() {
  const v = $('#glink').value.trim(), m = $('#gmsg'); if (!v) return;
  if (!/(^|\.)vinted\.[a-z.]+\//i.test(v.replace(/^https?:\/\//, ''))) { m.textContent = 'Colle un lien d\'annonce Vinted. Pour un autre site, fais une capture de l\'habit et choisis « Image ».'; return; }
  if (sb && !session) { state.step = 8; render(); return; }
  m.textContent = 'Recherche de la photo…';
  const r = await api({ action: 'preview', link: v }, 20000).catch(() => ({ error: 'pas de réponse' }));
  if (!r.image) { m.textContent = `Impossible de lire cette annonce (${r.error || 'erreur'}). Fais une capture de l'habit et choisis « Image ».`; return; }
  state.garment = r.image; state.gid++; render();
}
document.addEventListener('submit', async e => {
  if (e.target.id !== 'login') return; e.preventDefault();
  const m = $('#lmsg'), b = e.target.querySelector('button'); b.disabled = true;
  const email = $('#email').value.trim(), password = $('#pass').value;
  if (state.signup) {
    const { data, error } = await sb.auth.signUp({ email, password });
    m.textContent = error ? (/registered|already/i.test(error.message) ? 'Ce compte existe déjà : connecte-toi.' : /password/i.test(error.message) ? 'Mot de passe trop court (6 caractères minimum).' : 'Création impossible : ' + error.message)
      : data.session ? '✅ Compte créé !' : 'Compte créé, mais il doit être confirmé par e-mail.';
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    m.textContent = error ? 'E-mail ou mot de passe incorrect.' : '✅ Connecté !';
  }
  b.disabled = false;
});
// Après le lien reçu par e-mail : on reprend là où la personne en était (ou au début du parcours)
function afterLogin() {
  let next = null; try { next = localStorage.getItem('cabine-next'); localStorage.removeItem('cabine-next'); } catch (_) {}
  if (next || state.step === 8) { state.mode = next || state.mode || 'look'; state.step = state.mode === 'shop' && state.photo ? 5 : 1; render(); }
  else render(true);
}
if (/[?&]paye=1/.test(location.search)) { state.step = 9; history.replaceState(null, '', location.pathname); setTimeout(() => refreshQuota().then(() => render(true)), 2500); }
const authErr = new URLSearchParams(location.hash.slice(1)).get('error_description') || new URLSearchParams(location.search).get('error_description');
if (sb) {
  sb.auth.onAuthStateChange((ev, s) => {
    const was = !!session; session = s;
    if (s && !was) setTimeout(() => { afterLogin(); refreshQuota().then(() => render(true)); }, 0);
    if (!s && was) render(true);
  });
  if (authErr) { state.step = 8; setTimeout(() => { const m = $('#lmsg'); if (m) m.textContent = 'Le lien n\'a pas marché (' + authErr + '). Redemande un lien.'; }, 50); }
}
document.addEventListener('keydown', e => { const l = e.target.closest && e.target.closest('label[for^=garment]'); if (l && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); $('#' + l.htmlFor).click(); } });
render();
</script>
