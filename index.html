<style>
/* Lookmiz — boutique de cartes animées en 3D.
   Accueil → catégorie → occasion (galerie animée) → personnalisation → paiement → partage.
   Les scènes 3D sont dessinées par engine.js dans les zones .v3 (transparentes) de la page. */
:root {
  --bg: #f6f2ec; --paper: #ffffff; --ink: #161412; --muted: #7b746b; --line: #e4ddd2; --soft: #efe9e0;
  --acc: #9a7738; --acc-l: #c9a560; --deep: #161412;
  --ui: "Inter", system-ui, -apple-system, sans-serif; --title: "Instrument Serif", "Playfair Display", Georgia, serif;
  --r: 14px; color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--ui); -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; }
button, input, textarea, select { font: inherit; color: inherit; }
img { display: block; max-width: 100%; }
[hidden] { display: none !important; }
.app { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 0 max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 36px) max(18px, env(safe-area-inset-left, 0px)); }
/* en-tête */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; height: calc(60px + env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px);
  margin: 0 calc(50% - 50vw) 8px; padding-left: max(18px, calc(50vw - 522px)); padding-right: max(18px, calc(50vw - 522px)); background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.logo { font: 400 29px/1 var(--title); color: var(--ink); background: none; border: 0; cursor: pointer; padding: 0; letter-spacing: -.01em; }
.logo span { font-style: italic; color: var(--acc); }
.back { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); cursor: pointer; display: grid; place-items: center; }
.back svg { width: 18px; height: 18px; }
.top .sp { flex: 1; }
.mine { border: 1px solid var(--line); background: var(--paper); border-radius: 99px; padding: 9px 16px; font-weight: 600; font-size: 14px; cursor: pointer; }
/* typographie */
.screen { display: grid; gap: 28px; padding-top: 18px; animation: in .5s cubic-bezier(.2,.8,.2,1) both; }
@keyframes in { from { opacity: 0; transform: translateY(10px); } }
h1, h2, h3 { font-family: var(--title); font-weight: 400; margin: 0; line-height: 1.02; letter-spacing: -.015em; text-wrap: balance; }
h1 { font-size: clamp(46px, 11.5vw, 92px); }
h2 { font-size: clamp(34px, 7.6vw, 54px); }
h3 { font-size: 28px; }
h1 i, h2 i, h3 i { font-style: italic; color: var(--acc); }
.sub { color: var(--muted); margin: 0; max-width: 46ch; font-size: 16.5px; }
.kicker { font-size: 11.5px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--acc); }
.head { display: grid; gap: 10px; }
/* boutons */
.cta { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 0; border-radius: 99px; padding: 16px 26px; font-weight: 600; font-size: 15.5px; color: #fff; background: var(--ink); cursor: pointer; text-decoration: none; transition: transform .15s, background .2s; }
.cta:hover { background: #2d2925; } .cta:active { transform: scale(.97); } .cta:disabled { opacity: .55; cursor: default; }
.cta.full { width: 100%; }
.ghost { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--ink); border-radius: 99px; padding: 14px 22px; font-weight: 600; background: transparent; cursor: pointer; text-decoration: none; color: var(--ink); }
.ghost.full { width: 100%; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--acc); outline-offset: 3px; }
.rv { opacity: 0; transform: translateY(22px); transition: opacity .9s cubic-bezier(.2,.8,.2,1) var(--d, 0ms), transform .9s cubic-bezier(.2,.8,.2,1) var(--d, 0ms); }
.rv.on { opacity: 1; transform: none; }

/* zones 3D : transparentes, le moteur dessine dessous ; la carte en repli si pas de 3D */
.v3 { position: relative; }
.v3 .nogl { position: absolute; inset: 0; display: none; place-items: center; padding: 8%; }
.no3d .v3 .nogl { display: grid; }
.no3d .v3 .nogl .card { width: min(100%, 60vh * .72); }
.v3 .spin { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--ink) 15%, transparent); border-top-color: var(--acc); animation: rot 1s linear infinite; }
.v3.ready .spin, .no3d .v3 .spin { display: none; }
@keyframes rot { to { transform: rotate(1turn); } }

/* --- accueil --- */
.hero { display: grid; gap: 0; align-items: center; }
.hero .htxt { display: grid; gap: 18px; } .hero .h1x { padding-top: 10px; } .hero .h2x { gap: 16px; }
.hero .acts { display: flex; gap: 10px; flex-wrap: wrap; }
.hero .from { font-size: 13.5px; color: var(--muted); }
.hero .v3 { height: min(520px, 64vh); margin: 0 -18px; }
@media (min-width: 860px) { .hero { grid-template-columns: 1fr 1.05fr; grid-template-areas: "a v" "b v"; column-gap: 30px; } .hero .h1x { grid-area: a; align-self: end; } .hero .h2x { grid-area: b; align-self: start; padding-top: 18px; } .hero .v3 { grid-area: v; margin: 0; height: 620px; } }
.duo { display: grid; gap: 14px; }
@media (min-width: 760px) { .duo { grid-template-columns: 1fr 1fr; } }
.cat { position: relative; border: 0; text-align: left; cursor: pointer; border-radius: 22px; padding: 28px 26px 24px; display: grid; gap: 14px; min-height: 280px; align-content: end; overflow: hidden; transition: transform .3s; }
.cat:active { transform: scale(.985); }
.cat.dark { background: var(--deep); color: #f4efe6; } .cat.dark i { color: var(--acc-l); }
.cat.light { background: var(--paper); border: 1px solid var(--line); }
.cat b { font: 400 46px/1 var(--title); } .cat b i { font-style: italic; color: var(--acc); }
.cat p { margin: 0; opacity: .75; font-size: 15px; max-width: 32ch; }
.cat .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.cat .chips span { font-size: 12.5px; padding: 5px 11px; border-radius: 99px; border: 1px solid currentColor; opacity: .7; }
.cat .arrow { position: absolute; top: 24px; right: 24px; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; border: 1px solid currentColor; opacity: .8; }
.cat .arrow svg { width: 18px; }
.steps { display: grid; gap: 12px; counter-reset: s; }
@media (min-width: 760px) { .steps { grid-template-columns: repeat(3, 1fr); } }
.step { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: grid; gap: 6px; }
.step::before { counter-increment: s; content: "0" counter(s); font: 400 34px/1 var(--title); color: var(--acc); }
.step b { font-size: 16px; } .step span { color: var(--muted); font-size: 14.5px; }
.closing { text-align: center; display: grid; justify-items: center; gap: 16px; padding: 16px 0 6px; }

/* --- galeries --- */
.occs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 760px) { .occs { grid-template-columns: repeat(4, 1fr); } }
.occ { position: relative; border: 0; cursor: pointer; text-align: left; border-radius: 16px; padding: 16px; min-height: 150px; display: grid; align-content: space-between; gap: 18px; background: var(--o-bg); color: var(--o-ink); overflow: hidden; transition: transform .25s; }
.occ:active { transform: scale(.97); }
.occ::after { content: ""; position: absolute; right: -30px; top: -30px; width: 110px; height: 110px; border-radius: 50%; border: 1px solid var(--o-acc); opacity: .45; }
.occ::before { content: ""; position: absolute; right: -10px; top: -10px; width: 70px; height: 70px; border-radius: 50%; border: 1px solid var(--o-acc); opacity: .35; }
.occ b { font: 400 25px/1.05 var(--title); position: relative; }
.occ small { font-size: 12.5px; font-weight: 600; letter-spacing: .04em; color: var(--o-acc); position: relative; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 760px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 18px; } }
.mdl { border: 0; padding: 0; background: none; cursor: pointer; text-align: left; display: grid; gap: 8px; }
.mdl .v3 { aspect-ratio: 4 / 5; outline: 1px solid var(--line); }
.mdl b { font: 400 21px/1.1 var(--title); }
.mdl small { color: var(--muted); font-size: 12.5px; margin-top: -6px; }
.picks { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 760px) { .picks { grid-template-columns: repeat(4, 1fr); } }

/* --- la carte --- */
.card { position: relative; width: 100%; aspect-ratio: 3 / 4.2; overflow: hidden; container-type: inline-size; background: var(--c-bg); color: var(--c-ink); isolation: isolate; border-radius: 1.4cqw; }
.card::after { content: ""; position: absolute; inset: 0; z-index: 6; pointer-events: none; opacity: .22; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .45 0 0 0 0 .4 0 0 0 .55 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }
.card canvas.fx { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
.card .dec { position: absolute; inset: 0; z-index: 2; pointer-events: none; color: var(--c-acc); }
.card .dec svg { position: absolute; }
.card .ct { position: absolute; z-index: 3; inset: 13cqw 12cqw; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 2.4cqw; }
.card .pre { font: 600 2.9cqw var(--ui); letter-spacing: .32em; text-transform: uppercase; color: var(--c-acc); }
.card .tt { font: 400 10.4cqw/1.02 var(--title); margin: 0; }
.card .orn { width: 30cqw; height: auto; color: var(--c-acc); }
.card .nm { font: 500 6cqw/1.15 var(--title); font-style: italic; background: linear-gradient(100deg, var(--c-acc) 20%, color-mix(in srgb, var(--c-acc) 45%, #fff) 50%, var(--c-acc) 80%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.card .msg { font: 400 3.9cqw/1.5 var(--ui); opacity: .88; max-width: 64cqw; white-space: pre-line; }
.card .info { font: 600 3.4cqw/1.55 var(--ui); letter-spacing: .02em; padding-top: 2.4cqw; border-top: .25cqw solid color-mix(in srgb, var(--c-acc) 55%, transparent); }
.card .sig { font: 400 6cqw var(--title); font-style: italic; color: var(--c-acc); }
.card .uph { position: relative; flex: none; width: 46cqw; aspect-ratio: 1; overflow: hidden; margin-bottom: 1cqw; box-shadow: 0 0 0 .5cqw var(--c-bg), 0 0 0 .8cqw var(--c-acc); }
.card .uph img { width: 100%; height: 100%; object-fit: cover; }
.card.hasph .tt { font-size: 8.4cqw; } .card.hasph .msg { font-size: 3.4cqw; } .card.hasph .ct { gap: 1.8cqw; inset: 9cqw 10cqw; }
/* polices */
.f-script .tt { font-family: "Great Vibes", cursive; font-size: 13cqw; } .f-script.hasph .tt { font-size: 10.5cqw; }
.f-script .nm, .f-script .sig { font-family: "Great Vibes", cursive; font-style: normal; font-size: 8cqw; }
.f-serif .tt { font-family: "Playfair Display", Georgia, serif; font-style: italic; font-size: 9.6cqw; }
.f-royal .tt { font-family: "Cinzel", Georgia, serif; font-size: 8cqw; letter-spacing: .05em; } .f-royal .nm, .f-royal .sig { font-family: "Cinzel", serif; font-style: normal; font-size: 4.8cqw; letter-spacing: .06em; }
.f-fun .tt, .f-fun .nm, .f-fun .sig { font-family: "Fredoka", sans-serif; font-weight: 700; font-style: normal; } .f-fun .tt { font-size: 10cqw; }
.f-brush .tt, .f-brush .nm, .f-brush .sig { font-family: "Pacifico", cursive; font-style: normal; } .f-brush .tt { font-size: 9.4cqw; }
.f-arab .tt, .f-arab .nm, .f-arab .sig { font-family: "Amiri", serif; font-weight: 700; font-style: normal; } .f-arab .tt { font-size: 10.5cqw; }
/* 1. cadre : double filet et coins ornés */
.l-cadre .fr { position: absolute; inset: 5cqw; border: .45cqw solid var(--c-acc); }
.l-cadre .fr::after { content: ""; position: absolute; inset: 1.6cqw; border: .15cqw solid var(--c-acc); }
.l-cadre .cn { width: 11cqw; height: 11cqw; }
/* 2. arche */
.l-arche .ar { position: absolute; inset: 7cqw 9cqw; border: .4cqw solid var(--c-acc); border-radius: 50cqw 50cqw 1cqw 1cqw; }
.l-arche .ar::after { content: ""; position: absolute; inset: 1.8cqw; border: .15cqw solid var(--c-acc); border-radius: 50cqw 50cqw .5cqw .5cqw; }
.l-arche .ct { inset: 20cqw 15cqw 12cqw; } .l-arche .uph { border-radius: 50cqw 50cqw 1cqw 1cqw; width: 40cqw; aspect-ratio: .82; }
/* 3. monogramme */
.l-monogramme .fr { position: absolute; inset: 4.5cqw; border: .15cqw solid var(--c-acc); }
.l-monogramme .mono { width: 24cqw; aspect-ratio: 1; border-radius: 50%; border: .35cqw solid var(--c-acc); box-shadow: inset 0 0 0 1.2cqw var(--c-bg), inset 0 0 0 1.35cqw var(--c-acc); display: grid; place-items: center; font: 500 8cqw/1 "Cinzel", serif; color: var(--c-acc); flex: none; margin-bottom: 1.5cqw; }
.l-monogramme .uph { border-radius: 50%; width: 38cqw; }
/* 4. art déco */
.l-deco .ct { inset: 24cqw 12cqw 14cqw; } .l-deco .tt { letter-spacing: .02em; }
.l-deco .uph { width: 40cqw; aspect-ratio: 1; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); box-shadow: none; }
/* 5. botanique */
.l-botanique .ct { inset: 16cqw 13cqw; } .l-botanique .uph { border-radius: 50%; width: 38cqw; }
/* 6. moderne : aligné à gauche, grand titre */
.l-moderne .ct { inset: 12cqw 11cqw 11cqw; align-items: flex-start; text-align: left; justify-content: flex-end; }
.l-moderne .tt { font-size: 13cqw; line-height: .98; } .l-moderne.f-script .tt { font-size: 15cqw; } .l-moderne .orn { display: none; }
.l-moderne .bar { position: absolute; left: 11cqw; top: 11cqw; width: 14cqw; height: .7cqw; background: var(--c-acc); }
.l-moderne .msg { max-width: 72cqw; } .l-moderne .uph { width: 100%; aspect-ratio: 1.5; box-shadow: none; margin-bottom: 3cqw; }

/* --- éditeur --- */
.editor { display: grid; gap: 22px; }
@media (min-width: 900px) { .editor { grid-template-columns: 1fr 1fr; align-items: start; } .editor .stagecol { position: sticky; top: 76px; } }
.stagecol { display: grid; gap: 12px; }
.stagecol .v3 { aspect-ratio: 4 / 5; outline: 1px solid var(--line); }
.stagecol .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.thecard { max-width: 320px; width: 100%; margin: 0 auto; }
.thecard .card { box-shadow: 0 22px 46px rgba(22,20,18,.18); }
.form { display: grid; gap: 14px; }
.form h2 { margin-bottom: 4px; }
.fs { display: grid; gap: 12px; padding: 18px; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; }
.fs > .tlab { font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--acc); }
.form label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.form input, .form textarea { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-size: 15.5px; color: var(--ink); }
.form textarea { min-height: 92px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 520px) { .row2 { grid-template-columns: 1fr; } }
.form input[type=datetime-local] { min-width: 0; }
.switch { display: flex !important; align-items: center; justify-content: space-between; gap: 10px; color: var(--ink) !important; font-size: 15px !important; font-weight: 500 !important; }
.switch input { width: 46px; height: 26px; appearance: none; background: #d9d1c5; border-radius: 99px; position: relative; cursor: pointer; transition: background .2s; padding: 0; border: 0; flex: none; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch input:checked { background: var(--ink); } .switch input:checked::after { transform: translateX(20px); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg button { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px 6px; font-weight: 600; font-size: 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.phrow { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.phrow img { width: 56px; height: 56px; object-fit: cover; border-radius: 12px; }
.phrow label.pick { border: 1px dashed #c9bfae; border-radius: 12px; padding: 12px 16px; font-weight: 600; color: var(--ink); cursor: pointer; }
.phrow label.pick input { display: none; }
.phrow button { border: 0; background: none; text-decoration: underline; cursor: pointer; color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 8px; } .tags:empty { display: none; }
.tag { display: inline-flex; align-items: center; gap: 6px; background: var(--ink); color: #fff; border-radius: 99px; padding: 7px 8px 7px 14px; font-size: 14px; font-weight: 600; animation: in .3s both; }
.tag button { width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgba(255,255,255,.18); color: #fff; cursor: pointer; font-size: 14px; line-height: 1; padding: 0; }
.tadd { display: grid; grid-template-columns: minmax(0, 1fr) 50px; gap: 8px; }
.tadd .plus { border: 0; border-radius: 12px; background: var(--ink); color: #fff; font-size: 24px; cursor: pointer; }
.total { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-radius: 16px; background: var(--deep); color: #f4efe6; }
.total small { display: block; font-size: 12.5px; opacity: .7; } .total b { font: 400 32px var(--title); }
.note { font-size: 13px; color: var(--muted); text-align: center; margin: 0; }

/* --- partage, mes cartes --- */
.narrow { max-width: 620px; margin: 0 auto; width: 100%; }
.sharebox { background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: grid; gap: 12px; }
.linkrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.linkrow input { padding: 13px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); min-width: 0; font-size: 14px; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
#qr { display: grid; place-items: center; padding: 10px; background: #fff; border-radius: 14px; }
#qr img, #qr canvas { width: 150px !important; height: 150px !important; }
.resp { display: grid; gap: 8px; }
.resp .r { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; background: var(--bg); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; } .dot.oui { background: #2f9e64; } .dot.non { background: #c94a4a; } .dot.peut-etre { background: #d69a2d; }
.resp .tot { display: flex; gap: 8px; flex-wrap: wrap; font-weight: 700; font-size: 14px; } .resp .tot span { background: var(--bg); border-radius: 99px; padding: 6px 12px; }
.guests { display: grid; gap: 8px; } .guest { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; background: var(--bg); border-radius: 12px; padding: 8px 8px 8px 14px; font-weight: 600; }
.guest button { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 12px; font-weight: 600; font-size: 13px; cursor: pointer; }
.mylist { display: grid; gap: 10px; }
.mylist button { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: 16px; padding: 10px; cursor: pointer; }

function burst(cv, colors, n = 90) {
  const c = cv.getContext('2d'), r = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = r.width * dpr; cv.height = r.height * dpr; c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = r.width, H = r.height, P = [];
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, v = 3 + Math.random() * 9;
    P.push({ x: W / 2, y: H * .45, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 3, r: Math.random() * 6.28, vr: (Math.random() - .5) * .3, s: 3 + Math.random() * 5, col: colors[i % colors.length], star: i % 3 === 0, l: 1 }); }
  const star = (x, y, rr) => { c.beginPath(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, q = i % 2 ? rr * .35 : rr; c.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } c.fill(); };
  (function f() {
    c.clearRect(0, 0, W, H); let alive = 0;
    for (const p of P) { if (p.l <= 0) continue; alive++; p.x += p.vx; p.y += p.vy; p.vy += .22; p.vx *= .985; p.r += p.vr; p.l -= .011;
      c.globalAlpha = Math.max(0, p.l); c.fillStyle = p.col;
      if (p.star) star(p.x, p.y, p.s * 1.3); else { c.save(); c.translate(p.x, p.y); c.rotate(p.r); c.fillRect(-p.s, -p.s / 2, p.s * 2, p.s); c.restore(); } }
    c.globalAlpha = 1; if (alive) requestAnimationFrame(f); else c.clearRect(0, 0, W, H);
  })();
}

function musicSetup(id) {
  document.querySelector('.music')?.remove(); YTP = null; ytWant = false; if (!id) return;
  const box = document.createElement('div'); box.className = 'music'; box.innerHTML = '<div class="yt"><div id="ytp"></div></div><button type="button" data-mute aria-label="Couper la musique" hidden><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button>';
  document.body.appendChild(box);
  const make = () => { YTP = new YT.Player('ytp', { width: 160, height: 90, videoId: id, playerVars: { playsinline: 1, controls: 0, loop: 1, playlist: id, rel: 0 },
    events: { onReady: () => { if (ytWant) musicPlay(); }, onStateChange: e => { if (e.data === 1) { box.classList.remove('tap'); box.querySelector('[data-mute]').hidden = false; } } } }); };
  if (window.YT && YT.Player) make(); else { window.onYouTubeIframeAPIReady = make; if (!document.querySelector('script[src*="iframe_api"]')) { const sc = document.createElement('script'); sc.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(sc); } }
}
function musicPlay() {
  ytWant = true; if (!YTP || !YTP.playVideo) return;
  try { YTP.unMute(); YTP.setVolume(80); YTP.playVideo(); } catch (_) {}
  setTimeout(() => { const box = document.querySelector('.music'); try { if (box && YTP.getPlayerState() !== 1) box.classList.add('tap'); } catch (_) {} }, 2500);
}


function render() {
  FX.forEach(x => x.stop()); FX.clear();
  let r = state.route;
  if (r.startsWith('ok-') && !state.share) { const x = (store.get('mine') || []).find(y => 'ok-' + y.id === r); if (x) state.share = [x.id, x.cle, x.url]; else r = state.route = ''; }
  $('#app').innerHTML = r.startsWith('cat-') && CATS.find(c => c.id === r.slice(4)) ? catPage(r.slice(4)) : r.startsWith('o-') && occOf(r.slice(2)) ? occPage(r.slice(2)) : r.startsWith('m-') && mdlOf(r.slice(2)) ? editor(r.slice(2))
    : r.startsWith('ok-') ? sharePage(...state.share) : r === 'mes-cartes' ? myCards() : home();
  $('#back').hidden = !r;
  scrollTo(0, 0); liveCards(); reveal(); mount3();
  if (r.startsWith('ok-')) { if ($('#qr')) try { new QRCode($('#qr'), { text: $('#lnk') ? $('#lnk').value : state.share[2], width: 150, height: 150, correctLevel: QRCode.CorrectLevel.M }); } catch (_) { $('#qr').hidden = true; } loadResp(state.share[0], state.share[1]); }
}
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add('on'); io.unobserve(x.target); } }), { threshold: .1 }) : null;
function reveal() { document.querySelectorAll('.rv:not(.on)').forEach(el => io ? io.observe(el) : el.classList.add('on')); }
function go(r) { if (r === state.route) return; state.route = r; history.pushState({ r }, '', r ? '#' + r : location.pathname); render(); }
addEventListener('popstate', e => { const o = $('#open'); if (!o.hidden) { closeOpen(); return; } state.route = (e.state && e.state.r) || location.hash.slice(1); render(); });

/* ---------- ouverture chez le destinataire ---------- */
let POUR = '', TOK = '', OPENL = null;
function openCard(data, { id = null, preview = false } = {}) {
  const m = mdlOf(data.mid); if (!m) return false;
  const o = occOf(m.occ), f = data.f, [bg, ink] = PAL[m.pal], inv = o.cat === 'inv';
  const el = $('#open'); el.hidden = false; document.body.style.overflow = 'hidden';
  el.style.setProperty('--o-bg', bg); el.style.setProperty('--o-ink', ink);
  const hint = POUR ? 'Pour ' + esc(POUR) + (f.exp ? ' · de la part de ' + esc(f.exp) : '') : f.exp ? 'De la part de ' + esc(f.exp) : 'Tu as reçu une carte';
  const X = preview ? '<button class="x" type="button" data-close aria-label="Fermer">×</button>' : '';
  el.innerHTML = `<div class="ostage"><div class="v3" id="ov3" role="button" tabindex="0" aria-label="Ouvrir"><span class="spin"></span><div class="nogl">${cardHTML(m, f)}</div></div>
    <div class="o-fx"><div class="o-flash"></div><div class="o-card">${cardHTML(m, f)}</div><canvas class="o-burst" style="position:absolute;inset:0;width:100%;height:100%"></canvas></div>
    <div class="o-hint"><span class="tap"></span><b>Touche pour ouvrir</b><small>${hint}</small></div></div>${X}`;
  const slot = el.querySelector('#ov3'); let view = null, opened = false, want = false;
  const showReveal = () => {
    if (OPENL) { OPENL.destroy(); OPENL = null; }
    const when = f.date ? new Date(f.date) : null, addr = f.adresse || f.lieu;
    el.innerHTML = `${X}<div class="reveal">${cardHTML(m, f, { live: true })}
      ${inv && when && !isNaN(when) && when > Date.now() ? `<div class="panel"><h3>Plus que…</h3><div class="count" id="cnt"></div></div>` : ''}
      ${inv && (addr || when) ? `<div class="panel">${addr ? `<a class="ghost" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr)}" target="_blank" rel="noopener">Itinéraire vers ${esc(f.lieu || 'le lieu')}</a>` : ''}
        ${when && !isNaN(when) ? `<a class="ghost" href="${icsHref(f, o)}" download="invitation.ics">Ajouter à mon agenda</a>` : ''}</div>` : ''}
      ${inv && f.rsvp && id ? `<div class="panel" id="rsvp"><h3>Tu viens ?</h3>
        <input id="rn" maxlength="60" value="${esc(POUR)}" placeholder="Ton prénom et nom">
        <div class="choice3"><button type="button" data-rv="oui" aria-pressed="false">Oui</button><button type="button" data-rv="peut-etre" aria-pressed="false">Peut-être</button><button type="button" data-rv="non" aria-pressed="false">Non</button></div>
        <label style="display:flex;align-items:center;gap:10px;font-weight:600">Nombre de personnes <input id="rnb" type="number" min="1" max="20" value="1" style="width:76px"></label>
        <textarea id="rm" maxlength="300" placeholder="Un petit mot (facultatif)" style="min-height:70px"></textarea>
        <button class="cta" type="button" data-send-rsvp="${id}">Envoyer ma réponse</button><p class="note" id="rmsg" role="status"></p></div>` : ''}
      <p class="made">Carte créée avec <a href="${location.origin + location.pathname}">Lookmiz</a> · <a href="${location.origin + location.pathname}">Crée la tienne</a></p></div>`;
    el.scrollTop = 0; liveCards(el); tickCount(when);
  };
  // fin de l'ouverture : éclat de lumière, la carte vient au premier plan
  const finale = () => new Promise(res => {
    const A = (n, k, op) => n.animate(k, { fill: 'forwards', ...op });
    A(el.querySelector('.o-flash'), [{ opacity: 0 }, { opacity: 1, offset: .35 }, { opacity: 0 }], { duration: 900, easing: 'ease-out' });
    if (OPENL) A(OPENL.cv, [{ opacity: 1 }, { opacity: 0 }], { duration: 500 });
    A(el.querySelector('.o-card'), [{ transform: 'translate(-50%,-56%) scale(.7)', opacity: 0 }, { transform: 'translate(-50%,-50%) scale(1.03)', opacity: 1, offset: .7 }, { transform: 'translate(-50%,-50%) scale(1)', opacity: 1 }], { duration: 900, easing: 'cubic-bezier(.2,.9,.3,1.15)' });
    burst(el.querySelector('.o-burst'), [PAL[m.pal][2], '#ffffff', '#ffd98a', '#f3d9a4'], 110);
    setTimeout(res, 1250);
  });
  const doOpen = () => {
    if (opened) return; musicPlay();
    if (!view && !NO3D) { want = true; return; }
    opened = true; el.querySelector('.o-hint').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' });
    (view ? view.open() : Promise.resolve()).then(finale).then(showReveal);
  };
  slot.addEventListener('click', doOpen); slot.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); doOpen(); } });
  musicSetup(ytId(f.yt));
  engine().then(async E => {
    if (!E || !slot.isConnected) { if (want) doOpen(); return; }
    const b = await E.builderFor(m.occ, m.id.split('-').pop(), useEnv(m, f)); if (!slot.isConnected) return;
    if (OPENL) OPENL.destroy(); OPENL = E.createLayer(el, { dpr: 2 });
    view = OPENL.add(slot, b, sceneOpts(m, f), { zoom: true, shadows: true }); slot.classList.add('ready');
    if (want) { want = false; doOpen(); }
  });
  return true;
}
function closeOpen() { if (OPENL) { OPENL.destroy(); OPENL = null; } musicSetup(''); const el = $('#open'); el.hidden = true; el.innerHTML = ''; document.body.style.overflow = ''; liveCards(); }

/* ---------- clics ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('button, a'); if (!t) return;
  if (t.id === 'back') { history.back(); return; }
  if (t.dataset.go !== undefined) { go(t.dataset.go); return; }
  if (t.dataset.ouv && state.f) { state.f.ouv = t.dataset.ouv; t.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === t)); rebuild3(0); return; }
  if ('nophoto' in t.dataset && state.f) { delete state.f.photo; rerender(); return; }
  if ('mute' in t.dataset && YTP) { try { if (YTP.isMuted()) { YTP.unMute(); t.style.opacity = 1; } else { YTP.mute(); t.style.opacity = .5; } } catch (_) {} return; }
  if ('replay' in t.dataset) { rebuild3(0); return; }
  if ('preview' in t.dataset) { openCard({ mid: state.mid, f: state.f }, { preview: true }); history.pushState({ r: state.route, open: 1 }, ''); return; }
  if ('close' in t.dataset) { history.back(); return; }
  if ('save' in t.dataset) { save(); return; }
  if ('copy' in t.dataset) { const i = $('#lnk'); try { await navigator.clipboard.writeText(i.value); t.textContent = 'Copié'; } catch (_) { i.select(); } return; }
  if ('share' in t.dataset) { const u = $('#lnk').value; if (navigator.share) navigator.share({ title: 'Tu as reçu une carte', text: 'Ouvre ta carte :', url: u }).catch(() => {}); else { try { await navigator.clipboard.writeText(u); t.textContent = 'Lien copié'; } catch (_) {} } return; }
  if (t.dataset.pay) { const x = (store.get('mine') || []).find(y => y.id === t.dataset.pay); if (x) { t.disabled = true; $('#pmsg').textContent = 'Ouverture du paiement…'; pay(x.id, x.cle, $('#pmsg'), t); } return; }
  if ('addtag' in t.dataset) { addTag(); return; }
  if (t.dataset.untag !== undefined) { const L = destList(state.f); L.splice(+t.dataset.untag, 1); state.f.dest = L; refreshTags(); return; }
  if (t.dataset.selfview) { const x = (store.get('mine') || []).find(y => y.id === t.dataset.selfview); if (x) { openCard({ mid: x.mid, f: x.f }, { preview: true }); history.pushState({ r: state.route, open: 1 }, ''); } return; }
  if (t.dataset.gcopy) { try { await navigator.clipboard.writeText(t.dataset.gcopy); t.textContent = 'Copié'; } catch (_) {} return; }
  if (t.dataset.gshare) { const u = t.dataset.gshare; if (navigator.share) navigator.share({ title: t.dataset.gname + ', tu as reçu une carte', url: u }).catch(() => {}); else { try { await navigator.clipboard.writeText(u); t.textContent = 'Copié'; } catch (_) {} } return; }
  if (t.dataset.reload) { const x = (store.get('mine') || []).find(y => y.id === t.dataset.reload); if (x) loadResp(x.id, x.cle); return; }
  if (t.dataset.openMine) { const x = (store.get('mine') || []).find(y => y.id === t.dataset.openMine); if (x) { state.share = [x.id, x.cle, x.url]; go('ok-' + x.id); } return; }
  if (t.dataset.rv) { document.querySelectorAll('[data-rv]').forEach(b => b.setAttribute('aria-pressed', b === t)); return; }
  if (t.dataset.sendRsvp) {
    const nom = $('#rn').value.trim(), rep = (document.querySelector('[data-rv][aria-pressed="true"]') || {}).dataset?.rv, m = $('#rmsg');
    if (!nom) { m.textContent = 'Indique ton prénom.'; return; } if (!rep) { m.textContent = 'Choisis Oui, Peut-être ou Non.'; return; }
    t.disabled = true; m.textContent = 'Envoi…';
    try { const r = await sb('reponses', { carte: t.dataset.sendRsvp, t: TOK || null, nom, reponse: rep, nb: Math.max(1, Math.min(20, +$('#rnb').value || 1)), message: $('#rm').value.trim() || null }); if (r.status === 409) { m.textContent = 'Tu as déjà répondu avec ce lien.'; t.disabled = false; return; } if (!r.ok) throw 0;
      $('#rsvp').innerHTML = `<h3>Merci ${esc(nom)} !</h3><p style="margin:0">Ta réponse a bien été envoyée.</p>`; }
    catch (_) { m.textContent = 'L\'envoi n\'a pas marché. Réessaie dans un instant.'; t.disabled = false; }
  }
});

let cntT;
function tickCount(when) {
  clearInterval(cntT); if (!when || isNaN(when)) return;
  const t = () => { const box = $('#cnt'); if (!box) return clearInterval(cntT); let s = Math.max(0, (when - Date.now()) / 1000);
    const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), ss = Math.floor(s % 60);
    box.innerHTML = [[d, 'jours'], [h, 'heures'], [m, 'min'], [ss, 'sec']].map(([v, l]) => `<div><b>${v}</b><small>${l}</small></div>`).join(''); };
  t(); cntT = setInterval(t, 1000);
}
function icsHref(f, o) {
  const d = new Date(f.date), e = new Date(+d + 3 * 3600000), z = x => x.toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const ics = `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Lookmiz//FR\r\nBEGIN:VEVENT\r\nUID:${Date.now()}@lookmiz.com\r\nDTSTAMP:${z(new Date())}\r\nDTSTART:${z(d)}\r\nDTEND:${z(e)}\r\nSUMMARY:${(f.titre || o.titre).replace(/[,;\n]/g, ' ')}\r\nLOCATION:${(f.adresse || f.lieu || '').replace(/[,;\n]/g, ' ')}\r\nEND:VEVENT\r\nEND:VCALENDAR`;
  return 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
}


/* ---------- démarrage ---------- */
(async () => {
  const q = new URLSearchParams(location.search);
  if (q.get('paye')) {   // retour de Stripe : on vérifie le paiement avant d'activer la carte
    const id = q.get('paye'); history.replaceState(null, '', location.pathname);
    $('#app').innerHTML = '<section class="screen"><h2>Vérification du <i>paiement</i>…</h2></section>';
    try { const r = await fetch(PAYFN, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SBK, Authorization: 'Bearer ' + SBK }, body: JSON.stringify({ action: 'verify', id, sid: q.get('sid') }) });
      const d = await r.json(); if (d.paid) { markPaid(id); return; } } catch (_) {}
    state.route = 'mes-cartes'; render(); return;
  }
  if (q.get('c')) {
    let dev = store.get('dev'); if (!dev) { dev = rid(16); store.set('dev', dev); }
    try { const r = await fetch(SB + 'rpc/ouvrir_carte', { method: 'POST', headers: { apikey: SBK, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_id: q.get('c'), p_t: q.get('t') || '', p_dev: dev }) });
      const d = await r.json();
      if (d && d.erreur === 'limite') { $('#app').innerHTML = '<section class="screen"><h2>Lien déjà <i>utilisé</i></h2><p class="sub">Cette carte a déjà été ouverte sur 2 appareils. Chaque invité a son propre lien : demande à la personne qui t\'a invité de t\'envoyer le tien.</p></section>'; return; }
      if (d && d.data) { POUR = d.nom || ''; TOK = q.get('t') || ''; if (openCard(d.data, { id: q.get('c') })) return; } } catch (_) {}
    $('#app').innerHTML = '<section class="screen"><h2>Carte <i>introuvable</i></h2><p class="sub">Le lien est peut-être incomplet. Demande à la personne de te le renvoyer.</p><button class="cta" type="button" data-go="">Découvrir Lookmiz</button></section>';
    return;
  }
  state.route = location.hash.slice(1); history.replaceState({ r: state.route }, '', location.href); render();
})();
</script>
</body>
