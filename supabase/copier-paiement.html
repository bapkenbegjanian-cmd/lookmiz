<body><button id="b">Copier le code</button><p id="m">Touche le bouton, puis colle dans Supabase.</p><textarea id="t" readonly translate="no">// Fonction Supabase « paiement- » de Lookmiz.

// 2) Anciennes cartes d&#x27;invitation (checkout / verify) : inchangé.
import { createClient } from &#x27;npm:@supabase/supabase-js@2&#x27;;

const CORS = { &#x27;Access-Control-Allow-Origin&#x27;: &#x27;*&#x27;, &#x27;Access-Control-Allow-Headers&#x27;: &#x27;*&#x27;, &#x27;Access-Control-Allow-Methods&#x27;: &#x27;POST, OPTIONS&#x27; };

const admin = createClient(Deno.env.get(&#x27;SUPABASE_URL&#x27;)!, Deno.env.get(&#x27;SUPABASE_SERVICE_ROLE_KEY&#x27;)!);
const SK = Deno.env.get(&#x27;STRIPE_SECRET_KEY&#x27;) ?? &#x27;&#x27;;
const SITE = &#x27;https://lookmiz.com/&#x27;;
// Prix côté serveur : le navigateur ne peut pas les modifier.
// Contenu des 4 programmes : jamais envoyé sans paiement confirmé.
const DAYS: Record&lt;string, string[][]&gt; = {&quot;ecrans&quot;:[[&quot;Ton pourquoi&quot;,&quot;Avant de changer quoi que ce soit, il faut savoir pour quoi tu le fais. Ce pourquoi sera ta réserve les jours difficiles : il doit venir de toi, pas de ce qu&#x27;on attend de toi.&quot;,&quot;Écris 3 raisons personnelles de reprendre la main sur ton téléphone (dormir, être présent, avancer sur un projet…). Garde-les en note sur ton écran de verrouillage.&quot;],[&quot;Mesurer sans te juger&quot;,&quot;Ton téléphone sait déjà combien de temps tu y passes. Regarder le chiffre sans te traiter de nul, c&#x27;est le vrai premier pas : on ne règle pas ce qu&#x27;on ne regarde pas.&quot;,&quot;Ouvre « Temps d&#x27;écran » (iPhone) ou « Bien-être numérique » (Android). Note ta moyenne des 7 derniers jours et tes 3 applis les plus utilisées.&quot;],[&quot;Ce que ça t&#x27;apporte, ce que ça te coûte&quot;,&quot;Le scroll te donne quelque chose : fuir l&#x27;ennui, ne pas être seul, se sentir à jour. Le reconnaître permet de trouver d&#x27;autres façons d&#x27;obtenir la même chose. Ce n&#x27;est pas un manque de volonté, c&#x27;est une habitude qui te rend service.&quot;,&quot;Fais deux colonnes : ce que le téléphone t&#x27;apporte / ce qu&#x27;il te coûte (temps, sommeil, humeur, concentration). Souligne ce qui pèse le plus.&quot;],[&quot;Tes déclencheurs&quot;,&quot;Un déclencheur, c&#x27;est ce qui te fait sortir le téléphone sans y penser : une notification, l&#x27;ennui, une file d&#x27;attente, le lit, un moment de stress. Quand tu les repères, tu les vois venir.&quot;,&quot;Aujourd&#x27;hui, à chaque fois que tu prends ton téléphone, note l&#x27;heure et ce que tu ressens juste avant. Vise 10 notes.&quot;],[&quot;Rendre le scroll moins facile&quot;,&quot;Ta volonté est limitée, ton environnement peut faire le travail à ta place. Chaque petit obstacle, comme un mot de passe à retaper ou une appli rangée loin, réduit les ouvertures automatiques.&quot;,&quot;Coupe toutes les notifications sauf appels et messages de proches. Sors les 3 applis les plus utilisées de ton écran d&#x27;accueil et déconnecte-toi.&quot;],[&quot;Le plan « si… alors… »&quot;,&quot;Un plan précis marche mieux qu&#x27;une bonne intention. Tu décides à l&#x27;avance quoi faire quand le déclencheur arrive, pour ne pas avoir à choisir sous l&#x27;impulsion.&quot;,&quot;Écris 3 phrases : « Si je suis dans mon lit / en file d&#x27;attente / en pause, alors je… » avec une action concrète (lire 2 pages, regarder dehors, boire un verre d&#x27;eau).&quot;],[&quot;Bilan de la semaine 1&quot;,&quot;Une semaine pour comprendre. Tu sais maintenant combien de temps tu y passes, ce que ça te donne et quand ça se déclenche. C&#x27;est suffisant pour attaquer la suite.&quot;,&quot;Relis tes notes. Complète : « Ce que j&#x27;ai appris sur moi cette semaine, c&#x27;est… ». Choisis un seul moment de la journée à protéger la semaine prochaine.&quot;],[&quot;Comprendre l&#x27;envie&quot;,&quot;L&#x27;envie de regarder ton téléphone monte, atteint un pic, puis retombe, même si tu ne fais rien. Savoir que ça passe change tout : une envie n&#x27;est pas un ordre.&quot;,&quot;Quand l&#x27;envie arrive, attends 2 minutes avant d&#x27;agir. Observe : où la sens-tu dans le corps ? Que devient-elle au bout de 2 minutes ?&quot;],[&quot;La règle des 10 minutes&quot;,&quot;Quand une envie arrive, ne te dis pas « jamais », dis-toi « dans 10 minutes ». Souvent, l&#x27;envie est partie avant. Si elle est encore là, tu y vas en conscience, pas en automatique.&quot;,&quot;Utilise le bouton SOS du site (ou un minuteur de 10 minutes) à chaque envie aujourd&#x27;hui. Compte combien sont passées.&quot;],[&quot;Respirer pour retomber&quot;,&quot;Quand tu veux décrocher, le corps s&#x27;agite. Une respiration lente, avec un souffle plus long que l&#x27;inspiration, aide à calmer le système nerveux en quelques minutes.&quot;,&quot;Fais 2 minutes de respiration (inspire 4 secondes, souffle 6), deux fois dans la journée, dont une avant de prendre ton téléphone par réflexe.&quot;],[&quot;Quand tu t&#x27;ennuies&quot;,&quot;L&#x27;ennui est l&#x27;un des premiers déclencheurs. Il est inconfortable parce qu&#x27;on ne le laisse jamais durer. T&#x27;y habituer, c&#x27;est retrouver des idées et de l&#x27;attention.&quot;,&quot;Choisis un moment d&#x27;ennui (transport, attente, repas) et laisse ton téléphone dans la poche. Note ce qui te passe par la tête.&quot;],[&quot;Stress et fatigue&quot;,&quot;On scrolle davantage quand on est stressé ou fatigué : le cerveau cherche une pause facile. Si tu t&#x27;accordes de vraies pauses à ces moments, le téléphone devient moins nécessaire.&quot;,&quot;Prévois 3 pauses de 5 minutes sans écran aujourd&#x27;hui : étirements, fenêtre ouverte, verre d&#x27;eau, marche.&quot;],[&quot;Réseaux sociaux et comparaison&quot;,&quot;Les réseaux montrent le meilleur de la vie des autres, et s&#x27;y comparer fatigue. Tu peux garder ce qui t&#x27;apporte quelque chose et couper le reste.&quot;,&quot;Mets en sourdine ou désabonne-toi de 10 comptes qui te donnent un mauvais sentiment. Garde ceux qui t&#x27;apprennent ou te font rire.&quot;],[&quot;Bilan de la semaine 2&quot;,&quot;Tu as appris à voir l&#x27;envie venir et à la laisser passer. Même quelques envies surmontées comptent : ce sont elles qui construisent la nouvelle habitude.&quot;,&quot;Regarde ton compteur d&#x27;envies surmontées. Note le moment le plus dur de la semaine et ce qui t&#x27;a aidé.&quot;],[&quot;Remplacer, pas seulement enlever&quot;,&quot;Si tu enlèves une habitude sans rien mettre à la place, le vide la rappelle. Choisis des activités simples, accessibles, qui occupent les mains ou la tête.&quot;,&quot;Liste 5 activités de 10 minutes faisables n&#x27;importe où (livre, dessin, appel à un ami, podcast, étirements). Garde la liste en fond d&#x27;écran.&quot;],[&quot;Bouger&quot;,&quot;Le mouvement change l&#x27;humeur et l&#x27;énergie, et occupe le temps où tu aurais scrollé. Pas besoin de sport intense : marcher compte.&quot;,&quot;Marche 20 minutes aujourd&#x27;hui, sans écran. Un podcast est autorisé.&quot;],[&quot;Soirées et week-ends&quot;,&quot;Les moments sans cadre sont les plus risqués. Un planning léger, même flou, évite de glisser dans le scroll par défaut.&quot;,&quot;Planifie ce week-end 2 activités concrètes hors écran, avec un horaire.&quot;],[&quot;En parler à quelqu&#x27;un&quot;,&quot;Dire à un proche ce que tu fais t&#x27;engage et te soutient. Tu n&#x27;as pas à te justifier : une phrase simple suffit.&quot;,&quot;Dis à une personne de confiance que tu réduis ton temps d&#x27;écran. Propose-lui de te demander des nouvelles ce soir.&quot;],[&quot;Les pensées-pièges&quot;,&quot;« Juste cinq minutes », « je l&#x27;ai bien mérité », « je regarde juste un truc ». Ces phrases sont normales. Les repérer leur enlève du pouvoir.&quot;,&quot;Écris 3 phrases que tu te dis souvent avant de scroller. À côté de chacune, une réponse honnête et courte.&quot;],[&quot;Te récompenser autrement&quot;,&quot;Ton cerveau aime les petites récompenses. Tu peux en garder sans passer par l&#x27;écran : un café, un moment dehors, une série à plusieurs.&quot;,&quot;Choisis une récompense pour chaque jour tenu cette semaine. Note-la maintenant.&quot;],[&quot;Bilan de la semaine 3&quot;,&quot;Trois semaines de pratique. Regarde les chiffres, pas ton impression : on se juge toujours plus sévèrement qu&#x27;on ne le mérite.&quot;,&quot;Compare ton temps d&#x27;écran moyen de la semaine à celui du jour 2. Écris l&#x27;écart, quel qu&#x27;il soit.&quot;],[&quot;Un dérapage n&#x27;est pas une rechute&quot;,&quot;Tu vas peut-être craquer une soirée. Ce n&#x27;est pas un échec, c&#x27;est une information. Ce qui compte, c&#x27;est de reprendre le fil le lendemain, sans te punir.&quot;,&quot;Écris la phrase que tu te diras après un gros dérapage. Courte, bienveillante, qui te remet en route.&quot;],[&quot;Ton plan en cas de rechute&quot;,&quot;Prévoir le plan B enlève la peur. Qu&#x27;est-ce qui m&#x27;a fait craquer ? Qu&#x27;est-ce que je change ? Qui je préviens ?&quot;,&quot;Rédige un plan en 3 points : ce que je fais dans l&#x27;heure, ce que j&#x27;analyse, ce que j&#x27;ajuste.&quot;],[&quot;Qui tu deviens&quot;,&quot;Tu ne fais pas que supprimer un comportement : tu deviens quelqu&#x27;un qui décide de son attention. Cette image aide à tenir sur la durée.&quot;,&quot;Complète 3 fois : « Je suis quelqu&#x27;un qui… » à propos de ton rapport au téléphone.&quot;],[&quot;Les moments à risque à venir&quot;,&quot;Vacances, périodes de stress, soirées seul : certains moments vont remettre le scroll en jeu. Les prévoir, c&#x27;est déjà y être préparé.&quot;,&quot;Liste les 3 prochains moments à risque des 4 semaines à venir et ce que tu feras à chaque fois.&quot;],[&quot;Mieux dormir&quot;,&quot;Le téléphone au lit est l&#x27;un des plus gros voleurs de sommeil. Mieux dormir rend aussi les envies plus faciles à gérer.&quot;,&quot;Ce soir, charge ton téléphone hors de ta chambre, ou loin du lit, et utilise un réveil classique si besoin.&quot;],[&quot;Le temps que tu récupères&quot;,&quot;Ce temps est ton vrai gain. Le chiffrer le rend concret et motive.&quot;,&quot;Calcule : (temps d&#x27;écran du jour 2 moins temps actuel) × 30 jours. Écris ce que tu peux faire avec ces heures.&quot;],[&quot;Ton réseau de soutien&quot;,&quot;Si ton usage affecte ton sommeil, ton travail ou ton humeur au point que tu n&#x27;y arrives pas seul, en parler à un professionnel est une bonne idée. Ce n&#x27;est pas un échec.&quot;,&quot;Repère un interlocuteur : ton médecin généraliste, ou un psychologue. Si tu vas mal, le 3114 répond 24h/24.&quot;],[&quot;Lettre à toi-même&quot;,&quot;Ce que tu as fait pendant 30 jours mérite d&#x27;être écrit. Cette lettre te servira les jours où tu auras oublié pourquoi c&#x27;était important.&quot;,&quot;Écris-toi une lettre pour dans 3 mois : ce que tu as appris, ce que tu veux avoir gardé, ce que tu te souhaites.&quot;],[&quot;Et maintenant ?&quot;,&quot;30 jours, c&#x27;est un début, pas une fin. Garde 2 ou 3 règles qui ont marché, relâche le reste, et refais le point une fois par mois.&quot;,&quot;Choisis les 3 règles à garder. Plante un rappel mensuel dans ton agenda : « Point écrans ».&quot;]],&quot;pornographie&quot;:[[&quot;Ton pourquoi&quot;,&quot;Pas pour la honte, pour toi. Les raisons qui tiennent dans le temps sont positives : plus d&#x27;énergie, de concentration, de présence, des relations plus vraies. Ce pourquoi sera ta réserve les jours difficiles.&quot;,&quot;Écris 3 raisons personnelles de vouloir changer. Évite « parce que c&#x27;est mal » : cherche ce que tu veux gagner.&quot;],[&quot;Regarder honnêtement&quot;,&quot;On ne règle pas ce qu&#x27;on ne regarde pas. Mesurer ton habitude sans te juger, c&#x27;est te donner un point de départ réel.&quot;,&quot;Pendant 7 jours, note chaque fois : heure, lieu, durée, ce que tu ressentais avant. Aujourd&#x27;hui, reprends les 7 derniers jours de mémoire.&quot;],[&quot;Ce que ça t&#x27;apporte, ce que ça te coûte&quot;,&quot;Cette habitude te rend service : elle calme le stress, comble l&#x27;ennui ou la solitude. Le reconnaître permet de chercher d&#x27;autres façons d&#x27;obtenir la même chose. Elle a aussi un coût : temps, sommeil, culpabilité, attentes irréalistes.&quot;,&quot;Fais deux colonnes : ce que ça t&#x27;apporte / ce que ça te coûte. Souligne ce qui pèse le plus.&quot;],[&quot;Tes déclencheurs&quot;,&quot;Heure, lieu, émotion, appareil : ce sont les signaux qui déclenchent l&#x27;envie. Ennui, stress, solitude, fatigue et alcool reviennent souvent. Quand tu les repères, tu les vois venir.&quot;,&quot;Relis tes notes du jour 2. Repère les 3 déclencheurs les plus fréquents.&quot;],[&quot;Rendre l&#x27;accès plus difficile&quot;,&quot;La volonté s&#x27;épuise, l&#x27;environnement peut faire le travail. Moins d&#x27;accès facile, c&#x27;est moins de décisions à prendre sous l&#x27;envie.&quot;,&quot;Installe un filtre ou un bloqueur de contenus adultes sur tes appareils. Désactive la navigation privée. Mets ton téléphone hors du lit ce soir.&quot;],[&quot;Le plan « si… alors… »&quot;,&quot;Un plan précis marche mieux qu&#x27;une bonne intention. Tu décides à l&#x27;avance de ce que tu feras quand le déclencheur arrive.&quot;,&quot;Écris 3 phrases : « Si je suis seul le soir / ennuyé / stressé, alors je… » avec une action concrète (sortir, appeler quelqu&#x27;un, douche, marcher).&quot;],[&quot;Bilan de la semaine 1&quot;,&quot;Une semaine pour comprendre. Tu connais ton habitude, tes déclencheurs et tu as mis quelques barrières. C&#x27;est déjà beaucoup.&quot;,&quot;Complète : « Ce que j&#x27;ai appris sur moi cette semaine, c&#x27;est… ». Choisis un seul moment de la journée à protéger la semaine prochaine.&quot;],[&quot;Comprendre l&#x27;envie&quot;,&quot;L&#x27;envie monte, atteint un pic, puis retombe, même si tu ne fais rien. Savoir que ça passe change tout : une envie n&#x27;est pas un ordre.&quot;,&quot;Quand l&#x27;envie arrive, attends 2 minutes avant d&#x27;agir. Où la sens-tu dans le corps ? Que devient-elle au bout de 2 minutes ?&quot;],[&quot;La règle des 10 minutes&quot;,&quot;Ne te dis pas « jamais », dis-toi « dans 10 minutes, et dans une autre pièce ». Changer de lieu et d&#x27;activité coupe souvent l&#x27;automatisme.&quot;,&quot;Utilise le bouton SOS du site à chaque envie aujourd&#x27;hui. Compte combien sont passées.&quot;],[&quot;Respirer pour retomber&quot;,&quot;Une respiration lente, avec un souffle plus long que l&#x27;inspiration, aide à calmer le corps en quelques minutes.&quot;,&quot;Fais 2 minutes de respiration (inspire 4 secondes, souffle 6), deux fois dans la journée, dont une avant d&#x27;aller te coucher.&quot;],[&quot;Ennui et solitude&quot;,&quot;L&#x27;ennui et la solitude sont des déclencheurs fréquents. Ce que tu cherches vraiment, c&#x27;est souvent du contact, de la détente ou un peu de plaisir.&quot;,&quot;Aujourd&#x27;hui, ajoute un contact humain réel : message, appel, café avec quelqu&#x27;un.&quot;],[&quot;Stress, fatigue et nuit&quot;,&quot;La fatigue fragilise : tard le soir, seul, le téléphone à la main, c&#x27;est le moment le plus risqué. Une routine de soirée t&#x27;aide.&quot;,&quot;Fixe une heure de coucher. 30 minutes avant, téléphone hors de la chambre. Prévois une activité calme pour te détendre.&quot;],[&quot;Honte et culpabilité&quot;,&quot;La honte pousse souvent à recommencer : on se sent mal, on cherche du soulagement, on retombe. Se parler avec respect, comme à un ami, casse ce cycle.&quot;,&quot;Écris à toi-même ce que tu dirais à un ami dans la même situation. Relis-le à voix haute.&quot;],[&quot;Bilan de la semaine 2&quot;,&quot;Tu as appris à voir l&#x27;envie venir et à la laisser passer. Chaque envie surmontée construit la nouvelle habitude.&quot;,&quot;Regarde ton compteur d&#x27;envies surmontées. Note le moment le plus dur de la semaine et ce qui t&#x27;a aidé.&quot;],[&quot;Remplacer, pas seulement enlever&quot;,&quot;Si tu enlèves une habitude sans rien mettre à la place, le vide la rappelle. Cherche des activités qui te détendent ou te font du bien autrement.&quot;,&quot;Liste 5 activités de 10 à 20 minutes qui te détendent (douche, musique, lecture, sport, cuisine). Garde la liste accessible.&quot;],[&quot;Bouger&quot;,&quot;Le mouvement change l&#x27;humeur et dépense l&#x27;énergie. Pas besoin de sport intense : marcher compte.&quot;,&quot;Fais 20 minutes d&#x27;activité physique aujourd&#x27;hui, de préférence à l&#x27;heure où l&#x27;envie vient le plus.&quot;],[&quot;Soirées et week-ends&quot;,&quot;Les moments seul et sans programme sont les plus risqués. Un planning léger évite de glisser par défaut.&quot;,&quot;Planifie les 2 prochaines soirées seul : un horaire, une activité, un moment de coucher.&quot;],[&quot;En parler à quelqu&#x27;un&quot;,&quot;Garder ça pour soi entretient la honte. Parler à un ami de confiance, async function stripe(path: string, body?: URLSearchParams) {
  const r = await fetch(&#x27;https://api.stripe.com/v1/&#x27; + path, {
    method: body ? &#x27;POST&#x27; : &#x27;GET&#x27;, body,
    headers: { Authorization: &#x27;Bearer &#x27; + SK, &#x27;Content-Type&#x27;: &#x27;application/x-www-form-urlencoded&#x27; },
  });
  return r.json();
}

Deno.serve(async (req) =&gt; {
  if (req.method === &#x27;OPTIONS&#x27;) return new Response(&#x27;ok&#x27;, { headers: CORS });
  if (!SK) return json({ error: &#x27;paiement non configuré&#x27; }, 500);
  const body = await req.json().catch(() =&gt; ({}));
  const { action, id, cle, sid } = body;

  if (action === &#x27;prog_checkout&#x27;) {
    const prog = String(body.prog || &#x27;&#x27;), P = PROGS[prog];
    if (!P) return json({ error: &#x27;demande invalide&#x27; }, 400);
    const p = new URLSearchParams({
      mode: &#x27;payment&#x27;, locale: &#x27;fr&#x27;, allow_promotion_codes: &#x27;true&#x27;,
      &#x27;line_items[0][quantity]&#x27;: &#x27;1&#x27;,
      &#x27;line_items[0][price_data][currency]&#x27;: &#x27;eur&#x27;,
      &#x27;line_items[0][price_data][unit_amount]&#x27;: String(P.cents),
      &#x27;line_items[0][price_data][product_data][name]&#x27;: &#x27;Lookmiz · &#x27; + P.name,
      success_url: SITE + &#x27;app/?achat=1&amp;sid={CHECKOUT_SESSION_ID}&#x27;,
      cancel_url: SITE + (prog === &#x27;pack&#x27; ? &#x27;#tarifs&#x27; : &#x27;programmes/&#x27; + prog + &#x27;/#achat&#x27;),
      &#x27;metadata[prog]&#x27;: prog,
    });
    const s = await stripe(&#x27;checkout/sessions&#x27;, p);
    if (!s.url) return json({ error: s.error?.message || &#x27;Stripe a refusé&#x27; }, 502);
    return json({ url: s.url });
  }
  if (action === &#x27;prog_verify&#x27;) {
    if (!/^cs_[A-Za-z0-9_]+$/.test(String(sid || &#x27;&#x27;))) return json({ paid: false });
    const s = await stripe(&#x27;checkout/sessions/&#x27; + sid), prog = s.metadata?.prog;
    return json(okPaid(s) &amp;&amp; prog &amp;&amp; PROGS[prog] ? { paid: true, prog } : { paid: false });
  }
  if (action === &#x27;prog_day&#x27;) {
    const prog = String(body.prog || &#x27;&#x27;), list = Array.isArray(body.sids) ? body.sids.slice(0, 5) : [];
    if (!DAYS[prog]) return json({ error: &#x27;programme inconnu&#x27; }, 400);
    for (const one of list) {
      if (!/^cs_[A-Za-z0-9_]+$/.test(String(one))) continue;
      const s = await stripe(&#x27;checkout/sessions/&#x27; + one), pr = s.metadata?.prog;
      if (okPaid(s) &amp;&amp; (pr === prog || pr === &#x27;pack&#x27;)) return json({ days: DAYS[prog] });
    }
    return json({ error: &#x27;accès refusé&#x27; }, 403);
  }

  if (!/^[a-z0-9]{10,20}$/.test(id || &#x27;&#x27;)) return json({ error: &#x27;carte invalide&#x27; }, 400);
  const { data: carte } = await admin.from(&#x27;cartes&#x27;).select(&#x27;cle, data, paid&#x27;).eq(&#x27;id&#x27;, id).maybeSingle();
  if (!carte) return json({ error: &#x27;carte introuvable&#x27; }, 404);

  if (action === &#x27;checkout&#x27;) {
    if (carte.cle !== cle) return json({ error: &#x27;refusé&#x27; }, 403);
    if (carte.paid) return json({ paid: true });
    const dest = Array.isArray(carte.data?.f?.dest) ? carte.data.f.dest.length : 0;
    const extra = Math.max(0, dest - 1);            // 1,20 € la carte, puis 0,60 € par personne ajoutée
    const p = new URLSearchParams({
      mode: &#x27;payment&#x27;,
      &#x27;line_items[0][quantity]&#x27;: &#x27;1&#x27;,
      &#x27;line_items[0][price_data][currency]&#x27;: &#x27;eur&#x27;,
      &#x27;line_items[0][price_data][unit_amount]&#x27;: &#x27;120&#x27;,
      &#x27;line_items[0][price_data][product_data][name]&#x27;: &#x27;Carte Lookmiz animée&#x27;,
      success_url: SITE + &#x27;?paye=&#x27; + id + &#x27;&amp;sid={CHECKOUT_SESSION_ID}&#x27;,
      cancel_url: SITE + &#x27;#mes-cartes&#x27;,
      &#x27;metadata[carte]&#x27;: id,
    });
    if (extra) { p.set(&#x27;line_items[1][quantity]&#x27;, String(extra)); p.set(&#x27;line_items[1][price_data][currency]&#x27;, &#x27;eur&#x27;); p.set(&#x27;line_items[1][price_data][unit_amount]&#x27;, &#x27;60&#x27;); p.set(&#x27;line_items[1][price_data][product_data][name]&#x27;, &#x27;Personne supplémentaire&#x27;); }
    const s = await stripe(&#x27;checkout/sessions&#x27;, p);
    if (!s.url) return json({ error: s.error?.message || &#x27;Stripe a refusé&#x27; }, 502);
    return json({ url: s.url });
  }

  if (action === &#x27;verify&#x27;) {
    if (carte.paid) return json({ paid: true });
    if (!/^cs_[A-Za-z0-9_]+$/.test(sid || &#x27;&#x27;)) return json({ paid: false });
    const s = await stripe(&#x27;checkout/sessions/&#x27; + sid);
    const ok = s.payment_status === &#x27;paid&#x27; &amp;&amp; s.metadata?.carte === id;
    if (ok) await admin.from(&#x27;cartes&#x27;).update({ paid: true }).eq(&#x27;id&#x27;, id);
    return json({ paid: ok });
  }
  return json({ error: &#x27;demande invalide&#x27; }, 400);
});
