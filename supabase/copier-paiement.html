 seulement de 10 minutes.&quot;],[&quot;Je lutte de toutes mes forces&quot;,&quot;Lutter épuise. Observe l&#x27;envie comme une vague : elle monte, plafonne, redescend. Laisse-la passer sans la combattre.&quot;],[&quot;Je me distrais&quot;,&quot;Très bien : 10 minutes de distraction suffisent souvent. Prépare-en deux à l&#x27;avance, à portée de main.&quot;],[&quot;Je ne sais pas&quot;,&quot;Aujourd&#x27;hui, note l&#x27;heure et ce que tu ressens quand elle vient. Un schéma va apparaître.&quot;]]},[&quot;Une vague&quot;,&quot;Une envie monte, plafonne et retombe en quelques minutes, même si on ne fait rien.&quot;,&quot;Chronomètre ta prochaine envie.&quot;]],[&quot;Tenir 10 minutes&quot;,&quot;Quand une envie arrive, ne te dis pas « jamais », dis-toi « dans 10 minutes ». Souvent, elle est partie avant. Les premiers jours, on peut être irritable et dormir mal : c&#x27;est fréquent, et ça passe.&quot;,&quot;Utilise le bouton SOS à chaque envie aujourd&#x27;hui. Compte combien sont passées.&quot;,&quot;hold&quot;,{},{&quot;q&quot;:&quot;Peux-tu tenir 10 minutes avant de passer à l&#x27;acte ?&quot;,&quot;o&quot;:[[&quot;Oui, facilement&quot;,&quot;Alors fais-en une règle : la plupart des envies retombent avant 10 minutes.&quot;],[&quot;Oui, avec une distraction&quot;,&quot;Parfait. Prépare deux distractions : musique, verre d&#x27;eau, marche. Elles font la moitié du travail.&quot;],[&quot;Difficile&quot;,&quot;Commence par 2 minutes. Chaque envie traversée entraîne ton cerveau à tolérer l&#x27;inconfort.&quot;],[&quot;Impossible&quot;,&quot;Pas de souci : 1 minute compte déjà. Le bouton SOS te guide pendant 10 minutes, un souffle après l&#x27;autre.&quot;]]},[&quot;Les premiers jours&quot;,&quot;Irritabilité, nuits agitées, appétit en baisse : c&#x27;est fréquent la première semaine, puis ça s&#x27;atténue sur 2 à 4 semaines.&quot;,&quot;Prévois une soirée facile, sans pression.&quot;]],[&quot;Respirer pour retomber&quot;,&quot;Une respiration lente, avec un souffle plus long que l&#x27;inspiration, aide à calmer le système nerveux en quelques minutes. C&#x27;est un outil que tu emportes partout.&quot;,&quot;Fais 2 minutes de respiration (inspire 4 secondes, souffle 6), deux fois dans la journée, dont une au moment où tu consommais.&quot;,&quot;breathe&quot;,{},{&quot;q&quot;:&quot;Quand tu es tendu(e), ton souffle est plutôt…&quot;,&quot;o&quot;:[[&quot;Court et haut&quot;,&quot;Respirer haut met le corps en alerte. Allonge l&#x27;expiration : c&#x27;est le levier le plus rapide pour te calmer.&quot;],[&quot;Je le retiens parfois&quot;,&quot;Retenir son souffle augmente la tension. Souffle doucement par la bouche, comme dans une paille.&quot;],[&quot;Je n&#x27;y ai jamais fait attention&quot;,&quot;Pose une main sur le ventre : si elle ne bouge pas, ta respiration est haute. Essaie de la faire gonfler.&quot;],[&quot;Plutôt calme&quot;,&quot;Bien. Garde ce réflexe pour les moments d&#x27;envie, c&#x27;est là qu&#x27;il compte le plus.&quot;]]},[&quot;Le nerf vague&quot;,&quot;Respirer lentement stimule le nerf vague, qui ralentit le cœur et apaise.&quot;,&quot;Deux minutes de respiration, deux fois aujourd&#x27;hui.&quot;]],[&quot;Le rituel du soir&quot;,&quot;Souvent, ce n&#x27;est pas le produit qui manque, c&#x27;est le moment : la pause en rentrant, le geste, le canapé. Tu peux garder le moment et changer le geste.&quot;,&quot;Choisis un nouveau rituel pour ce soir : douche chaude, tisane, série, cuisine, musique. Prépare ce qu&#x27;il te faut avant de rentrer.&quot;,&quot;slot&quot;,{},{&quot;q&quot;:&quot;Pour t&#x27;occuper 10 minutes, tu préfères…&quot;,&quot;o&quot;:[[&quot;Bouger&quot;,&quot;Le mouvement réduit les envies et améliore l&#x27;humeur en quelques minutes.&quot;],[&quot;Parler à quelqu&#x27;un&quot;,&quot;Une voix humaine apaise plus vite qu&#x27;un écran ou un produit.&quot;],[&quot;Faire quelque chose de mes mains&quot;,&quot;Cuisine, dessin, rangement : occuper les mains occupe aussi l&#x27;attention, l&#x27;envie perd de la place.&quot;],[&quot;Rien ne me tente&quot;,&quot;Normal au début : l&#x27;envie rend tout fade. Essaie quand même 3 minutes, l&#x27;envie baisse avant que l&#x27;activité ne devienne agréable.&quot;]]},[&quot;Le sommeil paradoxal revient&quot;,&quot;Le cannabis réduit le sommeil paradoxal. À l&#x27;arrêt, les rêves reviennent souvent plus intenses : c&#x27;est un signe de rééquilibrage.&quot;,&quot;Note un rêve au réveil, sans t&#x27;inquiéter.&quot;]],[&quot;Stress et anxiété&quot;,&quot;On consomme davantage quand on est stressé ou anxieux : le corps cherche une pause. Si tu t&#x27;accordes de vraies pauses à ces moments, le produit devient moins nécessaire.&quot;,&quot;Prévois 3 pauses de 5 minutes aujourd&#x27;hui : étirements, fenêtre ouverte, verre d&#x27;eau, marche. Note comment tu te sens après.&quot;,null,{},{&quot;q&quot;:&quot;Quand tu es stressé(e), ton corps réagit surtout par…&quot;,&quot;o&quot;:[[&quot;De la tension (épaules, mâchoire)&quot;,&quot;Relâche : épaules vers le bas, mâchoire détendue, trois souffles lents.&quot;],[&quot;De la fatigue&quot;,&quot;La fatigue baisse le frein de la volonté. Une sieste de 15 à 20 minutes aide, sinon couche-toi plus tôt ce soir.&quot;],[&quot;De l&#x27;agitation&quot;,&quot;Marche rapide 5 minutes : elle dépense l&#x27;adrénaline en trop.&quot;],[&quot;Je ne sais pas&quot;,&quot;Scanne : tête, épaules, ventre, jambes. Où ça serre ? C&#x27;est là qu&#x27;il faut respirer.&quot;]]},[&quot;Le stress et le corps&quot;,&quot;Le stress élève le cortisol et pousse vers un soulagement rapide. Marcher 10 minutes le fait redescendre.&quot;,&quot;Marche 10 minutes en rentrant.&quot;]],[&quot;Idées reçues sur le cannabis&quot;,&quot;« Ça aide à dormir », « c&#x27;est naturel », « je gère ». Certaines idées reçues retiennent au même endroit. Les regarder d&#x27;un œil honnête enlève du pouvoir à la routine.&quot;,&quot;Écris l&#x27;idée reçue qui te parle le plus et ce que tu en penses maintenant.&quot;,&quot;myths&quot;,{},{&quot;q&quot;:&quot;Quelle idée te retient le plus ?&quot;,&quot;o&quot;:[[&quot;J&#x27;en ai besoin pour me détendre ou dormir&quot;,&quot;Ça détend sur l&#x27;instant mais entretient le manque ensuite. À terme, la détente et le sommeil naturels reviennent.&quot;],[&quot;Je gère, ce n&#x27;est pas un problème&quot;,&quot;Si tu es ici, c&#x27;est que tu veux plus de contrôle. Fais confiance à ça.&quot;],[&quot;Tout le monde le fait&quot;,&quot;Beaucoup le font, et beaucoup changent aussi. Tu n&#x27;es pas seul(e) dans les deux cas.&quot;],[&quot;Juste une fois ne compte pas&quot;,&quot;Chaque fois renforce le circuit de l&#x27;habitude. L&#x27;exception est souvent la porte d&#x27;entrée.&quot;]]},[&quot;La mémoire revient&quot;,&quot;Après quelques semaines, beaucoup de personnes retrouvent une meilleure mémoire de travail et plus de concentration.&quot;,&quot;Note un détail dont tu te souviens mieux.&quot;]],[&quot;Bilan de la semaine 2&quot;,&quot;Tu as appris à voir l&#x27;envie venir, à l&#x27;attendre et à changer le rituel. Chaque jour compte, même imparfait.&quot;,&quot;Regarde ton compteur de jours sans et d&#x27;envies surmontées. Note le moment le plus dur et ce qui t&#x27;a aidé.&quot;,null,{},{&quot;q&quot;:&quot;Ce qui t&#x27;a le plus aidé(e) cette semaine ?&quot;,&quot;o&quot;:[[&quot;Attendre 10 minutes&quot;,&quot;Garde-le : c&#x27;est ton outil principal. Il marche d&#x27;autant mieux qu&#x27;il est automatique.&quot;],[&quot;Respirer&quot;,&quot;La respiration est toujours avec toi. Utilise-la avant que l&#x27;envie ne soit à son maximum.&quot;],[&quot;Éloigner ce qui donne accès&quot;,&quot;Bien joué : réduire l&#x27;accès est l&#x27;une des méthodes les plus solides.&quot;],[&quot;Rien de précis&quot;,&quot;Pas grave. Regarde le bilan : tu as peut-être tenu plus que tu ne le penses.&quot;]]},[&quot;L&#x27;anxiété peut baisser&quot;,&quot;Une consommation régulière peut entretenir l&#x27;anxiété ; chez beaucoup, elle diminue après quelques semaines sans.&quot;,&quot;Note ton niveau d&#x27;anxiété de 1 à 10.&quot;]],[&quot;Remplacer, pas seulement enlever&quot;,&quot;Quand on enlève une habitude sans rien mettre à la place, le vide la rappelle. Construis ta boîte à outils : des actions simples que tu peux faire à la place.&quot;,&quot;Choisis 3 activités de remplacement et garde-les dans une note. Fais-en une aujourd&#x27;hui, même 10 minutes.&quot;,null,{},{&quot;q&quot;:&quot;Quel remplaçant te semble le plus réaliste ?&quot;,&quot;o&quot;:[[&quot;Un geste (eau, étirements)&quot;,&quot;Les petits gestes sont faciles à répéter. Garde-les à portée de main.&quot;],[&quot;Une activité courte (marche, jeu)&quot;,&quot;Dix minutes suffisent souvent. Choisis-en une que tu peux faire n&#x27;importe où.&quot;],[&quot;Une personne (appel, message)&quot;,&quot;Un lien humain est l&#x27;un des meilleurs remplaçants. Mets 2 prénoms dans tes favoris.&quot;],[&quot;Je n&#x27;en ai pas encore&quot;,&quot;Essaie les trois cette semaine. Tu verras vite lequel marche pour toi.&quot;]]},[&quot;Un rituel sans produit&quot;,&quot;Tisane chaude, douche, lumière tamisée : ces gestes déclenchent la détente physiologique, sans produit.&quot;,&quot;Prépare ta tisane avant de rentrer.&quot;]],[&quot;Bouger&quot;,&quot;Le mouvement change l&#x27;humeur, aide au sommeil et occupe les moments à risque. Pas besoin de sport intense : marcher compte.&quot;,&quot;Fais 20 minutes d&#x27;activité physique aujourd&#x27;hui, de préférence à l&#x27;heure où tu consommais.&quot;,&quot;move&quot;,{},{&quot;q&quot;:&quot;Ton niveau de mouvement dans une journée ?&quot;,&quot;o&quot;:[[&quot;Presque aucun&quot;,&quot;Commence par 5 minutes de marche : c&#x27;est déjà un effet mesurable sur l&#x27;humeur.&quot;],[&quot;Un peu&quot;,&quot;Ajoute 10 minutes à l&#x27;heure où l&#x27;envie est la plus forte.&quot;],[&quot;Régulier&quot;,&quot;Excellent. Place-le aux heures à risque : c&#x27;est là qu&#x27;il protège le plus.&quot;],[&quot;Beaucoup&quot;,&quot;Parfait. N&#x27;oublie pas le repos : il fait partie de la récupération.&quot;]]},[&quot;Le sport aide le sommeil&quot;,&quot;L&#x27;exercice régulier améliore la profondeur du sommeil, à condition de ne pas s&#x27;y mettre juste avant de dormir.&quot;,&quot;20 minutes de marche rapide, en fin d&#x27;après-midi.&quot;]],[&quot;Soirées et week-ends&quot;,&quot;Les soirées entre amis et les week-ends sont des moments à risque. Un plan évite de se retrouver coincé.&quot;,&quot;Regarde les 2 prochains événements. Décide à l&#x27;avance ce que tu feras, avec qui, et ce que tu diras si on te propose.&quot;,null,{},{&quot;q&quot;:&quot;Le plus dur dans tes week-ends, c&#x27;est…&quot;,&quot;o&quot;:[[&quot;Le temps libre&quot;,&quot;Prévois deux activités par jour : le vide appelle l&#x27;habitude.&quot;],[&quot;Les amis&quot;,&quot;Propose un lieu ou une activité sans l&#x27;habitude, ou dis-le d&#x27;avance. Les vrais amis comprennent.&quot;],[&quot;Le soir tard&quot;,&quot;Fixe une heure limite de coucher : la fatigue baisse les défenses.&quot;],[&quot;Rien de particulier&quot;,&quot;Prévois quand même un plan B, au cas où.&quot;]]},[&quot;Seul(e) et fatigué(e)&quot;,&quot;Fatigue, solitude et soirée libre : la combinaison la plus à risque. Il suffit d&#x27;en retirer un pour baisser le risque.&quot;,&quot;Prévois un appel ou une sortie ce soir.&quot;]],[&quot;En parler à quelqu&#x27;un&quot;,&quot;Garder ça pour soi entretient la honte. Parler à un proche de confiance, ou à Drogues info service (0 800 23 13 13, gratuit et anonyme), allège.&quot;,&quot;Choisis une personne de confiance et dis-lui que tu veux réduire ou arrêter. Dis-lui ce dont tu as besoin.&quot;,null,{},{&quot;q&quot;:&quot;À qui pourrais-tu en parler ?&quot;,&quot;o&quot;:[[&quot;Un(e) ami(e)&quot;,&quot;Un ami de confiance suffit. Dis simplement : « j&#x27;essaie de changer, peux-tu me demander demain comment ça va ? »&quot;],[&quot;Un proche de la famille&quot;,&quot;Choisis la personne la plus calme et la moins critique. Un message écrit peut être plus facile.&quot;],[&quot;Un professionnel ou une ligne d&#x27;aide&quot;,&quot;Excellente idée : Drogues info service (0 800 23 13 13) est là pour ça, gratuitement et sans jugement.&quot;],[&quot;Personne pour l&#x27;instant&quot;,&quot;C&#x27;est possible, et ce n&#x27;est pas grave. Une ligne d&#x27;aide (Drogues info service (0 800 23 13 13)) peut être ton premier interlocuteur.&quot;]]},[&quot;Le soutien aide&quot;,&quot;Parler à quelqu&#x27;un qui comprend réduit la honte et le stress, deux moteurs de l&#x27;envie.&quot;,&quot;Parle à une personne de confiance.&quot;]],[&quot;Les pensées-pièges&quot;,&quot;« Juste pour dormir », « c&#x27;est naturel », « demain j&#x27;arrête ». Ces phrases sont normales. Les repérer leur enlève du pouvoir.&quot;,&quot;Écris 3 phrases que tu te dis avant de consommer. À côté de chacune, une réponse honnête et courte.&quot;,&quot;pieges&quot;,{},{&quot;q&quot;:&quot;Quelle pensée te fait le plus craquer ?&quot;,&quot;o&quot;:[[&quot;« Juste une fois »&quot;,&quot;C&#x27;est le piège le plus courant. Réponse : « si c&#x27;est juste une fois, je peux attendre demain ».&quot;],[&quot;« Je l&#x27;ai bien mérité »&quot;,&quot;Oui, et tu peux te récompenser autrement : repas, film, sortie. Sans la facture.&quot;],[&quot;« Je m&#x27;y mets demain »&quot;,&quot;Demain sera pareil. Réponse : « je commence par les 10 prochaines minutes ».&quot;],[&quot;« J&#x27;ai déjà craqué, tant pis »&quot;,&quot;Un faux pas n&#x27;efface pas les jours passés. Reprends dès la prochaine heure.&quot;]]},[&quot;Le cerveau négocie&quot;,&quot;Pour obtenir un soulagement rapide, le cerveau fabrique des excuses (« juste pour dormir »). Les repérer leur enlève du pouvoir.&quot;,&quot;Note ta pensée-piège préférée.&quot;]],[&quot;Te récompenser autrement&quot;,&quot;Ton cerveau aime les petites récompenses. Tu peux en garder sans consommer : un bon repas, un loisir, une sortie avec l&#x27;argent économisé.&quot;,&quot;Choisis une récompense pour chaque semaine tenue. Calcule ce que ça coûte et compare avec ce que tu aurais dépensé.&quot;,null,{},{&quot;q&quot;:&quot;Quelle récompense te ferait vraiment plaisir ?&quot;,&quot;o&quot;:[[&quot;Un bon repas&quot;,&quot;Parfait : choisis le jour et le lieu à l&#x27;avance, une récompense prévue motive mieux qu&#x27;une récompense improvisée.&quot;],[&quot;Une sortie&quot;,&quot;Planifie-la dans ton agenda dès aujourd&#x27;hui : l&#x27;avoir devant soi aide à tenir.&quot;],[&quot;Un achat&quot;,&quot;Mets de côté la somme économisée dans une enveloppe : la voir grossir motive.&quot;],[&quot;Du repos&quot;,&quot;Le repos est une vraie récompense. Offre-toi une soirée sans obligation.&quot;]]},[&quot;La récompense prévue&quot;,&quot;Une récompense choisie à l&#x27;avance renforce un nouveau comportement mieux qu&#x27;une récompense improvisée.&quot;,&quot;Choisis ta récompense de la semaine.&quot;]],[&quot;Bilan de la semaine 3&quot;,&quot;Trois semaines de pratique. Regarde ce qui a changé : sommeil, énergie, humeur, argent, motivation.&quot;,&quot;Écris 3 changements que tu constates, même petits.&quot;,null,{},{&quot;q&quot;:&quot;Ce qui a changé depuis le début ?&quot;,&quot;o&quot;:[[&quot;Mon sommeil&quot;,&quot;Un meilleur sommeil réduit l&#x27;impulsivité : c&#x27;est un cercle vertueux qui s&#x27;installe.&quot;],[&quot;Mon humeur&quot;,&quot;Chaque jour, le cerveau se rééquilibre un peu. L&#x27;humeur suit souvent avec un décalage.&quot;],[&quot;Mon argent&quot;,&quot;Note la somme : c&#x27;est un des gains les plus concrets.&quot;],[&quot;Pas encore grand-chose&quot;,&quot;Normal : les changements sont souvent lents au début. Continue, ils arrivent avec la régularité.&quot;]]},[&quot;La motivation revient&quot;,&quot;Avec le temps, le système de récompense se rééquilibre et la motivation revient, souvent avec un décalage.&quot;,&quot;Fais une petite tâche que tu repoussais.&quot;]],[&quot;Un dérapage n&#x27;est pas une rechute&quot;,&quot;Si tu consommes, ce n&#x27;est pas la fin. C&#x27;est une information : qu&#x27;est-ce qui l&#x27;a déclenché ? Reprends le fil dès que possible, sans te punir.&quot;,&quot;Écris ce que tu feras après un dérapage : t&#x27;arrêter là, noter le déclencheur, le dire à quelqu&#x27;un.&quot;,&quot;scenario&quot;,{},{&quot;q&quot;:&quot;Si tu craques ce soir, tu te diras…&quot;,&quot;o&quot;:[[&quot;« Je suis nul(le) »&quot;,&quot;La honte nourrit le cycle. Parle-toi comme à un ami : « ça arrive, je reprends ».&quot;],[&quot;« C&#x27;est une information »&quot;,&quot;Exactement. Note ce qui l&#x27;a déclenché et ajuste ton plan.&quot;],[&quot;« Autant tout lâcher »&quot;,&quot;C&#x27;est l&#x27;effet « tant pis », le vrai piège. Reprends au prochain repas, pas à la prochaine semaine.&quot;],[&quot;« Je préviens quelqu&#x27;un »&quot;,&quot;Excellent réflexe : ça casse l&#x27;isolement et la honte.&quot;]]},[&quot;Un faux pas, pas une chute&quot;,&quot;Un dérapage ne défait pas les circuits déjà en place. Ce qui compte, c&#x27;est de reprendre vite.&quot;,&quot;Écris ta phrase de reprise.&quot;]],[&quot;Ton plan en cas de rechute&quot;,&quot;Prévoir le plan B enlève la peur. Qu&#x27;est-ce qui m&#x27;a fait craquer ? Qu&#x27;est-ce que je change ? Qui je préviens ?&quot;,&quot;Rédige un plan en 3 points : ce que je fais dans l&#x27;heure, ce que j&#x27;analyse, ce que j&#x27;ajuste. Note le 0 800 23 13 13.&quot;,&quot;relapse&quot;,{},{&quot;q&quot;:&quot;En cas de rechute, ce qui t&#x27;aiderait le plus ?&quot;,&quot;o&quot;:[[&quot;Un message tout prêt&quot;,&quot;Écris-le maintenant, il sera là quand tu en auras besoin. Tu n&#x27;auras plus qu&#x27;à l&#x27;envoyer.&quot;],[&quot;Quelqu&#x27;un à appeler&quot;,&quot;Choisis la personne et enregistre son numéro en favori.&quot;],[&quot;Une règle simple&quot;,&quot;Par exemple : « je m&#x27;arrête là, je bois de l&#x27;eau, je reprends demain ».&quot;],[&quot;Je préfère ne pas y penser&quot;,&quot;C&#x27;est compréhensible, mais prévoir réduit la peur. Ça prend 2 minutes et tu seras plus serein(e).&quot;]]},[&quot;Anticiper apaise&quot;,&quot;Prévoir ce qu&#x27;on fera en cas de craquage réduit la panique et l&#x27;effet « tant pis ».&quot;,&quot;Relis ton plan B ce soir.&quot;]],[&quot;Ce que ton corps récupère&quot;,&quot;Au fil des semaines, beaucoup de personnes retrouvent des nuits plus profondes, de l&#x27;énergie, de la concentration et de la motivation. Chaque personne a son rythme.&quot;,&quot;Note 3 changements que tu constates depuis le début, même petits.&quot;,&quot;timeline&quot;,{},{&quot;q&quot;:&quot;Dans 6 mois, tu aimerais être quelqu&#x27;un qui…&quot;,&quot;o&quot;:[[&quot;Dort bien&quot;,&quot;Un objectif concret : les nuits s&#x27;améliorent souvent dès les premières semaines.&quot;],[&quot;Tient ses engagements&quot;,&quot;Chaque petit engagement tenu renforce la confiance en toi.&quot;],[&quot;A de l&#x27;énergie&quot;,&quot;L&#x27;énergie revient avec le sommeil, le mouvement et moins d&#x27;à-coups.&quot;],[&quot;Se sent libre&quot;,&quot;La liberté, c&#x27;est choisir. Chaque envie traversée est un choix de plus.&quot;]]},[&quot;Le corps récupère&quot;,&quot;Les bronches, souvent irritées par la fumée, s&#x27;améliorent en quelques semaines : moins de toux et plus de souffle.&quot;,&quot;Respire profondément 3 fois et note ton souffle.&quot;]],[&quot;Les moments à risque à venir&quot;,&quot;Vacances, concerts, soirées, périodes de stress : certains moments vont remettre l&#x27;envie en jeu. Les prévoir, c&#x27;est déjà y être préparé.&quot;,&quot;Liste les 3 prochains moments à risque et ce que tu feras à chaque fois.&quot;,null,{},{&quot;q&quot;:&quot;Ton prochain moment à risque, c&#x27;est…&quot;,&quot;o&quot;:[[&quot;Un week-end&quot;,&quot;Prévois deux activités par jour et une heure de coucher.&quot;],[&quot;Une fête ou un événement&quot;,&quot;Décide à l&#x27;avance ce que tu fais et à quelle heure tu pars.&quot;],[&quot;Une période de stress&quot;,&quot;Planifie des pauses et du mouvement. Le stress est un déclencheur majeur.&quot;],[&quot;Je ne sais pas&quot;,&quot;Regarde ton agenda des 2 semaines à venir : tu en verras un ou deux.&quot;]]},[&quot;Le contexte déclenche&quot;,&quot;Concerts, soirées, périodes de stress : certains moments ravivent l&#x27;envie. Les repérer permet de s&#x27;y préparer.&quot;,&quot;Note les 3 prochains moments à risque.&quot;]],[&quot;Mieux dormir&quot;,&quot;Le sommeil est souvent perturbé les premières semaines, puis s&#x27;améliore. Une routine du soir régulière aide beaucoup.&quot;,&quot;Fixe une heure de coucher. Téléphone hors du lit. Prévois une activité calme avant de dormir.&quot;,&quot;evening&quot;,{},{&quot;q&quot;:&quot;Tes nuits en ce moment ?&quot;,&quot;o&quot;:[[&quot;Courtes&quot;,&quot;Une nuit courte renforce l&#x27;envie et réduit le contrôle. Couche-toi 30 minutes plus tôt ce soir.&quot;],[&quot;Agitées&quot;,&quot;Écrans coupés 30 minutes avant, chambre fraîche (18-19 °C) et dîner léger aident.&quot;],[&quot;Correctes&quot;,&quot;Bien. Garde un horaire régulier : c&#x27;est ça qui consolide.&quot;],[&quot;Très bonnes&quot;,&quot;Parfait. Protège-les : c&#x27;est un de tes meilleurs alliés.&quot;]]},[&quot;Mieux dormir&quot;,&quot;Chambre fraîche, écrans coupés, horaires réguliers : c&#x27;est le trio qui consolide les nuits.&quot;,&quot;Chambre à 18-19 °C ce soir.&quot;]],[&quot;L&#x27;argent économisé&quot;,&quot;Cet argent est ton vrai gain. Le chiffrer le rend concret et motive.&quot;,&quot;Reprends ton chiffre du jour 2. Écris ce que tu veux faire avec cet argent.&quot;,null,{},{&quot;q&quot;:&quot;Le temps ou l&#x27;argent récupéré, tu en feras…&quot;,&quot;o&quot;:[[&quot;Du repos&quot;,&quot;Le repos compte aussi. Planifie-le au lieu de le subir.&quot;],[&quot;Un projet&quot;,&quot;Choisis un petit projet de 30 minutes par jour : c&#x27;est ce qui remplit le vide.&quot;],[&quot;Du temps avec r toi dans 3 mois, le plus important à te rappeler ?&quot;,&quot;o&quot;:[[&quot;Ce que j&#x27;ai tenu&quot;,&quot;Écris-le : les chiffres sont des preuves quand le doute revient.&quot;],[&quot;Pourquoi j&#x27;ai commencé&quot;,&quot;Relis ton pourquoi du premier jour. Il est dans ton espace.&quot;],[&quot;Que ça passe&quot;,&quot;Oui : une envie passe toujours. C&#x27;est ta meilleure information.&quot;],[&quot;Que je mérite d&#x27;aller bien&quot;,&quot;C&#x27;est vrai. Écris-le comme si tu parlais à un ami.&quot;]]},[&quot;Écrire aide&quot;,&quot;Écrire ce qu&#x27;on ressent aide à réguler les émotions, c&#x27;est ce qu&#x27;on appelle l&#x27;écriture expressive.&quot;,&quot;Écris 5 minutes, sans te relire.&quot;]],[&quot;Et maintenant ?&quot;,&quot;30 jours, c&#x27;est un début, pas une fin. Garde les règles qui ont marché, et refais le point une fois par mois.&quot;,&quot;Choisis les 3 règles à garder. Plante un rappel mensuel dans ton agenda.&quot;,&quot;final&quot;,{},{&quot;q&quot;:&quot;Pour la suite, tu comptes…&quot;,&quot;o&quot;:[[&quot;Continuer chaque jour&quot;,&quot;Excellent. La régularité fait plus que l&#x27;intensité.&quot;],[&quot;Faire un point par semaine&quot;,&quot;Très bien : un point de 10 minutes le dimanche suffit.&quot;],[&quot;Appeler en cas de doute&quot;,&quot;Drogues info service (0 800 23 13 13) est là. Un coup de fil évite souvent une rechute.&quot;],[&quot;Je ne sais pas encore&quot;,&quot;Pas de pression. Garde juste la règle : au moindre doute, 10 minutes d&#x27;attente et un souffle lent.&quot;]]},[&quot;Garder le cap&quot;,&quot;Les rechutes sont fréquentes dans tout changement ; ce qui compte, c&#x27;est de reprendre vite, sans te punir.&quot;,&quot;Fixe un rappel mensuel pour faire le point.&quot;]]]},&quot;drogues-de-soiree&quot;:{&quot;kit&quot;:{&quot;raisons&quot;:[&quot;Ma santé&quot;,&quot;Mon argent&quot;,&quot;Mon sommeil&quot;,&quot;Mes relations&quot;,&quot;Mon humeur&quot;,&quot;Mon énergie&quot;,&quot;Mes projets&quot;,&quot;Ma confiance en moi&quot;,&quot;Ma liberté&quot;,&quot;Moins de descentes&quot;],&quot;pros&quot;:[&quot;L&#x27;énergie&quot;,&quot;La confiance en moi&quot;,&quot;Appartenir au groupe&quot;,&quot;Faire la fête plus longtemps&quot;,&quot;Oublier mes soucis&quot;,&quot;Me désinhiber&quot;],&quot;cons&quot;:[&quot;Je dépense beaucoup&quot;,&quot;La descente&quot;,&quot;Je dors mal&quot;,&quot;Mon humeur baisse après&quot;,&quot;Mon cœur s&#x27;emballe&quot;,&quot;Je m&#x27;éloigne de mes proches&quot;,&quot;Je perds le contrôle&quot;,&quot;J&#x27;ai peur de ce que je fais&quot;],&quot;calc&quot;:{&quot;q&quot;:&quot;Combien dépenses-tu par mois ?&quot;,&quot;unit&quot;:&quot;€ par mois&quot;,&quot;min&quot;:0,&quot;max&quot;:1000,&quot;step&quot;:10,&quot;def&quot;:150,&quot;mult&quot;:12,&quot;out&quot;:&quot;€ par an&quot;,&quot;div&quot;:0,&quot;divLabel&quot;:&quot;&quot;,&quot;eq&quot;:[500,&quot;week-ends en voyage&quot;],&quot;gain&quot;:&quot;économisés chaque année&quot;},&quot;env&quot;:[&quot;Supprimer les contacts et conversations&quot;,&quot;Prévoir mes soirées à l&#x27;avance&quot;,&quot;Réduire l&#x27;alcool, qui lève les barrières&quot;,&quot;Laisser l&#x27;argent liquide à la maison&quot;,&quot;Prévenir un ami de ma décision&quot;,&quot;Éviter les soirées à risque au début&quot;],&quot;triggers&quot;:[&quot;Les soirées en club&quot;,&quot;Certains amis&quot;,&quot;L&#x27;alcool&quot;,&quot;La fin de semaine&quot;,&quot;Le stress&quot;,&quot;L&#x27;ennui&quot;,&quot;Quand j&#x27;ai de l&#x27;argent sur moi&quot;,&quot;Les festivals&quot;,&quot;Après une dispute&quot;,&quot;Quand je me sens seul&quot;],&quot;actions&quot;:[&quot;Appeler un ami&quot;,&quot;Sortir marcher&quot;,&quot;Respirer lentement&quot;,&quot;Boire de l&#x27;eau&quot;,&quot;Faire du sport&quot;,&quot;Danser sans produit&quot;,&quot;Rentrer plus tôt&quot;,&quot;Écouter de la musique&quot;,&quot;Changer de pièce&quot;,&quot;Écrire ce que je ressens&quot;],&quot;distract& Le contrôle se perd souvent d&#x27;un coup. Mieux vaut ne pas tester.&quot;],[&quot;Je peux appeler Drogues info service.&quot;,false,&quot;Oui : 0 800 23 13 13, gratuit et anonyme.&quot;],[&quot;J&#x27;ai besoin de ça pour être drôle.&quot;,true,&quot;Ta personnalité est toujours là. La confiance revient avec le temps.&quot;],[&quot;Un dérapage n&#x27;est pas un échec.&quot;,false,&quot;Exact. Reprends le fil sans te punir.&quot;],[&quot;C&#x27;est le seul moyen de décompresser.&quot;,true,&quot;Le sport, la musique, le sommeil et les amis marchent aussi.&quot;]],&quot;scenarios&quot;:[{&quot;q&quot;:&quot;Vendredi soir, en club. Un ami te propose de partager quelque chose.&quot;,&quot;c&quot;:[[&quot;Je dis « non merci, j&#x27;arrête » et je prends de l&#x27;eau&quot;,2,&quot;Simple et sans justification. Tu protèges ta décision.&quot;],[&quot;J&#x27;accepte juste pour cette fois&quot;,0,&quot;« Juste cette fois » est le piège classique.&quot;],[&quot;Je pars aux toilettes et je réfléchis&quot;,1,&quot;Pause utile, mais prépare ta réponse à l&#x27;avance.&quot;]]},{&quot;q&quot;:&quot;Dimanche, descente : tu es fatigué, triste, et tu penses à reprendre pour te sentir mieux.&quot;,&quot;c&quot;:[[&quot;Je dors, je mange et j&#x27;appelle un ami&quot;,2,&quot;Tu laisses la descente passer et tu t&#x27;appuies sur quelqu&#x27;un.&quot;],[&quot;Je reprends un peu pour remonter&quot;,0,&quot;Ça repousse la descente et relance le cycle.&quot;],[&quot;Je me dis que je suis nul&quot;,1,&quot;Ce jugement fatigue. Parle-toi comme à un ami.&quot;]]},{&quot;q&quot;:&quot;Tu as craqué ce week-end. Tu te sens mal.&quot;,&quot;c&quot;:[[&quot;Je me dis que c&#x27;est foutu&quot;,0,&quot;Un dérapage n&#x27;est pas une rechute. Ne te punis pas.&quot;],[&quot;Je note ce qui m&#x27;a déclenché et je reprends dès aujourd&#x27;hui&quot;,2,&quot;C&#x27;est exactement ça. Et si malaise, appelle le 15.&quot;],[&quot;Je ne dis rien à personne&quot;,1,&quot;Parler à quelqu&#x27;un de confiance aide énormément.&quot;]]}],&quot;relapse&quot;:{&quot;heure&quot;:[&quot;Je ne reste pas seul et je bois de l&#x27;eau&quot;,&quot;En cas de malaise, j&#x27;appelle le 15 ou le 112&quot;,&quot;Je note ce qui s&#x27;est passé&quot;],&quot;ajuster&quot;:[&quot;Je réduis l&#x27;alcool en soirée&quot;,&quot;Je change de lieux ou d&#x27;amis&quot;,&quot;Je consulte une CJC ou mon médecin&quot;],&quot;prevenir&quot;:[&quot;Un ami proche&quot;,&quot;Mon frère ou ma sœur&quot;,&quot;Mon conjoint ou ma conjointe&quot;,&quot;Un professionnel&quot;,&quot;Personne, je gère seul&quot;]},&quot;events&quot;:[&quot;Soirée en club&quot;,&quot;Festival&quot;,&quot;Anniversaire&quot;,&quot;Nouvel an&quot;,&quot;Dimanche de descente&quot;,&quot;Période de stress&quot;],&quot;messages&quot;:[&quot;J&#x27;arrête les produits en soirée. Peux-tu me garder à l&#x27;œil ce week-end ?&quot;,&quot;Je sors ce soir sans rien prendre. Peux-tu me soutenir ?&quot;],&quot;rules&quot;:[&quot;Garder mes barrières en place&quot;,&quot;Utiliser le bouton SOS à chaque envie&quot;,&quot;Prévoir mes moments à risque&quot;,&quot;Parler à quelqu&#x27;un quand c&#x27;est dur&quot;,&quot;Bouger régulièrement&quot;,&quot;Bien dormir&quot;,&quot;Me récompenser autrement&quot;,&quot;Faire un point chaque mois&quot;,&quot;Ne jamais consommer seul&quot;,&quot;Partir à l&#x27;heure prévue&quot;],&quot;identite&quot;:[&quot;qui décide de son temps&quot;,&quot;qui tient ses engagements&quot;,&quot;qui prend soin de lui&quot;,&quot;qui sait demander de l&#x27;aide&quot;,&quot;qui ose dire non&quot;,&quot;qui se réveille avec de l&#x27;énergie&quot;,&quot;qui choisit ses soirées&quot;,&quot;qui protège son argent&quot;,&quot;qui est présent avec ses proches&quot;,&quot;qui avance sur ses projets&quot;,&quot;qui se respecte&quot;,&quot;qui ne se juge plus durement&quot;],&quot;rewards&quot;:[&quot;Un bon repas au restaurant&quot;,&quot;Une sortie au cinéma&quot;,&quot;Un week-end dans la nature&quot;,&quot;Un vêtement qui me plaît&quot;,&quot;Un moment avec un ami&quot;,&quot;Une journée sans rien faire&quot;,&quot;Un livre ou un jeu&quot;,&quot;Un hammam ou un massage&quot;,&quot;Un petit voyage&quot;,&quot;Un cadeau pour quelqu&#x27;un&quot;],&quot;evening&quot;:[&quot;Fixer l&#x27;heure du coucher&quot;,&quot;Téléphone hors du lit&quot;,&quot;Écrans éteints 30 minutes avant&quot;,&quot;Douche ou tisane&quot;,&quot;Préparer la journée de demain&quot;,&quot;Respirer 2 minutes&quot;],&quot;people&quot;:[&quot;Un ami proche&quot;,&quot;Mon frère ou ma sœur&quot;,&quot;Mon conjoint ou ma conjointe&quot;,&quot;Un parent&quot;,&quot;Un collègue de confiance&quot;,&quot;Mon médecin&quot;],&quot;pause&quot;:[&quot;Lève-toi et étire-toi&quot;,&quot;Bois un verre d&#x27;eau, lentement&quot;,&quot;Regarde loin, par la fenêtre&quot;,&quot;Respire lentement 5 fois&quot;,&quot;Note ce que tu ressens, en une phrase&quot;]},&quot;days&quot;:[[&quot;Ton pourquoi&quot;,&quot;Avant de changer quoi que ce soit, il faut savoir pour quoi tu le fais : ta santé, ton argent, ton sommeil, tes relations, ta liberté. Ce pourquoi sera ta réserve les jours difficiles : il doit venir de toi.&quot;,&quot;Écris 3 raisons personnelles de réduire ou d&#x27;arrêter. Garde-les en note sur ton écran de verrouillage.&quot;,&quot;choose&quot;,{},{&quot;q&quot;:&quot;Qu&#x27;est-ce qui te pousse à changer aujourd&#x27;hui ?&quot;,&quot;o&quot;:[[&quot;Ma santé&quot;,&quot;Excellent moteur. Le corps commence à récupérer très tôt : chaque jour compte déjà, même si tu ne le sens pas encore.&quot;],[&quot;Mon argent&quot;,&quot;Chiffrer l&#x27;argent regagné est l&#x27;un des meilleurs rappels les jours difficiles. On le fera dans quelques jours.&quot;],[&quot;Mes proches&quot;,&quot;Faire ça pour les autres aide, mais garde aussi une raison rien que pour toi : c&#x27;est elle qui tient quand personne ne regarde.&quot;],[&quot;Je me sens dépassé(e)&quot;,&quot;C&#x27;est une raison valable. Tu n&#x27;as pas à tout régler aujourd&#x27;hui : un seul petit pas suffit pour commencer.&quot;]]},[&quot;Dopamine et sérotonine&quot;,&quot;Les stimulants de soirée provoquent une forte libération de dopamine et de sérotonine. Les réserves se vident ensuite, d&#x27;où la baisse d&#x27;humeur du lendemain.&quot;,&quot;Note comment tu te sens le lendemain d&#x27;une soirée.&quot;]],[&quot;Ton usage réel&quot;,&quot;On sous-estime presque toujours ce qu&#x27;on consomme et ce que ça coûte, surtout sur plusieurs soirées. Regarder le chiffre sans te juger, c&#x27;est le vrai premier pas.&quot;,&quot;Fais le total de tes 3 derniers mois : combien de soirées, combien dépensé. Note le chiffre sans le commenter.&quot;,&quot;calc&quot;,{},{&quot;q&quot;:&quot;Ton estimation de ta semaine dernière, elle est…&quot;,&quot;o&quot;:[[&quot;Plutôt juste&quot;,&quot;C&#x27;est rare : la plupart des gens sous-estiment. Vérifie quand même avec les vrais chiffres ce soir.&quot;],[&quot;Sûrement en dessous de la réalité&quot;,&quot;C&#x27;est le cas de presque tout le monde : le cerveau oublie les automatismes. Mesurer sans te juger, c&#x27;est tout ce qu&#x27;on te demande.&quot;],[&quot;Je n&#x27;ose pas regarder&quot;,&quot;Normal : voir le chiffre pique un peu. C&#x27;est pourtant ce qui permet de reprendre la main. Regarde-le comme un simple relevé.&quot;],[&quot;Je n&#x27;en ai aucune idée&quot;,&quot;Alors note pendant 3 jours, une ligne à chaque fois. Les automatismes se voient dès qu&#x27;on les écrit.&quot;]]},[&quot;La descente&quot;,&quot;Fatigue, humeur basse, anxiété : la descente dure souvent un à trois jours. Elle vient de ce déséquilibre, pas d&#x27;un manque de caractère.&quot;,&quot;Prévois tes lendemains de soirée à l&#x27;avance.&quot;]],[&quot;Ce que ça t&#x27;apporte, ce que ça te coûte&quot;,&quot;Le produit te rend service : énergie, confiance, appartenance au groupe. Le reconnaître permet de trouver d&#x27;autres façons d&#x27;obtenir la même chose. Ça coûte aussi de la santé, du sommeil, de l&#x27;argent.&quot;,&quot;Fais deux colonnes sur papier : ce que ça t&#x27;apporte / ce que ça te coûte. Entoure ce que tu pourrais obtenir autrement.&quot;,null,{},{&quot;q&quot;:&quot;Qu&#x27;est-ce que ça t&#x27;apporte de consommer ?&quot;,&quot;o&quot;:[[&quot;Me détendre&quot;,&quot;La détente est réelle mais courte : elle soulage surtout le manque que l&#x27;habitude crée. Respiration lente, marche ou douche chaude donnent un calme plus durable.&quot;],[&quot;Ne plus penser à rien&quot;,&quot;C&#x27;est un vrai besoin : ton cerveau veut une pause. Une vraie pause (marche, étirements) repose mieux et ne laisse pas de culpabilité.&quot;],[&quot;Me sentir moins seul(e)&quot;,&quot;Besoin légitime. Un message ou un appel, même court, y répond mieux et plus longtemps.&quot;],[&quot;Du plaisir, tout simplement&quot;,&quot;Le plaisir compte. L&#x27;idée n&#x27;est pas de t&#x27;en priver mais de le retrouver ailleurs : dans quelques jours tu choisiras tes remplaçants.&quot;]]},[&quot;L&#x27;énergie empruntée&quot;,&quot;L&#x27;énergie d&#x27;un produit est empruntée à ton corps, à rembourser avec des intérêts : fatigue, sommeil, humeur.&quot;,&quot;Note ce que la soirée t&#x27;a coûté en énergie.&quot;]],[&quot;Tes déclencheurs&quot;,&quot;Certains lieux, certains amis, l&#x27;alcool, le vendredi soir, la fatigue : ce sont des déclencheurs. Quand tu les repères, tu les vois venir.&quot;,&quot;Pense à tes 3 dernières soirées. À chaque fois, note ce qui t&#x27;a donné envie et à quel moment.&quot;,&quot;heat&quot;,{},{&quot;q&quot;:&quot;Quand l&#x27;envie est-elle la plus forte ?&quot;,&quot;o&quot;:[[&quot;Le soir, seul(e)&quot;,&quot;Fatigue et solitude : le soir, le cerveau freine moins bien. Prévois quelque chose de précis pour ces heures-là.&quot;],[&quot;Quand je m&#x27;ennuie&quot;,&quot;L&#x27;ennui est un déclencheur très fréquent. Il retombe en quelques minutes si on ne le fuit pas : prépare une action de 5 minutes.&quot;],[&quot;Quand je suis stressé(e)&quot;,&quot;Le stress donne envie d&#x27;un soulagement rapide. Un souffle plus long à l&#x27;expiration (4 s / 6 s) calme le corps en 2 minutes.&quot;],[&quot;Avec d&#x27;autres personnes&quot;,&quot;Le contexte social pèse beaucoup. Dire à une personne que tu changes suffit souvent à désamorcer.&quot;]]},[&quot;Le cerveau associe&quot;,&quot;Musique, lieux, amis : le cerveau associe le contexte au produit. L&#x27;envie peut revenir en retrouvant le lieu.&quot;,&quot;Repère les lieux et sons qui déclenchent l&#x27;envie.&quot;]],[&quot;Verrouiller l&#x27;accès&quot;,&quot;Moins c&#x27;est facile d&#x27;en avoir, moins tu peux craquer sur un coup de tête. Ton contact, ton argent liquide, tes messages : tout ça peut se couper à l&#x27;avance.&quot;,&quot;Supprime les contacts et les conversations. Décide combien d&#x27;argent liquide tu emportes en soirée : le minimum.&quot;,null,{},{&quot;q&quot;:&quot;Quelle barrière poses-tu en premier ?&quot;,&quot;o&quot;:[[&quot;Supprimer l&#x27;accès&quot;,&quot;Chaque étape en plus fait baisser le passage à l&#x27;acte : un obstacle de 20 secondes laisse souvent l&#x27;envie retomber.&quot;],[&quot;Changer de lieu ou d&#x27;horaire&quot;,&quot;Les habitudes sont liées à des lieux et des heures. Change l&#x27;un des deux et l&#x27;automatisme perd son déclencheur.&quot;],[&quot;Prévenir quelqu&#x27;un&quot;,&quot;Dire ton objectif à voix haute le rend plus réel et te donne un témoin bienveillant.&quot;],[&quot;Aucune, c&#x27;est trop dur&quot;,&quot;Prends la plus petite, une seule. Une barrière imparfaite vaut mieux qu&#x27;un plan parfait jamais appliqué.&quot;]]},[&quot;Retirer la décision&quot;,&quot;À 3 h du matin, la volonté est faible. Supprimer le contact et limiter l&#x27;argent liquide retire la décision impulsive.&quot;,&quot;Supprime les contacts et ne prends que le minimum en espèces.&quot;]],[&quot;Le plan « si… alors… »&quot;,&quot;Un plan précis marche mieux qu&#x27;une bonne intention. Tu décides à l&#x27;avance quoi faire quand le moment arrive, pour ne pas avoir à choisir sous l&#x27;impulsion, avec du bruit, de la fatigue et de l&#x27;alcool.&quot;,&quot;Écris 3 phrases : « Si on me propose, alors je dis… / si la fatigue arrive, alors je… / si je suis seul, alors je… »&quot;,&quot;pairs&quot;,{},{&quot;q&quot;:&quot;Quel plan « si… alors… » te ressemble ?&quot;,&quot;o&quot;:[[&quot;Si l&#x27;envie vient, je bois de l&#x27;eau et j&#x27;attends 10 minutes&quot;,&quot;Un délai court plus un geste simple : c&#x27;est très efficace. Les plans précis marchent bien mieux que les bonnes intentions.&quot;],[&quot;Si je m&#x27;ennuie, je sors 5 minutes&quot;,&quot;Bouger change l&#x27;état du corps et coupe l&#x27;automatisme. Même monter un escalier compte.&quot;],[&quot;Si je suis stressé(e), je respire 1 minute&quot;,&quot;Inspire 4 secondes, souffle 6 : l&#x27;expiration longue ralentit le cœur et calme le système nerveux.&quot;],[&quot;Si je craque, j&#x27;appelle quelqu&#x27;un&quot;,&quot;Parler casse l&#x27;isolement et la honte, qui poussent à recommencer.&quot;]]},[&quot;L&#x27;expiration longue&quot;,&quot;Souffler plus longtemps qu&#x27;on inspire active le frein du système nerveux et fait baisser l&#x27;excitation.&quot;,&quot;Inspire 4 s, souffle 6 s, cinq fois.&quot;]],[&quot;Bilan de la semaine 1&quot;,&quot;Une semaine pour comprendre. Tu sais maintenant ce que tu consommes, ce que ça t&#x27;apporte et ce qui se déclenche. C&#x27;est suffisant pour attaquer la suite.&quot;,&quot;Relis tes notes. Complète : « Ce que j&#x27;ai appris sur moi cette semaine, c&#x27;est… ». Choisis une soirée à préparer cette semaine.&quot;,null,{},{&quot;q&quot;:&quot;Cette semaine, qu&#x27;est-ce qui t&#x27;a le plus surpris(e) ?&quot;,&quot;o&quot;:[[&quot;À quel point c&#x27;est automatique&quot;,&quot;Voir l&#x27;automatisme, c&#x27;est déjà la moitié du chemin : on ne peut changer que ce qu&#x27;on remarque.&quot;],[&quot;Les moments où l&#x27;envie arrive&quot;,&quot;Tu connais maintenant tes heures et tes lieux : tu peux les anticiper au lieu de les subir.&quot;],[&quot;Que ça passe quand j&#x27;attends&quot;,&quot;C&#x27;est l&#x27;info la plus utile : une envie qui passe n&#x27;est pas un ordre.&quot;],[&quot;Rien de spécial&quot;,&quot;Pas grave, c&#x27;est une semaine d&#x27;observation. Continue : les effets arrivent avec la pratique.&quot;]]},[&quot;La nuit blanche coûte&quot;,&quot;Veiller toute la nuit perturbe l&#x27;horloge biologique et l&#x27;humeur pendant plusieurs jours.&quot;,&quot;Rentre à l&#x27;heure que tu t&#x27;es fixée.&quot;]],[&quot;Comprendre l&#x27;envie&quot;,&quot;L&#x27;envie monte, atteint un pic, puis retombe, même si tu ne fais rien. Savoir que ça passe change tout : une envie n&#x27;est pas un ordre.&quot;,&quot;Quand l&#x27;envie arrive, attends 10 minutes avant d&#x27;agir. Observe où tu la sens dans le corps, et ce qu&#x27;elle devient.&quot;,&quot;wave&quot;,{},{&quot;q&quot;:&quot;Quand l&#x27;envie arrive, que fais-tu d&#x27;habitude ?&quot;,&quot;o&quot;:[[&quot;Je cède tout de suite&quot;,&quot;Normal : céder soulage vite, et c&#x27;est ce qui apprend au cerveau à recommencer. Aujourd&#x27;hui, repousse seulement de 10 minutes.&quot;],[&quot;Je lutte de toutes mes forces&quot;,&quot;Lutter épuise. Observe l&#x27;envie comme une vague : elle monte, plafonne, redescend. Laisse-la passer sans la combattre.&quot;],[&quot;Je me distrais&quot;,&quot;Très bien : 10 minutes de distraction suffisent souvent. Prépare-en deux à l&#x27;avance, à portée de main.&quot;],[&quot;Je ne sais pas&quot;,&quot;Aujourd&#x27;hui, note l&#x27;heure et ce que tu ressens quand elle vient. Un schéma va apparaître.&quot;]]},[&quot;Une vague&quot;,&quot;Une envie monte, plafonne et retombe en quelques minutes, même si on ne fait rien.&quot;,&quot;Chronomètre ta prochaine envie.&quot;]],[&quot;Tenir 10 minutes&quot;,&quot;Quand une envie arrive, ne te dis pas « jamais », dis-toi « dans 10 minutes ». Souvent, elle est partie avant. Si elle est encore là, tu décides en conscience.&quot;,&quot;Utilise le bouton SOS à chaque envie aujourd&#x27;hui. Compte combien sont passées.&quot;,&quot;hold&quot;,{},{&quot;q&quot;:&quot;Peux-tu tenir 10 minutes avant de passer à l&#x27;acte ?&quot;,&quot;o&quot;:[[&quot;Oui, facilement&quot;,&quot;Alors fais-en une règle : la plupart des envies retombent avant 10 minutes.&quot;],[&quot;Oui, avec une distraction&quot;,&quot;Parfait. Prépare deux distractions : musique, verre d&#x27;eau, marche. Elles font la moitié du travail.&quot;],[&quot;Difficile&quot;,&quot;Commence par 2 minutes. Chaque envie traversée entraîne ton cerveau à tolérer l&#x27;inconfort.&quot;],[&quot;Impossible&quot;,&quot;Pas de souci : 1 minute compte déjà. Le bouton SOS te guide pendant 10 minutes, un souffle après l&#x27;autre.&quot;]]},[&quot;Le délai&quot;,&quot;Attendre 10 minutes laisse redescendre l&#x27;excitation et redonne la main à la partie réfléchie du cerveau.&quot;,&quot;Lance un minuteur de 10 minutes.&quot;]],[&quot;Respirer pour retomber&quot;,&quot;Une respiration lente, avec un souffle plus long que l&#x27;inspiration, aide à calmer le corps en quelques minutes. C&#x27;est un outil que tu emportes partout, y compris en soirée.&quot;,&quot;Fais 2 minutes de respiration (inspire 4 secondes, souffle 6), deux fois dans la journée, dont une avant de sortir.&quot;,&quot;breathe&quot;,{},{&quot;q&quot;:&quot;Quand tu es tendu(e), ton souffle est plutôt…&quot;,&quot;o&quot;:[[&quot;Court et haut&quot;,&quot;Respirer haut met le corps en alerte. Allonge l&#x27;expiration : c&#x27;est le levier le plus rapide pour te calmer.&quot;],[&quot;Je le retiens parfois&quot;,&quot;Retenir son souffle augmente la tension. Souffle doucement par la bouche, comme dans une paille.&quot;],[&quot;Je n&#x27;y ai jamais fait attention&quot;,&quot;Pose une main sur le ventre : si elle ne bouge pas, ta respiration est haute. Essaie de la faire gonfler.&quot;],[&quot;Plutôt calme&quot;,&quot;Bien. Garde ce réflexe pour les moments d&#x27;envie, c&#x27;est là qu&#x27;il compte le plus.&quot;]]},[&quot;Le nerf vague&quot;,&quot;Respirer lentement stimule le nerf vague, qui ralentit le cœur et apaise.&quot;,&quot;Deux minutes de respiration avant de sortir.&quot;]],[&quot;Gérer la descente&quot;,&quot;Fatigue, humeur basse, anxiété : la descente donne envie de reprendre « pour remonter ». Elle passe avec le sommeil, la nourriture et un peu de patience.&quot;,&quot;Prépare ta prochaine descente : un repas, de l&#x27;eau, un film, un ami joignable, un lit propre. Tu n&#x27;as pas à la traverser seul.&quot;,&quot;slot&quot;,{},{&quot;q&quot;:&quot;Pour t&#x27;occuper 10 minutes, tu préfères…&quot;,&quot;o&quot;:[[&quot;Bouger&quot;,&quot;Le mouvement réduit les envies et améliore l&#x27;humeur en quelques minutes.&quot;],[&quot;Parler à quelqu&#x27;un&quot;,&quot;Une voix humaine apaise plus vite qu&#x27;un écran ou un produit.&quot;],[&quot;Faire quelque chose de mes mains&quot;,&quot;Cuisine, dessin, rangement : occuper les mains occupe aussi l&#x27;attention, l&#x27;envie perd de la place.&quot;],[&quot;Rien ne me tente&quot;,&quot;Normal au début : l&#x27;envie rend tout fade. Essaie quand même 3 minutes, l&#x27;envie baisse avant que l&#x27;activité ne devienne agréable.&quot;]]},[&quot;Traverser la descente&quot;,&quot;Pendant la descente : manger, boire de l&#x27;eau, dormir, marcher et se faire accompagner aident le cerveau à retrouver son équilibre.&quot;,&quot;Prévois repas, eau et un ami joignable pour dimanche.&quot;]],[&quot;Stress, fatigue et humeur&quot;,&quot;On consomme davantage quand on est stressé ou fatigué. Si tu t&#x27;accordes de vraies pauses à ces moments, le produit devient moins nécessaire. Si l&#x27;humeur reste très basse, parles-en à un professionnel.&quot;,&quot;Prévois 3 pauses de 5 minutes aujourd&#x27;hui : étirements, fenêtre ouverte, verre d&#x27;eau, marche. Note comment tu te sens après.&quot;,null,{},{&quot;q&quot;:&quot;Quand tu es stressé(e), ton corps réagit surtout par…&quot;,&quot;o&quot;:[[&quot;De la tension (épaules, mâchoire)&quot;,&quot;Relâche : épaules vers le bas, mâchoire détendue, trois souffles lents.&quot;],[&quot;De la fatigue&quot;,&quot;La fatigue baisse le frein de la volonté. Une sieste de 15 à 20 minutes aide, sinon couche-toi plus tôt ce soir.&quot;],[&quot;De l&#x27;agitation&quot;,&quot;Marche rapide 5 minutes : elle dépense l&#x27;adrénaline en trop.&quot;],[&quot;Je ne sais pas&quot;,&quot;Scanne : tête, épaules, ventre, jambes. Où ça serre ? C&#x27;est là qu&#x27;il faut respirer.&quot;]]},[&quot;Stress et cortisol&quot;,&quot;Le stress élève le cortisol et pousse vers le soulagement rapide. Marcher 10 minutes le fait redescendre.&quot;,&quot;Marche 10 minutes dehors.&quot;]],[&quot;Idées reçues sur les produits de soirée&quot;,&quot;« Tout le monde en prend », « j&#x27;ai besoin de ça pour m&#x27;amuser », « je contrôle ». Certaines idées reçues retiennent au même endroit. Les regarder d&#x27;un œil honnête enlève du pouvoir à la routine.&quot;,&quot;Écris l&#x27;idée reçue qui te parle le plus et ce que tu en penses maintenant.&quot;,&quot;myths&quot;,{},{&quot;q&quot;:&quot;Quelle idée te retient le plus ?&quot;,&quot;o&quot;:[[&quot;J&#x27;en ai besoin pour me détendre ou dormir&quot;,&quot;Ça détend sur l&#x27;instant mais entretient le manque ensuite. À terme, la détente et le sommeil naturels reviennent.&quot;],[&quot;Je gère, ce n&#x27;est pas un problème&quot;,&quot;Si tu es ici, c&#x27;est que tu veux plus de contrôle. Fais confiance à ça.&quot;],[&quot;Tout le monde le fait&quot;,&quot;Beaucoup le font, et beaucoup changent aussi. Tu n&#x27;es pas seul(e) dans les deux cas.&quot;],[&quot;Juste une fois ne compte pas&quot;,&quot;Chaque fois renforce le circuit de l&#x27;habitude. L&#x27;exception est souvent la porte d&#x27;entrée.&quot;]]},[&quot;L&#x27;alcool amplifie&quot;,&quot;L&#x27;alcool baisse l&#x27;inhibition et la vigilance, et augmente nettement l&#x27;envie comme les risques en soirée.&quot;,&quot;Alterne avec de l&#x27;eau ou une boisson sans alcool.&quot;]],[&quot;Bilan de la semaine 2&quot;,&quot;Tu as appris à voir l&#x27;envie venir, à l&#x27;attendre et à préparer la descente. Chaque jour compte, même imparfait.&quot;,&quot;Regarde ton compteur de jours sans et d&#x27;envies surmontées. Note le moment le plus dur et ce qui t&#x27;a aidé.&quot;,null,{},{&quot;q&quot;:&quot;Ce qui t&#x27;a le plus aidé(e) cette semaine ?&quot;,&quot;o&quot;:[[&quot;Attendre 10 minutes&quot;,&quot;Garde-le : c&#x27;est ton outil principal. Il marche d&#x27;autant mieux qu&#x27;il est automatique.&quot;],[&quot;Respirer&quot;,&quot;La respiration est toujours avec toi. Utilise-la avant que l&#x27;envie ne soit à son maximum.&quot;],[&quot;Éloigner ce qui donne accès&quot;,&quot;Bien joué : réduire l&#x27;accès est l&#x27;une des méthodes les plus solides.&quot;],[&quot;Rien de précis&quot;,&quot;Pas grave. Regarde le bilan : tu as peut-être tenu plus que tu ne le penses.&quot;]]},[&quot;Le cœur sous pression&quot;,&quot;Les stimulants accélèrent le cœur et montent la tension. En cas de douleur à la poitrine, malaise ou confusion : appelle le 15 ou le 112.&quot;,&quot;Enregistre le 15 et le 112 en favoris.&quot;]],[&quot;Faire la fête autrement&quot;,&quot;Danser, rire, rencontrer des gens : tout ça n&#x27;a pas besoin d&#x27;un produit. Construis ta boîte à outils pour sortir sans : une boisson sans alcool en main, un point de départ, un ami de confiance.&quot;,&quot;Choisis 3 actions pour ta prochaine soirée et garde-les dans une note.&quot;,null,{},{&quot;q&quot;:&quot;Quel remplaçant te semble le plus réaliste ?&quot;,&quot;o&quot;:[[&quot;Un geste (eau, étirements)&quot;,&quot;Les petits gestes sont faciles à répéter. Garde-les à portée de main.&quot;],[&quot;Une activité courte (marche, jeu)&quot;,&quot;Dix minutes suffisent souvent. Choisis-en une que tu peux faire n&#x27;importe où.&quot;],[&quot;Une personne (appel, message)&quot;,&quot;Un lien humain est l&#x27;un des meilleurs remplaçants. Mets 2 prénoms dans tes favoris.&quot;],[&quot;Je n&#x27;en ai pas encore&quot;,&quot;Essaie les trois cette semaine. Tu verras vite lequel marche pour toi.&quot;]]},[&quot;Danser libère&quot;,&quot;Danser libère des endorphines, et la musique active le circuit de la récompense, sans produit.&quot;,&quot;Mets de la musique et danse 5 minutes.&quot;]],[&quot;Bouger&quot;,&quot;Le sport aide au sommeil, à l&#x27;humeur et à la confiance. Pas besoin de sport intense : danse, marche, vélo comptent.&quot;,&quot;Fais 20 minutes d&#x27;activité physique aujourd&#x27;hui, de préférence à l&#x27;heure où tu aurais préparé ta soirée.&quot;,&quot;move&quot;,{},{&quot;q&quot;:&quot;Ton niveau de mouvement dans une journée ?&quot;,&quot;o&quot;:[[&quot;Presque aucun&quot;,&quot;Commence par 5 minutes de marche : c&#x27;est déjà un effet mesurable sur l&#x27;humeur.&quot;],[&quot;Un peu&quot;,&quot;Ajoute 10 minutes à l&#x27;heure où l&#x27;envie est la plus forte.&quot;],[&quot;Régulier&quot;,&quot;Excellent. Place-le aux heures à risque : c&#x27;est là qu&#x27;il protège le plus.&quot;],[&quot;Beaucoup&quot;,&quot;Parfait. N&#x27;oublie pas le repos : il fait partie de la récupération.&quot;]]},[&quot;Le mouvement répare&quot;,&quot;L&#x27;exercice améliore le sommeil, l&#x27;humeur et la confiance, trois choses que la descente abîme.&quot;,&quot;20 minutes de marche rapide.&quot;]],[&quot;Soirées et week-ends&quot;,&quot;Les soirées, les festivals, les anniversaires sont des moments à risque. Un plan évite de se retrouver coincé : qui, où, jusqu&#x27;à quand, avec quel budget.&quot;,&quot;Regarde les 2 prochains événements. Décide à l&#x27;avance ce que tu feras, avec qui, à quelle heure tu pars.&quot;,null,{},{&quot;q&quot;:&quot;Le plus dur dans tes week-ends, c&#x27;est…&quot;,&quot;o&quot;:[[&quot;Le temps libre&quot;,&quot;Prévois deux activités par jour : le vide appelle l&#x27;habitude.&quot;],[&quot;Les amis&quot;,&quot;Propose un lieu ou une activité sans l&#x27;habitude, ou dis-le d&#x27;avance. Les vrais amis comprennent.&quot;],[&quot;Le soir tard&quot;,&quot;Fixe une heure limite de coucher : la fatigue baisse les défenses.&quot;],[&quot;Rien de particulier&quot;,&quot;Prévois quand même un plan B, au cas où.&quot;]]},[&quot;Chaleur et eau&quot;,&quot;Danser longtemps fait monter la température et la transpiration. Boire de l&#x27;eau par petites gorgées et faire des pauses au frais.&quot;,&quot;Prévois une pause au frais toutes les heures.&quot;]],[&quot;En parler à quelqu&#x27;un&quot;,&quot;Garder ça pour soi entretient la honte. Parler à un ami de confiance, ou à Drogues info service (0 800 23 13 13, gratuit et anonyme), allège.&quot;,&quot;Choisis une personne de confiance et dis-lui que tu veux réduire ou arrêter. Dis-lui ce dont tu as besoin.&quot;,null,{},{&quot;q&quot;:&quot;À qui pourrais-tu en parler ?&quot;,&quot;o&quot;:[[&quot;Un(e) ami(e)&quot;,&quot;Un ami de confiance suffit. Dis simplement : « j&#x27;essaie de changer, peux-tu me demander demain comment ça va ? »&quot;],[&quot;Un proche de la famille&quot;,&quot;Choisis la personne la plus calme et la moins critique. Un message écrit peut être plus facile.&quot;],[&quot;Un professionnel ou une ligne d&#x27;aide&quot;,&quot;Excellente idée : Drogues info service (0 800 23 13 13) est là pour ça, gratuitement et sans jugement.&quot;],[&quot;Personne pour l&#x27;instant&quot;,&quot;C&#x27;est possible, et ce n&#x27;est pas grave. Une ligne d&#x27;aide (Drogues info service (0 800 23 13 13)) peut être ton premier interlocuteur.&quot;]]},[&quot;Parler allège&quot;,&quot;Parler à un ami de confiance réduit la honte et le stress, deux moteurs de l&#x27;envie.&quot;,&quot;Parle à une personne de confiance.&quot;]],[&quot;Les pensées-pièges&quot;,&quot;« Juste ce soir », « tout le monde le fait », « je contrôle ». Ces phrases sont normales. Les repérer leur enlève du pouvoir.&quot;,&quot;Écris 3 phrases que tu te dis avant de consommer. À côté de chacune, une réponse honnête et courte.&quot;,&quot;pieges&quot;,{},{&quot;q&quot;:&quot;Quelle pensée te fait le plus craquer ?&quot;,&quot;o&quot;:[[&quot;« Juste une fois »&quot;,&quot;C&#x27;est le piège le plus courant. Réponse : « si c&#x27;est juste une fois, je peux attendre demain ».&quot;],[&quot;« Je l&#x27;ai bien mérité »&quot;,&quot;Oui, et tu peux te récompenser autrement : repas, film, sortie. Sans la facture.&quot;],[&quot;« Je m&#x27;y mets demain »&quot;,&quot;Demain sera pareil. Réponse : « je commence par les 10 prochaines minutes ».&quot;],[&quot;« J&#x27;ai déjà craqué, tant pis »&quot;,&quot;Un faux pas n&#x27;efface pas les jours passés. Reprends dès la prochaine heure.&quot;]]},[&quot;Le cerveau négocie&quot;,&quot;Pour obtenir un plaisir rapide, le cerveau fabrique des excuses (« juste ce soir »). Les repérer leur enlève du pouvoir.&quot;,&quot;Note ta pensée-piège préférée.&quot;]],[&quot;Te récompenser autrement&quot;,&quot;Ton cerveau aime les petites récompenses. Tu peux en garder sans consommer : un bon repas, une sortie, un week-end avec l&#x27;argent économisé.&quot;,&quot;Choisis une récompense pour chaque semaine tenue. Calcule ce que ça coûte et compare avec ce que tu aurais dépensé.&quot;,null,{},{&quot;q&quot;:&quot;Quelle récompense te ferait vraiment plaisir ?&quot;,&quot;o&quot;:[[&quot;Un bon repas&quot;,&quot;Parfait : choisis le jour et le lieu à l&#x27;avance, une récompense prévue motive mieux qu&#x27;une récompense improvisée.&quot;],[&quot;Une sortie&quot;,&quot;Planifie-la dans ton agenda dès aujourd&#x27;hui : l&#x27;avoir devant soi aide à tenir.&quot;],[&quot;Un achat&quot;,&quot;Mets de côté la somme économisée dans une enveloppe : la voir grossir motive.&quot;],[&quot;Du repos&quot;,&quot;Le repos est une vraie récompense. Offre-toi une soirée sans obligation.&quot;]]},[&quot;La récompense prévue&quot;,&quot;Une récompense chois ant pis », le vrai piège. Reprends au prochain repas, pas à la prochaine semaine.&quot;],[&quot;« Je préviens quelqu&#x27;un »&quot;,&quot;Excellent réflexe : ça casse l&#x27;isolement et la honte.&quot;]]},[&quot;Un faux pas, pas une chute&quot;,&quot;Un dérapage ne défait pas les circuits déjà en place. Ne reste pas seul(e), bois de l&#x27;eau, et reprends vite.&quot;,&quot;Écris ta phrase de reprise.&quot;]],[&quot;Ton plan en cas de rechute&quot;,&quot;Prévoir le plan B enlève la peur. Qu&#x27;est-ce qui m&#x27;a fait craquer ? Qu&#x27;est-ce que je change ? Qui je préviens ? En cas de malaise : 15 ou 112.&quot;,&quot;Rédige un plan en 3 points : ce que je fais dans l&#x27;heure, ce que j&#x27;analyse, ce que j&#x27;ajuste. Note le 0 800 23 13 13 et le 15.&quot;,&quot;relapse&quot;,{},{&quot;q&quot;:&quot;En cas de rechute, ce qui t&#x27;aiderait le plus ?&quot;,&quot;o&quot;:[[&quot;Un message tout prêt&quot;,&quot;Écris-le maintenant, il sera là quand tu en auras besoin. Tu n&#x27;auras plus qu&#x27;à l&#x27;envoyer.&quot;],[&quot;Quelqu&#x27;un à appeler&quot;,&quot;Choisis la personne et enregistre son numéro en favori.&quot;],[&quot;Une règle simple&quot;,&quot;Par exemple : « je m&#x27;arrête là, je bois de l&#x27;eau, je reprends demain ».&quot;],[&quot;Je préfère ne pas y penser&quot;,&quot;C&#x27;est compréhensible, mais prévoir réduit la peur. Ça prend 2 minutes et tu seras plus serein(e).&quot;]]},[&quot;Anticiper apaise&quot;,&quot;Prévoir ce qu&#x27;on fera en cas de craquage réduit la panique. En cas de malaise : 15 ou 112.&quot;,&quot;Relis ton plan B ce soir.&quot;]],[&quot;Qui tu deviens&quot;,&quot;Au fil des semaines, tu n&#x27;es plus la même personne qu&#x27;au jour 1. Nommer qui tu deviens rend le changement concret et te donne une direction.&quot;,&quot;Écris une phrase : « Je deviens quelqu&#x27;un qui… ». Relis-la le matin.&quot;,null,{},{&quot;q&quot;:&quot;Dans 6 mois, tu aimerais être quelqu&#x27;un qui…&quot;,&quot;o&quot;:[[&quot;Dort bien&quot;,&quot;Un objectif concret : les nuits s&#x27;améliorent souvent dès les premières semaines.&quot;],[&quot;Tient ses engagements&quot;,&quot;Chaque petit engagement tenu renforce la confiance en toi.&quot;],[&quot;A de l&#x27;énergie&quot;,&quot;L&#x27;énergie revient avec le sommeil, le mouvement et moins d&#x27;à-coups.&quot;],[&quot;Se sent libre&quot;,&quot;La liberté, c&#x27;est choisir. Chaque envie traversée est un choix de plus.&quot;]]},[&quot;Une nouvelle identité&quot;,&quot;Chaque soirée vécue sans renforce la confiance : tu n&#x27;as pas besoin d&#x27;un produit pour être drôle ou à l&#x27;aise.&quot;,&quot;Note une chose que tu as aimée en soirée sans.&quot;]],[&quot;Les moments à risque à venir&quot;,&quot;Festivals, anniversaires, nouvel an, périodes de stress : certains moments vont remettre l&#x27;envie en jeu. Les prévoir, c&#x27;est déjà y être préparé.&quot;,&quot;Liste les 3 prochains moments à risque et ce que tu feras à chaque fois.&quot;,null,{},{&quot;q&quot;:&quot;Ton prochain moment à risque, c&#x27;est…&quot;,&quot;o&quot;:[[&quot;Un week-end&quot;,&quot;Prévois deux activités par jour et une heure de coucher.&quot;],[&quot;Une fête ou un événement&quot;,&quot;Décide à l&#x27;avance ce que tu fais et à quelle heure tu pars.&quot;],[&quot;Une période de stress&quot;,&quot;Planifie des pauses et du mouvement. Le stress est un déclencheur majeur.&quot;],[&quot;Je ne sais pas&quot;,&quot;Regarde ton agenda des 2 semaines à venir : tu en verras un ou deux.&quot;]]},[&quot;Le contexte déclenche&quot;,&quot;Festivals, anniversaires, nouvel an : certains moments ravivent l&#x27;envie. Les repérer permet de s&#x27;y préparer.&quot;,&quot;Note les 3 prochains moments à risque.&quot;]],[&quot;Mieux dormir&quot;,&quot;Le sommeil est souvent perturbé les premières semaines, puis s&#x27;améliore. Une routine du soir régulière aide beaucoup.&quot;,&quot;Fixe une heure de coucher. Téléphone hors du lit. Prévois une activité calme avant de dormir.&quot;,&quot;evening&quot;,{},{&quot;q&quot;:&quot;Tes nuits en ce moment ?&quot;,&quot;o&quot;:[[&quot;Courtes&quot;,&quot;Une nuit courte renforce l&#x27;envie et réduit le contrôle. Couche-toi 30 minutes plus tôt ce soir.&quot;],[&quot;Agitées&quot;,&quot;Écrans coupés 30 minutes avant, chambre fraîche (18-19 °C) et dîner léger aident.&quot;],[&quot;Correctes&quot;,&quot;Bien. Garde un horaire régulier : c&#x27;est ça qui consolide.&quot;],[&quot;Très bonnes&quot;,&quot;Parfait. Protège-les : c&#x27;est un de tes meilleurs alliés.&quot;]]},[&quot;Dormir 7 à 9 heures&quot;,&quot;Un sommeil régulier rééquilibre humeur et énergie, et réduit les envies.&quot;,&quot;Fixe une heure de coucher, même le week-end.&quot;]],[&quot;L&#x27;argent que tu récupères&quot;,&quot;Cet argent est ton vrai gain. Le chiffrer le rend concret et motive.&quot;,&quot;Reprends ton chiffre du jour 2. Écris ce que tu veux faire avec cet argent.&quot;,null,{},{&quot;q&quot;:&quot;Le temps ou l&#x27;argent récupéré, tu en feras…&quot;,&quot;o&quot;:[[&quot;Du repos&quot;,&quot;Le repos compte aussi. Planifie-le au lieu de le subir.&quot;],[&quot;Un projet&quot;,&quot;Choisis un petit projet de 30 minutes par jour : c&#x27;est ce qui remplit le vide.&quot;],[&quot;Du temps avec des proches&quot;,&quot;Les liens sont l&#x27;un des meilleurs soutiens pour tenir.&quot;],[&quot;Un plaisir ou de l&#x27;épargne&quot;,&quot;Mets une somme de côté chaque semaine : la voir grossir motive.&quot;]]},[&quot;L&#x27;argent regagné&quot;,&quot;Chaque soirée sans produit, ce sont des dizaines d&#x27;euros de moins dépensés. Les voir s&#x27;accumuler motive.&quot;,&quot;Mets la somme de côté dans une enveloppe.&quot;]],[&quot;Ton réseau d&#x27;aide&quot;,&quot;Si tu as du mal à tenir, un professionnel peut t&#x27;aider gratuitement : consultation jeunes consommateurs, CSAPA, ton médecin, Drogues info service. Ce n&#x27;est pas un échec.&quot;,&quot;Note le 0 800 23 13 13 et le nom de ton médecin. Si tu vas mal, le 3114 répond 24h/24.&quot;,null,{},{&quot;q&quot;:&quot;Qui est ton premier appel en cas de coup dur ?&quot;,&quot;o&quot;:[[&quot;Un(e) ami(e)&quot;,&quot;Garde son numéro en favori. Dis-lui d&#x27;avance qu&#x27;il peut t&#x27;aider.&quot;],[&quot;Un proche de la famille&quot;,&quot;Préviens-le à l&#x27;avance : il saura quoi répondre quand ça arrivera.&quot;],[&quot;Un professionnel&quot;,&quot;Drogues info service (0 800 23 13 13) est joignable. Note le numéro dans ton téléphone.&quot;],[&quot;Je n&#x27;ai pas de nom&quot;,&quot;Alors Drogues info service (0 800 23 13 13) peut être ce nom. C&#x27;est gratuit, tu n&#x27;as pas à te justifier.&quot;]]},[&quot;L&#x27;aide existe&quot;,&quot;Drogues info service, les CSAPA et ton médecin sont gratuits, confidentiels et sans jugement.&quot;,&quot;Note le 0 800 23 13 13.&quot;]],[&quot;Lettre à toi-même&quot;,&quot;Ce que tu as fait pendant 30 jours mérite d&#x27;être écrit. Cette lettre te servira les jours où tu auras oublié pourquoi c&#x27;était important.&quot;,&quot;Écris-toi une lettre pour dans 3 mois : ce que tu as appris, ce que tu veux avoir gardé, ce que tu te souhaites.&quot;,&quot;letter&quot;,{},{&quot;q&quot;:&quot;Pour toi dans 3 mois, le plus important à te rappeler ?&quot;,&quot;o&quot;:[[&quot;Ce que j&#x27;ai tenu&quot;,&quot;Écris-le : les chiffres sont des preuves quand le doute revient.&quot;],[&quot;Pourquoi j&#x27;ai commencé&quot;,&quot;Relis ton pourquoi du premier jour. Il est dans ton espace.&quot;],[&quot;Que ça passe&quot;,&quot;Oui : une envie passe toujours. C&#x27;est ta meilleure information.&quot;],[&quot;Que je mérite d&#x27;aller bien&quot;,&quot;C&#x27;est vrai. Écris-le comme si tu parlais à un ami.&quot;]]},[&quot;Écrire aide&quot;,&quot;Écrire ce qu&#x27;on ressent aide à réguler les émotions, c&#x27;est ce qu&#x27;on appelle l&#x27;écriture expressive.&quot;,&quot;Écris 5 minutes, sans te relire.&quot;]],[&quot;Et maintenant ?&quot;,&quot;30 jours, c&#x27;est un début, pas une fin. Garde les règles qui ont marché, et refais le point une fois par mois. Ne reste jamais seul en cas de rechute.&quot;,&quot;Choisis les 3 règles à garder. Plante un rappel mensuel dans ton agenda.&quot;,&quot;final&quot;,{},{&quot;q&quot;:&quot;Pour la suite, tu comptes…&quot;,&quot;o&quot;:[[&quot;Continuer chaque jour&quot;,&quot;Excellent. La régularité fait plus que l&#x27;intensité.&quot;],[&quot;Faire un point par semaine&quot;,&quot;Très bien : un point de 10 minutes le dimanche suffit.&quot;],[&quot;Appeler en cas de doute&quot;,&quot;Drogues info service (0 800 23 13 13) est là. Un coup de fil évite souvent une rechute.&quot;],[&quot;Je ne sais pas encore&quot;,&quot;Pas de pression. Garde juste la règle : au moindre doute, 10 minutes d&#x27;attente et un souffle lent.&quot;]]},[&quot;Garder le cap&quot;,&quot;Les rechutes sont fréquentes dans tout changement ; ce qui compte, c&#x27;est de reprendre vite. Ne reste jamais seul(e) en cas de rechute.&quot;,&quot;Fixe un rappel mensuel pour faire le point.&quot;]]]}};

async function stripe(path: string, body?: URLSearchParams) {
  const r = await fetch(&#x27;https://api.stripe.com/v1/&#x27; + path, {
    method: body ? &#x27;POST&#x27; : &#x27;GET&#x27;, body,
    headers: { Authorization: &#x27;Bearer &#x27; + SK, &#x27;Content-Type&#x27;: &#x27;application/x-www-form-urlencoded&#x27; },
  });
  return r.json();
}

Deno.serve(async (req) =&gt; {
  if (req.method === &#x27;OPTIONS&#x27;) return new Response(&#x27;ok&#x27;, { headers: CORS });
  if (!SK) return json({ error: &#x27;paiement non configuré&#x27; }, 500);
  const body = await req.json().catch(() =&gt; ({}));
  const { action, id, cle, sid } = body;

  if (action === &#x27;prog_checkout&#x27;) {
    const prog = String(body.prog || &#x27;&#x27;), P = PROGS[prog];
    if (!P) return json({ error: &#x27;demande invalide&#x27; }, 400);
    const p = new URLSearchParams({
      mode: &#x27;payment&#x27;, locale: &#x27;fr&#x27;, allow_promotion_codes: &#x27;true&#x27;,
      &#x27;line_items[0][quantity]&#x27;: &#x27;1&#x27;,
      &#x27;line_items[0][price_data][currency]&#x27;: &#x27;eur&#x27;,
      &#x27;line_items[0][price_data][unit_amount]&#x27;: String(P.cents),
      &#x27;line_items[0][price_data][product_data][name]&#x27;: &#x27;Lookmiz · &#x27; + P.name,
      success_url: SITE + &#x27;app/?achat=1&amp;sid={CHECKOUT_SESSION_ID}&#x27;,
      cancel_url: SITE + (prog === &#x27;pack&#x27; ? &#x27;#tarifs&#x27; : &#x27;programmes/&#x27; + prog + &#x27;/#achat&#x27;),
      &#x27;metadata[prog]&#x27;: prog,
    });
    const s = await stripe(&#x27;checkout/sessions&#x27;, p);
    if (!s.url) return json({ error: s.error?.message || &#x27;Stripe a refusé&#x27; }, 502);
    return json({ url: s.url });
  }
  if (action === &#x27;prog_verify&#x27;) {
    if (!/^cs_[A-Za-z0-9_]+$/.test(String(sid || &#x27;&#x27;))) return json({ paid: false });
    const s = await stripe(&#x27;checkout/sessions/&#x27; + sid), prog = s.metadata?.prog;
    return json(okPaid(s) &amp;&amp; prog &amp;&amp; PROGS[prog] ? { paid: true, prog } : { paid: false });
  }
  if (action === &#x27;prog_day&#x27;) {
    const prog = String(body.prog || &#x27;&#x27;), list = Array.isArray(body.sids) ? body.sids.slice(0, 5) : [];
    if (!DAYS[prog]) return json({ error: &#x27;programme inconnu&#x27; }, 400);
    for (const one of list) {
      if (!/^cs_[A-Za-z0-9_]+$/.test(String(one))) continue;
      const s = await stripe(&#x27;checkout/sessions/&#x27; + one), pr = s.metadata?.prog;
      if (okPaid(s) &amp;&amp; (pr === prog || pr === &#x27;pack&#x27;)) return json({ days: DAYS[prog].days, kit: DAYS[prog].kit });
    }
    return json({ error: &#x27;accès refusé&#x27; }, 403);
  }

  if (!/^[a-z0-9]{10,20}$/.test(id || &#x27;&#x27;)) return json({ error: &#x27;carte invalide&#x27; }, 400);
  const { data: carte } = await admin.from(&#x27;cartes&#x27;).select(&#x27;cle, data, paid&#x27;).eq(&#x27;id&#x27;, id).maybeSingle();
  if (!carte) return json({ error: &#x27;carte introuvable&#x27; }, 404);

  if (action === &#x27;checkout&#x27;) {
    if (carte.cle !== cle) return json({ error: &#x27;refusé&#x27; }, 403);
    if (carte.paid) return json({ paid: true });
    const dest = Array.isArray(carte.data?.f?.dest) ? carte.data.f.dest.length : 0;
    const extra = Math.max(0, dest - 1);            // 1,20 € la carte, puis 0,60 € par personne ajoutée
    const p = new URLSearchParams({
      mode: &#x27;payment&#x27;,
      &#x27;line_items[0][quantity]&#x27;: &#x27;1&#x27;,
      &#x27;line_items[0][price_data][currency]&#x27;: &#x27;eur&#x27;,
      &#x27;line_items[0][price_data][unit_amount]&#x27;: &#x27;120&#x27;,
      &#x27;line_items[0][price_data][product_data][name]&#x27;: &#x27;Carte Lookmiz animée&#x27;,
      success_url: SITE + &#x27;?paye=&#x27; + id + &#x27;&amp;sid={CHECKOUT_SESSION_ID}&#x27;,
      cancel_url: SITE + &#x27;#mes-cartes&#x27;,
      &#x27;metadata[carte]&#x27;: id,
    });
    if (extra) { p.set(&#x27;line_items[1][quantity]&#x27;, String(extra)); p.set(&#x27;line_items[1][price_data][currency]&#x27;, &#x27;eur&#x27;); p.set(&#x27;line_items[1][price_data][unit_amount]&#x27;, &#x27;60&#x27;); p.set(&#x27;line_items[1][price_data][product_data][name]&#x27;, &#x27;Personne supplémentaire&#x27;); }
    const s = await stripe(&#x27;checkout/sessions&#x27;, p);
    if (!s.url) return json({ error: s.error?.message || &#x27;Stripe a refusé&#x27; }, 502);
    return json({ url: s.url });
  }

  if (action === &#x27;verify&#x27;) {
    if (carte.paid) return json({ paid: true });
    if (!/^cs_[A-Za-z0-9_]+$/.test(sid || &#x27;&#x27;)) return json({ paid: false });
    const s = await stripe(&#x27;checkout/sessions/&#x27; + sid);
    const ok = s.payment_status === &#x27;paid&#x27; &amp;&amp; s.metadata?.carte === id;
    if (ok) await admin.from(&#x27;cartes&#x27;).update({ paid: true }).eq(&#x27;id&#x27;, id);
    return json({ paid: ok });
  }
  return json({ error: &#x27;demande invalide&#x27; }, 400);
});
