r&quot;,&quot;Téléphone hors du lit&quot;,&quot;Écrans éteints 30 minutes avant&quot;,&quot;Douche ou tisane&quot;,&quot;Préparer la journée de demain&quot;,&quot;Respirer 2 minutes&quot;],&quot;people&quot;:[&quot;Un ami proche&quot;,&quot;Mon frère ou ma sœur&quot;,&quot;Mon conjoint ou ma conjointe&quot;,&quot;Un parent&quot;,&quot;Un collègue de confiance&quot;,&quot;Mon médecin&quot;],&quot;pause&quot;:[&quot;Lève-toi et étire-toi&quot;,&quot;Bois un verre d&#x27;eau, lentement&quot;,&quot;Regarde loin, par la fenêtre&quot;,&quot;Respire lentement 5 fois&quot;,&quot;Note ce que tu ressens, en une phrase&quot;],&quot;money&quot;:[&quot;Mettre en place un virement d&#x27;épargne le jour de la paie&quot;,&quot;Fixer un plafond de retrait hebdomadaire&quot;,&quot;Confier une carte à un proche&quot;,&quot;Demander l&#x27;interdiction volontaire de jeux (ANJ)&quot;,&quot;Supprimer les moyens de paiement enregistrés&quot;],&quot;steps&quot;:[&quot;Lister toutes mes dettes et leurs montants&quot;,&quot;Appeler un Point Conseil Budget (gratuit)&quot;,&quot;Prévenir mes créanciers avant les retards&quot;,&quot;Établir un budget mensuel simple&quot;,&quot;Ne contracter aucun nouveau crédit&quot;,&quot;Appeler Joueurs info service : 09 74 75 13 13&quot;]},&quot;days&quot;:[[&quot;Ton pourquoi&quot;,&quot;Avant de changer quoi que ce soit, sache pour quoi tu le fais : l&#x27;argent, la famille, la tranquillité, le temps. Ce pourquoi sera ta réserve les jours difficiles.&quot;,&quot;Écris 3 raisons personnelles d&#x27;arrêter. Garde-les en note sur ton écran de verrouillage.&quot;,&quot;choose&quot;,{},{&quot;q&quot;:&quot;Qu&#x27;est-ce qui te pousse à changer aujourd&#x27;hui ?&quot;,&quot;o&quot;:[[&quot;Ma santé&quot;,&quot;Excellent moteur. Le corps commence à récupérer très tôt : chaque jour compte déjà, même si tu ne le sens pas encore.&quot;],[&quot;Mon argent&quot;,&quot;Chiffrer l&#x27;argent regagné est l&#x27;un des meilleurs rappels les jours difficiles. On le fera dans quelques jours.&quot;],[&quot;Mes proches&quot;,&quot;Faire ça pour les autres aide, mais garde aussi une raison rien que pour toi : c&#x27;est elle qui tient quand personne ne regarde.&quot;],[&quot;Je me sens dépassé(e)&quot;,&quot;C&#x27;est une raison valable. Tu n&#x27;as pas à tout régler aujourd&#x27;hui : un seul petit pas suffit pour commencer.&quot;]]},[&quot;Le cerveau aime l&#x27;incertain&quot;,&quot;La dopamine monte surtout à l&#x27;attente d&#x27;un gain incertain, plus qu&#x27;au gain lui-même. C&#x27;est l&#x27;attente qui accroche.&quot;,&quot;Remarque l&#x27;excitation avant de miser, pas après.&quot;]],[&quot;Le vrai chiffre&quot;,&quot;On se souvient des gains, on oublie les pertes. Le premier acte de contrôle, c&#x27;est de regarder le vrai chiffre, sans te juger.&quot;,&quot;Sur tes relevés bancaires des 3 derniers mois, additionne les dépôts sur les sites de jeux et de paris. Soustrais les retraits. Écris le résultat.&quot;,&quot;calc&quot;,{},{&quot;q&quot;:&quot;Ton estimation de ta semaine dernière, elle est…&quot;,&quot;o&quot;:[[&quot;Plutôt juste&quot;,&quot;C&#x27;est rare : la plupart des gens sous-estiment. Vérifie quand même avec les vrais chiffres ce soir.&quot;],[&quot;Sûrement en dessous de la réalité&quot;,&quot;C&#x27;est le cas de presque tout le monde : le cerveau oublie les automatismes. Mesurer sans te juger, c&#x27;est tout ce qu&#x27;on te demande.&quot;],[&quot;Je n&#x27;ose pas regarder&quot;,&quot;Normal : voir le chiffre pique un peu. C&#x27;est pourtant ce qui permet de reprendre la main. Regarde-le comme un simple relevé.&quot;],[&quot;Je n&#x27;en ai aucune idée&quot;,&quot;Alors note pendant 3 jours, une ligne à chaque fois. Les automatismes se voient dès qu&#x27;on les écrit.&quot;]]},[&quot;La maison gagne&quot;,&quot;Les jeux sont conçus avec un avantage pour l&#x27;opérateur : sur la durée, la perte attendue est certaine, même si de petits gains arrivent.&quot;,&quot;Écris le total que tu as misé le mois dernier.&quot;]],[&quot;Ce que ça t&#x27;apporte, ce que ça te coûte&quot;,&quot;Le jeu te donne de l&#x27;excitation, de l&#x27;espoir, une évasion. Le reconnaître permet de chercher d&#x27;autres sources. Il a aussi un coût : argent, stress, mensonges, temps.&quot;,&quot;Fais deux colonnes : ce que le jeu t&#x27;apporte / ce qu&#x27;il te coûte. Souligne ce qui pèse le plus.&quot;,null,{},{&quot;q&quot;:&quot;Qu&#x27;est-ce que ça t&#x27;apporte de jouer ?&quot;,&quot;o&quot;:[[&quot;Me détendre&quot;,&quot;La détente est réelle mais courte : elle soulage surtout le manque que l&#x27;habitude crée. Respiration lente, marche ou douche chaude donnent un calme plus durable.&quot;],[&quot;Ne plus penser à rien&quot;,&quot;C&#x27;est un vrai besoin : ton cerveau veut une pause. Une vraie pause (marche, étirements) repose mieux et ne laisse pas de culpabilité.&quot;],[&quot;Me sentir moins seul(e)&quot;,&quot;Besoin légitime. Un message ou un appel, même court, y répond mieux et plus longtemps.&quot;],[&quot;Du plaisir, tout simplement&quot;,&quot;Le plaisir compte. L&#x27;idée n&#x27;est pas de t&#x27;en priver mais de le retrouver ailleurs : dans quelques jours tu choisiras tes remplaçants.&quot;]]},[&quot;Les « presque gagné »&quot;,&quot;Un « presque gagné » active les circuits de la récompense presque comme un gain, et pousse à rejouer.&quot;,&quot;Quand tu « as failli gagner », rappelle-toi : c&#x27;est une perte.&quot;]],[&quot;Tes déclencheurs&quot;,&quot;La paie, un match, une notification de bonus, l&#x27;ennui, après une perte : ce sont des déclencheurs. Quand tu les repères, tu les vois venir.&quot;,&quot;Note les 5 dernières fois où tu as joué : le jour, l&#x27;heure, ce qui s&#x27;est passé juste avant et ce que tu ressentais.&quot;,&quot;heat&quot;,{},{&quot;q&quot;:&quot;Quand l&#x27;envie est-elle la plus forte ?&quot;,&quot;o&quot;:[[&quot;Le soir, seul(e)&quot;,&quot;Fatigue et solitude : le soir, le cerveau freine moins bien. Prévois quelque chose de précis pour ces heures-là.&quot;],[&quot;Quand je m&#x27;ennuie&quot;,&quot;L&#x27;ennui est un déclencheur très fréquent. Il retombe en quelques minutes si on ne le fuit pas : prépare une action de 5 minutes.&quot;],[&quot;Quand je suis stressé(e)&quot;,&quot;Le stress donne envie d&#x27;un soulagement rapide. Un souffle plus long à l&#x27;expiration (4 s / 6 s) calme le corps en 2 minutes.&quot;],[&quot;Avec d&#x27;autres personnes&quot;,&quot;Le contexte social pèse beaucoup. Dire à une personne que tu changes suffit souvent à désamorcer.&quot;]]},[&quot;Des signaux qui conditionnent&quot;,&quot;Notifications, sons, bonus, matchs : ces signaux conditionnent l&#x27;envie. Les couper réduit le déclenchement.&quot;,&quot;Coupe toutes les notifications de paris.&quot;]],[&quot;Verrouiller l&#x27;accès&quot;,&quot;La volonté s&#x27;épuise, des barrières font le travail. Supprimer la facilité, c&#x27;est supprimer des décisions sous l&#x27;impulsion.&quot;,&quot;Désinstalle les applis de paris, supprime les cartes enregistrées, désabonne-toi des mails promotionnels. Renseigne-toi sur l&#x27;interdiction volontaire de jeux sur le site de l&#x27;ANJ.&quot;,null,{},{&quot;q&quot;:&quot;Quelle barrière poses-tu en premier ?&quot;,&quot;o&quot;:[[&quot;Supprimer l&#x27;accès&quot;,&quot;Chaque étape en plus fait baisser le passage à l&#x27;acte : un obstacle de 20 secondes laisse souvent l&#x27;envie retomber.&quot;],[&quot;Changer de lieu ou d&#x27;horaire&quot;,&quot;Les habitudes sont liées à des lieux et des heures. Change l&#x27;un des deux et l&#x27;automatisme perd son déclencheur.&quot;],[&quot;Prévenir quelqu&#x27;un&quot;,&quot;Dire ton objectif à voix haute le rend plus réel et te donne un témoin bienveillant.&quot;],[&quot;Aucune, c&#x27;est trop dur&quot;,&quot;Prends la plus petite, une seule. Une barrière imparfaite vaut mieux qu&#x27;un plan parfait jamais appliqué.&quot;]]},[&quot;La friction aide&quot;,&quot;Plus il y a d&#x27;étapes (désinstaller, retirer sa carte), plus l&#x27;envie a le temps de retomber.&quot;,&quot;Désinstalle une application de paris.&quot;]],[&quot;Le plan « si… alors… »&quot;,&quot;Un plan précis marche mieux qu&#x27;une bonne intention. Tu décides à l&#x27;avance de ce que tu feras quand le déclencheur arrive.&quot;,&quot;Écris 3 phrases : « Si je reçois une notification / un jour de match / après avoir perdu, alors je… » avec une action concrète.&quot;,&quot;pairs&quot;,{},{&quot;q&quot;:&quot;Quel plan « si… alors… » te ressemble ?&quot;,&quot;o&quot;:[[&quot;Si l&#x27;envie vient, je bois de l&#x27;eau et j&#x27;attends 10 minutes&quot;,&quot;Un délai court plus un geste simple : c&#x27;est très efficace. Les plans précis marchent bien mieux que les bonnes intentions.&quot;],[&quot;Si je m&#x27;ennuie, je sors 5 minutes&quot;,&quot;Bouger change l&#x27;état du corps et coupe l&#x27;automatisme. Même monter un escalier compte.&quot;],[&quot;Si je suis stressé(e), je respire 1 minute&quot;,&quot;Inspire 4 secondes, souffle 6 : l&#x27;expiration longue ralentit le cœur et calme le système nerveux.&quot;],[&quot;Si je craque, j&#x27;appelle quelqu&#x27;un&quot;,&quot;Parler casse l&#x27;isolement et la honte, qui poussent à recommencer.&quot;]]},[&quot;L&#x27;expiration longue&quot;,&quot;Souffler plus longtemps qu&#x27;on inspire active le frein du système nerveux et fait baisser l&#x27;excitation.&quot;,&quot;Inspire 4 s, souffle 6 s, cinq fois.&quot;]],[&quot;Bilan de la semaine 1&quot;,&quot;Tu connais ton chiffre, tes déclencheurs, et tu as verrouillé l&#x27;accès. C&#x27;est la base.&quot;,&quot;Complète : « Ce que j&#x27;ai appris sur moi cette semaine, c&#x27;est… ». Choisis le moment le plus risqué de la semaine prochaine.&quot;,null,{},{&quot;q&quot;:&quot;Cette semaine, qu&#x27;est-ce qui t&#x27;a le plus surpris(e) ?&quot;,&quot;o&quot;:[[&quot;À quel point c&#x27;est automatique&quot;,&quot;Voir l&#x27;automatisme, c&#x27;est déjà la moitié du chemin : on ne peut changer que ce qu&#x27;on remarque.&quot;],[&quot;Les moments où l&#x27;envie arrive&quot;,&quot;Tu connais maintenant tes heures et tes lieux : tu peux les anticiper au lieu de les subir.&quot;],[&quot;Que ça passe quand j&#x27;attends&quot;,&quot;C&#x27;est l&#x27;info la plus utile : une envie qui passe n&#x27;est pas un ordre.&quot;],[&quot;Rien de spécial&quot;,&quot;Pas grave, c&#x27;est une semaine d&#x27;observation. Continue : les effets arrivent avec la pratique.&quot;]]},[&quot;Fatigué, on décide mal&quot;,&quot;Fatigué, on prend de plus mauvaises décisions, financières notamment. Le sommeil protège le cortex préfrontal, celui qui freine.&quot;,&quot;Pas de pari après 22 h, jamais.&quot;]],[&quot;Comprendre l&#x27;envie de jouer&quot;,&quot;L&#x27;envie monte, atteint un pic, puis retombe, même si tu ne fais rien. L&#x27;espoir de gagner est puissant, mais il ne dure pas. Une envie n&#x27;est pas un ordre.&quot;,&quot;Quand l&#x27;envie arrive, attends 2 minutes avant d&#x27;agir. Où la sens-tu dans le corps ? Que devient-elle ?&quot;,&quot;wave&quot;,{},{&quot;q&quot;:&quot;Quand l&#x27;envie arrive, que fais-tu d&#x27;habitude ?&quot;,&quot;o&quot;:[[&quot;Je cède tout de suite&quot;,&quot;Normal : céder soulage vite, et c&#x27;est ce qui apprend au cerveau à recommencer. Aujourd&#x27;hui, repousse seulement de 10 minutes.&quot;],[&quot;Je lutte de toutes mes forces&quot;,&quot;Lutter épuise. Observe l&#x27;envie comme une vague : elle monte, plafonne, redescend. Laisse-la passer sans la combattre.&quot;],[&quot;Je me distrais&quot;,&quot;Très bien : 10 minutes de distraction suffisent souvent. Prépare-en deux à l&#x27;avance, à portée de main.&quot;],[&quot;Je ne sais pas&quot;,&quot;Aujourd&#x27;hui, note l&#x27;heure et ce que tu ressens quand elle vient. Un schéma va apparaître.&quot;]]},[&quot;Une vague&quot;,&quot;L&#x27;envie de jouer monte, plafonne puis redescend, même si on ne fait rien.&quot;,&quot;Chronomètre ta prochaine envie.&quot;]],[&quot;La règle des 24 heures&quot;,&quot;Ne dépose jamais le jour même. En te donnant 24 heures, tu laisses l&#x27;envie retomber, et tu décides à tête reposée.&quot;,&quot;Utilise le bouton SOS à chaque envie. Écris-toi : « Pas de dépôt avant demain ».&quot;,&quot;hold&quot;,{&quot;sec&quot;:24,&quot;t&quot;:&quot;Les 24 heures, version courte&quot;},{&quot;q&quot;:&quot;Peux-tu tenir 10 minutes avant de passer à l&#x27;acte ?&quot;,&quot;o&quot;:[[&quot;Oui, facilement&quot;,&quot;Alors fais-en une règle : la plupart des envies retombent avant 10 minutes.&quot;],[&quot;Oui, avec une distraction&quot;,&quot;Parfait. Prépare deux distractions : musique, verre d&#x27;eau, marche. Elles font la moitié du travail.&quot;],[&quot;Difficile&quot;,&quot;Commence par 2 minutes. Chaque envie traversée entraîne ton cerveau à tolérer l&#x27;inconfort.&quot;],[&quot;Impossible&quot;,&quot;Pas de souci : 1 minute compte déjà. Le bouton SOS te guide pendant 10 minutes, un souffle après l&#x27;autre.&quot;]]},[&quot;24 heures&quot;,&quot;Attendre 24 heures laisse l&#x27;excitation et le stress redescendre : on décide à tête reposée.&quot;,&quot;Écris : « pas de dépôt avant demain ».&quot;]],[&quot;Respirer pour retomber&quot;,&quot;Une respiration lente, avec un souffle plus long que l&#x27;inspiration, aide à calmer le corps en quelques minutes.&quot;,&quot;Fais 2 minutes de respiration (inspire 4 secondes, souffle 6) quand l&#x27;envie monte.&quot;,&quot;breathe&quot;,{},{&quot;q&quot;:&quot;Quand tu es tendu(e), ton souffle est plutôt…&quot;,&quot;o&quot;:[[&quot;Court et haut&quot;,&quot;Respirer haut met le corps en alerte. Allonge l&#x27;expiration : c&#x27;est le levier le plus rapide pour te calmer.&quot;],[&quot;Je le retiens parfois&quot;,&quot;Retenir son souffle augmente la tension. Souffle doucement par la bouche, comme dans une paille.&quot;],[&quot;Je n&#x27;y ai jamais fait attention&quot;,&quot;Pose une main sur le ventre : si elle ne bouge pas, ta respiration est haute. Essaie de la faire gonfler.&quot;],[&quot;Plutôt calme&quot;,&quot;Bien. Garde ce réflexe pour les moments d&#x27;envie, c&#x27;est là qu&#x27;il compte le plus.&quot;]]},[&quot;Le nerf vague&quot;,&quot;Respirer lentement stimule le nerf vague, qui ralentit le cœur et apaise.&quot;,&quot;Deux minutes de respiration avant d&#x27;ouvrir une appli.&quot;]],[&quot;« Je vais me refaire »&quot;,&quot;C&#x27;est la pensée la plus coûteuse. Chaque mise pour récupérer une perte rend la suivante plus lourde. Les mathématiques ne sont pas de ton côté.&quot;,&quot;Écris le montant que tu as déjà perdu et ce que tu aurais pu en faire. Relis-le quand l&#x27;envie de te refaire monte.&quot;,&quot;chase&quot;,{},{&quot;q&quot;:&quot;Pour t&#x27;occuper 10 minutes, tu préfères…&quot;,&quot;o&quot;:[[&quot;Bouger&quot;,&quot;Le mouvement réduit les envies et améliore l&#x27;humeur en quelques minutes.&quot;],[&quot;Parler à quelqu&#x27;un&quot;,&quot;Une voix humaine apaise plus vite qu&#x27;un écran ou un produit.&quot;],[&quot;Faire quelque chose de mes mains&quot;,&quot;Cuisine, dessin, rangement : occuper les mains occupe aussi l&#x27;attention, l&#x27;envie perd de la place.&quot;],[&quot;Rien ne me tente&quot;,&quot;Normal au début : l&#x27;envie rend tout fade. Essaie quand même 3 minutes, l&#x27;envie baisse avant que l&#x27;activité ne devienne agréable.&quot;]]},[&quot;Se refaire coûte plus&quot;,&quot;Après une perte, le cerveau cherche à la compenser (aversion à la perte). C&#x27;est l&#x27;une des erreurs de jugement les plus coûteuses.&quot;,&quot;Écris le montant déjà perdu, et relis-le au moment de « te refaire ».&quot;]],[&quot;Confier la gestion de ton argent&quot;,&quot;Moins tu as d&#x27;accès direct à l&#x27;argent, moins tu peux jouer sur un coup de tête. Demander de l&#x27;aide ici est une force.&quot;,&quot;Mets en place un virement automatique d&#x27;épargne le jour de la paie. Pense à confier un compte à un proche, ou à fixer un plafond de paiement.&quot;,null,{},{&quot;q&quot;:&quot;Quand tu es stressé(e), ton corps réagit surtout par…&quot;,&quot;o&quot;:[[&quot;De la tension (épaules, mâchoire)&quot;,&quot;Relâche : épaules vers le bas, mâchoire détendue, trois souffles lents.&quot;],[&quot;De la fatigue&quot;,&quot;La fatigue baisse le frein de la volonté. Une sieste de 15 à 20 minutes aide, sinon couche-toi plus tôt ce soir.&quot;],[&quot;De l&#x27;agitation&quot;,&quot;Marche rapide 5 minutes : elle dépense l&#x27;adrénaline en trop.&quot;],[&quot;Je ne sais pas&quot;,&quot;Scanne : tête, épaules, ventre, jambes. Où ça serre ? C&#x27;est là qu&#x27;il faut respirer.&quot;]]},[&quot;Le stress de l&#x27;argent&quot;,&quot;Les soucis d&#x27;argent maintiennent le corps en alerte (cortisol), ce qui donne envie d&#x27;un soulagement rapide.&quot;,&quot;Marche 10 minutes quand l&#x27;inquiétude monte.&quot;]],[&quot;Bonus, cotes et publicités&quot;,&quot;Bonus, cotes « boostées », notifications : ces outils sont conçus pour te faire jouer plus. Savoir comment ils fonctionnent aide à ne plus tomber dans le panneau.&quot;,&quot;Désactive toutes les notifications liées aux paris. Note la dernière promotion qui t&#x27;a fait craquer.&quot;,&quot;myths&quot;,{},{&quot;q&quot;:&quot;Quelle idée te retient le plus ?&quot;,&quot;o&quot;:[[&quot;J&#x27;en ai besoin pour me détendre ou dormir&quot;,&quot;Ça détend sur l&#x27;instant mais entretient le manque ensuite. À terme, la détente et le sommeil naturels reviennent.&quot;],[&quot;Je gère, ce n&#x27;est pas un problème&quot;,&quot;Si tu es ici, c&#x27;est que tu veux plus de contrôle. Fais confiance à ça.&quot;],[&quot;Tout le monde le fait&quot;,&quot;Beaucoup le font, et beaucoup changent aussi. Tu n&#x27;es pas seul(e) dans les deux cas.&quot;],[&quot;Juste une fois ne compte pas&quot;,&quot;Chaque fois renforce le circuit de l&#x27;habitude. L&#x27;exception est souvent la porte d&#x27;entrée.&quot;]]},[&quot;Les bonus sont un appât&quot;,&quot;Bonus et cotes « boostées » sont conçus pour prolonger le jeu. Les comprendre aide à ne plus tomber dans le panneau.&quot;,&quot;Note la dernière offre qui t&#x27;a fait jouer.&quot;]],[&quot;Bilan de la semaine 2&quot;,&quot;Tu as appris à voir l&#x27;envie venir, à l&#x27;attendre et à protéger ton argent. Chaque jour sans jouer compte.&quot;,&quot;Regarde ton compteur de jours sans jouer et d&#x27;envies surmontées. Note le moment le plus dur et ce qui t&#x27;a aidé.&quot;,null,{},{&quot;q&quot;:&quot;Ce qui t&#x27;a le plus aidé(e) cette semaine ?&quot;,&quot;o&quot;:[[&quot;Attendre 10 minutes&quot;,&quot;Garde-le : c&#x27;est ton outil principal. Il marche d&#x27;autant mieux qu&#x27;il est automatique.&quot;],[&quot;Respirer&quot;,&quot;La respiration est toujours avec toi. Utilise-la avant que l&#x27;envie ne soit à son maximum.&quot;],[&quot;Éloigner ce qui donne accès&quot;,&quot;Bien joué : réduire l&#x27;accès est l&#x27;une des méthodes les plus solides.&quot;],[&quot;Rien de précis&quot;,&quot;Pas grave. Regarde le bilan : tu as peut-être tenu plus que tu ne le penses.&quot;]]},[&quot;L&#x27;énergie du mouvement&quot;,&quot;L&#x27;activité physique libère des endorphines et fait baisser le stress, sans risque financier.&quot;,&quot;20 minutes de sport à l&#x27;heure où tu jouais.&quot;]],[&quot;Remplacer l&#x27;excitation&quot;,&quot;Le jeu comblait un besoin d&#x27;excitation ou d&#x27;évasion. Cherche d&#x27;autres sources : sport, défis, projets, rencontres.&quot;,&quot;Liste 5 activités qui te donnent de l&#x27;énergie ou du plaisir (sport, défi, loisir, sortie). Planifie-en une cette semaine.&quot;,null,{},{&quot;q&quot;:&quot;Quel remplaçant te semble le plus réaliste ?&quot;,&quot;o&quot;:[[&quot;Un geste (eau, étirements)&quot;,&quot;Les petits gestes sont faciles à répéter. Garde-les à portée de main.&quot;],[&quot;Une activité courte (marche, jeu)&quot;,&quot;Dix minutes suffisent souvent. Choisis-en une que tu peux faire n&#x27;importe où.&quot;],[&quot;Une personne (appel, message)&quot;,&quot;Un lien humain est l&#x27;un des meilleurs remplaçants. Mets 2 prénoms dans tes favoris.&quot;],[&quot;Je n&#x27;en ai pas encore&quot;,&quot;Essaie les trois cette semaine. Tu verras vite lequel marche pour toi.&quot;]]},[&quot;Une excitation saine&quot;,&quot;On peut retrouver de l&#x27;excitation par le sport, les défis ou les rencontres : l&#x27;adrénaline de l&#x27;effort est un bon substitut.&quot;,&quot;Planifie une activité qui te met au défi.&quot;]],[&quot;Bouger&quot;,&quot;Le mouvement change l&#x27;humeur et occupe les moments à risque. Pas besoin de sport intense : marcher compte.&quot;,&quot;Fais 20 minutes d&#x27;activité physique aujourd&#x27;hui, de préférence à l&#x27;heure où tu jouais.&quot;,&quot;move&quot;,{},{&quot;q&quot;:&quot;Ton niveau de mouvement dans une journée ?&quot;,&quot;o&quot;:[[&quot;Presque aucun&quot;,&quot;Commence par 5 minutes de marche : c&#x27;est déjà un effet mesurable sur l&#x27;humeur.&quot;],[&quot;Un peu&quot;,&quot;Ajoute 10 minutes à l&#x27;heure où l&#x27;envie est la plus forte.&quot;],[&quot;Régulier&quot;,&quot;Excellent. Place-le aux heures à risque : c&#x27;est là qu&#x27;il protège le plus.&quot;],[&quot;Beaucoup&quot;,&quot;Parfait. N&#x27;oublie pas le repos : il fait partie de la récupération.&quot;]]},[&quot;Bouger fait baisser l&#x27;envie&quot;,&quot;Marcher 10 à 15 minutes améliore souvent l&#x27;humeur et réduit l&#x27;envie sur le moment.&quot;,&quot;Une marche, sans téléphone.&quot;]],[&quot;Jours de match et soirées&quot;,&quot;Les gros événements sportifs et les soirées entre amis sont des moments à risque. Un plan évite de se retrouver coincé.&quot;,&quot;Regarde les 2 prochains événements sportifs importants. Décide à l&#x27;avance ce que tu feras : où tu regardes, avec qui, sans pari.&quot;,null,{},{&quot;q&quot;:&quot;Le plus dur dans tes week-ends, c&#x27;est…&quot;,&quot;o&quot;:[[&quot;Le temps libre&quot;,&quot;Prévois deux activités par jour : le vide appelle l&#x27;habitude.&quot;],[&quot;Les amis&quot;,&quot;Propose un lieu ou une activité sans l&#x27;habitude, ou dis-le d&#x27;avance. Les vrais amis comprennent.&quot;],[&quot;Le soir tard&quot;,&quot;Fixe une heure limite de coucher : la fatigue baisse les défenses.&quot;],[&quot;Rien de particulier&quot;,&quot;Prévois quand même un plan B, au cas où.&quot;]]},[&quot;Le direct amplifie&quot;,&quot;L&#x27;émotion du direct et le contexte social amplifient l&#x27;impulsivité. Un plan à l&#x27;avance protège.&quot;,&quot;Décide d&#x27;avance où tu regardes le match, sans pari.&quot;]],[&quot;En parler à quelqu&#x27;un&quot;,&quot;Cacher entretient la honte et les pertes. Parler à un proche de confiance, ou à Joueurs info service (09 74 75 13 13, gratuit et anonyme), allège.&quot;,&quot;Choisis une personne de confiance et dis-lui que tu arrêtes les paris. Ou appelle Joueurs info service.&quot;,null,{},{&quot;q&quot;:&quot;À qui pourrais-tu en parler ?&quot;,&quot;o&quot;:[[&quot;Un(e) ami(e)&quot;,&quot;Un ami de confiance suffit. Dis simplement : « j&#x27;essaie de changer, peux-tu me demander demain comment ça va ? »&quot;],[&quot;Un proche de la famille&quot;,&quot;Choisis la personne la plus calme et la moins critique. Un message écrit peut être plus facile.&quot;],[&quot;Un professionnel ou une ligne d&#x27;aide&quot;,&quot;Excellente idée : Joueurs info service (09 74 75 13 13) est là pour ça, gratuitement et sans jugement.&quot;],[&quot;Personne pour l&#x27;instant&quot;,&quot;C&#x27;est possible, et ce n&#x27;est pas grave. Une ligne d&#x27;aide (Joueurs info service (09 74 75 13 13)) peut être ton premier interlocuteur.&quot;]]},[&quot;Le secret pèse&quot;,&quot;Cacher le jeu entretient le stress et la honte, deux moteurs de l&#x27;envie.&quot;,&quot;Parle à une personne de confiance ou appelle le 09 74 75 13 13.&quot;]],[&quot;Les pensées-pièges&quot;,&quot;« Juste un petit pari », « j&#x27;ai un système », « j&#x27;étais proche ». Ces phrases sont normales. Les repérer leur enlève du pouvoir.&quot;,&quot;Écris 3 phrases que tu te dis avant de parier. À côté de chacune, une réponse honnête et courte.&quot;,&quot;pieges&quot;,{},{&quot;q&quot;:&quot;Quelle pensée te fait le plus craquer ?&quot;,&quot;o&quot;:[[&quot;« Juste une fois »&quot;,&quot;C&#x27;est le piège le plus courant. Réponse : « si c&#x27;est juste une fois, je peux attendre demain ».&quot;],[&quot;« Je l&#x27;ai bien mérité »&quot;,&quot;Oui, et tu peux te récompenser autrement : repas, film, sortie. Sans la facture.&quot;],[&quot;« Je m&#x27;y mets demain »&quot;,&quot;Demain sera pareil. Réponse : « je commence par les 10 prochaines minutes ».&quot;],[&quot;« J&#x27;ai déjà craqué, tant pis »&quot;,&quot;Un faux pas n&#x27;efface pas les jours passés. Reprends dès la prochaine heure.&quot;]]},[&quot;L&#x27;illusion de contrôle&quot;,&quot;Le cerveau croit pouvoir « lire » le hasard. Chaque tirage est pourtant indépendant, aucun système ne bat les maths.&quot;,&quot;Écris la pensée « j&#x27;ai un système » et sa réponse honnête.&quot;]],[&quot;Te récompenser autrement&quot;,&quot;Ton cerveau aime les petites récompenses. Tu peux en garder sans jouer : un bon repas, un loisir, un week-end avec l&#x27;argent économisé.&quot;,&quot;Choisis une récompense pour chaque semaine tenue. Calcule combien ça coûte, et compare à ce que tu aurais joué.&quot;,null,{},{&quot;q&quot;:&quot;Quelle récompense te ferait vraiment plaisir ?&quot;,&quot;o&quot;:[[&quot;Un bon repas&quot;,&quot;Parfait : choisis le jour et le lieu à l&#x27;avance, une récompense prévue motive mieux qu&#x27;une récompense improvisée.&quot;],[&quot;Une sortie&quot;,&quot;Planifie-la dans ton agenda dès aujourd&#x27;hui : l&#x27;avoir devant soi aide à tenir.&quot;],[&quot;Un achat&quot;,&quot;Mets de côté la somme économisée dans une enveloppe : la voir grossir motive.&quot;],[&quot;Du repos&quot;,&quot;Le repos est une vraie récompense. Offre-toi une soirée sans obligation.&quot;]]},[&quot;La récompense prévue&quot;,&quot;Une récompense choisie à l&#x27;avance renforce un nouveau comportement mieux qu&#x27;une récompense improvisée.&quot;,&quot;Choisis ta récompense de la semaine, financée par l&#x27;argent non joué.&quot;]],[&quot;Bilan de la semaine 3&quot;,&quot;Trois semaines de pratique. Regarde ce qui a changé : l&#x27;argent, le stress, le sommeil, l&#x27;humeur.&quot;,&quot;Écris 3 changements que tu constates, même petits.&quot;,null,{},{&quot;q&quot;:&quot;Ce qui a changé depuis le début ?&quot;,&quot;o&quot;:[[&quot;Mon sommeil&quot;,&quot;Un meilleur sommeil réduit l&#x27;impulsivité : c&#x27;est un cercle vertueux qui s&#x27;installe.&quot;],[&quot;Mon humeur&quot;,&quot;Chaque jour, le cerveau se rééquilibre un peu. L&#x27;humeur suit souvent avec un décalage.&quot;],[&quot;Mon argent&quot;,&quot;Note la somme : c&#x27;est un des gains les plus concrets.&quot;],[&quot;Pas encore grand-chose&quot;,&quot;Normal : les changements sont souvent lents au début. Continue, ils arrivent avec la régularité.&quot;]]},[&quot;Le sommeil répare&quot;,&quot;Un sommeil régulier améliore l&#x27;humeur et le contrôle des impulsions.&quot;,&quot;Couche-toi à heure fixe ce soir.&quot;]],[&quot;Un dérapage n&#x27;est pas une rechute&quot;,&quot;Si tu craques, arrête immédiatement et ne cherche surtout pas à te refaire. Ce n&#x27;est pas un échec, c&#x27;est une information. Reprends le fil dès que possible.&quot;,&quot;Écris ce que tu feras si tu as joué : arrêter, ne rien redéposer, le dire à quelqu&#x27;un. Une phrase bienveillante pour reprendre.&quot;,&quot;scenario&quot;,{},{&quot;q&quot;:&quot;Si tu craques ce soir, tu te diras…&quot;,&quot;o&quot;:[[&quot;« Je suis nul(le) »&quot;,&quot;La honte nourrit le cycle. Parle-toi comme à un ami : « ça arrive, je reprends ».&quot;],[&quot;« C&#x27;est une information »&quot;,&quot;Exactement. Note ce qui l&#x27;a déclenché et ajuste ton plan.&quot;],[&quot;« Autant tout lâcher »&quot;,&quot;C&#x27;est l&#x27;effet « tant pis », le vrai piège. Reprends au prochain repas, pas à la prochaine semaine.&quot;],[&quot;« Je préviens quelqu&#x27;un »&quot;,&quot;Excellent réflexe : ça casse l&#x27;isolement et la honte.&quot;]]},[&quot;Un faux pas, pas une chute&quot;,&quot;Un dérapage ne défait pas les circuits déjà en place. S&#x27;arrêter tout de suite compte, ne pas se « refaire ».&quot;,&quot;Écris : « si je joue, j&#x27;arrête et je ne redépose rien ».&quot;]],[&quot;Ton plan en cas de rechute&quot;,&quot;Prévoir le plan B enlève la peur. Qu&#x27;est-ce qui m&#x27;a fait craquer ? Qu&#x27;est-ce que je change ? Qui je préviens ?&quot;,&quot;Rédige un plan en 3 points : ce que je fais dans l&#x27;heure (arrêter, geler les paiements, appeler quelqu&#x27;un), ce que j&#x27;analyse, ce que j&#x27;ajuste.&quot;,&quot;relapse&quot;,{},{&quot;q&quot;:&quot;En cas de rechute, ce qui t&#x27;aiderait le plus ?&quot;,&quot;o&quot;:[[&quot;Un message tout prêt&quot;,&quot;Écris-le maintenant, il sera là quand tu en auras besoin. Tu n&#x27;auras plus qu&#x27;à l&#x27;envoyer.&quot;],[&quot;Quelqu&#x27;un à appeler&quot;,&quot;Choisis la personne et enregistre son numéro en favori.&quot;],[&quot;Une règle simple&quot;,&quot;Par exemple : « je m&#x27;arrête là, je bois de l&#x27;eau, je reprends demain ».&quot;],[&quot;Je préfère ne pas y penser&quot;,&quot;C&#x27;est compréhensible, mais prévoir réduit la peur. Ça prend 2 minutes et tu seras plus serein(e).&quot;]]},[&quot;Anticiper apaise&quot;,&quot;Prévoir ce qu&#x27;on fera en cas de craquage réduit la panique et l&#x27;effet « tant pis ».&quot;,&quot;Relis ton plan B ce soir.&quot;]],[&quot;Faire face aux dettes&quot;,&quot;Si tu as des dettes, les regarder en face est difficile, et c&#x27;est ce qui permet d&#x27;avancer. Il existe des conseillers gratuits pour t&#x27;aider à faire un plan.&quot;,&quot;Liste tes dettes et leurs montants. Renseigne-toi sur un Point Conseil Budget près de chez toi, gratuit.&quot;,null,{},{&quot;q&quot;:&quot;Dans 6 mois, tu aimerais être quelqu&#x27;un qui…&quot;,&quot;o&quot;:[[&quot;Dort bien&quot;,&quot;Un objectif concret : les nuits s&#x27;améliorent souvent dès les premières semaines.&quot;],[&quot;Tient ses engagements&quot;,&quot;Chaque petit engagement tenu renforce la confiance en toi.&quot;],[&quot;A de l&#x27;énergie&quot;,&quot;L&#x27;énergie revient avec le sommeil, le mouvement et moins d&#x27;à-coups.&quot;],[&quot;Se sent libre&quot;,&quot;La liberté, c&#x27;est choisir. Chaque envie traversée est un choix de plus.&quot;]]},[&quot;L&#x27;anxiété des dettes&quot;,&quot;L&#x27;angoisse des dettes active la réponse de stress. Faire un plan concret et demander de l&#x27;aide la fait redescendre.&quot;,&quot;Note ce que tu dois et appelle un Point Conseil Budget.&quot;]],[&quot;Les moments à risque à venir&quot;,&quot;Jour de paie, grands tournois, fêtes, périodes de stress : certains moments vont remettre le jeu en jeu. Les prévoir, c&#x27;est déjà y être préparé.&quot;,&quot;Liste les 3 prochains moments à risque des 4 semaines à venir et ce que tu feras à chaque fois.&quot;,null,{},{&quot;q&quot;:&quot;Ton prochain moment à risque, c&#x27;est…&quot;,&quot;o&quot;:[[&quot;Un week-end&quot;,&quot;Prévois deux activités par jour et une heure de coucher.&quot;],[&quot;Une fête ou un événement&quot;,&quot;Décide à l&#x27;avance ce que tu fais et à quelle heure tu pars.&quot;],[&quot;Une période de stress&quot;,&quot;Planifie des pauses et du mouvement. Le stress est un déclencheur majeur.&quot;],[&quot;Je ne sais pas&quot;,&quot;Regarde ton agenda des 2 semaines à venir : tu en verras un ou deux.&quot;]]},[&quot;Le contexte déclenche&quot;,&quot;Un jour de paie, un match, un salon : le cerveau associe ces moments au jeu. Les repérer permet de s&#x27;y préparer.&quot;,&quot;Note les 3 prochaines dates à risque.&quot;]],[&quot;Mieux dormir&quot;,&quot;Le stress et les nuits courtes fragilisent. Dormir mieux rend les envies plus faciles à gérer.&quot;,&quot;Fixe une heure de coucher. Téléphone hors du lit ce soir. Prévois une activité calme avant de dormir.&quot;,&quot;evening&quot;,{},{&quot;q&quot;:&quot;Tes nuits en ce moment ?&quot;,&quot;o&quot;:[[&quot;Courtes&quot;,&quot;Une nuit courte renforce l&#x27;envie et réduit le contrôle. Couche-toi 30 minutes plus tôt ce soir.&quot;],[&quot;Agitées&quot;,&quot;Écrans coupés 30 minutes avant, chambre fraîche (18-19 °C) et dîner léger aident.&quot;],[&quot;Correctes&quot;,&quot;Bien. Garde un horaire régulier : c&#x27;est ça qui consolide.&quot;],[&quot;Très bonnes&quot;,&quot;Parfait. Protège-les : c&#x27;est un de tes meilleurs alliés.&quot;]]},[&quot;Dormir, c&#x27;est se protéger&quot;,&quot;Le manque de sommeil augmente l&#x27;attrait pour la prise de risque. Dormir mieux rend les envies plus faciles à gérer.&quot;,&quot;Fixe une heure de coucher.&quot;]],[&quot;L&#x27;argent que tu récupères&quot;,&quot;Cet argent est ton vrai gain. Le chiffrer le rend concret et motive.&quot;,&quot;Reprends ton chiffre du jour 2. Divise-le par 3 pour avoir un montant par mois. Écris ce que tu veux faire avec cet argent.&quot;,null,{},{&quot;q&quot;:&quot;Le temps ou l&#x27;argent récupéré, tu en feras…&quot;,&quot;o&quot;:[[&quot;Du repos&quot;,&quot;Le repos compte aussi. Planifie-le au lieu de le subir.&quot;],[&quot;Un projet&quot;,&quot;Choisis un petit projet de 30 minutes par jour : c&#x27;est ce qui remplit le vide.&quot;],[&quot;Du temps avec des proches&quot;,&quot;Les liens sont l&#x27;un des meilleurs soutiens pour tenir.&quot;],[&quot;Un plaisir ou de l&#x27;épargne&quot;,&quot;Mets une somme de côté chaque semaine : la voir grossir motive.&quot;]]},[&quot;L&#x27;argent regagné&quot;,&quot;Chaque euro non joué est un euro tangible. Le voir s&#x27;accumuler renforce la motivation.&quot;,&quot;Fais un virement automatique le jour de la paie.&quot;]],[&quot;Ton réseau d&#x27;aide&quot;,&quot;Si tu n&#x27;y arrives pas seul, ou si tu es endetté, en parler à un professionnel est une bonne idée. Ce n&#x27;est pas un échec : Joueurs info service (09 74 75 13 13), ton médecin, un centre d&#x27;addictologie (CSAPA).&quot;,&quot;Note le numéro de Joueurs info service et le nom d&#x27;un médecin à qui t&#x27;adresser. Si tu vas mal, le 3114 répond 24h/24.&quot;,null,{},{&quot;q&quot;:&quot;Qui est ton premier appel en cas de coup dur ?&quot;,&quot;o&quot;:[[&quot;Un(e) ami(e)&quot;,&quot;Garde son numéro en favori. Dis-lui d&#x27;avance qu&#x27;il peut t&#x27;aider.&quot;],[&quot;Un proche de la famille&quot;,&quot;Préviens-le à l&#x27;avance : il saura quoi répondre quand ça arrivera.&quot;],[&quot;Un professionnel&quot;,&quot;Joueurs info service (09 74 75 13 13) est joignable. Note le numéro dans ton téléphone.&quot;],[&quot;Je n&#x27;ai pas de nom&quot;,&quot;Alors Joueurs info service (09 74 75 13 13) peut être ce nom. C&#x27;est gratuit, tu n&#x27;as pas à te justifier.&quot;]]},[&quot;Le lien protège&quot;,&quot;Des liens sociaux de qualité sont associés à une meilleure santé et à de meilleures chances de tenir un changement.&quot;,&quot;Note le 09 74 75 13 13 et un nom de confiance.&quot;]],[&quot;Lettre à toi-même&quot;,&quot;Ce que tu as fait pendant 30 jours mérite d&#x27;être écrit. Cette lettre te servira les jours où tu auras oublié pourquoi c&#x27;était important.&quot;,&quot;Écris-toi une lettre pour dans 3 mois : ce que tu as appris, ce que tu veux avoir gardé, ce que tu te souhaites.&quot;,&quot;letter&quot;,{},{&quot;q&quot;:&quot;Pour toi dans 3 mois, le plus important à te rappeler ?&quot;,&quot;o&quot;:[[&quot;Ce que j&#x27;ai tenu&quot;,&quot;Écris-le : les chiffres sont des preuves quand le doute revient.&quot;],[&quot;Pourquoi j&#x27;ai commencé&quot;,&quot;Relis ton pourquoi du premier jour. Il est dans ton espace.&quot;],[&quot;Que ça passe&quot;,&quot;Oui : une envie passe toujours. C&#x27;est ta meilleure information.&quot;],[&quot;Que je mérite d&#x27;aller bien&quot;,&quot;C&#x27;est vrai. Écris-le comme si tu parlais à un ami.&quot;]]},[&quot;Écrire aide&quot;,&quot;Écrire ce qu&#x27;on ressent aide à réguler les émotions, c&#x27;est ce qu&#x27;on appelle l&#x27;écriture expressive.&quot;,&quot;Écris 5 minutes, sans te relire.&quot;]],[&quot;Et maintenant ?&quot;,&quot;30 jours, c&#x27;est un début, pas une fin. Garde les barrières qui ont marché, et refais le point une fois par mois. Ne remets jamais le jeu « juste pour voir ».&quot;,&quot;Choisis les 3 règles à garder. Plante un rappel mensuel dans ton agenda.&quot;,&quot;final&quot;,{},{&quot;q&quot;:&quot;Pour la suite, tu comptes…&quot;,&quot;o&quot;:[[&quot;Continuer chaque jour&quot;,&quot;Excellent. La régularité fait plus que l&#x27;intensité.&quot;],[&quot;Faire un point par semaine&quot;,&quot;Très bien : un point de 10 minutes le dimanche suffit.&quot;],[&quot;Appeler en cas de doute&quot;,&quot;Joueurs info service (09 74 75 13 13) est là. Un coup de fil évite souvent une rechute.&quot;],[&quot;Je ne sais pas encore&quot;,&quot;Pas de pression. Garde juste la règle : au moindre doute, 10 minutes d&#x27;attente et un souffle lent.&quot;]]},[&quot;Garder le cap&quot;,&quot;Les rechutes sont fréquentes dans tout changement de comportement ; ce qui compte, c&#x27;est de reprendre vite.&quot;,&quot;Garde l&#x27;interdiction volontaire de jeux si tu l&#x27;as demandée.&quot;]]]},&quot;vape-tabac&quot;:{&quot;kit&quot;:{&quot;raisons&quot;:[&quot;Retrouver mon souffle&quot;,&quot;Ma santé&quot;,&quot;L&#x27;argent économisé&quot;,&quot;Faire du sport&quot;,&quot;Être un exemple pour mes proches&quot;,&quot;Ne plus dépendre d&#x27;un produit&quot;,&quot;Mieux dormir&quot;,&quot;Retrouver le goût et l&#x27;odorat&quot;,&quot;Avoir plus d&#x27;énergie&quot;,&quot;Me sentir libre&quot;],&quot;pros&quot;:[&quot;Me détendre&quot;,&quot;Une pause&quot;,&quot;Un rituel social&quot;,&quot;Gérer le stress&quot;,&quot;Me concentrer&quot;,&quot;Mes habitudes du café&quot;],&quot;cons&quot;:[&quot;Je manque de souffle&quot;,&quot;Ça coûte cher&quot;,&quot;Je dépends de la nicotine&quot;,&quot;Je tousse&quot;,&quot;Je suis irritable quand j&#x27;en manque&quot;,&quot;Je m&#x27;inquiète pour ma santé&quot;,&quot;Je dors moins bien&quot;,&quot;Ça me prend du temps&quot;],&quot;calc&quot;:{&quot;q&quot;:&quot;Combien dépenses-tu par semaine ?&quot;,&quot;unit&quot;:&quot;€ par semaine&quot;,&quot;min&quot;:0,&quot;max&quot;:150,&quot;step&quot;:1,&quot;def&quot;:30,&quot;mult&quot;:52,&quot;out&quot;:&quot;€ par an&quot;,&quot;div&quot;:0,&quot;divLabel&quot;:&quot;&quot;,&quot;eq&quot;:[60,&quot;bons restaurants&quot;],&quot;gain&quot;:&quot;économisés chaque année&quot;},&quot;env&quot;:[&quot;Choisir mon jour d&#x27;arrêt&quot;,&quot;Parler à mon pharmacien ou à mon médecin&quot;,&quot;Jeter ou donner mon matériel&quot;,&quot;Nettoyer ma voiture et mon logement&quot;,&quot;Préparer chewing-gums et collations&quot;,&quot;Prévenir mes proches&quot;],&quot;triggers&quot;:[&quot;Le café&quot;,&quot;Après le repas&quot;,&quot;Une pause au travail&quot;,&quot;En soirée&quot;,&quot;Avec de l&#x27;alcool&quot;,&quot;Le stress&quot;,&quot;Dans la voiture&quot;,&quot;L&#x27;ennui&quot;,&quot;Avec des amis qui fument&quot;,&quot;Au réveil&quot;],&quot;actions&quot;:[&quot;Boire un grand verre d&#x27;eau&quot;,&quot;Mâcher un chewing-gum&quot;,&quot;Respirer lentement&quot;,&quot;Marcher 5 minutes&quot;,&quot;Me brosser les dents&quot;,&quot;Appeler un ami&quot;,&quot;Croquer une carotte&quot;,&quot;Faire les 4 D&quot;,&quot;Changer de pièce&quot;,&quot;Écrire ce que je ressens&quot;],&quot;distract&quot;:[&quot;Un collègue sort fumer&quot;,&quot;L&#x27;odeur d&#x27;une cigarette&quot;,&quot;Pause café&quot;,&quot;Un ami propose une bouffée&quot;,&quot;Une publicité de vape&quot;,&quot;Fin de repas&quot;],&quot;myths&quot;:[[&quot;Une bouffée après l&#x27;arrêt ne change rien.&quot;,false,&quot;Elle relance souvent la dépendance. Mieux vaut t&#x27;arrêter tout de suite.&quot;],[&quot;La détente après u e café au travail. Ton collègue sort fumer comme d&#x27;habitude.&quot;,&quot;c&quot;:[[&quot;Je sors avec lui, sans fumer&quot;,1,&quot;Possible, mais tu restes exposé à l&#x27;envie. Mieux vaut changer de routine.&quot;],[&quot;Je bois mon café debout, ailleurs, avec un chewing-gum&quot;,2,&quot;Tu gardes la pause et tu changes le geste. Bien joué.&quot;],[&quot;Je prends juste une bouffée&quot;,0,&quot;Une bouffée relance la dépendance.&quot;]]},{&quot;q&quot;:&quot;En soirée, après quelques verres, un ami te propose une cigarette.&quot;,&quot;c&quot;:[[&quot;Je refuse en disant « non merci, j&#x27;arrête »&quot;,2,&quot;Simple, clair, tu n&#x27;as pas à te justifier.&quot;],[&quot;J&#x27;accepte, c&#x27;est la fête&quot;,0,&quot;L&#x27;alcool et la fête sont les moments les plus risqués. Prévois ton plan à l&#x27;avance.&quot;],[&quot;Je m&#x27;éloigne sans rien dire&quot;,1,&quot;Ça protège, mais n&#x27;hésite pas à expliquer ta décision.&quot;]]},{&quot;q&quot;:&quot;Jour 3 sans nicotine : tu es irritable et l&#x27;envie est très forte.&quot;,&quot;c&quot;:[[&quot;Je lance les 4 D : délai, distraction, eau, respiration&quot;,2,&quot;Tu appliques une méthode qui marche et tu laisses passer l&#x27;envie.&quot;],[&quot;Je me dis que c&#x27;est trop dur et j&#x27;abandonne&quot;,0,&quot;Les premiers jours sont souvent les plus intenses. Ça passe. Appelle le 39 89 si besoin.&quot;],[&quot;Je me promets d&#x27;arrêter demain&quot;,0,&quot;Le « demain » repousse l&#x27;arrêt. Tu es déjà dedans.&quot;]]}],&quot;relapse&quot;:{&quot;heure&quot;:[&quot;Je m&#x27;arrête là et je jette ce qu&#x27;il reste&quot;,&quot;Je bois un verre d&#x27;eau et je sors prendre l&#x27;air&quot;,&quot;J&#x27;appelle le 39 89 ou un proche&quot;],&quot;ajuster&quot;:[&quot;Je demande des substituts à mon pharmacien&quot;,&quot;Je change mes routines du café&quot;,&quot;Je prends rendez-vous avec mon médecin&quot;],&quot;prevenir&quot;:[&quot;Un ami proche&quot;,&quot;Mon frère ou ma sœur&quot;,&quot;Mon conjoint ou ma conjointe&quot;,&quot;Un professionnel&quot;,&quot;Personne, je gère seul&quot;]},&quot;events&quot;:[&quot;Soirée avec alcool&quot;,&quot;Pause café&quot;,&quot;Période de stress&quot;,&quot;Repas de famille&quot;,&quot;Vacances&quot;,&quot;Dispute&quot;],&quot;messages&quot;:[&quot;J&#x27;arrête la cigarette ou la vape. Peux-tu me soutenir cette semaine ?&quot;,&quot;Peux-tu éviter de m&#x27;en proposer ? Ça m&#x27;aiderait beaucoup.&quot;],&quot;rules&quot;:[&quot;Garder mes barrières en place&quot;,&quot;Utiliser le bouton SOS à chaque envie&quot;,&quot;Prévoir mes moments à risque&quot;,&quot;Parler à quelqu&#x27;un quand c&#x27;est dur&quot;,&quot;Bouger régulièrement&quot;,&quot;Bien dormir&quot;,&quot;Me récompenser autrement&quot;,&quot;Faire un point chaque mois&quot;,&quot;Aucune bouffée, jamais&quot;,&quot;Appeler le 39 89 si ça devient dur&quot;],&quot;identite&quot;:[&quot;qui décide de son temps&quot;,&quot;qui tient ses engagements&quot;,&quot;qui prend soin de lui&quot;,&quot;qui sait demander de l&#x27;aide&quot;,&quot;qui ose dire non&quot;,&quot;qui se réveille avec de l&#x27;énergie&quot;,&quot;qui choisit ses soirées&quot;,&quot;qui protège son argent&quot;,&quot;qui est présent avec ses proches&quot;,&quot;qui avance sur ses projets&quot;,&quot;qui se respecte&quot;,&quot;qui ne se juge plus durement&quot;],&quot;rewards&quot;:[&quot;Un bon repas au restaurant&quot;,&quot;Une sortie au cinéma&quot;,&quot;Un week-end dans la nature&quot;,&quot;Un vêtement qui me plaît&quot;,&quot;Un moment avec un ami&quot;,&quot;Une journée sans rien faire&quot;,&quot;Un livre ou un jeu&quot;,&quot;Un hammam ou un massage&quot;,&quot;Un petit voyage&quot;,&quot;Un cadeau pour quelqu&#x27;un&quot;],&quot;evening&quot;:[&quot;Fixer l&#x27;heure du coucher&quot;,&quot;Téléphone hors du lit&quot;,&quot;Écrans éteints 30 minutes avant&quot;,&quot;Douche ou tisane&quot;,&quot;Préparer la journée de demain&quot;,&quot;Respirer 2 minutes&quot;],&quot;people&quot;:[&quot;Un ami proche&quot;,&quot;Mon frère ou ma sœur&quot;,&quot;Mon conjoint ou ma conjointe&quot;,&quot;Un parent&quot;,&quot;Un collègue de confiance&quot;,&quot;Mon médecin&quot;],&quot;pause&quot;:[&quot;Lève-toi et étire-toi&quot;,&quot;Bois un verre d&#x27;eau, lentement&quot;,&quot;Regarde loin, par la fenêtre&quot;,&quot;Respire lentement 5 fois&quot;,&quot;Note ce que tu ressens, en une phrase&quot;],&quot;method&quot;:[&quot;Patch nicotinique&quot;,&quot;Gommes ou pastilles&quot;,&quot;Rendez-vous avec mon pharmacien&quot;,&quot;Rendez-vous avec mon médecin&quot;,&quot;Appeler Tabac info service (39 89)&quot;,&quot;Sans substitut, avec mon plan&quot;],&quot;veille&quot;:[&quot;Relire mon pourquoi&quot;,&quot;Jeter ou donner mon matériel&quot;,&quot;Préparer chewing-gums, eau et collations&quot;,&quot;Prévenir 2 personnes&quot;,&quot;Fixer mon heure de coucher&quot;,&quot;Choisir mon premier geste de remplacement&quot;],&quot;geste&quot;:[&quot;Chewing-gum&quot;,&quot;Cure-dent&quot;,&quot;Verre d&#x27;eau&quot;,&quot;Bâtonnet de cannelle&quot;,&quot;Balle antistress&quot;,&quot;Crayon dans les doigts&quot;],&quot;snacks&quot;:[&quot;Fruits&quot;,&quot;Carottes&quot;,&quot;Noix&quot;,&quot;Yaourt&quot;,&quot;Pommes&quot;,&quot;Tisane&quot;],&quot;timeline&quot;:[[&quot;20 minutes&quot;,&quot;La fréquence cardiaque et la tension commencent à redescendre.&quot;],[&quot;24 heures&quot;,&quot;Le monoxyde de carbone quitte progressivement le sang.&quot;],[&quot;2 à 3 jours&quot;,&quot;Le goût et l&#x27;odorat reviennent peu à peu.&quot;],[&quot;2 à 4 semaines&quot;,&quot;Beaucoup de personnes respirent plus facilement et toussent moins.&quot;],[&quot;1 à 3 mois&quot;,&quot;Le souffle et l&#x27;énergie s&#x27;améliorent souvent nettement.&quot;],[&quot;1 an&quot;,&quot;Le risque de maladie cardiaque diminue fortement par rapport à un fumeur.&quot;]]},&quot;days&quot;:[[&quot;Ton pourquoi&quot;,&quot;Avant d&#x27;arrêter, sache pour quoi tu le fais : la santé, le souffle, l&#x27;argent, le sport, la liberté. Ce pourquoi sera ta réserve les jours difficiles.&quot;,&quot;Écris 3 raisons personnelles d&#x27;arrêter. Garde-les en note sur ton écran de verrouillage.&quot;,&quot;choose&quot;,{},{&quot;q&quot;:&quot;Qu&#x27;est-ce qui te pousse à changer aujourd&#x27;hui ?&quot;,&quot;o&quot;:[[&quot;Ma santé&quot;,&quot;Excellent moteur. Le corps commence à récupérer très tôt : chaque jour compte déjà, même si tu ne le sens pas encore.&quot;],[&quot;Mon argent&quot;,&quot;Chiffrer l&#x27;argent regagné est l&#x27;un des meilleurs rappels les jours difficiles. On le fera dans quelques jours.&quot;],[&quot;Mes proches&quot;,&quot;Faire ça pour les autres aide, mais garde aussi une raison rien que pour toi : c&#x27;est elle qui tient quand personne ne regarde.&quot;],[&quot;Je me sens dépassé(e)&quot;,&quot;C&#x27;est une raison valable. Tu n&#x27;as pas à tout régler aujourd&#x27;hui : un seul petit pas suffit pour commencer.&quot;]]},[&quot;10 à 20 secondes&quot;,&quot;En fumant, la nicotine atteint le cerveau en quelques secondes. C&#x27;est ce qui rend le réflexe « geste + récompense » si puissant.&quot;,&quot;Repère à quel moment le geste précède l&#x27;envie.&quot;]],[&quot;Ta consommation réelle&quot;,&quot;On sous-estime presque toujours. Savoir exactement combien tu consommes, c&#x27;est un point de départ réel. Pour la vape, compte aussi la quantité de nicotine.&quot;,&quot;Pendant 3 jours, note chaque cigarette ou chaque session de vape : l&#x27;heure, le lieu, ce qui se passe juste avant. Aujourd&#x27;hui, estime ta consommation habituelle.&quot;,&quot;calc&quot;,{},{&quot;q&quot;:&quot;Ton estimation de ta semaine dernière, elle est…&quot;,&quot;o&quot;:[[&quot;Plutôt juste&quot;,&quot;C&#x27;est rare : la plupart des gens sous-estiment. Vérifie quand même avec les vrais chiffres ce soir.&quot;],[&quot;Sûrement en dessous de la réalité&quot;,&quot;C&#x27;est le cas de presque tout le monde : le cerveau oublie les automatismes. Mesurer sans te juger, c&#x27;est tout ce qu&#x27;on te demande.&quot;],[&quot;Je n&#x27;ose pas regarder&quot;,&quot;Normal : voir le chiffre pique un peu. C&#x27;est pourtant ce qui permet de reprendre la main. Regarde-le comme un simple relevé.&quot;],[&quot;Je n&#x27;en ai aucune idée&quot;,&quot;Alors note pendant 3 jours, une ligne à chaque fois. Les automatismes se voient dès qu&#x27;on les écrit.&quot;]]},[&quot;La nicotine reste environ 2 heures&quot;,&quot;La nicotine met environ 2 heures à diminuer de moitié dans le sang : le manque revient par vagues tout au long de la journée.&quot;,&quot;Note l&#x27;heure de tes envies : elles reviennent en rythme.&quot;]],[&quot;Ce que ça t&#x27;apporte, ce que ça te coûte&quot;,&quot;La détente ressentie après une bouffée est souvent la fin du manque de nicotine. Le comprendre aide à voir le piège. Ça coûte aussi du souffle, de l&#x27;argent et du temps.&quot;,&quot;Fais deux colonnes : ce que ça t&#x27;apporte / ce que ça te coûte (argent, souffle, santé). Souligne ce qui pèse le plus.&quot;,null,{},{&quot;q&quot;:&quot;Qu&#x27;est-ce que ça t&#x27;apporte de fumer ou vapoter ?&quot;,&quot;o&quot;:[[&quot;Me détendre&quot;,&quot;La détente est réelle mais courte : elle soulage surtout le manque que l&#x27;habitude crée. Respiration lente, marche ou douche chaude donnent un calme plus durable.&quot;],[&quot;Ne plus penser à rien&quot;,&quot;C&#x27;est un vrai besoin : ton cerveau veut une pause. Une vraie pause (marche, étirements) repose mieux et ne laisse pas de culpabilité.&quot;],[&quot;Me sentir moins seul(e)&quot;,&quot;Besoin légitime. Un message ou un appel, même court, y répond mieux et plus longtemps.&quot;],[&quot;Du plaisir, tout simplement&quot;,&quot;Le plaisir compte. L&#x27;idée n&#x27;est pas de t&#x27;en priver mais de le retrouver ailleurs : dans quelques jours tu choisiras tes remplaçants.&quot;]]},[&quot;Le calme est un soulagement&quot;,&quot;La détente ressentie après une cigarette vient surtout du soulagement du manque que la nicotine a créé.&quot;,&quot;Note comment tu te sens 10 minutes après.&quot;]],[&quot;Tes déclencheurs&quot;,&quot;Café, pause, après le repas, soirée, alcool, stress, voiture : ce sont des déclencheurs. Quand tu les repères, tu les vois venir.&quot;,&quot;Note tes 5 moments de la journée où l&#x27;envie est la plus forte.&quot;,&quot;heat&quot;,{},{&quot;q&quot;:&quot;Quand l&#x27;envie est-elle la plus forte ?&quot;,&quot;o&quot;:[[&quot;Le soir, seul(e)&quot;,&quot;Fatigue et solitude : le soir, le cerveau freine moins bien. Prévois quelque chose de précis pour ces heures-là.&quot;],[&quot;Quand je m&#x27;ennuie&quot;,&quot;L&#x27;ennui est un déclencheur très fréquent. Il retombe en quelques minutes si on ne le fuit pas : prépare une action de 5 minutes.&quot;],[&quot;Quand je suis stressé(e)&quot;,&quot;Le stress donne envie d&#x27;un soulagement rapide. Un souffle plus long à l&#x27;expiration (4 s / 6 s) calme le corps en 2 minutes.&quot;],[&quot;Avec d&#x27;autres personnes&quot;,&quot;Le contexte social pèse beaucoup. Dire à une personne que tu changes suffit souvent à désamorcer.&quot;]]},[&quot;Le cerveau associe&quot;,&quot;Café, repas, alcool : le cerveau associe ces moments à la nicotine. Changer l&#x27;ordre ou le lieu défait l&#x27;association.&quot;,&quot;Bois ton café debout, dans une autre pièce.&quot;]],[&quot;Choisir ta méthode et ta date&quot;,&quot;Beaucoup de personnes arrêtent avec de l&#x27;aide : substituts nicotiniques (patchs, gommes), accompagnement d&#x27;un tabacologue, ton médecin. Demande conseil à ton pharmacien ou ton médecin, ou appelle Tabac info service (39 89).&quot;,&quot;Choisis ton jour d&#x27;arrêt, dans 3 jours. Parle à ton pharmacien ou ton médecin de ce qui peut t&#x27;aider.&quot;,&quot;toolbox&quot;,{&quot;src&quot;:&quot;method&quot;,&quot;min&quot;:1,&quot;max&quot;:3,&quot;t&quot;:&quot;Choisis ta méthode&quot;,&quot;i&quot;:&quot;Touche jusqu&#x27;à 3 aides qui te conviennent. Tu peux en parler à ton pharmacien ou au 39 89.&quot;},{&quot;q&quot;:&quot;Quelle barrière poses-tu en premier ?&quot;,&quot;o&quot;:[[&quot;Supprimer l&#x27;accès&quot;,&quot;Chaque étape en plus fait baisser le passage à l&#x27;acte : un obstacle de 20 secondes laisse souvent l&#x27;envie retomber.&quot;],[&quot;Changer de lieu ou d&#x27;horaire&quot;,&quot;Les habitudes sont liées à des lieux et des heures. Change l&#x27;un des deux et l&#x27;automatisme perd son déclencheur.&quot;],[&quot;Prévenir quelqu&#x27;un&quot;,&quot;Dire ton objectif à voix haute le rend plus réel et te donne un témoin bienveillant.&quot;],[&quot;Aucune, c&#x27;est trop dur&quot;,&quot;Prends la plus petite, une seule. Une barrière imparfaite vaut mieux qu&#x27;un plan parfait jamais appliqué.&quot;]]},[&quot;Les substituts aident&quot;,&quot;Patchs, gommes et pastilles augmentent nettement les chances d&#x27;arrêter, surtout avec un accompagnement. Demande à ton pharmacien.&quot;,&quot;Appelle Tabac info service : 39 89, gratuit.&quot;]],[&quot;Préparer le terrain&quot;,&quot;Tu mets toutes les chances de ton côté avant le jour J : pas de stock, pas de tentation facile, un plan pour les moments difficiles.&quot;,&quot;Prévois de jeter ou donner ton matériel le jour J. Nettoie ta voiture et ton appartement. Prépare chewing-gums, eau et collations.&quot;,&quot;checklist&quot;,{&quot;key&quot;:&quot;env&quot;,&quot;t&quot;:&quot;Préparer le terrain&quot;},{&quot;q&quot;:&quot;Quel plan « si… alors… » te ressemble ?&quot;,&quot;o&quot;:[[&quot;Si l&#x27;envie vient, je bois de l&#x27;eau et j&#x27;attends 10 minutes&quot;,&quot;Un délai court plus un geste simple : c&#x27;est très efficace. Les plans précis marchent bien mieux que les bonnes intentions.&quot;],[&quot;Si je m&#x27;ennuie, je sors 5 minutes&quot;,&quot;Bouger change l&#x27;état du corps et coupe l&#x27;automatisme. Même monter un escalier compte.&quot;],[&quot;Si je suis stressé(e), je respire 1 minute&quot;,&quot;Inspire 4 secondes, souffle 6 : l&#x27;expiration longue ralentit le cœur et calme le système nerveux.&quot;],[&quot;Si je craque, j&#x27;appelle quelqu&#x27;un&quot;,&quot;Parler casse l&#x27;isolement et la honte, qui poussent à recommencer.&quot;]]},[&quot;Plus de stock, moins de rechute&quot;,&quot;Se débarrasser du matériel et des stocks évite les rechutes impulsives : l&#x27;envie passe avant que tu n&#x27;aies le temps d&#x27;aller en acheter.&quot;,&quot;Jette ou donne tout ton matériel.&quot;]],[&quot;La veille du jour J&quot;,&quot;Dernière étape avant l&#x27;arrêt. Tu te prépares, tu te reposes, tu te donnes un cadre pour demain.&quot;,&quot;Relis ton pourquoi. Prévois demain : ce que tu feras pour les moments à risque, qui tu préviens, et ce que tu fais de ton matériel.&quot;,null,{},{&quot;q&quot;:&quot;Cette semaine, qu&#x27;est-ce qui t&#x27;a le plus surpris(e) ?&quot;,&quot;o&quot;:[[&quot;À quel point c&#x27;est automatique&quot;,&quot;Voir l&#x27;automatisme, c&#x27;est déjà la moitié du chemin : on ne peut changer que ce qu&#x27;on remarque.&quot;],[&quot;Les moments où l&#x27;envie arrive&quot;,&quot;Tu connais maintenant tes heures et tes lieux : tu peux les anticiper au lieu de les subir.&quot;],[&quot;Que ça passe quand j&#x27;attends&quot;,&quot;C&#x27;est l&#x27;info la plus utile : une envie qui passe n&#x27;est pas un ordre.&quot;],[&quot;Rien de spécial&quot;,&quot;Pas grave, c&#x27;est une semaine d&#x27;observation. Continue : les effets arrivent avec la pratique.&quot;]]},[&quot;Bien dormir avant le jour J&quot;,&quot;Dormir suffisamment avant l&#x27;arrêt aide à mieux gérer les premières envies : la fatigue amplifie le manque.&quot;,&quot;Couche-toi tôt ce soir.&quot;]],[&quot;Jour J : ta première journée sans&quot;,&quot;Les premiers jours sont souvent les plus intenses. Chaque envie passe. Bois de l&#x27;eau, bouge, évite l&#x27;alcool, et reste près de ton plan.&quot;,&quot;Touche « J&#x27;ai arrêté » dans le suivi pour lancer ton compteur. Utilise le bouton SOS à chaque envie. Va te coucher fier de ta journée.&quot;,&quot;wave&quot;,{&quot;t&quot;:&quot;Jour J : surfe sur l&#x27;envie&quot;},{&quot;q&quot;:&quot;Quand l&#x27;envie arrive, que fais-tu d&#x27;habitude ?&quot;,&quot;o&quot;:[[&quot;Je cède tout de suite&quot;,&quot;Normal : céder soulage vite, et c&#x27;est ce qui apprend au cerveau à recommencer. Aujourd&#x27;hui, repousse seulement de 10 minutes.&quot;],[&quot;Je lutte de toutes mes forces&quot;,&quot;Lutter épuise. Observe l&#x27;envie comme une vague : elle monte, plafonne, redescend. Laisse-la passer sans la combattre.&quot;],[&quot;Je me distrais&quot;,&quot;Très bien : 10 minutes de distraction suffisent souvent. Prépare-en deux à l&#x27;avance, à portée de main.&quot;],[&quot;Je ne sais pas&quot;,&quot;Aujourd&#x27;hui, note l&#x27;heure et ce que tu ressens quand elle vient. Un schéma va apparaître.&quot;]]},[&quot;Premières heures&quot;,&quot;Dès les premières heures, la fréquence cardiaque et la tension redescendent. Le monoxyde de carbone baisse en quelques heures.&quot;,&quot;Bois un grand verre d&#x27;eau toutes les heures.&quot;]],[&quot;Comprendre le manque&quot;,&quot;Le manque de nicotine se traduit par de l&#x27;irritabilité, de la fatigue, des envies. Ça passe, souvent en quelques jours à quelques semaines. L&#x27;envie monte, atteint un pic, puis retombe.&quot;,&quot;Note chaque envie : l&#x27;heure, l&#x27;intensité de 1 à 10, ce qui l&#x27;a calmée.&quot;,&quot;myths&quot;,{&quot;t&quot;:&quot;Comprendre le manque&quot;},{&quot;q&quot;:&quot;Peux-tu tenir 10 minutes avant de passer à l&#x27;acte ?&quot;,&quot;o&quot;:[[&quot;Oui, facilement&quot;,&quot;Alors fais-en une règle : la plupart des envies retombent avant 10 minutes.&quot;],[&quot;Oui, avec une distraction&quot;,&quot;Parfait. Prépare deux distractions : musique, verre d&#x27;eau, marche. Elles font la moitié du travail.&quot;],[&quot;Difficile&quot;,&quot;Commence par 2 minutes. Chaque envie traversée entraîne ton cerveau à tolérer l&#x27;inconfort.&quot;],[&quot;Impossible&quot;,&quot;Pas de souci : 1 minute compte déjà. Le bouton SOS te guide pendant 10 minutes, un souffle après l&#x27;autre.&quot;]]},[&quot;Le manque culmine tôt&quot;,&quot;Irritabilité et envies culminent souvent aux jours 2 à 3, puis diminuent sur 2 à 4 semaines.&quot;,&quot;Prévois des activités faciles pour ces jours.&quot;]],[&quot;Les 4 D&quot;,&quot;Quatre réflexes simples : Délai (attends 10 minutes), Distraction (change d&#x27;activité), Drink (bois de l&#x27;eau), Deep breath (respire lentement).&quot;,&quot;Applique les 4 D à chaque envie aujourd&#x27;hui. Note lesquels marchent le mieux pour toi.&quot;,&quot;pairs&quot;,{&quot;t&quot;:&quot;Les 4 D : associe chaque envie à son réflexe&quot;},{&quot;q&quot;:&quot;Quand tu es tendu(e), ton souffle est plutôt…&quot;,&quot;o&quot;:[[&quot;Court et haut&quot;,&quot;Respirer haut met le corps en alerte. Allonge l&#x27;expiration : c&#x27;est le levier le plus rapide pour te calmer.&quot;],[&quot;Je le retiens parfois&quot;,&quot;Retenir son souffle augmente la tension. Souffle doucement par la bouche, comme dans une paille.&quot;],[&quot;Je n&#x27;y ai jamais fait attention&quot;,&quot;Pose une main sur le ventre : si elle ne bouge pas, ta respiration est haute. Essaie de la faire gonfler.&quot;],[&quot;Plutôt calme&quot;,&quot;Bien. Garde ce réflexe pour les moments d&#x27;envie, c&#x27;est là qu&#x27;il compte le plus.&quot;]]},[&quot;Une envie dure 3 à 5 minutes&quot;,&quot;Une envie de fumer dure généralement 3 à 5 minutes. Boire de l&#x27;eau et respirer aident à la traverser.&quot;,&quot;Applique les 4 D : délai, distraction, eau, respiration.&quot;]],[&quot;Tes routines&quot;,&quot;Café, pause, après le repas : ces moments étaient des habitudes. Tu peux garder le moment et changer le geste.&quot;,&quot;Change l&#x27;ordre ou le lieu de 2 routines (café debout, pause en marchant, brosse-toi les dents après le repas).&quot;,&quot;slot&quot;,{&quot;t&quot;:&quot;Change ta routine&quot;},{&quot;q&quot;:&quot;Pour t&#x27;occuper 10 minutes, tu préfères…&quot;,&quot;o&quot;:[[&quot;Bouger&quot;,&quot;Le mouvement réduit les envies et améliore l&#x27;humeur en quelques minutes.&quot;],[&quot;Parler à quelqu&#x27;un&quot;,&quot;Une voix humaine apaise plus vite qu&#x27;un écran ou un produit.&quot;],[&quot;Faire quelque chose de mes mains&quot;,&quot;Cuisine, dessin, rangement : occuper les mains occupe aussi l&#x27;attention, l&#x27;envie perd de la place.&quot;],[&quot;Rien ne me tente&quot;,&quot;Normal au début : l&#x27;envie rend tout fade. Essaie quand même 3 minutes, l&#x27;envie baisse avant que l&#x27;activité ne devienne agréable.&quot;]]},[&quot;Les routines se défont&quot;,&quot;Le café, la pause, l&#x27;après-repas : garde le moment, change le geste. L&#x27;association se défait en quelques semaines.&quot;,&quot;Brosse-toi les dents juste après le repas.&quot;]],[&quot;Stress et humeur&quot;,&quot;L&#x27;irritabilité des premières semaines est temporaire. Si tu as du mal à gérer ton humeur, des pauses et du mouvement aident.&quot;,&quot;Prévois 3 pauses de 5 minutes aujourd&#x27;hui : étirements, fenêtre ouverte, marche.&quot;,null,{},{&quot;q&quot;:&quot;Quand tu es stressé(e), ton corps réagit surtout par…&quot;,&quot;o&quot;:[[&quot;De la tension (épaules, mâchoire)&quot;,&quot;Relâche : épaules vers le bas, mâchoire détendue, trois souffles lents.&quot;],[&quot;De la fatigue&quot;,&quot;La fatigue baisse le frein de la volonté. Une sieste de 15 à 20 minutes aide, sinon couche-toi plus tôt ce soir.&quot;],[&quot;De l&#x27;agitation&quot;,&quot;Marche rapide 5 minutes : elle dépense l&#x27;adrénaline en trop.&quot;],[&quot;Je ne sais pas&quot;,&quot;Scanne : tête, épaules, ventre, jambes. Où ça serre ? C&#x27;est là qu&#x27;il faut respirer.&quot;]]},[&quot;Le stress de base baisse&quot;,&quot;La nicotine ne réduit pas le stress en moyenne : après quelques semaines sans, beaucoup de personnes se sentent moins tendues.&quot;,&quot;Prévois 3 pauses de 5 minutes aujourd&#x27;hui.&quot;]],[&quot;Soirées et alcool&quot;,&quot;L&#x27;alcool et les soirées sont l&#x27;un des moments les plus risqués. Prévois ton plan avant de sortir.&quot;,&quot;Avant la prochaine soirée : décide de ce que tu bois, de ce que tu fais quand on te propose, et qui est au courant de ton arrêt.&quot;,&quot;planner&quot;,{&quot;t&quot;:&quot;Ta prochaine soirée, sans&quot;},{&quot;q&quot;:&quot;Quelle idée te retient le plus ?&quot;,&quot;o&quot;:[[&quot;J&#x27;en ai besoin pour me détendre ou dormir&quot;,&quot;Ça détend sur l&#x27;instant mais entretient le manque ensuite. À terme, la détente et le sommeil naturels reviennent.&quot;],[&quot;Je gère, ce n&#x27;est pas un problème&quot;,&quot;Si tu es ici, c&#x27;est que tu veux plus de contrôle. Fais confiance à ça.&quot;],[&quot;Tout le monde le fait&quot;,&quot;Beaucoup le font, et beaucoup changent aussi. Tu n&#x27;es pas seul(e) dans les deux cas.&quot;],[&quot;Juste une fois ne compte pas&quot;,&quot;Chaque fois renforce le circuit de l&#x27;habitude. L&#x27;exception est souvent la porte d&#x27;entrée.&quot;]]},[&quot;L&#x27;alcool et la rechute&quot;,&quot;L&#x27;alcool baisse la vigilance et les freins : c&#x27;est l&#x27;un des premiers déclencheurs de rechute.&quot;,&quot;Choisis une boisson sans alcool pour ta prochaine soirée.&quot;]],[&quot;Bilan de la semaine 2&quot;,&quot;Tu as passé la première semaine sans. Chaque envie surmontée construit la nouvelle habitude.&quot;,&quot;Regarde ton compteur de jours et d&#x27;envies surmontées. Note le moment le plus dur et ce qui t&#x27;a aidé.&quot;,null,{},{&quot;q&quot;:&quot;Ce qui t&#x27;a le plus aidé(e) cette semaine ?&quot;,&quot;o&quot;:[[&quot;Attendre 10 minutes&quot;,&quot;Garde-le : c&#x27;est ton outil principal. Il marche d&#x27;autant mieux qu&#x27;il est automatique.&quot;],[&quot;Respirer&quot;,&quot;La respiration est toujours avec toi. Utilise-la avant que l&#x27;envie ne soit à son maximum.&quot;],[&quot;Éloigner ce qui donne accès&quot;,&quot;Bien joué : réduire l&#x27;accès est l&#x27;une des méthodes les plus solides.&quot;],[&quot;Rien de précis&quot;,&quot;Pas grave. Regarde le bilan : tu as peut-être tenu plus que tu ne le penses.&quot;]]},[&quot;La toux peut augmenter&quot;,&quot;Au début, la toux peut augmenter : les cils des bronches repoussent et nettoient les voies respiratoires. C&#x27;est un signe de récupération.&quot;,&quot;Bois chaud et respire lentement.&quot;]],[&quot;Remplacer le geste&quot;,&quot;Les mains et la bouche ont besoin d&#x27;occuper leur place. Trouve un geste de remplacement.&quot;,&quot;Choisis 3 remplacements (chewing-gum, cure-dent, eau, bâtonnet, balle antistress). Garde-les sur toi.&quot;,null,{},{&quot;q&quot;:&quot;Quel remplaçant te semble le plus réaliste ?&quot;,&quot;o&quot;:[[&quot;Un geste (eau, étirements)&quot;,&quot;Les petits gestes sont faciles à répéter. Garde-les à portée de main.&quot;],[&quot;Une activité courte (marche, jeu)&quot;,&quot;Dix minutes suffisent souvent. Choisis-en une que tu peux faire n&#x27;importe où.&quot;],[&quot;Une personne (appel, message)&quot;,&quot;Un lien humain est l&#x27;un des meilleurs remplaçants. Mets 2 prénoms dans tes favoris.&quot;],[&quot;Je n&#x27;en ai pas encore&quot;,&quot;Essaie les trois cette semaine. Tu verras vite lequel marche pour toi.&quot;]]},[&quot;Mains et bouche occupées&quot;,&quot;Le geste main-bouche est une partie de l&#x27;habitude. Un chewing-gum ou un cure-dent le remplace efficacement.&quot;,&quot;Garde ton remplaçant dans la poche.&quot;]],[&quot;Bouger&quot;,&quot;Le sport aide à gérer les envies et à retrouver du souffle. Pas besoin de sport intense : marcher compte.&quot;,&quot;Fais 20 minutes de marche ou d&#x27;activité aujourd&#x27;hui. Note comment tu te sens après.&quot;,&quot;move&quot;,{},{&quot;q&quot;:&quot;Ton niveau de mouvement dans une journée ?&quot;,&quot;o&quot;:[[&quot;Presque aucun&quot;,&quot;Commence par 5 minutes de marche : c&#x27;est déjà un effet mesurable sur l&#x27;humeur.&quot;],[&quot;Un peu&quot;,&quot;Ajoute 10 minutes à l&#x27;heure où l&#x27;envie est la plus forte.&quot;],[&quot;Régulier&quot;,&quot;Excellent. Place-le aux heures à risque : c&#x27;est là qu&#x27;il protège le plus.&quot;],[&quot;Beaucoup&quot;,&quot;Parfait. N&#x27;oublie pas le repos : il fait partie de la récupération.&quot;]]},[&quot;Le souffle revient&quot;,&quot;Après quelques semaines, la capacité respiratoire s&#x27;améliore et l&#x27;effort devient plus facile.&quot;,&quot;Monte un escalier et note ton souffle.&quot;]],[&quot;Appétit et poids&quot;,&quot;Après l&#x27;arrêt, l&#x27;appétit augmente souvent. Prévoir des collations saines évite de remplacer la cigarette par la nourriture.&quot;,&quot;Prépare des collations (fruits, carottes, noix). Bois de l&#x27;eau avant de manger.&quot;,null,{},{&quot;q&quot;:&quot;Le plus dur dans tes week-ends, c&#x27;est…&quot;,&quot;o&quot;:[[&quot;Le temps libre&quot;,&quot;Prévois deux activités par jour : le vide appelle l&#x27;habitude.&quot;],[&quot;Les amis&quot;,&quot;Propose un lieu ou une activité sans l&#x27;habitude, ou dis-le d&#x27;avance. Les vrais amis comprennent.&quot;],[&quot;Le soir tard&quot;,&quot;Fixe une heure limite de coucher : la fatigue baisse les défenses.&quot;],[&quot;Rien de particulier&quot;,&quot;Prévois quand même un plan B, au cas où.&quot;]]},[&quot;Appétit et métabolisme&quot;,&quot;L&#x27;arrêt peut augmenter l&#x27;appétit et ralentir un peu le métabolisme. Manger équilibré et bouger limite la prise de poids.&quot;,&quot;Prépare des collations : fruits, carottes, noix.&quot;]],[&quot;En parler à ton entourage&quot;,&quot;Dire que tu arrêtes t&#x27;engage et te soutient. Demande à ceux qui vapent ou fument de ne pas t&#x27;en proposer.&quot;,&quot;Préviens 2 personnes que tu arrêtes. Dis-leur ce dont tu as besoin.&quot;,null,{},{&quot;q&quot;:&quot;À qui pourrais-tu en parler ?&quot;,&quot;o&quot;:[[&quot;Un(e) ami(e)&quot;,&quot;Un ami de confiance suffit. Dis simplement : « j&#x27;essaie de changer, peux-tu me demander demain comment ça va ? »&quot;],[&quot;Un proche de la famille&quot;,&quot;Choisis la personne la plus calme et la moins critique. Un message écrit peut être plus facile.&quot;],[&quot;Un professionnel ou une ligne d&#x27;aide&quot;,&quot;Excellente idée : Tabac info service (39 89) est là pour ça, gratuitement et sans jugement.&quot;],[&quot;Personne pour l&#x27;instant&quot;,&quot;C&#x27;est possible, et ce n&#x27;est pas grave. Une ligne d&#x27;aide (Tabac info service (39 89)) peut être ton premier interlocuteur.&quot;]]},[&quot;La caféine agit plus fort&quot;,&quot;Les fumeurs éliminent la caféine plus vite. Après l&#x27;arrêt, le même café agit plus fort : réduis un peu.&quot;,&quot;Prends un café de moins aujourd&#x27;hui.&quot;]],[&quot;Les pensées-pièges&quot;,&quot;« Juste une », « juste ce soir », « je contrôle ». Ces phrases sont normales. Les repérer leur enlève du pouvoir.&quot;,&quot;Écris 3 phrases que tu te dis avant de craquer. À côté de chacune, une réponse honnête et courte.&quot;,&quot;pieges&quot;,{},{&quot;q&quot;:&quot;Quelle pensée te fait le plus craquer ?&quot;,&quot;o&quot;:[[&quot;« Juste une fois »&quot;,&quot;C&#x27;est le piège le plus courant. Réponse : « si c&#x27;est juste une fois, je peux attendre demain ».&quot;],[&quot;« Je l&#x27;ai bien mérité »&quot;,&quot;Oui, et tu peux te récompenser autrement : repas, film, sortie. Sans la facture.&quot;],[&quot;« Je m&#x27;y mets demain »&quot;,&quot;Demain sera pareil. Réponse : « je commence par les 10 prochaines minutes ».&quot;],[&quot;« J&#x27;ai déjà craqué, tant pis »&quot;,&quot;Un faux pas n&#x27;efface pas les jours passés. Reprends dès la prochaine heure.&quot;]]},[&quot;Le cerveau négocie&quot;,&quot;Pour obtenir un soulagement rapide, le cerveau fabrique des excuses (« juste une »). Les repérer leur enlève du pouvoir.&quot;,&quot;Note ta pensée-piège préférée.&quot;]],[&quot;Te récompenser avec l&#x27;argent économisé&quot;,&quot;L&#x27;argent économisé est ton vrai bonus. Le voir grossir motive.&quot;,&quot;Calcule ce que tu économises par semaine. Choisis une récompense pour le premier mois.&quot;,null,{},{&quot;q&quot;:&quot;Quelle récompense te ferait vraiment plaisir ?&quot;,&quot;o&quot;:[[&quot;Un bon repas&quot;,&quot;Parfait : choisis le jour et le lieu à l&#x27;avance, une récompense prévue motive mieux qu&#x27;une récompense improvisée.&quot;],[&quot;Une sortie&quot;,&quot;Planifie-la dans ton agenda dès aujourd&#x27;hui : l&#x27;avoir devant soi aide à tenir.&quot;],[&quot;Un achat&quot;,&quot;Mets de côté la somme économisée dans une enveloppe : la voir grossir motive.&quot;],[&quot;Du repos&quot;,&quot;Le repos est une vraie récompense. Offre-toi une soirée sans obligation.&quot;]]},[&quot;L&#x27;argent regagné&quot;,&quot;Chaque semaine sans, c&#x27;est plusieurs dizaines d&#x27;euros en plus. Les voir s&#x27;accumuler renforce la motivation.&quot;,&quot;Mets la somme de côté dans une enveloppe.&quot;]],[&quot;Bilan de la semaine 3&quot;,&quot;Trois semaines de pratique. Regarde ce qui a changé : souffle, énergie, humeur, argent.&quot;,&quot;Écris 3 changements que tu constates, même petits.&quot;,null,{},{&quot;q&quot;:&quot;Ce qui a changé depuis le début ?&quot;,&quot;o&quot;:[[&quot;Mon sommeil&quot;,&quot;Un meilleur sommeil réduit l&#x27;impulsivité : c&#x27;est un cercle vertueux qui s&#x27;installe.&quot;],[&quot;Mon humeur&quot;,&quot;Chaque jour, le cerveau se rééquilibre un peu. L&#x27;humeur suit souvent avec un décalage.&quot;],[&quot;Mon argent&quot;,&quot;Note la somme : c&#x27;est un des gains les plus concrets.&quot;],[&quot;Pas encore grand-chose&quot;,&quot;Normal : les changements sont souvent lents au début. Continue, ils arrivent avec la régularité.&quot;]]},[&quot;Le goût revient&quot;,&quot;Goût et odorat reviennent une idée&quot;,&quot;Alors note pendant 3 jours, une ligne à chaque fois. Les automatismes se voient dès qu&#x27;on les écrit.&quot;]]},[&quot;Le THC se stocke&quot;,&quot;Le THC se stocke dans les graisses et s&#x27;élimine lentement, sur des jours à des semaines. Les effets sur le sommeil peuvent mettre du temps à partir.&quot;,&quot;Sois patient avec toi : les nuits s&#x27;améliorent par étapes.&quot;]],[&quot;Ce que ça t&#x27;apporte, ce que ça te coûte&quot;,&quot;Le cannabis te rend service : il détend, il aide à décrocher, il rapproche des amis. Le reconnaître permet de trouver d&#x27;autres façons d&#x27;obtenir la même chose. Ça coûte aussi du sommeil, de la motivation, de l&#x27;argent.&quot;,&quot;Fais deux colonnes sur papier : ce que ça t&#x27;apporte / ce que ça te coûte. Entoure ce que tu pourrais obtenir autrement.&quot;,null,{},{&quot;q&quot;:&quot;Qu&#x27;est-ce que ça t&#x27;apporte de fumer ?&quot;,&quot;o&quot;:[[&quot;Me détendre&quot;,&quot;La détente est réelle mais courte : elle soulage surtout le manque que l&#x27;habitude crée. Respiration lente, marche ou douche chaude donnent un calme plus durable.&quot;],[&quot;Ne plus penser à rien&quot;,&quot;C&#x27;est un vrai besoin : ton cerveau veut une pause. Une vraie pause (marche, étirements) repose mieux et ne laisse pas de culpabilité.&quot;],[&quot;Me sentir moins seul(e)&quot;,&quot;Besoin légitime. Un message ou un appel, même court, y répond mieux et plus longtemps.&quot;],[&quot;Du plaisir, tout simplement&quot;,&quot;Le plaisir compte. L&#x27;idée n&#x27;est pas de t&#x27;en priver mais de le retrouver ailleurs : dans quelques jours tu choisiras tes remplaçants.&quot;]]},[&quot;Détente ou habitude ?&quot;,&quot;Beaucoup décrivent un calme réel, mais le cerveau s&#x27;habitue : à terme, le calme sans produit devient plus difficile à atteindre.&quot;,&quot;Note ce que tu ressens sans, 30 minutes après le moment habituel.&quot;]],[&quot;Tes déclencheurs&quot;,&quot;Un déclencheur, c&#x27;est ce qui te donne envie sans que tu y penses : rentrer chez toi, un ami, l&#x27;ennui, un morceau de musique, la fin de journée. Quand tu les repères, tu les vois venir.&quot;,&quot;À chaque envie aujourd&#x27;hui, note l&#x27;heure, le lieu et ce que tu ressens juste avant. Vise 5 notes.&quot;,&quot;heat&quot;,{},{&quot;q&quot;:&quot;Quand l&#x27;envie est-elle la plus forte ?&quot;,&quot;o&quot;:[[&quot;Le soir, seul(e)&quot;,&quot;Fatigue et solitude : le soir, le cerveau freine moins bien. Prévois quelque chose de précis pour ces heures-là.&quot;],[&quot;Quand je m&#x27;ennuie&quot;,&quot;L&#x27;ennui est un déclencheur très fréquent. Il retombe en quelques minutes si on ne le fuit pas : prépare une action de 5 minutes.&quot;],[&quot;Quand je suis stressé(e)&quot;,&quot;Le stress donne envie d&#x27;un soulagement rapide. Un souffle plus long à l&#x27;expiration (4 s / 6 s) calme le corps en 2 minutes.&quot;],[&quot;Avec d&#x27;autres personnes&quot;,&quot;Le contexte social pèse beaucoup. Dire à une personne que tu changes suffit souvent à désamorcer.&quot;]]},[&quot;Le cerveau associe&quot;,&quot;Le soir, le cerveau associe un lieu, un geste et un effet. Les repérer, c&#x27;est savoir quand l&#x27;envie va arriver.&quot;,&quot;Repère l&#x27;heure et le lieu de ta plus grosse envie.&quot;]],[&quot;Préparer ta méthode et ta date&quot;,&quot;Tu mets toutes les chances de ton côté : un jour d&#x27;arrêt, un environnement qui t&#x27;aide, quelqu&#x27;un qui le sait. Rien ne se garde « pour plus tard » : ce qui est à portée de main finit par être utilisé.&quot;,&quot;Choisis ton jour d&#x27;arrêt. Jette ou donne ton stock et ton matériel, supprime les contacts et conversations liés.&quot;,null,{},{&quot;q&quot;:&quot;Quelle barrière poses-tu en premier ?&quot;,&quot;o&quot;:[[&quot;Supprimer l&#x27;accès&quot;,&quot;Chaque étape en plus fait baisser le passage à l&#x27;acte : un obstacle de 20 secondes laisse souvent l&#x27;envie retomber.&quot;],[&quot;Changer de
