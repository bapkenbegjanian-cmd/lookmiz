<body><button id="b">Copier le code</button><p id="m">Touche le bouton, puis colle dans Supabase.</p><textarea id="t" readonly translate="no">// Fonction Supabase « paiement- » de Lookmiz.
// 1) Programmes de 30 jours : page de paiement Stripe (prog_checkout), vérification (prog_verify)
//    et livraison du contenu des jours, seulement si le paiement est confirmé (prog_day).
// 2) Anciennes cartes d&#x27;invitation (checkout / verify) : inchangé.
import { createClient } from &#x27;npm:@supabase/supabase-js@2&#x27;;

const CORS = { &#x27;Access-Control-Allow-Origin&#x27;: &#x27;*&#x27;, &#x27;Access-Control-Allow-Headers&#x27;: &#x27;*&#x27;, &#x27;Access-Control-Allow-Methods&#x27;: &#x27;POST, OPTIONS&#x27; };
const json = (d: unknown, status = 200) =&gt; new Response(JSON.stringify(d), { status, headers: { ...CORS, &#x27;Content-Type&#x27;: &#x27;application/json&#x27; } });
const admin = createClient(Deno.env.get(&#x27;SUPABASE_URL&#x27;)!, Deno.env.get(&#x27;SUPABASE_SERVICE_ROLE_KEY&#x27;)!);
const SK = Deno.env.get(&#x27;STRIPE_SECRET_KEY&#x27;) ?? &#x27;&#x27;;
const SITE = &#x27;https://lookmiz.com/&#x27;;
// Prix côté serveur : le navigateur ne peut pas les modifier.
// Contenu des 4 programmes : jamais envoyé sans paiement confirmé.
const DAYS: Record&lt;string, { kit: unknown; days: unknown[] }&gt; = {&quot;ecrans&quot;:{&quot;kit&quot;:{&quot;raisons&quot;:[&quot;Mieux dormir&quot;,&quot;Être plus présent avec les gens&quot;,&quot;Retrouver ma concentration&quot;,&quot;Avancer sur mes projets&quot;,&quot;Moins me comparer aux autres&quot;,&quot;Avoir plus de temps pour moi&quot;,&quot;Être moins stressé&quot;,&quot;Reprendre le sport&quot;,&quot;Relire des livres&quot;,&quot;Moins culpabiliser&quot;],&quot;pros&quot;:[&quot;M&#x27;occuper quand je m&#x27;ennuie&quot;,&quot;Rester en lien avec mes amis&quot;,&quot;Me détendre&quot;,&quot;Ne pas rater les infos&quot;,&quot;Me divertir&quot;,&quot;Ne pas penser à mes soucis&quot;],&quot;cons&quot;:[&quot;Je dors moins&quot;,&quot;Je perds des heures&quot;,&quot;Je me compare aux autres&quot;,&quot;J&#x27;ai du mal à me concentrer&quot;,&quot;Je suis plus irritable&quot;,&quot;Je remets mes projets à plus tard&quot;,&quot;Je suis moins présent avec les gens&quot;,&quot;Je me sens vidé après&quot;],&quot;calc&quot;:{&quot;q&quot;:&quot;Combien d&#x27;heures par jour passes-tu sur ton téléphone ?&quot;,&quot;unit&quot;:&quot;h par jour&quot;,&quot;min&quot;:0,&quot;max&quot;:12,&quot;step&quot;:0.5,&quot;def&quot;:4,&quot;mult&quot;:365,&quot;out&quot;:&quot;heures par an&quot;,&quot;div&quot;:24,&quot;divLabel&quot;:&quot;jours entiers&quot;,&quot;eq&quot;:[6,&quot;livres de 300 pages lus&quot;],&quot;gain&quot;:&quot;récupérées chaque année&quot;},&quot;env&quot;:[&quot;Couper les notifications non essentielles&quot;,&quot;Sortir les applis des écrans d&#x27;accueil&quot;,&quot;Me déconnecter des réseaux sociaux&quot;,&quot;Passer l&#x27;écran en noir et blanc&quot;,&quot;Charger le téléphone hors de la chambre&quot;,&quot;Régler une limite de temps par appli&quot;],&quot;triggers&quot;:[&quot;Une notification&quot;,&quot;L&#x27;ennui&quot;,&quot;Une file d&#x27;attente&quot;,&quot;Dans mon lit&quot;,&quot;Une pause au travail&quot;,&quot;Pendant le repas&quot;,&quot;Quand je suis stressé&quot;,&quot;Quand je suis seul&quot;,&quot;Dans les transports&quot;,&quot;Avant de m&#x27;endormir&quot;],&quot;actions&quot;:[&quot;Respirer 1 minute&quot;,&quot;Boire un verre d&#x27;eau&quot;,&quot;Écrire une phrase dans mes notes&quot;,&quot;Poser le téléphone dans une autre pièce&quot;,&quot;Lire 2 pages&quot;,&quot;Faire quelques étirements&quot;,&quot;Appeler un ami&quot;,&quot;Marcher 5 minutes dehors&quot;,&quot;Regarder par la fenêtre&quot;,&quot;Ranger un objet&quot;],&quot;distract&quot;:[&quot;Nouveau message&quot;,&quot;12 notifications&quot;,&quot;Quelqu&#x27;un a aimé ta photo&quot;,&quot;Offre -50 % aujourd&#x27;hui&quot;,&quot;Tu as raté une story&quot;,&quot;Mise à jour disponible&quot;],&quot;myths&quot;:[[&quot;Si je coupe les notifications, je vais rater des choses importantes.&quot;,false,&quot;Tes appels et messages de proches restent possibles. La plupart des notifications ne sont pas urgentes.&quot;],[&quot;Une envie de checker dure toute la journée.&quot;,false,&quot;Elle monte, atteint un pic, puis retombe, souvent en quelques minutes.&quot;],[&quot;Il faut une volonté de fer pour réduire son temps d&#x27;écran.&quot;,false,&quot;Ton environnement fait le travail : applis rangées, notifications coupées, téléphone loin du lit.&quot;],[&quot;Dormir avec le téléphone près du lit n&#x27;a aucun effet sur le sommeil.&quot;,false,&quot;Il retarde souvent le coucher et fragilise le sommeil. Le charger hors de la chambre aide.&quot;],[&quot;Remplacer le scroll par une autre activité aide à tenir.&quot;,true,&quot;Quand on enlève une habitude sans rien mettre à la place, le vide la rappelle.&quot;],[&quot;Si je dérape une soirée, tout est perdu.&quot;,false,&quot;Un dérapage n&#x27;est pas une rechute : on reprend le fil le lendemain.&quot;]],&quot;pairs&quot;:[[&quot;Notification&quot;,&quot;Couper les notifications&quot;],[&quot;L&#x27;ennui&quot;,&quot;Lire 2 pages&quot;],[&quot;Dans mon lit&quot;,&quot;Téléphone hors de la chambre&quot;],[&quot;Stress&quot;,&quot;Respirer 1 minute&quot;],[&quot;File d&#x27;attente&quot;,&quot;Regarder autour de moi&quot;]],&quot;pieges&quot;:[[&quot;Juste cinq minutes.&quot;,true,&quot;Cinq minutes deviennent souvent trente. Si tu y vas, mets un minuteur avant.&quot;],[&quot;Je l&#x27;ai bien mérité.&quot;,true,&quot;Tu peux te récompenser autrement, sans y perdre ta soirée.&quot;],[&quot;L&#x27;envie va passer si j&#x27;attends 10 minutes.&quot;,false,&quot;Exact : une envie monte, atteint un pic puis retombe.&quot;],[&quot;J&#x27;ai besoin de savoir ce qui se passe.&quot;,true,&quot;Presque rien n&#x27;est urgent. Les vraies urgences t&#x27;appellent.&quot;],[&quot;Je peux faire une pause d&#x27;écran maintenant.&quot;,false,&quot;Oui. Une pause de 10 minutes est déjà une victoire.&quot;],[&quot;Je regarde juste un truc.&quot;,true,&quot;« Juste un truc » est la porte d&#x27;entrée du scroll.&quot;],[&quot;Un dérapage n&#x27;est pas un échec.&quot;,false,&quot;Exact. Ce qui compte, c&#x27;est de reprendre le fil.&quot;],[&quot;Je peux m&#x27;arrêter quand je veux.&quot;,true,&quot;Alors prouve-le : arrête pendant 10 minutes, tout de suite.&quot;]],&quot;scenarios&quot;:[{&quot;q&quot;:&quot;Il est 23h30, tu es dans ton lit. Tu prends ton téléphone « juste pour voir l&#x27;heure ».&quot;,&quot;c&quot;:[[&quot;J&#x27;ouvre une appli, juste deux minutes&quot;,0,&quot;Deux minutes deviennent souvent une heure. L&#x27;idéal : le téléphone n&#x27;est pas dans la chambre.&quot;],[&quot;Je le repose et je respire 1 minute&quot;,2,&quot;Bien joué : tu coupes l&#x27;automatisme et tu protèges ton sommeil.&quot;],[&quot;Je mets un minuteur de 5 minutes&quot;,1,&quot;Mieux que rien, mais tu restes dans le piège.&quot;]]},{&quot;q&quot;:&quot;Tu t&#x27;ennuies dans la file d&#x27;attente du supermarché.&quot;,&quot;c&quot;:[[&quot;Je regarde autour de moi, sans écran&quot;,2,&quot;Parfait. L&#x27;ennui est inconfortable un instant, puis il passe.&quot;],[&quot;Je regarde juste mes notifications&quot;,0,&quot;C&#x27;est comme ça que le scroll recommence.&quot;],[&quot;J&#x27;écoute un podcast&quot;,1,&quot;Ça occupe sans scroller : c&#x27;est correct.&quot;]]},{&quot;q&quot;:&quot;Tu as passé 2 heures sur ton téléphone sans t&#x27;en rendre compte. Tu te sens mal.&quot;,&quot;c&quot;:[[&quot;Je me dis que je suis nul et j&#x27;abandonne&quot;,0,&quot;Le jugement dur fatigue et pousse à recommencer.&quot;],[&quot;Je note ce qui m&#x27;a déclenché et je reprends demain&quot;,2,&quot;C&#x27;est ça, un dérapage utile : tu apprends et tu repars.&quot;],[&quot;Je supprime toutes mes applis d&#x27;un coup&quot;,1,&quot;Radical, mais difficile à tenir. Mieux vaut avancer pas à pas.&quot;]]}],&quot;relapse&quot;:{&quot;heure&quot;:[&quot;Je pose le téléphone et je respire&quot;,&quot;Je bois un verre d&#x27;eau et je sors prendre l&#x27;air&quot;,&quot;Je note ce qui s&#x27;est passé&quot;],&quot;ajuster&quot;:[&quot;Je règle une limite de temps&quot;,&quot;Je range l&#x27;appli difficile&quot;,&quot;Je change mon heure de coucher&quot;],&quot;prevenir&quot;:[&quot;Un ami proche&quot;,&quot;Mon frère ou ma sœur&quot;,&quot;Mon conjoint ou ma conjointe&quot;,&quot;Un professionnel&quot;,&quot;Personne, je gère seul&quot;]},&quot;events&quot;:[&quot;Soirée seul&quot;,&quot;Week-end sans programme&quot;,&quot;Voyage&quot;,&quot;Stress au travail&quot;,&quot;Dimanche soir&quot;,&quot;Vacances&quot;],&quot;messages&quot;:[&quot;Je réduis mon temps d&#x27;écran. Peux-tu me demander demain comment ça s&#x27;est passé ?&quot;,&quot;J&#x27;essaie de lâcher mon téléphone le soir. Tu peux me le rappeler gentiment ?&quot;],&quot;rules&quot;:[&quot;Garder mes barrières en place&quot;,&quot;Utiliser le bouton SOS à chaque envie&quot;,&quot;Prévoir mes moments à risque&quot;,&quot;Parler à quelqu&#x27;un quand c&#x27;est dur&quot;,&quot;Bouger régulièrement&quot;,&quot;Bien dormir&quot;,&quot;Me récompenser autrement&quot;,&quot;Faire un point chaque mois&quot;,&quot;Pas de téléphone au lit&quot;,&quot;Notifications coupées&quot;],&quot;identite&quot;:[&quot;qui décide de son temps&quot;,&quot;qui tient ses engagements&quot;,&quot;qui prend soin de lui&quot;,&quot;qui sait demander de l&#x27;aide&quot;,&quot;qui ose dire non&quot;,&quot;qui se réveille avec de l&#x27;énergie&quot;,&quot;qui choisit ses soirées&quot;,&quot;qui protège son argent&quot;,&quot;qui est présent avec ses proches&quot;,&quot;qui avance sur ses projets&quot;,&quot;qui se respecte&quot;,&quot;qui ne se juge plus durement&quot;],&quot;rewards&quot;:[&quot;Un bon repas au restaurant&quot;,&quot;Une sortie au cinéma&quot;,&quot;Un week-end dans la nature&quot;,&quot;Un vêtement qui me plaît&quot;,&quot;Un moment avec un ami&quot;,&quot;Une journée sans rien faire&quot;,&quot;Un livre ou un jeu&quot;,&quot;Un hammam ou un massage&quot;,&quot;Un petit voyage&quot;,&quot;Un cadeau pour quelqu&#x27;un&quot;],&quot;evening&quot;:[&quot;Fixer l&#x27;heure du coucher&quot;,&quot;Téléphone hors du lit&quot;,&quot;Écrans éteints 30 minutes avant&quot;,&quot;Douche ou tisane&quot;,&quot;Préparer la journée de demain&quot;,&quot;Respirer 2 minutes&quot;],&quot;people&quot;:[&quot;Un ami proche&quot;,&quot;Mon frère ou ma sœur&quot;,&quot;Mon conjoint ou ma conjointe&quot;,&quot;Un parent&quot;,&quot;Un collègue de confiance&quot;,&quot;Mon médecin&quot;],&quot;pause&quot;:[&quot;Lève-toi et étire-toi&quot;,&quot;Bois un verre d&#x27;eau, lentement&quot;,&quot;Regarde loin, par la fenêtre&quot;,&quot;Respire lentement 5 fois&quot;,&quot;Note ce que tu ressens, en une phrase&quot;]},&quot;days&quot;:[[&quot;Ton pourquoi&quot;,&quot;Avant de changer quoi que ce soit, il faut savoir pour quoi tu le fais. Ce pourquoi sera ta réserve les jours difficiles : il doit venir de toi, pas de ce qu&#x27;on attend de toi.&quot;,&quot;Écris 3 raisons personnelles de reprendre la main sur ton téléphone (dormir, être présent, avancer sur un projet…). Garde-les en note sur ton écran de verrouillage.&quot;,&quot;choose&quot;,{},{&quot;q&quot;:&quot;Qu&#x27;est-ce qui te pousse à changer aujourd&#x27;hui ?&quot;,&quot;o&quot;:[[&quot;Ma santé&quot;,&quot;Excellent moteur. Le corps commence à récupérer très tôt : chaque jour compte déjà, même si tu ne le sens pas encore.&quot;],[&quot;Mon argent&quot;,&quot;Chiffrer l&#x27;argent regagné est l&#x27;un des meilleurs rappels les jours difficiles. On le fera dans quelques jours.&quot;],[&quot;Mes proches&quot;,&quot;Faire ça pour les autres aide, mais garde aussi une raison rien que pour toi : c&#x27;est elle qui tient quand personne ne regarde.&quot;],[&quot;Je me sens dépassé(e)&quot;,&quot;C&#x27;est une raison valable. Tu n&#x27;as pas à tout régler aujourd&#x27;hui : un seul petit pas suffit pour commencer.&quot;]]},[&quot;Récompenses imprévisibles&quot;,&quot;Notifications et flux infini marchent comme une machine à surprises : on ne sait jamais si le prochain contenu sera bon, et le cerveau en redemande.&quot;,&quot;Compte combien de fois tu ouvres une appli sans raison.&quot;]],[&quot;Mesurer sans te juger&quot;,&quot;Ton téléphone sait déjà combien de temps tu y passes. Regarder le chiffre sans te traiter de nul, c&#x27;est le vrai premier pas : on ne règle pas ce qu&#x27;on ne regarde pas.&quot;,&quot;Ouvre « Temps d&#x27;écran » (iPhone) ou « Bien-être numérique » (Android). Note ta moyenne des 7 derniers jours et tes 3 applis les plus utilisées.&quot;,&quot;calc&quot;,{},{&quot;q&quot;:&quot;Ton estimation de ta semaine dernière, elle est…&quot;,&quot;o&quot;:[[&quot;Plutôt juste&quot;,&quot;C&#x27;est rare : la plupart des gens sous-estiment. Vérifie quand même avec les vrais chiffres ce soir.&quot;],[&quot;Sûrement en dessous de la réalité&quot;,&quot;C&#x27;est le cas de presque tout le monde : le cerveau oublie les automatismes. Mesurer sans te juger, c&#x27;est tout ce qu&#x27;on te demande.&quot;],[&quot;Je n&#x27;ose pas regarder&quot;,&quot;Normal : voir le chiffre pique un peu. C&#x27;est pourtant ce qui permet de reprendre la main. Regarde-le comme un simple relevé.&quot;],[&quot;Je n&#x27;en ai aucune idée&quot;,&quot;Alors note pendant 3 jours, une ligne à chaque fois. Les automatismes se voient dès qu&#x27;on les écrit.&quot;]]},[&quot;Tes yeux clignent moins&quot;,&quot;Devant un écran, on cligne environ deux fois moins, d&#x27;où sécheresse et fatigue visuelle.&quot;,&quot;Cligne 10 fois, puis regarde au loin 20 secondes.&quot;]],[&quot;Ce que ça t&#x27;apporte, ce que ça te coûte&quot;,&quot;Le scroll te donne quelque chose : fuir l&#x27;ennui, ne pas être seul, se sentir à jour. Le reconnaître permet de trouver d&#x27;autres façons d&#x27;obtenir la même chose. Ce n&#x27;est pas un manque de volonté, c&#x27;est une habitude qui te rend service.&quot;,&quot;Fais deux colonnes : ce que le téléphone t&#x27;apporte / ce qu&#x27;il te coûte (temps, sommeil, humeur, concentration). Souligne ce qui pèse le plus.&quot;,null,{},{&quot;q&quot;:&quot;Qu&#x27;est-ce que ça t&#x27;apporte de regarder ton téléphone ?&quot;,&quot;o&quot;:[[&quot;Me détendre&quot;,&quot;La détente est réelle mais courte : elle soulage surtout le manque que l&#x27;habitude crée. Respiration lente, marche ou douche chaude donnent un calme plus durable.&quot;],[&quot;Ne plus penser à rien&quot;,&quot;C&#x27;est un vrai besoin : ton cerveau veut une pause. Une vraie pause (marche, étirements) repose mieux et ne laisse pas de culpabilité.&quot;],[&quot;Me sentir moins seul(e)&quot;,&quot;Besoin légitime. Un message ou un appel, même court, y répond mieux et plus longtemps.&quot;],[&quot;Du plaisir, tout simplement&quot;,&quot;Le plaisir compte. L&#x27;idée n&#x27;est pas de t&#x27;en priver mais de le retrouver ailleurs : dans quelques jours tu choisiras tes remplaçants.&quot;]]},[&quot;Le coût d&#x27;une interruption&quot;,&quot;Après une interruption, il faut souvent 15 à 20 minutes pour retrouver sa concentration. Chaque coup d&#x27;œil au téléphone a un prix.&quot;,&quot;Fais une tâche 25 minutes sans téléphone.&quot;]],[&quot;Tes déclencheurs&quot;,&quot;Un déclencheur, c&#x27;est ce qui te fait sortir le téléphone sans y penser : une notification, l&#x27;ennui, une file d&#x27;attente, le lit, un moment de stress. Quand tu les repères, tu les vois venir.&quot;,&quot;Aujourd&#x27;hui, à chaque fois que tu prends ton téléphone, note l&#x27;heure et ce que tu ressens juste avant. Vise 10 notes.&quot;,&quot;heat&quot;,{},{&quot;q&quot;:&quot;Quand l&#x27;envie est-elle la plus forte ?&quot;,&quot;o&quot;:[[&quot;Le soir, seul(e)&quot;,&quot;Fatigue et solitude : le soir, le cerveau freine moins bien. Prévois quelque chose de précis pour ces heures-là.&quot;],[&quot;Quand je m&#x27;ennuie&quot;,&quot;L&#x27;ennui est un déclencheur très fréquent. Il retombe en quelques minutes si on ne le fuit pas : prépare une action de 5 minutes.&quot;],[&quot;Quand je suis stressé(e)&quot;,&quot;Le stress donne envie d&#x27;un soulagement rapide. Un souffle plus long à l&#x27;expiration (4 s / 6 s) calme le corps en 2 minutes.&quot;],[&quot;Avec d&#x27;autres personnes&quot;,&quot;Le contexte social pèse beaucoup. Dire à une personne que tu changes suffit souvent à désamorcer.&quot;]]},[&quot;Le réflexe du pouce&quot;,&quot;Une grande partie des ouvertures sont des automatismes déclenchés par un contexte (file d&#x27;attente, canapé), pas par un besoin.&quot;,&quot;Note le lieu de tes 3 prochaines ouvertures.&quot;]],[&quot;Rendre le scroll moins facile&quot;,&quot;Ta volonté est limitée, ton environnement peut faire le travail à ta place. Chaque petit obstacle, comme un mot de passe à retaper ou une appli rangée loin, réduit les ouvertures automatiques.&quot;,&quot;Coupe toutes les notifications sauf appels et messages de proches. Sors les 3 applis les plus utilisées de ton écran d&#x27;accueil et déconnecte-toi.&quot;,null,{},{&quot;q&quot;:&quot;Quelle barrière poses-tu en premier ?&quot;,&quot;o&quot;:[[&quot;Supprimer l&#x27;accès&quot;,&quot;Chaque étape en plus fait baisser le passage à l&#x27;acte : un obstacle de 20 secondes laisse souvent l&#x27;envie retomber.&quot;],[&quot;Changer de lieu ou d&#x27;horaire&quot;,&quot;Les habitudes sont liées à des lieux et des heures. Change l&#x27;un des deux et l&#x27;automatisme perd son déclencheur.&quot;],[&quot;Prévenir quelqu&#x27;un&quot;,&quot;Dire ton objectif à voix haute le rend plus réel et te donne un témoin bienveillant.&quot;],[&quot;Aucune, c&#x27;est trop dur&quot;,&quot;Prends la plus petite, une seule. Une barrière imparfaite vaut mieux qu&#x27;un plan parfait jamais appliqué.&quot;]]},[&quot;Un clic de plus&quot;,&quot;Ajouter de la friction (se déconnecter, ranger l&#x27;appli) réduit nettement les ouvertures impulsives.&quot;,&quot;Déconnecte-toi d&#x27;une appli maintenant.&quot;]],[&quot;Le plan « si… alors… »&quot;,&quot;Un plan précis marche mieux qu&#x27;une bonne intention. Tu décides à l&#x27;avance quoi faire quand le déclencheur arrive, pour ne pas avoir à choisir sous l&#x27;impulsion.&quot;,&quot;Écris 3 phrases : « Si je suis dans mon lit / en file d&#x27;attente / en pause, alors je… » avec une action concrète (lire 2 pages, regarder dehors, boire un verre d&#x27;eau).&quot;,&quot;pairs&quot;,{},{&quot;q&quot;:&quot;Quel plan « si… alors… » te ressemble ?&quot;,&quot;o&quot;:[[&quot;Si l&#x27;envie vient, je bois de l&#x27;eau et j&#x27;attends 10 minutes&quot;,&quot;Un délai court plus un geste simple : c&#x27;est très efficace. Les plans précis marchent bien mieux que les bonnes intentions.&quot;],[&quot;Si je m&#x27;ennuie, je sors 5 minutes&quot;,&quot;Bouger change l&#x27;état du corps et coupe l&#x27;automatisme. Même monter un escalier compte.&quot;],[&quot;Si je suis stressé(e), je respire 1 minute&quot;,&quot;Inspire 4 secondes, souffle 6 : l&#x27;expiration longue ralentit le cœur et calme le système nerveux.&quot;],[&quot;Si je craque, j&#x27;appelle quelqu&#x27;un&quot;,&quot;Parler casse l&#x27;isolement et la honte, qui poussent à recommencer.&quot;]]},[&quot;L&#x27;expiration longue&quot;,&quot;Souffler plus longtemps qu&#x27;on inspire active le frein du système nerveux et fait baisser le rythme cardiaque.&quot;,&quot;Inspire 4 s, souffle 6 s, cinq fois.&quot;]],[&quot;Bilan de la semaine 1&quot;,&quot;Une semaine pour comprendre. Tu sais maintenant combien de temps tu y passes, ce que ça te donne et quand ça se déclenche. C&#x27;est suffisant pour attaquer la suite.&quot;,&quot;Relis tes notes. Complète : « Ce que j&#x27;ai appris sur moi cette semaine, c&#x27;est… ». Choisis un seul moment de la journée à protéger la semaine prochaine.&quot;,null,{},{&quot;q&quot;:&quot;Cette semaine, qu&#x27;est-ce qui t&#x27;a le plus surpris(e) ?&quot;,&quot;o&quot;:[[&quot;À quel point c&#x27;est automatique&quot;,&quot;Voir l&#x27;automatisme, c&#x27;est déjà la moitié du chemin : on ne peut changer que ce qu&#x27;on remarque.&quot;],[&quot;Les moments où l&#x27;envie arrive&quot;,&quot;Tu connais maintenant tes heures et tes lieux : tu peux les anticiper au lieu de les subir.&quot;],[&quot;Que ça passe quand j&#x27;attends&quot;,&quot;C&#x27;est l&#x27;info la plus utile : une envie qui passe n&#x27;est pas un ordre.&quot;],[&quot;Rien de spécial&quot;,&quot;Pas grave, c&#x27;est une semaine d&#x27;observation. Continue : les effets arrivent avec la pratique.&quot;]]},[&quot;Lumière bleue et sommeil&quot;,&quot;La lumière des écrans le soir retarde la mélatonine, l&#x27;hormone qui signale la nuit. S&#x27;endormir prend plus de temps.&quot;,&quot;Coupe les écrans 30 minutes avant de dormir.&quot;]],[&quot;Comprendre l&#x27;envie&quot;,&quot;L&#x27;envie de regarder ton téléphone monte, atteint un pic, puis retombe, même si tu ne fais rien. Savoir que ça passe change tout : une envie n&#x27;est pas un ordre.&quot;,&quot;Quand l&#x27;envie arrive, attends 2 minutes avant d&#x27;agir. Observe : où la sens-tu dans le corps ? Que devient-elle au bout de 2 minutes ?&quot;,&quot;wave&quot;,{},{&quot;q&quot;:&quot;Quand l&#x27;envie arrive, que fais-tu d&#x27;habitude ?&quot;,&quot;o&quot;:[[&quot;Je cède tout de suite&quot;,&quot;Normal : céder soulage vite, et c&#x27;est ce qui apprend au cerveau à recommencer. Aujourd&#x27;hui, repousse seulement de 10 minutes.&quot;],[&quot;Je lutte de toutes mes forces&quot;,&quot;Lutter épuise. Observe l&#x27;envie comme une vague : elle monte, plafonne, redescend. Laisse-la passer sans la combattre.&quot;],[&quot;Je me distrais&quot;,&quot;Très bien : 10 minutes de distraction suffisent souvent. Prépare-en deux à l&#x27;avance, à portée de main.&quot;],[&quot;Je ne sais pas&quot;,&quot;Aujourd&#x27;hui, note l&#x27;heure et ce que tu ressens quand elle vient. Un schéma va apparaître.&quot;]]},[&quot;Une envie dure peu&quot;,&quot;Une envie atteint un pic puis retombe en quelques minutes si on ne la nourrit pas.&quot;,&quot;Chronomètre ta prochaine envie.&quot;]],[&quot;La règle des 10 minutes&quot;,&quot;Quand une envie arrive, ne te dis pas « jamais », dis-toi « dans 10 minutes ». Souvent, l&#x27;envie est partie avant. Si elle est encore là, tu y vas en conscience, pas en automatique.&quot;,&quot;Utilise le bouton SOS du site (ou un minuteur de 10 minutes) à chaque envie aujourd&#x27;hui. Compte combien sont passées.&quot;,&quot;hold&quot;,{},{&quot;q&quot;:&quot;Peux-tu tenir 10 minutes avant de passer à l&#x27;acte ?&quot;,&quot;o&quot;:[[&quot;Oui, facilement&quot;,&quot;Alors fais-en une règle : la plupart des envies retombent avant 10 minutes.&quot;],[&quot;Oui, avec une distraction&quot;,&quot;Parfait. Prépare deux distractions : musique, verre d&#x27;eau, marche. Elles font la moitié du travail.&quot;],[&quot;Difficile&quot;,&quot;Commence par 2 minutes. Chaque envie traversée entraîne ton cerveau à tolérer l&#x27;inconfort.&quot;],[&quot;Impossible&quot;,&quot;Pas de souci : 1 minute compte déjà. Le bouton SOS te guide pendant 10 minutes, un souffle après l&#x27;autre.&quot;]]},[&quot;Le pouvoir du délai&quot;,&quot;Attendre 10 minutes laisse l&#x27;émotion redescendre et la partie réfléchie du cerveau (cortex préfrontal) reprendre la main.&quot;,&quot;Lance un minuteur de 10 minutes avant de céder.&quot;]],[&quot;Respirer pour retomber&quot;,&quot;Quand tu veux décrocher, le corps s&#x27;agite. Une respiration lente, avec un souffle plus long que l&#x27;inspiration, aide à calmer le système nerveux en quelques minutes.&quot;,&quot;Fais 2 minutes de respiration (inspire 4 secondes, souffle 6), deux fois dans la journée, dont une avant de prendre ton téléphone par réflexe.&quot;,&quot;breathe&quot;,{},{&quot;q&quot;:&quot;Quand tu es tendu(e), ton souffle est plutôt…&quot;,&quot;o&quot;:[[&quot;Court et haut&quot;,&quot;Respirer haut met le corps en alerte. Allonge l&#x27;expiration : c&#x27;est le levier le plus rapide pour te calmer.&quot;],[&quot;Je le retiens parfois&quot;,&quot;Retenir son souffle augmente la tension. Souffle doucement par la bouche, comme dans une paille.&quot;],[&quot;Je n&#x27;y ai jamais fait attention&quot;,&quot;Pose une main sur le ventre : si elle ne bouge pas, ta respiration est haute. Essaie de la faire gonfler.&quot;],[&quot;Plutôt calme&quot;,&quot;Bien. Garde ce réflexe pour les moments d&#x27;envie, c&#x27;est là qu&#x27;il compte le plus.&quot;]]},[&quot;Le nerf vague&quot;,&quot;Respirer lentement stimule le nerf vague, qui ralentit le cœur et apaise. Quelques minutes suffisent.&quot;,&quot;Deux minutes de respiration avant de prendre ton téléphone.&quot;]],[&quot;Quand tu t&#x27;ennuies&quot;,&quot;L&#x27;ennui est l&#x27;un des premiers déclencheurs. Il est inconfortable parce qu&#x27;on ne le laisse jamais durer. T&#x27;y habituer, c&#x27;est retrouver des idées et de l&#x27;attention.&quot;,&quot;Choisis un moment d&#x27;ennui (transport, attente, repas) et laisse ton téléphone dans la poche. Note ce qui te passe par la tête.&quot;,&quot;slot&quot;,{},{&quot;q&quot;:&quot;Pour t&#x27;occuper 10 minutes, tu préfères…&quot;,&quot;o&quot;:[[&quot;Bouger&quot;,&quot;Le mouvement réduit les envies et améliore l&#x27;humeur en quelques minutes.&quot;],[&quot;Parler à quelqu&#x27;un&quot;,&quot;Une voix humaine apaise plus vite qu&#x27;un écran ou un produit.&quot;],[&quot;Faire quelque chose de mes mains&quot;,&quot;Cuisine, dessin, rangement : occuper les mains occupe aussi l&#x27;attention, l&#x27;envie perd de la place.&quot;],[&quot;Rien ne me tente&quot;,&quot;Normal au début : l&#x27;envie rend tout fade. Essaie quand même 3 minutes, l&#x27;envie baisse avant que l&#x27;activité ne devienne agréable.&quot;]]},[&quot;L&#x27;ennui est utile&quot;,&quot;Quand l&#x27;attention n&#x27;est pas stimulée, le cerveau passe en « mode par défaut », lié à la créativité et à la mémoire.&quot;,&quot;Reste 3 minutes sans rien faire, juste à observer.&quot;]],[&quot;Stress et fatigue&quot;,&quot;On scrolle davantage quand on est stressé ou fatigué : le cerveau cherche une pause facile. Si tu t&#x27;accordes de vraies pauses à ces moments, le téléphone devient moins nécessaire.&quot;,&quot;Prévois 3 pauses de 5 minutes sans écran aujourd&#x27;hui : étirements, fenêtre ouverte, verre d&#x27;eau, marche.&quot;,null,{},{&quot;q&quot;:&quot;Quand tu es stressé(e), ton corps réagit surtout par…&quot;,&quot;o&quot;:[[&quot;De la tension (épaules, mâchoire)&quot;,&quot;Relâche : épaules vers le bas, mâchoire détendue, trois souffles lents.&quot;],[&quot;De la fatigue&quot;,&quot;La fatigue baisse le frein de la volonté. Une sieste de 15 à 20 minutes aide, sinon couche-toi plus tôt ce soir.&quot;],[&quot;De l&#x27;agitation&quot;,&quot;Marche rapide 5 minutes : elle dépense l&#x27;adrénaline en trop.&quot;],[&quot;Je ne sais pas&quot;,&quot;Scanne : tête, épaules, ventre, jambes. Où ça serre ? C&#x27;est là qu&#x27;il faut respirer.&quot;]]},[&quot;Le cortisol&quot;,&quot;Le stress élève le cortisol et pousse vers un soulagement rapide. Marcher 10 minutes aide à le faire redescendre.&quot;,&quot;Marche 10 minutes sans téléphone.&quot;]],[&quot;Réseaux sociaux et comparaison&quot;,&quot;Les réseaux montrent le meilleur de la vie des autres, et s&#x27;y comparer fatigue. Tu peux garder ce qui t&#x27;apporte quelque chose et couper le reste.&quot;,&quot;Mets en sourdine ou désabonne-toi de 10 comptes qui te donnent un mauvais sentiment. Garde ceux qui t&#x27;apprennent ou te font rire.&quot;,&quot;myths&quot;,{},{&quot;q&quot;:&quot;Quelle idée te retient le plus ?&quot;,&quot;o&quot;:[[&quot;J&#x27;en ai besoin pour me détendre ou dormir&quot;,&quot;Ça détend sur l&#x27;instant mais entretient le manque ensuite. À terme, la détente et le sommeil naturels reviennent.&quot;],[&quot;Je gère, ce n&#x27;est pas un problème&quot;,&quot;Si tu es ici, c&#x27;est que tu veux plus de contrôle. Fais confiance à ça.&quot;],[&quot;Tout le monde le fait&quot;,&quot;Beaucoup le font, et beaucoup changent aussi. Tu n&#x27;es pas seul(e) dans les deux cas.&quot;],[&quot;Juste une fois ne compte pas&quot;,&quot;Chaque fois renforce le circuit de l&#x27;habitude. L&#x27;exception est souvent la porte d&#x27;entrée.&quot;]]},[&quot;La comparaison sociale&quot;,&quot;Voir des vies filtrées active la comparaison, associée à une humeur plus basse chez beaucoup de gros utilisateurs.&quot;,&quot;Désabonne-toi de 3 comptes qui te font te sentir mal.&quot;]],[&quot;Bilan de la semaine 2&quot;,&quot;Tu as appris à voir l&#x27;envie venir et à la laisser passer. Même quelques envies surmontées comptent : ce sont elles qui construisent la nouvelle habitude.&quot;,&quot;Regarde ton compteur d&#x27;envies surmontées. Note le moment le plus dur de la semaine et ce qui t&#x27;a aidé.&quot;,null,{},{&quot;q&quot;:&quot;Ce qui t&#x27;a le plus aidé(e) cette semaine ?&quot;,&quot;o&quot;:[[&quot;Attendre 10 minutes&quot;,&quot;Garde-le : c&#x27;est ton outil principal. Il marche d&#x27;autant mieux qu&#x27;il est automatique.&quot;],[&quot;Respirer&quot;,&quot;La respiration est toujours avec toi. Utilise-la avant que l&#x27;envie ne soit à son maximum.&quot;],[&quot;Éloigner ce qui donne accès&quot;,&quot;Bien joué : réduire l&#x27;accès est l&#x27;une des méthodes les plus solides.&quot;],[&quot;Rien de précis&quot;,&quot;Pas grave. Regarde le bilan : tu as peut-être tenu plus que tu ne le penses.&quot;]]},[&quot;L&#x27;attention se reconstruit&quot;,&quot;L&#x27;attention se muscle : des plages sans interruption la réentraînent peu à peu.&quot;,&quot;Lis 20 minutes sans téléphone.&quot;]],[&quot;Remplacer, pas seulement enlever&quot;,&quot;Si tu enlèves une habitude sans rien mettre à la place, le vide la rappelle. Choisis des activités simples, accessibles, qui occupent les mains ou la tête.&quot;,&quot;Liste 5 activités de 10 minutes faisables n&#x27;importe où (livre, dessin, appel à un ami, podcast, étirements). Garde la liste en fond d&#x27;écran.&quot;,null,{},{&quot;q&quot;:&quot;Quel remplaçant te semble le plus réaliste ?&quot;,&quot;o&quot;:[[&quot;Un geste (eau, étirements)&quot;,&quot;Les petits gestes sont faciles à répéter. Garde-les à portée de main.&quot;],[&quot;Une activité courte (marche, jeu)&quot;,&quot;Dix minutes suffisent souvent. Choisis-en une que tu peux faire n&#x27;importe où.&quot;],[&quot;Une personne (appel, message)&quot;,&quot;Un lien humain est l&#x27;un des meilleurs remplaçants. Mets 2 prénoms dans tes favoris.&quot;],[&quot;Je n&#x27;en ai pas encore&quot;,&quot;Essaie les trois cette semaine. Tu verras vite lequel marche pour toi.&quot;]]},[&quot;Les endorphines du mouvement&quot;,&quot;L&#x27;activité physique libère des substances de l&#x27;humeur (endorphines, dopamine) sans effet « pot sans fond ».&quot;,&quot;Cinq minutes de mouvement quand l&#x27;envie arrive.&quot;]],[&quot;Bouger&quot;,&quot;Le mouvement change l&#x27;humeur et l&#x27;énergie, et occupe le temps où tu aurais scrollé. Pas besoin de sport intense : marcher compte.&quot;,&quot;Marche 20 minutes aujourd&#x27;hui, sans écran. Un podcast est autorisé.&quot;,&quot;move&quot;,{},{&quot;q&quot;:&quot;Ton niveau de mouvement dans une journée ?&quot;,&quot;o&quot;:[[&quot;Presque aucun&quot;,&quot;Commence par 5 minutes de marche : c&#x27;est déjà un effet mesurable sur l&#x27;humeur.&quot;],[&quot;Un peu&quot;,&quot;Ajoute 10 minutes à l&#x27;heure où l&#x27;envie est la plus forte.&quot;],[&quot;Régulier&quot;,&quot;Excellent. Place-le aux heures à risque : c&#x27;est là qu&#x27;il protège le plus.&quot;],[&quot;Beaucoup&quot;,&quot;Parfait. N&#x27;oublie pas le repos : il fait partie de la récupération.&quot;]]},[&quot;Marcher aide le cerveau&quot;,&quot;Marcher 10 à 15 minutes améliore souvent l&#x27;humeur et l&#x27;attention, et réduit l&#x27;envie sur le moment.&quot;,&quot;Une marche, sans écouteurs.&quot;]],[&quot;Soirées et week-ends&quot;,&quot;Les moments sans cadre sont les plus risqués. Un planning léger, même flou, évite de glisser dans le scroll par défaut.&quot;,&quot;Planifie ce week-end 2 activités concrètes hors écran, avec un horaire.&quot;,null,{},{&quot;q&quot;:&quot;Le plus dur dans tes week-ends, c&#x27;est…&quot;,&quot;o&quot;:[[&quot;Le temps libre&quot;,&quot;Prévois deux activités par jour : le vide appelle l&#x27;habitude.&quot;],[&quot;Les amis&quot;,&quot;Propose un lieu ou une activité sans l&#x27;habitude, ou dis-le d&#x27;avance. Les vrais amis comprennent.&quot;],[&quot;Le soir tard&quot;,&quot;Fixe une heure limite de coucher : la fatigue baisse les défenses.&quot;],[&quot;Rien de particulier&quot;,&quot;Prévois quand même un plan B, au cas où.&quot;]]},[&quot;Le soir, la volonté baisse&quot;,&quot;En fin de journée, fatigue et décisions accumulées réduisent l&#x27;autocontrôle : on cède plus facilement.&quot;,&quot;Mets ton téléphone en charge hors de la chambre.&quot;]],[&quot;En parler à quelqu&#x27;un&quot;,&quot;Dire à un proche ce que tu fais t&#x27;engage et te soutient. Tu n&#x27;as pas à te justifier : une phrase simple suffit.&quot;,&quot;Dis à une personne de confiance que tu réduis ton temps d&#x27;écran. Propose-lui de te demander des nouvelles ce soir.&quot;,null,{},{&quot;q&quot;:&quot;À qui pourrais-tu en parler ?&quot;,&quot;o&quot;:[[&quot;Un(e) ami(e)&quot;,&quot;Un ami de confiance suffit. Dis simplement : « j&#x27;essaie de changer, peux-tu me demander demain comment ça va ? »&quot;],[&quot;Un proche de la famille&quot;,&quot;Choisis la personne la plus calme et la moins critique. Un message écrit peut être plus facile.&quot;],[&quot;Un professionnel ou une ligne d&#x27;aide&quot;,&quot;Excellente idée : ton médecin est là pour ça, gratuitement et sans jugement.&quot;],[&quot;Personne pour l&#x27;instant&quot;,&quot;C&#x27;est possible, et ce n&#x27;est pas grave. Une ligne d&#x27;aide (ton médecin) peut être ton premier interlocuteur.&quot;]]},[&quot;Le contact apaise&quot;,&quot;Parler à quelqu&#x27;un de confiance fait baisser la réaction au stress, souvent plus qu&#x27;un écran.&quot;,&quot;Appelle quelqu&#x27;un au lieu de scroller.&quot;]],[&quot;Les pensées-pièges&quot;,&quot;« Juste cinq minutes », « je l&#x27;ai bien mérité », « je regarde juste un truc ». Ces phrases sont normales. Les repérer leur enlève du pouvoir.&quot;,&quot;Écris 3 phrases que tu te dis souvent avant de scroller. À côté de chacune, une réponse honnête et courte.&quot;,&quot;pieges&quot;,{},{&quot;q&quot;:&quot;Quelle pensée te fait le plus craquer ?&quot;,&quot;o&quot;:[[&quot;« Juste une fois »&quot;,&quot;C&#x27;est le piège le plus courant. Réponse : « si c&#x27;est juste une fois, je peux attendre demain ».&quot;],[&quot;« Je l&#x27;ai bien mérité »&quot;,&quot;Oui, et tu peux te récompenser autrement : repas, film, sortie. Sans la facture.&quot;],[&quot;« Je m&#x27;y mets demain »&quot;,&quot;Demain sera pareil. Réponse : « je commence par les 10 prochaines minutes ».&quot;],[&quot;« J&#x27;ai déjà craqué, tant pis »&quot;,&quot;Un faux pas n&#x27;efface pas les jours passés. Reprends dès la prochaine heure.&quot;]]},[&quot;Le cerveau négocie&quot;,&quot;Pour obtenir un soulagement rapide, le cerveau fabrique des excuses (« juste 5 minutes »). Les repérer leur enlève du pouvoir.&quot;,&quot;Note ta pensée-piège préférée.&quot;]],[&quot;Te récompenser autrement&quot;,&quot;Ton cerveau aime les petites récompenses. Tu peux en garder sans passer par l&#x27;écran : un café, un moment dehors, une série à plusieurs.&quot;,&quot;Choisis une récompense pour chaque jour tenu cette semaine. Note-la maintenant.&quot;,null,{},{&quot;q&quot;:&quot;Quelle récompense te ferait vraiment plaisir ?&quot;,&quot;o&quot;:[[&quot;Un bon repas&quot;,&quot;Parfait : choisis le jour et le lieu à l&#x27;avance, une récompense prévue motive mieux qu&#x27;une récompense improvisée.&quot;],[&quot;Une sortie&quot;,&quot;Planifie-la dans ton agenda dès aujourd&#x27;hui : l&#x27;avoir devant soi aide à tenir.&quot;],[&quot;Un achat&quot;,&quot;Mets de côté la somme économisée dans une enveloppe : la voir grossir motive.&quot;],[&quot;Du repos&quot;,&quot;Le repos est une vraie récompense. Offre-toi une soirée sans obligation.&quot;]]},[&quot;La récompense prévue&quot;,&quot;Une récompense choisie à l&#x27;avance renforce un nouveau comportement mieux qu&#x27;une récompense improvisée.&quot;,&quot;Choisis ta récompense de la semaine.&quot;]],[&quot;Bilan de la semaine 3&quot;,&quot;Trois semaines de pratique. Regarde les chiffres, pas ton impression : on se juge toujours plus sévèrement qu&#x27;on ne le mérite.&quot;,&quot;Compare ton temps d&#x27;écran moyen de la semaine à celui du jour 2. Écris l&#x27;écart, quel qu&#x27;il soit.&quot;,null,{},{&quot;q&quot;:&quot;Ce qui a changé depuis le début ?&quot;,&quot;o&quot;:[[&quot;Mon sommeil&quot;,&quot;Un meilleur sommeil réduit l&#x27;impulsivité : c&#x27;est un cercle vertueux qui s&#x27;installe.&quot;],[&quot;Mon humeur&quot;,&quot;Chaque jour, le cerveau se rééquilibre un peu. L&#x27;humeur suit souvent avec un décalage.&quot;],[&quot;Mon argent&quot;,&quot;Note la somme : c&#x27;est un des gains les plus concrets.&quot;],[&quot;Pas encore grand-chose&quot;,&quot;Normal : les changements sont souvent lents au début. Continue, ils arrivent avec la régularité.&quot;]]},[&quot;Le sommeil répare&quot;,&quot;Moins d&#x27;écran le soir améliore souvent la qualité du sommeil, et un sommeil réparateur réduit l&#x27;impulsivité.&quot;,&quot;Note l&#x27;heure à laquelle tu te réveilles demain.&quot;]],[&quot;Un dérapage n&#x27;est pas une rechute&quot;,&quot;Tu vas peut-être craquer une soirée. Ce n&#x27;est pas un échec, c&#x27;est une information. Ce qui compte, c&#x27;est de reprendre le fil le lendemain, sans te punir.&quot;,&quot;Écris la phrase que tu te diras après un gros dérapage. Courte, bienveillante, qui te remet en route.&quot;,&quot;scenario&quot;,{},{&quot;q&quot;:&quot;Si tu craques ce soir, tu te diras…&quot;,&quot;o&quot;:[[&quot;« Je suis nul(le) »&quot;,&quot;La honte nourrit le cycle. Parle-toi comme à un ami : « ça arrive, je reprends ».&quot;],[&quot;« C&#x27;est une information »&quot;,&quot;Exactement. Note ce qui l&#x27;a déclenché et ajuste ton plan.&quot;],[&quot;« Autant tout lâcher »&quot;,&quot;C&#x27;est l&#x27;effet « tant pis », le vrai piège. Reprends au prochain repas, pas à la prochaine semaine.&quot;],[&quot;« Je préviens quelqu&#x27;un »&quot;,&quot;Excellent réflexe : ça casse l&#x27;isolement et la honte.&quot;]]},[&quot;Un faux pas, pas une chute&quot;,&quot;Un dérapage ne défait pas les circuits déjà en place : ce qui compte, c&#x27;est la régularité dans la durée.&quot;,&quot;Écris ta phrase de reprise.&quot;]],[&quot;Ton plan en cas de rechute&quot;,&quot;Prévoir le plan B enlève la peur. Qu&#x27;est-ce qui m&#x27;a fait craquer ? Qu&#x27;est-ce que je change ? Qui je préviens ?&quot;,&quot;Rédige un plan en 3 points : ce que je fais dans l&#x27;heure, ce que j&#x27;analyse, ce que j&#x27;ajuste.&quot;,&quot;relapse&quot;,{},{&quot;q&quot;:&quot;En cas de rec uot;Dans mon lit&quot;,&quot;Téléphone hors du lit&quot;],[&quot;Une envie forte&quot;,&quot;Changer de pièce&quot;]],&quot;pieges&quot;:[[&quot;Juste une fois.&quot;,true,&quot;« Juste une fois » est la phrase qui relance le cycle.&quot;],[&quot;Personne ne le saura.&quot;,true,&quot;Toi, tu le sauras. Et la culpabilité reviendra.&quot;],[&quot;L&#x27;envie va passer si je change de pièce.&quot;,false,&quot;Oui. Changer de lieu coupe souvent l&#x27;automatisme.&quot;],[&quot;Je l&#x27;ai bien mérité.&quot;,true,&quot;Tu peux te récompenser autrement : un bon repas, un film, un moment avec des amis.&quot;],[&quot;Je peux en parler à quelqu&#x27;un de confiance.&quot;,false,&quot;Oui. Garder ça pour soi entretient la honte.&quot;],[&quot;Ça me détend, il n&#x27;y a pas de mal.&quot;,true,&quot;Ça détend sur le moment, mais ça laisse souvent de la culpabilité.&quot;],[&quot;Un dérapage n&#x27;est pas un échec.&quot;,false,&quot;Exact. Tu reprends le fil sans te punir.&quot;],[&quot;Je gère, je n&#x27;ai besoin de rien changer.&quot;,true,&quot;Si tu es ici, c&#x27;est que tu veux changer. Fais confiance à ça.&quot;]],&quot;scenarios&quot;:[{&quot;q&quot;:&quot;Il est minuit, tu es seul, fatigué, le téléphone à la main. L&#x27;envie monte.&quot;,&quot;c&quot;:[[&quot;Je laisse le téléphone dans la chambre et je vais dans une autre pièce&quot;,2,&quot;Parfait : tu changes de lieu et tu coupes l&#x27;accès.&quot;],[&quot;Je me dis que c&#x27;est la dernière fois&quot;,0,&quot;« La dernière fois » revient presque toujours. Mieux vaut agir maintenant.&quot;],[&quot;Je regarde juste mes messages&quot;,1,&quot;Pas idéal : le téléphone au lit reste le déclencheur.&quot;]]},{&quot;q&quot;:&quot;Tu as une dispute avec ton partenaire et tu te sens nul.&quot;,&quot;c&quot;:[[&quot;Je sors marcher 10 minutes&quot;,2,&quot;Bien : tu laisses redescendre l&#x27;émotion sans passer par l&#x27;habitude.&quot;],[&quot;J&#x27;ouvre un onglet pour me détendre&quot;,0,&quot;Tu apaises sur le moment, mais la culpabilité arrive ensuite.&quot;],[&quot;Je mets de la musique&quot;,1,&quot;Ça aide un peu. Ajoute un changement de pièce.&quot;]]},{&quot;q&quot;:&quot;Tu as craqué hier soir. Ce matin, tu te sens honteux.&quot;,&quot;c&quot;:[[&quot;Je me dis que je ne m&#x27;en sortirai jamais&quot;,0,&quot;La honte fatigue et pousse à recommencer.&quot;],[&quot;Je note ce qui a déclenché l&#x27;envie et je reprends aujourd&#x27;hui&quot;,2,&quot;C&#x27;est exactement ça : une information, pas une fin.&quot;],[&quot;Je fais comme si rien ne s&#x27;était passé&quot;,1,&quot;Mieux vaut regarder ce qui s&#x27;est passé pour mieux t&#x27;en protéger.&quot;]]}],&quot;relapse&quot;:{&quot;heure&quot;:[&quot;Je ferme tout et je change de pièce&quot;,&quot;Je prends une douche et je respire&quot;,&quot;Je note ce qui s&#x27;est passé&quot;],&quot;ajuster&quot;:[&quot;Je renforce mon filtre&quot;,&quot;Je change mes soirées seul&quot;,&quot;Je parle à quelqu&#x27;un&quot;],&quot;prevenir&quot;:[&quot;Un ami proche&quot;,&quot;Mon frère ou ma sœur&quot;,&quot;Mon conjoint ou ma conjointe&quot;,&quot;Un professionnel&quot;,&quot;Personne, je gère seul&quot;]},&quot;events&quot;:[&quot;Soirée seul&quot;,&quot;Voyage ou hôtel&quot;,&quot;Période de stress&quot;,&quot;Après une dispute&quot;,&quot;Week-end seul&quot;,&quot;Nuit sans sommeil&quot;],&quot;messages&quot;:[&quot;J&#x27;essaie de changer une habitude. Peux-tu me demander de mes nouvelles cette semaine ?&quot;,&quot;Je traverse une période difficile. Tu pourrais m&#x27;appeler ce soir ?&quot;],&quot;rules&quot;:[&quot;Garder mes barrières en place&quot;,&quot;Utiliser le bouton SOS à chaque envie&quot;,&quot;Prévoir mes moments à risque&quot;,&quot;Parler à quelqu&#x27;un quand c&#x27;est dur&quot;,&quot;Bouger régulièrement&quot;,&quot;Bien dormir&quot;,&quot;Me récompenser autrement&quot;,&quot;Faire un point chaque mois&quot;,&quot;Garder mon filtre actif&quot;,&quot;Pas de téléphone dans le lit&quot;],&quot;identite&quot;:[&quot;qui décide de son temps&quot;,&quot;qui tient ses engagements&quot;,&quot;qui prend soin de lui&quot;,&quot;qui sait demander de l&#x27;aide&quot;,&quot;qui ose dire non&quot;,&quot;qui se réveille avec de l&#x27;énergie&quot;,&quot;qui choisit ses soirées&quot;,&quot;qui protège son argent&quot;,&quot;qui est présent avec ses proches&quot;,&quot;qui avance sur ses projets&quot;,&quot;qui se respecte&quot;,&quot;qui ne se juge plus durement&quot;],&quot;rewards&quot;:[&quot;Un bon repas au restaurant&quot;,&quot;Une sortie au cinéma&quot;,&quot;Un week-end dans la nature&quot;,&quot;Un vêtement qui me plaît&quot;,&quot;Un moment avec un ami&quot;,&quot;Une journée sans rien faire&quot;,&quot;Un livre ou un jeu&quot;,&quot;Un hammam ou un massage&quot;,&quot;Un petit voyage&quot;,&quot;Un cadeau pour quelqu&#x27;un&quot;],&quot;evening&quot;:[&quot;Fixer l&#x27;heure du coucher&quot;,&quot;Téléphone hors du lit&quot;,&quot;Écrans éteints 30 minutes avant&quot;,&quot;Douche ou tisane&quot;,&quot;Préparer la journée de demain&quot;,&quot;Respirer 2 minutes&quot;],&quot;people&quot;:[&quot;Un ami proche&quot;,&quot;Mon frère ou ma sœur&quot;,&quot;Mon conjoint ou ma conjointe&quot;,&quot;Un parent&quot;,&quot;Un collègue de confiance&quot;,&quot;Mon médecin&quot;],&quot;pause&quot;:[&quot;Lève-toi et étire-toi&quot;,&quot;Bois un verre d&#x27;eau, lentement&quot;,&quot;Regarde loin, par la fenêtre&quot;,&quot;Respire lentement 5 fois&quot;,&quot;Note ce que tu ressens, en une phrase&quot;]},&quot;days&quot;:[[&quot;Ton pourquoi&quot;,&quot;Pas pour la honte, pour toi. Les raisons qui tiennent dans le temps sont positives : plus d&#x27;énergie, de concentration, de présence, des relations plus vraies. Ce pourquoi sera ta réserve les jours difficiles.&quot;,&quot;Écris 3 raisons personnelles de vouloir changer. Évite « parce que c&#x27;est mal » : cherche ce que tu veux gagner.&quot;,&quot;choose&quot;,{},{&quot;q&quot;:&quot;Qu&#x27;est-ce qui te pousse à changer aujourd&#x27;hui ?&quot;,&quot;o&quot;:[[&quot;Ma santé&quot;,&quot;Excellent moteur. Le corps commence à récupérer très tôt : chaque jour compte déjà, même si tu ne le sens pas encore.&quot;],[&quot;Mon argent&quot;,&quot;Chiffrer l&#x27;argent regagné est l&#x27;un des meilleurs rappels les jours difficiles. On le fera dans quelques jours.&quot;],[&quot;Mes proches&quot;,&quot;Faire ça pour les autres aide, mais garde aussi une raison rien que pour toi : c&#x27;est elle qui tient quand personne ne regarde.&quot;],[&quot;Je me sens dépassé(e)&quot;,&quot;C&#x27;est une raison valable. Tu n&#x27;as pas à tout régler aujourd&#x27;hui : un seul petit pas suffit pour commencer.&quot;]]},[&quot;Le circuit de la récompense&quot;,&quot;Le plaisir sexuel libère de la dopamine. Avec une nouveauté infinie à portée de clic, le cerveau peut s&#x27;habituer à chercher toujours plus de stimulation.&quot;,&quot;Note ce que tu cherchais vraiment : détente, ennui, solitude ?&quot;]],[&quot;Regarder honnêtement&quot;,&quot;On ne règle pas ce qu&#x27;on ne regarde pas. Mesurer ton habitude sans te juger, c&#x27;est te donner un point de départ réel.&quot;,&quot;Pendant 7 jours, note chaque fois : heure, lieu, durée, ce que tu ressentais avant. Aujourd&#x27;hui, reprends les 7 derniers jours de mémoire.&quot;,&quot;calc&quot;,{},{&quot;q&quot;:&quot;Ton estimation de ta semaine dernière, elle est…&quot;,&quot;o&quot;:[[&quot;Plutôt juste&quot;,&quot;C&#x27;est rare : la plupart des gens sous-estiment. Vérifie quand même avec les vrais chiffres ce soir.&quot;],[&quot;Sûrement en dessous de la réalité&quot;,&quot;C&#x27;est le cas de presque tout le monde : le cerveau oublie les automatismes. Mesurer sans te juger, c&#x27;est tout ce qu&#x27;on te demande.&quot;],[&quot;Je n&#x27;ose pas regarder&quot;,&quot;Normal : voir le chiffre pique un peu. C&#x27;est pourtant ce qui permet de reprendre la main. Regarde-le comme un simple relevé.&quot;],[&quot;Je n&#x27;en ai aucune idée&quot;,&quot;Alors note pendant 3 jours, une ligne à chaque fois. Les automatismes se voient dès qu&#x27;on les écrit.&quot;]]},[&quot;La nouveauté relance&quot;,&quot;Le cerveau réagit fortement à la nouveauté : le défilement de contenus la renouvelle sans fin et allonge les sessions.&quot;,&quot;Note la durée de ta dernière session.&quot;]],[&quot;Ce que ça t&#x27;apporte, ce que ça te coûte&quot;,&quot;Cette habitude te rend service : elle calme le stress, comble l&#x27;ennui ou la solitude. Le reconnaître permet de chercher d&#x27;autres façons d&#x27;obtenir la même chose. Elle a aussi un coût : temps, sommeil, culpabilité, attentes irréalistes.&quot;,&quot;Fais deux colonnes : ce que ça t&#x27;apporte / ce que ça te coûte. Souligne ce qui pèse le plus.&quot;,null,{},{&quot;q&quot;:&quot;Qu&#x27;est-ce que ça t&#x27;apporte de regarder du porno ?&quot;,&quot;o&quot;:[[&quot;Me détendre&quot;,&quot;La détente est réelle mais courte : elle soulage surtout le manque que l&#x27;habitude crée. Respiration lente, marche ou douche chaude donnent un calme plus durable.&quot;],[&quot;Ne plus penser à rien&quot;,&quot;C&#x27;est un vrai besoin : ton cerveau veut une pause. Une vraie pause (marche, étirements) repose mieux et ne laisse pas de culpabilité.&quot;],[&quot;Me sentir moins seul(e)&quot;,&quot;Besoin légitime. Un message ou un appel, même court, y répond mieux et plus longtemps.&quot;],[&quot;Du plaisir, tout simplement&quot;,&quot;Le plaisir compte. L&#x27;idée n&#x27;est pas de t&#x27;en priver mais de le retrouver ailleurs : dans quelques jours tu choisiras tes remplaçants.&quot;]]},[&quot;Un soulagement bref&quot;,&quot;Beaucoup l&#x27;utilisent pour calmer le stress. Le soulagement est réel mais bref, et laisse souvent de la culpabilité.&quot;,&quot;Note comment tu te sens 10 minutes après.&quot;]],[&quot;Tes déclencheurs&quot;,&quot;Heure, lieu, émotion, appareil : ce sont les signaux qui déclenchent l&#x27;envie. Ennui, stress, solitude, fatigue et alcool reviennent souvent. Quand tu les repères, tu les vois venir.&quot;,&quot;Relis tes notes du jour 2. Repère les 3 déclencheurs les plus fréquents.&quot;,&quot;heat&quot;,{},{&quot;q&quot;:&quot;Quand l&#x27;envie est-elle la plus forte ?&quot;,&quot;o&quot;:[[&quot;Le soir, seul(e)&quot;,&quot;Fatigue et solitude : le soir, le cerveau freine moins bien. Prévois quelque chose de précis pour ces heures-là.&quot;],[&quot;Quand je m&#x27;ennuie&quot;,&quot;L&#x27;ennui est un déclencheur très fréquent. Il retombe en quelques minutes si on ne le fuit pas : prépare une action de 5 minutes.&quot;],[&quot;Quand je suis stressé(e)&quot;,&quot;Le stress donne envie d&#x27;un soulagement rapide. Un souffle plus long à l&#x27;expiration (4 s / 6 s) calme le corps en 2 minutes.&quot;],[&quot;Avec d&#x27;autres personnes&quot;,&quot;Le contexte social pèse beaucoup. Dire à une personne que tu changes suffit souvent à désamorcer.&quot;]]},[&quot;Heure et lieu&quot;,&quot;Les habitudes sont liées à un contexte (seul, tard, au lit). Changer le contexte coupe l&#x27;automatisme.&quot;,&quot;Pas de téléphone dans le lit ce soir.&quot;]],[&quot;Rendre l&#x27;accès plus difficile&quot;,&quot;La volonté s&#x27;épuise, l&#x27;environnement peut faire le travail. Moins d&#x27;accès facile, c&#x27;est moins de décisions à prendre sous l&#x27;envie.&quot;,&quot;Installe un filtre ou un bloqueur de contenus adultes sur tes appareils. Désactive la navigation privée. Mets ton téléphone hors du lit ce soir.&quot;,null,{},{&quot;q&quot;:&quot;Quelle barrière poses-tu en premier ?&quot;,&quot;o&quot;:[[&quot;Supprimer l&#x27;accès&quot;,&quot;Chaque étape en plus fait baisser le passage à l&#x27;acte : un obstacle de 20 secondes laisse souvent l&#x27;envie retomber.&quot;],[&quot;Changer de lieu ou d&#x27;horaire&quot;,&quot;Les habitudes sont liées à des lieux et des heures. Change l&#x27;un des deux et l&#x27;automatisme perd son déclencheur.&quot;],[&quot;Prévenir quelqu&#x27;un&quot;,&quot;Dire ton objectif à voix haute le rend plus réel et te donne un témoin bienveillant.&quot;],[&quot;Aucune, c&#x27;est trop dur&quot;,&quot;Prends la plus petite, une seule. Une barrière imparfaite vaut mieux qu&#x27;un plan parfait jamais appliqué.&quot;]]},[&quot;Moins d&#x27;accès, moins d&#x27;envie&quot;,&quot;Le soir, la volonté est limitée. Rendre l&#x27;accès plus difficile (filtre, pas d&#x27;écran dans la chambre) réduit les décisions impulsives.&quot;,&quot;Installe un filtre de contenu.&quot;]],[&quot;Le plan « si… alors… »&quot;,&quot;Un plan précis marche mieux qu&#x27;une bonne intention. Tu décides à l&#x27;avance de ce que tu feras quand le déclencheur arrive.&quot;,&quot;Écris 3 phrases : « Si je suis seul le soir / ennuyé / stressé, alors je… » avec une action concrète (sortir, appeler quelqu&#x27;un, douche, marcher).&quot;,&quot;pairs&quot;,{},{&quot;q&quot;:&quot;Quel plan « si… alors… » te ressemble ?&quot;,&quot;o&quot;:[[&quot;Si l&#x27;envie vient, je bois de l&#x27;eau et j&#x27;attends 10 minutes&quot;,&quot;Un délai court plus un geste simple : c&#x27;est très efficace. Les plans précis marchent bien mieux que les bonnes intentions.&quot;],[&quot;Si je m&#x27;ennuie, je sors 5 minutes&quot;,&quot;Bouger change l&#x27;état du corps et coupe l&#x27;automatisme. Même monter un escalier compte.&quot;],[&quot;Si je suis stressé(e), je respire 1 minute&quot;,&quot;Inspire 4 secondes, souffle 6 : l&#x27;expiration longue ralentit le cœur et calme le système nerveux.&quot;],[&quot;Si je craque, j&#x27;appelle quelqu&#x27;un&quot;,&quot;Parler casse l&#x27;isolement et la honte, qui poussent à recommencer.&quot;]]},[&quot;L&#x27;expiration longue&quot;,&quot;Souffler plus longtemps qu&#x27;on inspire active le frein du système nerveux et calme l&#x27;excitation.&quot;,&quot;Inspire 4 s, souffle 6 s, cinq fois.&quot;]],[&quot;Bilan de la semaine 1&quot;,&quot;Une semaine pour comprendre. Tu connais ton habitude, tes déclencheurs et tu as mis quelques barrières. C&#x27;est déjà beaucoup.&quot;,&quot;Complète : « Ce que j&#x27;ai appris sur moi cette semaine, c&#x27;est… ». Choisis un seul moment de la journée à protéger la semaine prochaine.&quot;,null,{},{&quot;q&quot;:&quot;Cette semaine, qu&#x27;est-ce qui t&#x27;a le plus surpris(e) ?&quot;,&quot;o&quot;:[[&quot;À quel point c&#x27;est automatique&quot;,&quot;Voir l&#x27;automatisme, c&#x27;est déjà la moitié du chemin : on ne peut changer que ce qu&#x27;on remarque.&quot;],[&quot;Les moments où l&#x27;envie arrive&quot;,&quot;Tu connais maintenant tes heures et tes lieux : tu peux les anticiper au lieu de les subir.&quot;],[&quot;Que ça passe quand j&#x27;attends&quot;,&quot;C&#x27;est l&#x27;info la plus utile : une envie qui passe n&#x27;est pas un ordre.&quot;],[&quot;Rien de spécial&quot;,&quot;Pas grave, c&#x27;est une semaine d&#x27;observation. Continue : les effets arrivent avec la pratique.&quot;]]},[&quot;Écrans tard, nuit courte&quot;,&quot;Les écrans tard retardent le sommeil, et un sommeil court amplifie les envies le lendemain.&quot;,&quot;Écran coupé 30 minutes avant de dormir.&quot;]],[&quot;Comprendre l&#x27;envie&quot;,&quot;L&#x27;envie monte, atteint un pic, puis retombe, même si tu ne fais rien. Savoir que ça passe change tout : une envie n&#x27;est pas un ordre.&quot;,&quot;Quand l&#x27;envie arrive, attends 2 minutes avant d&#x27;agir. Où la sens-tu dans le corps ? Que devient-elle au bout de 2 minutes ?&quot;,&quot;wave&quot;,{},{&quot;q&quot;:&quot;Quand l&#x27;envie arrive, que fais-tu d&#x27;habitude ?&quot;,&quot;o&quot;:[[&quot;Je cède tout de suite&quot;,&quot;Normal : céder soulage vite, et c&#x27;est ce qui apprend au cerveau à recommencer. Aujourd&#x27;hui, repousse seulement de 10 minutes.&quot;],[&quot;Je lutte de toutes mes forces&quot;,&quot;Lutter épuise. Observe l&#x27;envie comme une vague : elle monte, plafonne, redescend. Laisse-la passer sans la combattre.&quot;],[&quot;Je me distrais&quot;,&quot;Très bien : 10 minutes de distraction suffisent souvent. Prépare-en deux à l&#x27;avance, à portée de main.&quot;],[&quot;Je ne sais pas&quot;,&quot;Aujourd&#x27;hui, note l&#x27;heure et ce que tu ressens quand elle vient. Un schéma va apparaître.&quot;]]},[&quot;Une vague, pas un ordre&quot;,&quot;L&#x27;excitation et l&#x27;envie montent puis redescendent en quelques minutes si on ne les nourrit pas.&quot;,&quot;Chronomètre ta prochaine envie.&quot;]],[&quot;La règle des 10 minutes&quot;,&quot;Ne te dis pas « jamais », dis-toi « dans 10 minutes, et dans une autre pièce ». Changer de lieu et d&#x27;activité coupe souvent l&#x27;automatisme.&quot;,&quot;Utilise le bouton SOS du site à chaque envie aujourd&#x27;hui. Compte combien sont passées.&quot;,&quot;hold&quot;,{},{&quot;q&quot;:&quot;Peux-tu tenir 10 minutes avant de passer à l&#x27;acte ?&quot;,&quot;o&quot;:[[&quot;Oui, facilement&quot;,&quot;Alors fais-en une règle : la plupart des envies retombent avant 10 minutes.&quot;],[&quot;Oui, avec une distraction&quot;,&quot;Parfait. Prépare deux distractions : musique, verre d&#x27;eau, marche. Elles font la moitié du travail.&quot;],[&quot;Difficile&quot;,&quot;Commence par 2 minutes. Chaque envie traversée entraîne ton cerveau à tolérer l&#x27;inconfort.&quot;],[&quot;Impossible&quot;,&quot;Pas de souci : 1 minute compte déjà. Le bouton SOS te guide pendant 10 minutes, un souffle après l&#x27;autre.&quot;]]},[&quot;Le délai&quot;,&quot;Attendre 10 minutes laisse redescendre l&#x27;émotion et redonne la main à la partie réfléchie du cerveau.&quot;,&quot;Lance un minuteur de 10 minutes.&quot;]],[&quot;Respirer pour retomber&quot;,&quot;Une respiration lente, avec un souffle plus long que l&#x27;inspiration, aide à calmer le corps en quelques minutes.&quot;,&quot;Fais 2 minutes de respiration (inspire 4 secondes, souffle 6), deux fois dans la journée, dont une avant d&#x27;aller te coucher.&quot;,&quot;breathe&quot;,{},{&quot;q&quot;:&quot;Quand tu es tendu(e), ton souffle est plutôt…&quot;,&quot;o&quot;:[[&quot;Court et haut&quot;,&quot;Respirer haut met le corps en alerte. Allonge l&#x27;expiration : c&#x27;est le levier le plus rapide pour te calmer.&quot;],[&quot;Je le retiens parfois&quot;,&quot;Retenir son souffle augmente la tension. Souffle doucement par la bouche, comme dans une paille.&quot;],[&quot;Je n&#x27;y ai jamais fait attention&quot;,&quot;Pose une main sur le ventre : si elle ne bouge pas, ta respiration est haute. Essaie de la faire gonfler.&quot;],[&quot;Plutôt calme&quot;,&quot;Bien. Garde ce réflexe pour les moments d&#x27;envie, c&#x27;est là qu&#x27;il compte le plus.&quot;]]},[&quot;Le nerf vague&quot;,&quot;Respirer lentement stimule le nerf vague, qui ralentit le cœur et apaise le corps.&quot;,&quot;Deux minutes de respiration, deux fois aujourd&#x27;hui.&quot;]],[&quot;Ennui et solitude&quot;,&quot;L&#x27;ennui et la solitude sont des déclencheurs fréquents. Ce que tu cherches vraiment, c&#x27;est souvent du contact, de la détente ou un peu de plaisir.&quot;,&quot;Aujourd&#x27;hui, ajoute un contact humain réel : message, appel, café avec quelqu&#x27;un.&quot;,&quot;slot&quot;,{},{&quot;q&quot;:&quot;Pour t&#x27;occuper 10 minutes, tu préfères…&quot;,&quot;o&quot;:[[&quot;Bouger&quot;,&quot;Le mouvement réduit les envies et améliore l&#x27;humeur en quelques minutes.&quot;],[&quot;Parler à quelqu&#x27;un&quot;,&quot;Une voix humaine apaise plus vite qu&#x27;un écran ou un produit.&quot;],[&quot;Faire quelque chose de mes mains&quot;,&quot;Cuisine, dessin, rangement : occuper les mains occupe aussi l&#x27;attention, l&#x27;envie perd de la place.&quot;],[&quot;Rien ne me tente&quot;,&quot;Normal au début : l&#x27;envie rend tout fade. Essaie quand même 3 minutes, l&#x27;envie baisse avant que l&#x27;activité ne devienne agréable.&quot;]]},[&quot;La solitude fait mal&quot;,&quot;Le sentiment de solitude active des zones proches de la douleur physique. Un contact humain, même bref, l&#x27;apaise.&quot;,&quot;Envoie un message à quelqu&#x27;un.&quot;]],[&quot;Stress, fatigue et nuit&quot;,&quot;La fatigue fragilise : tard le soir, seul, le téléphone à la main, c&#x27;est le moment le plus risqué. Une routine de soirée t&#x27;aide.&quot;,&quot;Fixe une heure de coucher. 30 minutes avant, téléphone hors de la chambre. Prévois une activité calme pour te détendre.&quot;,null,{},{&quot;q&quot;:&quot;Quand tu es stressé(e), ton corps réagit surtout par…&quot;,&quot;o&quot;:[[&quot;De la tension (épaules, mâchoire)&quot;,&quot;Relâche : épaules vers le bas, mâchoire détendue, trois souffles lents.&quot;],[&quot;De la fatigue&quot;,&quot;La fatigue baisse le frein de la volonté. Une sieste de 15 à 20 minutes aide, sinon couche-toi plus tôt ce soir.&quot;],[&quot;De l&#x27;agitation&quot;,&quot;Marche rapide 5 minutes : elle dépense l&#x27;adrénaline en trop.&quot;],[&quot;Je ne sais pas&quot;,&quot;Scanne : tête, épaules, ventre, jambes. Où ça serre ? C&#x27;est là qu&#x27;il faut respirer.&quot;]]},[&quot;Stress et cortisol&quot;,&quot;Le stress augmente le cortisol et donne envie d&#x27;un soulagement rapide. Marcher 10 minutes le fait redescendre.&quot;,&quot;Marche 10 minutes dehors.&quot;]],[&quot;Honte et culpabilité&quot;,&quot;La honte pousse souvent à recommencer : on se sent mal, on cherche du soulagement, on retombe. Se parler avec respect, comme à un ami, casse ce cycle.&quot;,&quot;Écris à toi-même ce que tu dirais à un ami dans la même situation. Relis-le à voix haute.&quot;,&quot;myths&quot;,{},{&quot;q&quot;:&quot;Quelle idée te retient le plus ?&quot;,&quot;o&quot;:[[&quot;J&#x27;en ai besoin pour me détendre ou dormir&quot;,&quot;Ça détend sur l&#x27;instant mais entretient le manque ensuite. À terme, la détente et le sommeil naturels reviennent.&quot;],[&quot;Je gère, ce n&#x27;est pas un problème&quot;,&quot;Si tu es ici, c&#x27;est que tu veux plus de contrôle. Fais confiance à ça.&quot;],[&quot;Tout le monde le fait&quot;,&quot;Beaucoup le font, et beaucoup changent aussi. Tu n&#x27;es pas seul(e) dans les deux cas.&quot;],[&quot;Juste une fois ne compte pas&quot;,&quot;Chaque fois renforce le circuit de l&#x27;habitude. L&#x27;exception est souvent la porte d&#x27;entrée.&quot;]]},[&quot;La honte nourrit le cycle&quot;,&quot;La honte augmente le stress, qui augmente l&#x27;envie : un cercle. La bienveillance envers soi le casse.&quot;,&quot;Parle-toi comme à un ami.&quot;]],[&quot;Bilan de la semaine 2&quot;,&quot;Tu as appris à voir l&#x27;envie venir et à la laisser passer. Chaque envie surmontée construit la nouvelle habitude.&quot;,&quot;Regarde ton compteur d&#x27;envies surmontées. Note le moment le plus dur de la semaine et ce qui t&#x27;a aidé.&quot;,null,{},{&quot;q&quot;:&quot;Ce qui t&#x27;a le plus aidé(e) cette semaine ?&quot;,&quot;o&quot;:[[&quot;Attendre 10 minutes&quot;,&quot;Garde-le : c&#x27;est ton outil principal. Il marche d&#x27;autant mieux qu&#x27;il est automatique.&quot;],[&quot;Respirer&quot;,&quot;La respiration est toujours avec toi. Utilise-la avant que l&#x27;envie ne soit à son maximum.&quot;],[&quot;Éloigner ce qui donne accès&quot;,&quot;Bien joué : réduire l&#x27;accès est l&#x27;une des méthodes les plus solides.&quot;],[&quot;Rien de précis&quot;,&quot;Pas grave. Regarde le bilan : tu as peut-être tenu plus que tu ne le penses.&quot;]]},[&quot;L&#x27;énergie revient&quot;,&quot;Dormir assez et bouger rétablissent l&#x27;humeur et l&#x27;énergie, et réduisent les envies.&quot;,&quot;Couche-toi à heure fixe ce soir.&quot;]],[&quot;Remplacer, pas seulement enlever&quot;,&quot;Si tu enlèves une habitude sans rien mettre à la place, le vide la rappelle. Cherche des activités qui te détendent ou te font du bien autrement.&quot;,&quot;Liste 5 activités de 10 à 20 minutes qui te détendent (douche, musique, lecture, sport, cuisine). Garde la liste accessible.&quot;,null,{},{&quot;q&quot;:&quot;Quel remplaçant te semble le plus réaliste ?&quot;,&quot;o&quot;:[[&quot;Un geste (eau, étirements)&quot;,&quot;Les petits gestes sont faciles à répéter. Garde-les à portée de main.&quot;],[&quot;Une activité courte (marche, jeu)&quot;,&quot;Dix minutes suffisent souvent. Choisis-en une que tu peux faire n&#x27;importe où.&quot;],[&quot;Une personne (appel, message)&quot;,&quot;Un lien humain est l&#x27;un des meilleurs remplaçants. Mets 2 prénoms dans tes favoris.&quot;],[&quot;Je n&#x27;en ai pas encore&quot;,&quot;Essaie les trois cette semaine. Tu verras vite lequel marche pour toi.&quot;]]},[&quot;Changer d&#x27;état&quot;,&quot;Douche, musique, mouvement : ces gestes changent l&#x27;état du corps et coupent l&#x27;envie sur le moment.&quot;,&quot;Prends une douche fraîche ou tiède en cas d&#x27;envie.&quot;]],[&quot;Bouger&quot;,&quot;Le mouvement change l&#x27;humeur et dépense l&#x27;énergie. Pas besoin de sport intense : marcher compte.&quot;,&quot;Fais 20 minutes d&#x27;activité physique aujourd&#x27;hui, de préférence à l&#x27;heure où l&#x27;envie vient le plus.&quot;,&quot;move&quot;,{},{&quot;q&quot;:&quot;Ton niveau de mouvement dans une journée ?&quot;,&quot;o&quot;:[[&quot;Presque aucun&quot;,&quot;Commence par 5 minutes de marche : c&#x27;est déjà un effet mesurable sur l&#x27;humeur.&quot;],[&quot;Un peu&quot;,&quot;Ajoute 10 minutes à l&#x27;heure où l&#x27;envie est la plus forte.&quot;],[&quot;Régulier&quot;,&quot;Excellent. Place-le aux heures à risque : c&#x27;est là qu&#x27;il protège le plus.&quot;],[&quot;Beaucoup&quot;,&quot;Parfait. N&#x27;oublie pas le repos : il fait partie de la récupération.&quot;]]},[&quot;Le sport calme&quot;,&quot;L&#x27;exercice réduit l&#x27;anxiété et améliore le sommeil, deux moteurs de l&#x27;envie.&quot;,&quot;20 minutes de marche rapide.&quot;]],[&quot;Soirées et week-ends&quot;,&quot;Les moments seul et sans programme sont les plus risqués. Un planning léger évite de glisser par défaut.&quot;,&quot;Planifie les 2 prochaines soirées seul : un horaire, une activité, un moment de coucher.&quot;,null,{},{&quot;q&quot;:&quot;Le plus dur dans tes week-ends, c&#x27;est…&quot;,&quot;o&quot;:[[&quot;Le temps libre&quot;,&quot;Prévois deux activités par jour : le vide appelle l&#x27;habitude.&quot;],[&quot;Les amis&quot;,&quot;Propose un lieu ou une activité sans l&#x27;habitude, ou dis-le d&#x27;avance. Les vrais amis comprennent.&quot;],[&quot;Le soir tard&quot;,&quot;Fixe une heure limite de coucher : la fatigue baisse les défenses.&quot;],[&quot;Rien de particulier&quot;,&quot;Prévois quand même un plan B, au cas où.&quot;]]},[&quot;Seul, fatigué, téléphone en main&quot;,&quot;Cette combinaison est la plus à risque : fatigue, solitude et accès facile. Il suffit d&#x27;en retirer un pour baisser le risque.&quot;,&quot;Laisse le téléphone hors de la chambre.&quot;]],[&quot;En parler à quelqu&#x27;un&quot;,&quot;Garder ça pour soi entretient la honte. Parler à un ami de confiance, à un médecin ou à un thérapeute allège. Tu n&#x27;as pas à tout dire : une phrase suffit.&quot;,&quot;Choisis une personne de confiance et dis-lui que tu essaies de changer cette habitude. Ou prends rendez-vous avec un professionnel.&quot;,null,{},{&quot;q&quot;:&quot;À qui pourrais-tu en parler ?&quot;,&quot;o&quot;:[[&quot;Un(e) ami(e)&quot;,&quot;Un ami de confiance suffit. Dis simplement : « j&#x27;essaie de changer, peux-tu me demander demain comment ça va ? »&quot;],[&quot;Un proche de la famille&quot;,&quot;Choisis la personne la plus calme et la moins critique. Un message écrit peut être plus facile.&quot;],[&quot;Un professionnel ou une ligne d&#x27;aide&quot;,&quot;Excellente idée : ton médecin ou un psychologue est là pour ça, gratuitement et sans jugement.&quot;],[&quot;Personne pour l&#x27;instant&quot;,&quot;C&#x27;est possible, et ce n&#x27;est pas grave. Une ligne d&#x27;aide (ton médecin ou un psychologue) peut être ton premier interlocuteur.&quot;]]},[&quot;Le lien réduit la honte&quot;,&quot;Le soutien social réduit la honte, un moteur de l&#x27;habitude.&quot;,&quot;Parle à une personne de confiance.&quot;]],[&quot;Les pensées-pièges&quot;,&quot;« Juste une fois », « personne ne le saura », « je l&#x27;ai bien mérité ». Ces phrases sont normales. Les repérer leur enlève du pouvoir.&quot;,&quot;Écris 3 phrases que tu te dis avant de craquer. À côté de chacune, une réponse honnête et courte.&quot;,&quot;pieges&quot;,{},{&quot;q&quot;:&quot;Quelle pensée te fait le plus craquer ?&quot;,&quot;o&quot;:[[&quot;« Juste une fois »&quot;,&quot;C&#x27;est le piège le plus courant. Réponse : « si c&#x27;est juste une fois, je peux attendre demain ».&quot;],[&quot;« Je l&#x27;ai bien mérité »&quot;,&quot;Oui, et tu peux te récompenser autrement : repas, film, sortie. Sans la facture.&quot;],[&quot;« Je m&#x27;y mets demain »&quot;,&quot;Demain sera pareil. Réponse : « je commence par les 10 prochaines minutes ».&quot;],[&quot;« J&#x27;ai déjà craqué, tant pis »&quot;,&quot;Un faux pas n&#x27;efface pas les jours passés. Reprends dès la prochaine heure.&quot;]]},[&quot;Le cerveau négocie&quot;,&quot;Pour obtenir un soulagement rapide, le cerveau fabrique des excuses. Les repérer leur enlève du pouvoir.&quot;,&quot;Note ta pensée-piège préférée.&quot;]],[&quot;Te récompenser autrement&quot;,&quot;Ton cerveau aime les petites récompenses. Tu peux en garder sans passer par là : un bon repas, un film, un moment avec des amis.&quot;,&quot;Choisis une récompense pour chaque jour tenu cette semaine. Note-la maintenant.&quot;,null,{},{&quot;q&quot;:&quot;Quelle récompense te ferait vraiment plaisir ?&quot;,&quot;o&quot;:[[&quot;Un bon repas&quot;,&quot;Parfait : choisis le jour et le lieu à l&#x27;avance, une récompense prévue motive mieux qu&#x27;une récompense improvisée.&quot;],[&quot;Une sortie&quot;,&quot;Planifie-la dans ton agenda dès aujourd&#x27;hui : l&#x27;avoir devant soi aide à tenir.&quot;],[&quot;Un achat&quot;,&quot;Mets de côté la somme économisée dans une enveloppe : la voir grossir motive.&quot;],[&quot;Du repos&quot;,&quot;Le repos est une vraie récompense. Offre-toi une soirée sans obligation.&quot;]]},[&quot;La récompense prévue&quot;,&quot;Une récompense choisie à l&#x27;avance renforce un nouveau comportement mieux qu&#x27;une récompense improvisée.&quot;,&quot;Choisis ta récompense de la semaine.&quot;]],[&quot;Bilan de la semaine 3&quot;,&quot;Trois semaines de pratique. Regarde ce qui a changé : l&#x27;envie, le sommeil, l&#x27;humeur, le temps libre.&quot;,&quot;Écris 3 changements que tu constates, même petits.&quot;,null,{},{&quot;q&quot;:&quot;Ce qui a changé depuis le début ?&quot;,&quot;o&quot;:[[&quot;Mon sommeil&quot;,&quot;Un meilleur sommeil réduit l&#x27;impulsivité : c&#x27;est un cercle vertueux qui s&#x27;installe.&quot;],[&quot;Mon humeur&quot;,&quot;Chaque jour, le cerveau se rééquilibre un peu. L&#x27;humeur suit souvent avec un décalage.&quot;],[&quot;Mon argent&quot;,&quot;Note la somme : c&#x27;est un des gains les plus concrets.&quot;],[&quot;Pas encore grand-chose&quot;,&quot;Normal : les changements sont souvent lents au début. Continue, ils arrivent avec la régularité.&quot;]]},[&quot;La concentration revient&quot;,&quot;Beaucoup de personnes notent peu à peu une meilleure concentration et plus d&#x27;énergie quand elles réduisent l&#x27;habitude.&quot;,&quot;Note ton niveau de concentration de 1 à 10.&quot;]],[&quot;Un dérapage n&#x27;est pas une rechute&quot;,&quot;Tu vas peut-être craquer. Ce n&#x27;est pas un échec, c&#x27;est une information. Ce qui compte, c&#x27;est de reprendre le fil, sans te punir.&quot;,&quot;Écris la phrase que tu te diras après un dérapage. Courte, bienveillante, qui te remet en route.&quot;,&quot;scenario&quot;,{},{&quot;q&quot;:&quot;Si tu craques ce soir, tu te diras…&quot;,&quot;o&quot;:[[&quot;« Je suis nul(le) »&quot;,&quot;La honte nourrit le cycle. Parle-toi comme à un ami : « ça arrive, je reprends ».&quot;],[&quot;« C&#x27;est une information »&quot;,&quot;Exactement. Note ce qui l&#x27;a déclenché et ajuste ton plan.&quot;],[&quot;« Autant tout lâcher »&quot;,&quot;C&#x27;est l&#x27;effet « tant pis », le vrai piège. Reprends au prochain repas, pas à la prochaine semaine.&quot;],[&quot;« Je préviens quelqu&#x27;un »&quot;,&quot;Excellent réflexe : ça casse l&#x27;isolement et la honte.&quot;]]},[&quot;Un faux pas, pas une chute&quot;,&quot;Un dérapage ne défait pas les circuits déjà en place. Reprendre vite compte plus que la perfection.&quot;,&quot;Écris ta phrase de reprise.&quot;]],[&quot;Ton plan en cas de rechute&quot;,&quot;Prévoir le plan B enlève la peur. Qu&#x27;est-ce qui m&#x27;a fait craquer ? Qu&#x27;est-ce que je change ? Qui je préviens ?&quot;,&quot;Rédige un plan en 3 points : ce que je fais dans l&#x27;heure, ce que j&#x27;analyse, ce que j&#x27;ajuste.&quot;,&quot;relapse&quot;,{},{&quot;q&quot;:&quot;En cas de rechute, ce qui t&#x27;aiderait le plus ?&quot;,&quot;o&quot;:[[&quot;Un message tout prêt&quot;,&quot;Écris-le maintenant, il sera là quand tu en auras besoin. Tu n&#x27;auras plus qu&#x27;à l&#x27;envoyer.&quot;],[&quot;Quelqu&#x27;un à appeler&quot;,&quot;Choisis la personne et enregistre son numéro en favori.&quot;],[&quot;Une règle simple&quot;,&quot;Par exemple : « je m&#x27;arrête là, je bois de l&#x27;eau, je reprends demain ».&quot;],[&quot;Je préfère ne pas y penser&quot;,&quot;C&#x27;est compréhensible, mais prévoir réduit la peur. Ça prend 2 minutes et tu seras plus serein(e).&quot;]]},[&quot;Anticiper apaise&quot;,&quot;Prévoir ce qu&#x27;on fera en cas de craquage réduit la panique et l&#x27;effet « tant pis ».&quot;,&quot;Relis ton plan B ce soir.&quot;]],[&quot;Attentes et vraies relations&quot;,&quot;Ce qu&#x27;on voit à l&#x27;écran est une mise en scène. S&#x27;en détacher aide à retrouver du désir et du lien avec de vraies personnes, avec leurs rythmes et leurs envies.&quot;,&quot;Écris ce que tu veux dans une vraie relation (lien, complicité, écoute). Laisse de côté ce que tu as vu à l&#x27;écran.&quot;,null,{},{&quot;q&quot;:&quot;Dans 6 mois, tu aimerais être quelqu&#x27;un qui…&quot;,&quot;o&quot;:[[&quot;Dort bien&quot;,&quot;Un objectif concret : les nuits s&#x27;améliorent souvent dès les premières semaines.&quot;],[&quot;Tient ses engagements&quot;,&quot;Chaque petit engagement tenu renforce la confiance en toi.&quot;],[&quot;A de l&#x27;énergie&quot;,&quot;L&#x27;énergie revient avec le sommeil, le mouvement et moins d&#x27;à-coups.&quot;],[&quot;Se sent libre&quot;,&quot;La liberté, c&#x27;est choisir. Chaque envie traversée est un choix de plus.&quot;]]},[&quot;L&#x27;ocytocine du contact&quot;,&quot;Le contact (se serrer, toucher, parler sincèrement) libère de l&#x27;ocytocine, liée au lien et à l&#x27;apaisement.&quot;,&quot;Un échange sincère ou un câlin aujourd&#x27;hui.&quot;]],[&quot;Les moments à risque à venir&quot;,&quot;Voyages, soirées seul, périodes de stress : certains moments vont remettre l&#x27;envie en jeu. Les prévoir, c&#x27;est déjà y être préparé.&quot;,&quot;Liste les 3 prochains moments à risque des 4 semaines à venir et ce que tu feras à chaque fois.&quot;,null,{},{&quot;q&quot;:&quot;Ton prochain moment à risque, c&#x27;est…&quot;,&quot;o&quot;:[[&quot;Un week-end&quot;,&quot;Prévois deux activités par jour et une heure de coucher.&quot;],[&quot;Une fête ou un événement&quot;,&quot;Décide à l&#x27;avance ce que tu fais et à quelle heure tu pars.&quot;],[&quot;Une période de stress&quot;,&quot;Planifie des pauses et du mouvement. Le stress est un déclencheur majeur.&quot;],[&quot;Je ne sais pas&quot;,&quot;Regarde ton agenda des 2 semaines à venir : tu en verras un ou deux.&quot;]]},[&quot;Le contexte déclenche&quot;,&quot;Un lieu ou une heure associés à l&#x27;habitude suffisent à déclencher l&#x27;envie. Les repérer permet de s&#x27;y préparer.&quot;,&quot;Note ton prochain moment à risque.&quot;]],[&quot;Mieux dormir&quot;,&quot;Le téléphone au lit, tard le soir, est un déclencheur et un voleur de sommeil. Dormir mieux rend les envies plus faciles à gérer.&quot;,&quot;Ce soir, charge ton téléphone hors de ta chambre. Utilise un réveil classique si besoin.&quot;,&quot;evening&quot;,{},{&quot;q&quot;:&quot;Tes nuits en ce moment ?&quot;,&quot;o&quot;:[[&quot;Courtes&quot;,&quot;Une nuit courte renforce l&#x27;envie et réduit le contrôle. Couche-toi 30 minutes plus tôt ce soir.&quot;],[&quot;Agitées&quot;,&quot;Écrans coupés 30 minutes avant, chambre fraîche (18-19 °C) et dîner léger aident.&quot;],[&quot;Correctes&quot;,&quot;Bien. Garde un horaire régulier : c&#x27;est ça qui consolide.&quot;],[&quot;Très bonnes&quot;,&quot;Parfait. Protège-les : c&#x27;est un de tes meilleurs alliés.&quot;]]},[&quot;Sommeil et impulsivité&quot;,&quot;Une nuit courte réduit le contrôle des impulsions. Dormir 7 à 9 heures est un des meilleurs outils.&quot;,&quot;Fixe une heure de coucher.&quot;]],[&quot;Le temps que tu récupères&quot;,&quot;Ce temps est ton vrai gain. Le chiffrer le rend concret et motive.&quot;,&quot;Estime les heures par semaine que ça te prenait. Multiplie par 4. Écris ce que tu peux faire avec ce temps.&quot;,null,{},{&quot;q&quot;:&quot;Le temps ou l&#x27;argent récupéré, tu en feras…&quot;,&quot;o&quot;:[[&quot;Du repos&quot;,&quot;Le repos compte aussi. Planifie-le au lieu de le subir.&quot;],[&quot;Un projet&quot;,&quot;Choisis un petit projet de 30 minutes par jour : c&#x27;est ce qui remplit le vide.&quot;],[&quot;Du temps avec des proches&quot;,&quot;Les liens sont l&#x27;un des meilleurs soutiens pour tenir.&quot;],[&quot;Un plaisir ou de l&#x27;épargne&quot;,&quot;Mets une somme de côté chaque semaine : la voir grossir motive.&quot;]]},[&quot;Du temps pour toi&quot;,&quot;Quelques heures par semaine récupérées font plusieurs jours par an : de quoi relancer un projet ou une activité.&quot;,&quot;Choisis 30 minutes récupérées pour une activité.&quot;]],[&quot;Ton réseau de soutien&quot;,&quot;Si tu n&#x27;y arrives pas seul, ou si ça affecte ton couple, ton sommeil ou ton humeur, un médecin, un psychologue ou un sexologue peut t&#x27;aider. Ce n&#x27;est pas un échec.&quot;,&quot;Repère un professionnel (médecin généraliste pour commencer). Si tu vas mal, le 3114 répond 24h/24.&quot;,null,{},{&quot;q&quot;:&quot;Qui est ton premier appel en cas de coup dur ?&quot;,&quot;o&quot;:[[&quot;Un(e) ami(e)&quot;,&quot;Garde son numéro en favori. Dis-lui d&#x27;avance qu&#x27;il peut t&#x27;aider.&quot;],[&quot;Un proche de la famille&quot;,&quot;Préviens-le à l&#x27;avance : il saura quoi répondre quand ça arrivera.&quot;],[&quot;Un professionnel&quot;,&quot;ton médecin ou un psychologue est joignable. Note le numéro dans ton téléphone.&quot;],[&quot;Je n&#x27;ai pas de nom&quot;,&quot;Alors ton médecin ou un psychologue peut être ce nom. C&#x27;est gratuit, tu n&#x27;as pas à te justifier.&quot;]]},[&quot;Le lien protège&quot;,&quot;Des liens sociaux de qualité sont associés à une meilleure santé et à de meilleures chances de tenir un changement.&quot;,&quot;Propose un moment à quelqu&#x27;un cette semaine.&quot;]],[&quot;Lettre à toi-même&quot;,&quot;Ce que tu as fait pendant 30 jours mérite d&#x27;être écrit. Cette lettre te servira les jours où tu auras oublié pourquoi c&#x27;était important.&quot;,&quot;Écris-toi une lettre pour dans 3 mois : ce que tu as appris, ce que tu veux avoir gardé, ce que tu te souhaites.&quot;,&quot;letter&quot;,{},{&quot;q&quot;:&quot;Pour toi dans 3 mois, le plus important à te rappeler ?&quot;,&quot;o&quot;:[[&quot;Ce que j&#x27;ai tenu&quot;,&quot;Écris-le : les chiffres sont des preuves quand le doute revient.&quot;],[&quot;Pourquoi j&#x27;ai commencé&quot;,&quot;Relis ton pourquoi du premier jour. Il est dans ton espace.&quot;],[&quot;Que ça passe&quot;,&quot;Oui : une envie passe toujours. C&#x27;est ta meilleure information.&quot;],[&quot;Que je mérite d&#x27;aller bien&quot;,&quot;C&#x27;est vrai. Écris-le comme si tu parlais à un ami.&quot;]]},[&quot;Écrire aide&quot;,&quot;Écrire ce qu&#x27;on ressent aide à réguler les émotions, c&#x27;est ce qu
