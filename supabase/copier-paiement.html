<body><button id="b">Copier le code</button><p id="m">Touche le bouton, puis colle dans Supabase.</p><textarea id="t" readonly translate="no">// Fonction Supabase « paiement- » de Lookmiz.

//    et livraison du contenu des jours, seulement si le paiement est confirmé (prog_day).
// 2) Anciennes cartes d&#x27;invitation (checkout / verify) : inchangé.
import { createClient } from &#x27;npm:@supabase/supabase-js@2&#x27;;

const CORS = { &#x27;Access-Control-Allow-Origin&#x27;: &#x27;*&#x27;, &#x27;Access-Control-Allow-Headers&#x27;: &#x27;*&#x27;, &#x27;Access-Control-Allow-Methods&#x27;: &#x27;POST, OPTIONS&#x27; };
const json = (d: unknown, status = 200) =&gt; new Response(JSON.stringify(d), { status, headers: { ...CORS, &#x27;Content-Type&#x27;: &#x27;application/json&#x27; } });
const admin = createClient(Deno.env.get(&#x27;SUPABASE_URL&#x27;)!, Deno.env.get(&#x27;SUPABASE_SERVICE_ROLE_KEY&#x27;)!);
const SK = Deno.env.get(&#x27;STRIPE_SECRET_KEY&#x27;) ?? &#x27;&#x27;;
const SITE = &#x27;https://lookmiz.com/&#x27;;
// Prix côté serveur : le navigateur ne peut pas les modifier.
// Contenu des 4 programmes : jamais envoyé sans paiement confirmé.
const DAYS: Record&lt;string, { kit: unknown; days: unknown[] }&gt; = {&quot;ecrans&quot;:{&quot;kit&quot;:{&quot;raisons&quot;:[&quot;Mieux dormir&quot;,&quot;Être plus présent avec les gens&quot;,&quot;Retrouver ma concentration&quot;,&quot;Avancer sur mes projets&quot;,&quot;Moins me comparer aux autres&quot;,&quot;Avoir plus de temps pour moi&quot;,&quot;Être moins stressé&quot;,&quot;Reprendre le sport&quot;,&quot;Relire des livres&quot;,&quot;Moins culpabiliser&quot;],&quot;pros&quot;:[&quot;M&#x27;occuper quand je m&#x27;ennuie&quot;,&quot;Rester en lien avec mes amis&quot;,&quot;Me détendre&quot;,&quot;Ne pas rater les infos&quot;,&quot;Me divertir&quot;,&quot;Ne pas penser à mes soucis&quot;],&quot;cons&quot;:[&quot;Je dors moins&quot;,&quot;Je perds des heures&quot;,&quot;Je me compare aux autres&quot;,&quot;J&#x27;ai du mal à me concentrer&quot;,&quot;Je suis plus irritable&quot;,&quot;Je remets mes projets à plus tard&quot;,&quot;Je suis moins présent avec les gens&quot;,&quot;Je me sens vidé après&quot;],&quot;calc&quot;:{&quot;q&quot;:&quot;Combien d&#x27;heures par jour passes-tu sur ton téléphone ?&quot;,&quot;unit&quot;:&quot;h par jour&quot;,&quot;min&quot;:0,&quot;max&quot;:12,&quot;step&quot;:0.5,&quot;def&quot;:4,&quot;mult&quot;:365,&quot;out&quot;:&quot;heures par an&quot;,&quot;div&quot;:24,&quot;divLabel&quot;:&quot;jours entiers&quot;,&quot;eq&quot;:[6,&quot;livres de 300 pages lus&quot;],&quot;gain&quot;:&quot;récupérées chaque année&quot;},&quot;env&quot;:[&quot;Couper les notifications non essentielles&quot;,&quot;Sortir les applis des écrans d&#x27;accueil&quot;,&quot;Me déconnecter des réseaux sociaux&quot;,&quot;Passer l&#x27;écran en noir et blanc&quot;,&quot;Charger le téléphone hors de la chambre&quot;,&quot;Régler une limite de temps par appli&quot;],&quot;triggers&quot;:[&quot;Une notification&quot;,&quot;L&#x27;ennui&quot;,&quot;Une file d&#x27;attente&quot;,&quot;Dans mon lit&quot;,&quot;Une pause au travail&quot;,&quot;Pendant le repas&quot;,&quot;Quand je suis stressé&quot;,&quot;Quand je suis seul&quot;,&quot;Dans les transports&quot;,&quot;Avant de m&#x27;endormir&quot;],&quot;actions&quot;:[&quot;Respirer 1 minute&quot;,&quot;Boire un verre d&#x27;eau&quot;,&quot;Écrire une phrase dans mes notes&quot;,&quot;Poser le téléphone dans une autre pièce&quot;,&quot;Lire 2 pages&quot;,&quot;Faire quelques étirements&quot;,&quot;Appeler un ami&quot;,&quot;Marcher 5 minutes dehors&quot;,&quot;Regarder par la fenêtre&quot;,&quot;Ranger un objet&quot;],&quot;distract&quot;:[&quot;Nouveau message&quot;,&quot;12 notifications&quot;,&quot;Quelqu&#x27;un a aimé ta photo&quot;,&quot;Offre -50 % aujourd&#x27;hui&quot;,&quot;Tu as raté une story&quot;,&quot;Mise à jour disponible&quot;],&quot;myths&quot;:[[&quot;Si je coupe les notifications, je vais rater des choses importantes.&quot;,false,&quot;Tes appels et messages de proches restent possibles. La plupart des notifications ne sont pas urgentes.&quot;],[&quot;Une envie de checker dure toute la journée.&quot;,false,&quot;Elle monte, atteint un pic, puis retombe, souvent en quelques minutes.&quot;],[&quot;Il faut une volonté de fer pour réduire son temps d&#x27;écran.&quot;,false,&quot;Ton environnement fait le travail : applis rangées, notifications coupées, téléphone loin du lit.&quot;],[&quot;Dormir avec le téléphone près du lit n&#x27;a aucun effet sur le sommeil.&quot;,false,&quot;Il retarde souvent le coucher et fragilise le sommeil. Le charger hors de la chambre aide.&quot;],[&quot;Remplacer le scroll par une autre activité aide à tenir.&quot;,true,&quot;Quand on enlève une habitude sans rien mettre à la place, le vide la rappelle.&quot;],[&quot;Si je dérape une soirée, tout est perdu.&quot;,false,&quot;Un dérapage n&#x27;est pas une rechute : on reprend le fil le lendemain.&quot;]],&quot;pairs&quot;:[[&quot;Notification&quot;,&quot;Couper les notifications&quot;],[&quot;L&#x27;ennui&quot;,&quot;Lire 2 pages&quot;],[&quot;Dans mon lit&quot;,&quot;Téléphone hors de la chambre&quot;],[&quot;Stress&quot;,&quot;Respirer 1 minute&quot;],[&quot;File d&#x27;attente&quot;,&quot;Regarder autour de moi&quot;]],&quot;pieges&quot;:[[&quot;Juste cinq minutes.&quot;,true,&quot;Cinq minutes deviennent souvent trente. Si tu y vas, mets un minuteur avant.&quot;],[&quot;Je l&#x27;ai bien mérité.&quot;,true,&quot;Tu peux te récompenser autrement, sans y perdre ta soirée.&quot;],[&quot;L&#x27;envie va passer si j&#x27;attends 10 minutes.&quot;,false,&quot;Exact : une envie monte, atteint un pic puis retombe.&quot;],[&quot;J&#x27;ai besoin de savoir ce qui se passe.&quot;,true,&quot;Presque rien n&#x27;est urgent. Les vraies urgences t&#x27;appellent.&quot;],[&quot;Je peux faire une pause d&#x27;écran maintenant.&quot;,false,&quot;Oui. Une pause de 10 minutes est déjà une victoire.&quot;],[&quot;Je regarde juste un truc.&quot;,true,&quot;« Juste un truc » est la porte d&#x27;entrée du scroll.&quot;],[&quot;Un dérapage n&#x27;est pas un échec.&quot;,false,&quot;Exact. Ce qui compte, c&#x27;est de reprendre le fil.&quot;],[&quot;Je peux m&#x27;arrêter quand je veux.&quot;,true,&quot;Alors prouve-le : arrête pendant 10 minutes, tout de suite.&quot;]],&quot;scenarios&quot;:[{&quot;q&quot;:&quot;Il est 23h30, tu es dans ton lit. Tu prends ton téléphone « juste pour voir l&#x27;heure ».&quot;,&quot;c&quot;:[[&quot;J&#x27;ouvre une appli, juste deux minutes&quot;,0,&quot;Deux minutes deviennent souvent une heure. L&#x27;idéal : le téléphone n&#x27;est pas dans la chambre.&quot;],[&quot;Je le repose et je respire 1 minute&quot;,2,&quot;Bien joué : tu coupes l&#x27;automatisme et tu protèges ton sommeil.&quot;],[&quot;Je mets un minuteur de 5 minutes&quot;,1,&quot;Mieux que rien, mais tu restes dans le piège.&quot;]]},{&quot;q&quot;:&quot;Tu t&#x27;ennuies dans la file d&#x27;attente du supermarché.&quot;,&quot;c&quot;:[[&quot;Je regarde autour de moi, sans écran&quot;,2,&quot;Parfait. L&#x27;ennui est inconfortable un instant, puis il passe.&quot;],[&quot;Je regarde juste mes notifications&quot;,0,&quot;C&#x27;est comme ça que le scroll recommence.&quot;],[&quot;J&#x27;écoute un podcast&quot;,1,&quot;Ça occupe sans scroller : c&#x27;est correct.&quot;]]},{&quot;q&quot;:&quot;Tu as passé 2 heures sur ton téléphone sans t&#x27;en rendre compte. Tu te sens mal.&quot;,&quot;c&quot;:[[&quot;Je me dis que je suis nul et j&#x27;abandonne&quot;,0,&quot;Le jugement dur fatigue et pousse à recommencer.&quot;],[&quot;Je note ce qui m&#x27;a déclenché et je reprends demain&quot;,2,&quot;C&#x27;est ça, un dérapage utile : tu apprends et tu repars.&quot;],[&quot;Je supprime toutes mes applis d&#x27;un coup&quot;,1,&quot;Radical, mais difficile à tenir. Mieux vaut avancer pas à pas.&quot;]]}],&quot;relapse&quot;:{&quot;heure&quot;:[&quot;Je pose le téléphone et je respire&quot;,&quot;Je bois un verre d&#x27;eau et je sors prendre l&#x27;air&quot;,&quot;Je note ce qui s&#x27;est passé&quot;],&quot;ajuster&quot;:[&quot;Je règle une limite de temps&quot;,&quot;Je range l&#x27;appli difficile&quot;,&quot;Je change mon heure de coucher&quot;],&quot;prevenir&quot;:[&quot;Un ami proche&quot;,&quot;Mon frère ou ma sœur&quot;,&quot;Mon conjoint ou ma conjointe&quot;,&quot;Un professionnel&quot;,&quot;Personne, je gère seul&quot;]},&quot;events&quot;:[&quot;Soirée seul&quot;,&quot;Week-end sans programme&quot;,&quot;Voyage&quot;,&quot;Stress au travail&quot;,&quot;Dimanche soir&quot;,&quot;Vacances&quot;],&quot;messages&quot;:[&quot;Je réduis mon temps d&#x27;écran. Peux-tu me demander demain comment ça s&#x27;est passé ?&quot;,&quot;J&#x27;essaie de lâcher mon téléphone le soir. Tu peux me le rappeler gentiment ?&quot;],&quot;rules&quot;:[&quot;Garder mes barrières en place&quot;,&quot;Utiliser le bouton SOS à chaque envie&quot;,&quot;Prévoir mes moments à risque&quot;,&quot;Parler à quelqu&#x27;un quand c&#x27;est dur&quot;,&quot;Bouger régulièrement&quot;,&quot;Bien dormir&quot;,&quot;Me récompenser autrement&quot;,&quot;Faire un point chaque mois&quot;,&quot;Pas de téléphone au lit&quot;,&quot;Notifications coupées&quot;],&quot;identite&quot;:[&quot;qui décide de son temps&quot;,&quot;qui tient ses engagements&quot;,&quot;qui prend soin de lui&quot;,&quot;qui sait demander de l&#x27;aide&quot;,&quot;qui ose dire non&quot;,&quot;qui se réveille avec de l&#x27;énergie&quot;,&quot;qui choisit ses soirées&quot;,&quot;qui protège son argent&quot;,&quot;qui est présent avec ses proches&quot;,&quot;qui avance sur ses projets&quot;,&quot;qui se respecte&quot;,&quot;qui ne se juge plus durement&quot;],&quot;rewards&quot;:[&quot;Un bon repas au restaurant&quot;,&quot;Une sortie au cinéma&quot;,&quot;Un week-end dans la nature&quot;,&quot;Un vêtement qui me plaît&quot;,&quot;Un moment avec un ami&quot;,&quot;Une journée sans rien faire&quot;,&quot;Un livre ou un jeu&quot;,&quot;Un hammam ou un massage&quot;,&quot;Un petit voyage&quot;,&quot;Un cadeau pour quelqu&#x27;un&quot;],&quot;evening&quot;:[&quot;Fixer l&#x27;heure du coucher&quot;,&quot;Téléphone hors du lit&quot;,&quot;Écrans éteints 30 minutes avant&quot;,&quot;Douche ou tisane&quot;,&quot;Préparer la journée de demain&quot;,&quot;Respirer 2 minutes&quot;],&quot;people&quot;:[&quot;Un ami proche&quot;,&quot;Mon frère ou ma sœur&quot;,&quot;Mon conjoint ou ma conjointe&quot;,&quot;Un parent&quot;,&quot;Un collègue de confiance&quot;,&quot;Mon médecin&quot;],&quot;pause&quot;:[&quot;Lève-toi et étire-toi&quot;,&quot;Bois un verre d&#x27;eau, lentement&quot;,&quot;Regarde loin, par la fenêtre&quot;,&quot;Respire lentement 5 fois&quot;,&quot;Note ce que tu ressens, en une phrase&quot;]},&quot;days&quot;:[[&quot;Ton pourquoi&quot;,&quot;Avant de changer quoi que ce soit, il faut savoir pour quoi tu le fais. Ce pourquoi sera ta réserve les jours difficiles : il doit venir de toi, pas de ce qu&#x27;on attend de toi.&quot;,&quot;Écris 3 raisons personnelles de reprendre la main sur ton téléphone (dormir, être présent, avancer sur un projet…). Garde-les en note sur ton écran de verrouillage.&quot;,&quot;choose&quot;,{}],[&quot;Mesurer sans te juger&quot;,&quot;Ton téléphone sait déjà combien de temps tu y passes. Regarder le chiffre sans te traiter de nul, c&#x27;est le vrai premier pas : on ne règle pas ce qu&#x27;on ne regarde pas.&quot;,&quot;Ouvre « Temps d&#x27;écran » (iPhone) ou « Bien-être numérique » (Android). Note ta moyenne des 7 derniers jours et tes 3 applis les plus utilisées.&quot;,&quot;calc&quot;,{}],[&quot;Ce que ça t&#x27;apporte, ce que ça te coûte&quot;,&quot;Le scroll te donne quelque chose : fuir l&#x27;ennui, ne pas être seul, se sentir à jour. Le reconnaître permet de trouver d&#x27;autres façons d&#x27;obtenir la même chose. Ce n&#x27;est pas un manque de volonté, c&#x27;est une habitude qui te rend service.&quot;,&quot;Fais deux colonnes : ce que le téléphone t&#x27;apporte / ce qu&#x27;il te coûte (temps, sommeil, humeur, concentration). Souligne ce qui pèse le plus.&quot;,&quot;balance&quot;,{}],[&quot;Tes déclencheurs&quot;,&quot;Un déclencheur, c&#x27;est ce qui te fait sortir le téléphone sans y penser : une notification, l&#x27;ennui, une file d&#x27;attente, le lit, un moment de stress. Quand tu les repères, tu les vois venir.&quot;,&quot;Aujourd&#x27;hui, à chaque fois que tu prends ton téléphone, note l&#x27;heure et ce que tu ressens juste avant. Vise 10 notes.&quot;,&quot;heat&quot;,{}],[&quot;Rendre le scroll moins facile&quot;,&quot;Ta volonté est limitée, ton environnement peut faire le travail à ta place. Chaque petit obstacle, comme un mot de passe à retaper ou une appli rangée loin, réduit les ouvertures automatiques.&quot;,&quot;Coupe toutes les notifications sauf appels et messages de proches. Sors les 3 applis les plus utilisées de ton écran d&#x27;accueil et déconnecte-toi.&quot;,&quot;checklist&quot;,{}],[&quot;Le plan « si… alors… »&quot;,&quot;Un plan précis marche mieux qu&#x27;une bonne intention. Tu décides à l&#x27;avance quoi faire quand le déclencheur arrive, pour ne pas avoir à choisir sous l&#x27;impulsion.&quot;,&quot;Écris 3 phrases : « Si je suis dans mon lit / en file d&#x27;attente / en pause, alors je… » avec une action concrète (lire 2 pages, regarder dehors, boire un verre d&#x27;eau).&quot;,&quot;pairs&quot;,{}],[&quot;Bilan de la semaine 1&quot;,&quot;Une semaine pour comprendre. Tu sais maintenant combien de temps tu y passes, ce que ça te donne et quand ça se déclenche. C&#x27;est suffisant pour attaquer la suite.&quot;,&quot;Relis tes notes. Complète : « Ce que j&#x27;ai appris sur moi cette semaine, c&#x27;est… ». Choisis un seul moment de la journée à protéger la semaine prochaine.&quot;,&quot;bilan&quot;,{}],[&quot;Comprendre l&#x27;envie&quot;,&quot;L&#x27;envie de regarder ton téléphone monte, atteint un pic, puis retombe, même si tu ne fais rien. Savoir que ça passe change tout : une envie n&#x27;est pas un ordre.&quot;,&quot;Quand l&#x27;envie arrive, attends 2 minutes avant d&#x27;agir. Observe : où la sens-tu dans le corps ? Que devient-elle au bout de 2 minutes ?&quot;,&quot;wave&quot;,{}],[&quot;La règle des 10 minutes&quot;,&quot;Quand une envie arrive, ne te dis pas « jamais », dis-toi « dans 10 minutes ». Souvent, l&#x27;envie est partie avant. Si elle est encore là, tu y vas en conscience, pas en automatique.&quot;,&quot;Utilise le bouton SOS du site (ou un minuteur de 10 minutes) à chaque envie aujourd&#x27;hui. Compte combien sont passées.&quot;,&quot;hold&quot;,{}],[&quot;Respirer pour retomber&quot;,&quot;Quand tu veux décrocher, le corps s&#x27;agite. Une respiration lente, avec un souffle plus long que l&#x27;inspiration, aide à calmer le système nerveux en quelques minutes.&quot;,&quot;Fais 2 minutes de respiration (inspire 4 secondes, souffle 6), deux fois dans la journée, dont une avant de prendre ton téléphone par réflexe.&quot;,&quot;breathe&quot;,{}],[&quot;Quand tu t&#x27;ennuies&quot;,&quot;L&#x27;ennui est l&#x27;un des premiers déclencheurs. Il est inconfortable parce qu&#x27;on ne le laisse jamais durer. T&#x27;y habituer, c&#x27;est retrouver des idées et de l&#x27;attention.&quot;,&quot;Choisis un moment d&#x27;ennui (transport, attente, repas) et laisse ton téléphone dans la poche. Note ce qui te passe par la tête.&quot;,&quot;slot&quot;,{}],[&quot;Stress et fatigue&quot;,&quot;On scrolle davantage quand on est stressé ou fatigué : le cerveau cherche une pause facile. Si tu t&#x27;accordes de vraies pauses à ces moments, le téléphone devient moins nécessaire.&quot;,&quot;Prévois 3 pauses de 5 minutes sans écran aujourd&#x27;hui : étirements, fenêtre ouverte, verre d&#x27;eau, marche.&quot;,&quot;pause&quot;,{}],[&quot;Réseaux sociaux et comparaison&quot;,&quot;Les réseaux montrent le meilleur de la vie des autres, et s&#x27;y comparer fatigue. Tu peux garder ce qui t&#x27;apporte quelque chose et couper le reste.&quot;,&quot;Mets en sourdine ou désabonne-toi de 10 comptes qui te donnent un mauvais sentiment. Garde ceux qui t&#x27;apprennent ou te font rire.&quot;,&quot;myths&quot;,{}],[&quot;Bilan de la semaine 2&quot;,&quot;Tu as appris à voir l&#x27;envie venir et à la laisser passer. Même quelques envies surmontées comptent : ce sont elles qui construisent la nouvelle habitude.&quot;,&quot;Regarde ton compteur d&#x27;envies surmontées. Note le moment le plus dur de la semaine et ce qui t&#x27;a aidé.&quot;,&quot;bilan&quot;,{}],[&quot;Remplacer, pas seulement enlever&quot;,&quot;Si tu enlèves une habitude sans rien mettre à la place, le vide la rappelle. Choisis des activités simples, accessibles, qui occupent les mains ou la tête.&quot;,&quot;Liste 5 activités de 10 minutes faisables n&#x27;importe où (livre, dessin, appel à un ami, podcast, étirements). Garde la liste en fond d&#x27;écran.&quot;,&quot;toolbox&quot;,{}],[&quot;Bouger&quot;,&quot;Le mouvement change l&#x27;humeur et l&#x27;énergie, et occupe le temps où tu aurais scrollé. Pas besoin de sport intense : marcher compte.&quot;,&quot;Marche 20 minutes aujourd&#x27;hui, sans écran. Un podcast est autorisé.&quot;,&quot;move&quot;,{}],[&quot;Soirées et week-ends&quot;,&quot;Les moments sans cadre sont les plus risqués. Un planning léger, même flou, évite de glisser dans le scroll par défaut.&quot;,&quot;Planifie ce week-end 2 activités concrètes hors écran, avec un horaire.&quot;,&quot;planner&quot;,{}],[&quot;En parler à quelqu&#x27;un&quot;,&quot;Dire à un proche ce que tu fais t&#x27;engage et te soutient. Tu n&#x27;as pas à te justifier : une phrase simple suffit.&quot;,&quot;Dis à une personne de confiance que tu réduis ton temps d&#x27;écran. Propose-lui de te demander des nouvelles ce soir.&quot;,&quot;message&quot;,{}],[&quot;Les pensées-pièges&quot;,&quot;« Juste cinq minutes », « je l&#x27;ai bien mérité », « je regarde juste un truc ». Ces phrases sont normales. Les repérer leur enlève du pouvoir.&quot;,&quot;Écris 3 phrases que tu te dis souvent avant de scroller. À côté de chacune, une réponse honnête et courte.&quot;,&quot;pieges&quot;,{}],[&quot;Te récompenser autrement&quot;,&quot;Ton cerveau aime les petites récompenses. Tu peux en garder sans passer par l&#x27;écran : un café, un moment dehors, une série à plusieurs.&quot;,&quot;Choisis une récompense pour chaque jour tenu cette semaine. Note-la maintenant.&quot;,&quot;rewards&quot;,{}],[&quot;Bilan de la semaine 3&quot;,&quot;Trois semaines de pratique. Regarde les chiffres, pas ton impression : on se juge toujours plus sévèrement qu&#x27;on ne le mérite.&quot;,&quot;Compare ton temps d&#x27;écran moyen de la semaine à celui du jour 2. Écris l&#x27;écart, quel qu&#x27;il soit.&quot;,&quot;bilan&quot;,{}],[&quot;Un dérapage n&#x27;est pas une rechute&quot;,&quot;Tu vas peut-être craquer une soirée. Ce n&#x27;est pas un échec, c&#x27;est une information. Ce qui compte, c&#x27;est de reprendre le fil le lendemain, sans te punir.&quot;,&quot;Écris la phrase que tu te diras après un gros dérapage. Courte, bienveillante, qui te remet en route.&quot;,&quot;scenario&quot;,{}],[&quot;Ton plan en cas de rechute&quot;,&quot;Prévoir le plan B enlève la peur. Qu&#x27;est-ce qui m&#x27;a fait craquer ? Qu&#x27;est-ce que je change ? Qui je préviens ?&quot;,&quot;Rédige un plan en 3 points : ce que je fais dans l&#x27;heure, ce que j&#x27;analyse, ce que j&#x27;ajuste.&quot;,&quot;relapse&quot;,{}],[&quot;Qui tu deviens&quot;,&quot;Tu ne fais pas que supprimer un comportement : tu deviens quelqu&#x27;un qui décide de son attention. Cette image aide à tenir sur la durée.&quot;,&quot;Complète 3 fois : « Je suis quelqu&#x27;un qui… » à propos de ton rapport au téléphone.&quot;,&quot;identity&quot;,{}],[&quot;Les moments à risque à venir&quot;,&quot;Vacances, périodes de stress, soirées seul : certains moments vont remettre le scroll en jeu. Les prévoir, c&#x27;est déjà y être préparé.&quot;,&quot;Liste les 3 prochains moments à risque des 4 semaines à venir et ce que tu feras à chaque fois.&quot;,&quot;calendar&quot;,{}],[&quot;Mieux dormir&quot;,&quot;Le téléphone au lit est l&#x27;un des plus gros voleurs de sommeil. Mieux dormir rend aussi les envies plus faciles à gérer.&quot;,&quot;Ce soir, charge ton téléphone hors de ta chambre, ou loin du lit, et utilise un réveil classique si besoin.&quot;,&quot;evening&quot;,{}],[&quot;Le temps que tu récupères&quot;,&quot;Ce temps est ton vrai gain. Le chiffrer le rend concret et motive.&quot;,&quot;Calcule : (temps d&#x27;écran du jour 2 moins temps actuel) × 30 jours. Écris ce que tu peux faire avec ces heures.&quot;,&quot;gain&quot;,{}],[&quot;Ton réseau de soutien&quot;,&quot;Si ton usage affecte ton sommeil, ton travail ou ton humeur au point que tu n&#x27;y arrives pas seul, en parler à un professionnel est une bonne idée. Ce n&#x27;est pas un échec.&quot;,&quot;Repère un interlocuteur : ton médecin généraliste, ou un psychologue. Si tu vas mal, le 3114 répond 24h/24.&quot;,&quot;support&quot;,{}],[&quot;Lettre à toi-même&quot;,&quot;Ce que tu as fait pendant 30 jours m ;avance de ce que tu feras quand le déclencheur arrive.&quot;,&quot;Écris 3 phrases : « Si je reçois une notification / un jour de match / après avoir perdu, alors je… » avec une action concrète.&quot;,&quot;pairs&quot;,{}],[&quot;Bilan de la semaine 1&quot;,&quot;Tu connais ton chiffre, tes déclencheurs, et tu as verrouillé l&#x27;accès. C&#x27;est la base.&quot;,&quot;Complète : « Ce que j&#x27;ai appris sur moi cette semaine, c&#x27;est… ». Choisis le moment le plus risqué de la semaine prochaine.&quot;,&quot;bilan&quot;,{}],[&quot;Comprendre l&#x27;envie de jouer&quot;,&quot;L&#x27;envie monte, atteint un pic, puis retombe, même si tu ne fais rien. L&#x27;espoir de gagner est puissant, mais il ne dure pas. Une envie n&#x27;est pas un ordre.&quot;,&quot;Quand l&#x27;envie arrive, attends 2 minutes avant d&#x27;agir. Où la sens-tu dans le corps ? Que devient-elle ?&quot;,&quot;wave&quot;,{}],[&quot;La règle des 24 heures&quot;,&quot;Ne dépose jamais le jour même. En te donnant 24 heures, tu laisses l&#x27;envie retomber, et tu décides à tête reposée.&quot;,&quot;Utilise le bouton SOS à chaque envie. Écris-toi : « Pas de dépôt avant demain ».&quot;,&quot;hold&quot;,{&quot;sec&quot;:24,&quot;t&quot;:&quot;Les 24 heures, version courte&quot;}],[&quot;Respirer pour retomber&quot;,&quot;Une respiration lente, avec un souffle plus long que l&#x27;inspiration, aide à calmer le corps en quelques minutes.&quot;,&quot;Fais 2 minutes de respiration (inspire 4 secondes, souffle 6) quand l&#x27;envie monte.&quot;,&quot;breathe&quot;,{}],[&quot;« Je vais me refaire »&quot;,&quot;C&#x27;est la pensée la plus coûteuse. Chaque mise pour récupérer une perte rend la suivante plus lourde. Les mathématiques ne sont pas de ton côté.&quot;,&quot;Écris le montant que tu as déjà perdu et ce que tu aurais pu en faire. Relis-le quand l&#x27;envie de te refaire monte.&quot;,&quot;chase&quot;,{}],[&quot;Confier la gestion de ton argent&quot;,&quot;Moins tu as d&#x27;accès direct à l&#x27;argent, moins tu peux jouer sur un coup de tête. Demander de l&#x27;aide ici est une force.&quot;,&quot;Mets en place un virement automatique d&#x27;épargne le jour de la paie. Pense à confier un compte à un proche, ou à fixer un plafond de paiement.&quot;,&quot;checklist&quot;,{&quot;key&quot;:&quot;money&quot;,&quot;t&quot;:&quot;Confier la gestion de ton argent&quot;}],[&quot;Bonus, cotes et publicités&quot;,&quot;Bonus, cotes « boostées », notifications : ces outils sont conçus pour te faire jouer plus. Savoir comment ils fonctionnent aide à ne plus tomber dans le panneau.&quot;,&quot;Désactive toutes les notifications liées aux paris. Note la dernière promotion qui t&#x27;a fait craquer.&quot;,&quot;myths&quot;,{}],[&quot;Bilan de la semaine 2&quot;,&quot;Tu as appris à voir l&#x27;envie venir, à l&#x27;attendre et à protéger ton argent. Chaque jour sans jouer compte.&quot;,&quot;Regarde ton compteur de jours sans jouer et d&#x27;envies surmontées. Note le moment le plus dur et ce qui t&#x27;a aidé.&quot;,&quot;bilan&quot;,{}],[&quot;Remplacer l&#x27;excitation&quot;,&quot;Le jeu comblait un besoin d&#x27;excitation ou d&#x27;évasion. Cherche d&#x27;autres sources : sport, défis, projets, rencontres.&quot;,&quot;Liste 5 activités qui te donnent de l&#x27;énergie ou du plaisir (sport, défi, loisir, sortie). Planifie-en une cette semaine.&quot;,&quot;toolbox&quot;,{}],[&quot;Bouger&quot;,&quot;Le mouvement change l&#x27;humeur et occupe les moments à risque. Pas besoin de sport intense : marcher compte.&quot;,&quot;Fais 20 minutes d&#x27;activité physique aujourd&#x27;hui, de préférence à l&#x27;heure où tu jouais.&quot;,&quot;move&quot;,{}],[&quot;Jours de match et soirées&quot;,&quot;Les gros événements sportifs et les soirées entre amis sont des moments à risque. Un plan évite de se retrouver coincé.&quot;,&quot;Regarde les 2 prochains événements sportifs importants. Décide à l&#x27;avance ce que tu feras : où tu regardes, avec qui, sans pari.&quot;,&quot;planner&quot;,{}],[&quot;En parler à quelqu&#x27;un&quot;,&quot;Cacher entretient la honte et les pertes. Parler à un proche de confiance, ou à Joueurs info service (09 74 75 13 13, gratuit et anonyme), allège.&quot;,&quot;Choisis une personne de confiance et dis-lui que tu arrêtes les paris. Ou appelle Joueurs info service.&quot;,&quot;message&quot;,{}],[&quot;Les pensées-pièges&quot;,&quot;« Juste un petit pari », « j&#x27;ai un système », « j&#x27;étais proche ». Ces phrases sont normales. Les repérer leur enlève du pouvoir.&quot;,&quot;Écris 3 phrases que tu te dis avant de parier. À côté de chacune, une réponse honnête et courte.&quot;,&quot;pieges&quot;,{}],[&quot;Te récompenser autrement&quot;,&quot;Ton cerveau aime les petites récompenses. Tu peux en garder sans jouer : un bon repas, un loisir, un week-end avec l&#x27;argent économisé.&quot;,&quot;Choisis une récompense pour chaque semaine tenue. Calcule combien ça coûte, et compare à ce que tu aurais joué.&quot;,&quot;rewards&quot;,{}],[&quot;Bilan de la semaine 3&quot;,&quot;Trois semaines de pratique. Regarde ce qui a changé : l&#x27;argent, le stress, le sommeil, l&#x27;humeur.&quot;,&quot;Écris 3 changements que tu constates, même petits.&quot;,&quot;bilan&quot;,{}],[&quot;Un dérapage n&#x27;est pas une rechute&quot;,&quot;Si tu craques, arrête immédiatement et ne cherche surtout pas à te refaire. Ce n&#x27;est pas un échec, c&#x27;est une information. Reprends le fil dès que possible.&quot;,&quot;Écris ce que tu feras si tu as joué : arrêter, ne rien redéposer, le dire à quelqu&#x27;un. Une phrase bienveillante pour reprendre.&quot;,&quot;scenario&quot;,{}],[&quot;Ton plan en cas de rechute&quot;,&quot;Prévoir le plan B enlève la peur. Qu&#x27;est-ce qui m&#x27;a fait craquer ? Qu&#x27;est-ce que je change ? Qui je préviens ?&quot;,&quot;Rédige un plan en 3 points : ce que je fais dans l&#x27;heure (arrêter, geler les paiements, appeler quelqu&#x27;un), ce que j&#x27;analyse, ce que j&#x27;ajuste.&quot;,&quot;relapse&quot;,{}],[&quot;Faire face aux dettes&quot;,&quot;Si tu as des dettes, les regarder en face est difficile, et c&#x27;est ce qui permet d&#x27;avancer. Il existe des conseillers gratuits pour t&#x27;aider à faire un plan.&quot;,&quot;Liste tes dettes et leurs montants. Renseigne-toi sur un Point Conseil Budget près de chez toi, gratuit.&quot;,&quot;checklist&quot;,{&quot;key&quot;:&quot;steps&quot;,&quot;t&quot;:&quot;Faire face aux dettes, pas à pas&quot;}],[&quot;Les moments à risque à venir&quot;,&quot;Jour de paie, grands tournois, fêtes, périodes de stress : certains moments vont remettre le jeu en jeu. Les prévoir, c&#x27;est déjà y être préparé.&quot;,&quot;Liste les 3 prochains moments à risque des 4 semaines à venir et ce que tu feras à chaque fois.&quot;,&quot;calendar&quot;,{}],[&quot;Mieux dormir&quot;,&quot;Le stress et les nuits courtes fragilisent. Dormir mieux rend les envies plus faciles à gérer.&quot;,&quot;Fixe une heure de coucher. Téléphone hors du lit ce soir. Prévois une activité calme avant de dormir.&quot;,&quot;evening&quot;,{}],[&quot;L&#x27;argent que tu récupères&quot;,&quot;Cet argent est ton vrai gain. Le chiffrer le rend concret et motive.&quot;,&quot;Reprends ton chiffre du jour 2. Divise-le par 3 pour avoir un montant par mois. Écris ce que tu veux faire avec cet argent.&quot;,&quot;gain&quot;,{}],[&quot;Ton réseau d&#x27;aide&quot;,&quot;Si tu n&#x27;y arrives pas seul, ou si tu es endetté, en parler à un professionnel est une bonne idée. Ce n&#x27;est pas un échec : Joueurs info service (09 74 75 13 13), ton médecin, un centre d&#x27;addictologie (CSAPA).&quot;,&quot;Note le numéro de Joueurs info service et le nom d&#x27;un médecin à qui t&#x27;adresser. Si tu vas mal, le 3114 répond 24h/24.&quot;,&quot;support&quot;,{}],[&quot;Lettre à toi-même&quot;,&quot;Ce que tu as fait pendant 30 jours mérite d&#x27;être écrit. Cette lettre te servira les jours où tu auras oublié pourquoi c&#x27;était important.&quot;,&quot;Écris-toi une lettre pour dans 3 mois : ce que tu as appris, ce que tu veux avoir gardé, ce que tu te souhaites.&quot;,&quot;letter&quot;,{}],[&quot;Et maintenant ?&quot;,&quot;30 jours, c&#x27;est un début, pas une fin. Garde les barrières qui ont marché, et refais le point une fois par mois. Ne remets jamais le jeu « juste pour voir ».&quot;,&quot;Choisis les 3 règles à garder. Plante un rappel mensuel dans ton agenda.&quot;,&quot;final&quot;,{}]]},&quot;vape-tabac&quot;:{&quot;kit&quot;:{&quot;raisons&quot;:[&quot;Retrouver mon souffle&quot;,&quot;Ma santé&quot;,&quot;L&#x27;argent économisé&quot;,&quot;Faire du sport&quot;,&quot;Être un exemple pour mes proches&quot;,&quot;Ne plus dépendre d&#x27;un produit&quot;,&quot;Mieux dormir&quot;,&quot;Retrouver le goût et l&#x27;odorat&quot;,&quot;Avoir plus d&#x27;énergie&quot;,&quot;Me sentir libre&quot;],&quot;pros&quot;:[&quot;Me détendre&quot;,&quot;Une pause&quot;,&quot;Un rituel social&quot;,&quot;Gérer le stress&quot;,&quot;Me concentrer&quot;,&quot;Mes habitudes du café&quot;],&quot;cons&quot;:[&quot;Je manque de souffle&quot;,&quot;Ça coûte cher&quot;,&quot;Je dépends de la nicotine&quot;,&quot;Je tousse&quot;,&quot;Je suis irritable quand j&#x27;en manque&quot;,&quot;Je m&#x27;inquiète pour ma santé&quot;,&quot;Je dors moins bien&quot;,&quot;Ça me prend du temps&quot;],&quot;calc&quot;:{&quot;q&quot;:&quot;Combien dépenses-tu par semaine ?&quot;,&quot;unit&quot;:&quot;€ par semaine&quot;,&quot;min&quot;:0,&quot;max&quot;:150,&quot;step&quot;:1,&quot;def&quot;:30,&quot;mult&quot;:52,&quot;out&quot;:&quot;€ par an&quot;,&quot;div&quot;:0,&quot;divLabel&quot;:&quot;&quot;,&quot;eq&quot;:[60,&quot;bons restaurants&quot;],&quot;gain&quot;:&quot;économisés chaque année&quot;},&quot;env&quot;:[&quot;Choisir mon jour d&#x27;arrêt&quot;,&quot;Parler à mon pharmacien ou à mon médecin&quot;,&quot;Jeter ou donner mon matériel&quot;,&quot;Nettoyer ma voiture et mon logement&quot;,&quot;Préparer chewing-gums et collations&quot;,&quot;Prévenir mes proches&quot;],&quot;triggers&quot;:[&quot;Le café&quot;,&quot;Après le repas&quot;,&quot;Une pause au travail&quot;,&quot;En soirée&quot;,&quot;Avec de l&#x27;alcool&quot;,&quot;Le stress&quot;,&quot;Dans la voiture&quot;,&quot;L&#x27;ennui&quot;,&quot;Avec des amis qui fument&quot;,&quot;Au réveil&quot;],&quot;actions&quot;:[&quot;Boire un grand verre d&#x27;eau&quot;,&quot;Mâcher un chewing-gum&quot;,&quot;Respirer lentement&quot;,&quot;Marcher 5 minutes&quot;,&quot;Me brosser les dents&quot;,&quot;Appeler un ami&quot;,&quot;Croquer une carotte&quot;,&quot;Faire les 4 D&quot;,&quot;Changer de pièce&quot;,&quot;Écrire ce que je ressens&quot;],&quot;distract&quot;:[&quot;Un collègue sort fumer&quot;,&quot;L&#x27;odeur d&#x27;une cigarette&quot;,&quot;Pause café&quot;,&quot;Un ami propose une bouffée&quot;,&quot;Une publicité de vape&quot;,&quot;Fin de repas&quot;],&quot;myths&quot;:[[&quot;Une bouffée après l&#x27;arrêt ne change rien.&quot;,false,&quot;Elle relance souvent la dépendance. Mieux vaut t&#x27;arrêter tout de suite.&quot;],[&quot;La détente après une cigarette est surtout la fin du manque.&quot;,true,&quot;La nicotine calme le manque qu&#x27;elle a créé.&quot;],[&quot;Les envies durent toute la journée.&quot;,false,&quot;Elles montent, atteignent un pic et retombent en quelques minutes.&quot;],[&quot;Des substituts nicotiniques peuvent aider à arrêter.&quot;,true,&quot;Parles-en à ton pharmacien ou à ton médecin, ou appelle Tabac info service (39 89).&quot;],[&quot;Il faut arrêter seul, sans aide.&quot;,false,&quot;L&#x27;accompagnement augmente les chances de réussir. Le 39 89 est gratuit.&quot;],[&quot;Un craquage = tout recommencer de zéro.&quot;,false,&quot;Un dérapage n&#x27;est pas une rechute : on reprend le fil.&quot;]],&quot;pairs&quot;:[[&quot;Le café&quot;,&quot;Le boire debout, dans une autre pièce&quot;],[&quot;Après le repas&quot;,&quot;Me brosser les dents&quot;],[&quot;Le stress&quot;,&quot;Respirer lentement&quot;],[&quot;En soirée&quot;,&quot;Une boisson sans alcool à la main&quot;],[&quot;Une envie forte&quot;,&quot;Les 4 D&quot;]],&quot;pieges&quot;:[[&quot;Juste une.&quot;,true,&quot;« Juste une » relance la dépendance.&quot;],[&quot;Ce soir c&#x27;est exceptionnel.&quot;,true,&quot;Il y aura toujours une occasion « exceptionnelle ».&quot;],[&quot;Je vais attendre 10 minutes.&quot;,false,&quot;L&#x27;envie monte, atteint un pic puis retombe.&quot;],[&quot;Je contrôle, je peux faire une exception.&quot;,true,&quot;Le contrôle revient seulement si tu arrêtes complètement.&quot;],[&quot;Je peux demander de l&#x27;aide au 39 89.&quot;,false,&quot;Oui, c&#x27;est gratuit et accompagné par un tabacologue.&quot;],[&quot;Ça va me calmer.&quot;,true,&quot;Ça calme le manque créé par la nicotine, pas ton vrai stress.&quot;],[&quot;Un dérapage n&#x27;est pas un échec.&quot;,false,&quot;Exact. Tu t&#x27;arrêtes là et tu reprends.&quot;],[&quot;Un seul de plus ne changera rien.&quot;,true,&quot;Ça relance l&#x27;envie et rapproche de la rechute.&quot;]],&quot;scenarios&quot;:[{&quot;q&quot;:&quot;Pause café au travail. Ton collègue sort fumer comme d&#x27;habitude.&quot;,&quot;c&quot;:[[&quot;Je sors avec lui, sans fumer&quot;,1,&quot;Possible, mais tu restes exposé à l&#x27;envie. Mieux vaut changer de routine.&quot;],[&quot;Je bois mon café debout, ailleurs, avec un chewing-gum&quot;,2,&quot;Tu gardes la pause et tu changes le geste. Bien joué.&quot;],[&quot;Je prends juste une bouffée&quot;,0,&quot;Une bouffée relance la dépendance.&quot;]]},{&quot;q&quot;:&quot;En soirée, après quelques verres, un ami te propose une cigarette.&quot;,&quot;c&quot;:[[&quot;Je refuse en disant « non merci, j&#x27;arrête »&quot;,2,&quot;Simple, clair, tu n&#x27;as pas à te justifier.&quot;],[&quot;J&#x27;accepte, c&#x27;est la fête&quot;,0,&quot;L&#x27;alcool et la fête sont les moments les plus risqués. Prévois ton plan à l&#x27;avance.&quot;],[&quot;Je m&#x27;éloigne sans rien dire&quot;,1,&quot;Ça protège, mais n&#x27;hésite pas à expliquer ta décision.&quot;]]},{&quot;q&quot;:&quot;Jour 3 sans nicotine : tu es irritable et l&#x27;envie est très forte.&quot;,&quot;c&quot;:[[&quot;Je lance les 4 D : délai, distraction, eau, respiration&quot;,2,&quot;Tu appliques une méthode qui marche et tu laisses passer l&#x27;envie.&quot;],[&quot;Je me dis que c&#x27;est trop dur et j&#x27;abandonne&quot;,0,&quot;Les premiers jours sont souvent les plus intenses. Ça passe. Appelle le 39 89 si besoin.&quot;],[&quot;Je me promets d&#x27;arrêter demain&quot;,0,&quot;Le « demain » repousse l&#x27;arrêt. Tu es déjà dedans.&quot;]]}],&quot;relapse&quot;:{&quot;heure&quot;:[&quot;Je m&#x27;arrête là et je jette ce qu&#x27;il reste&quot;,&quot;Je bois un verre d&#x27;eau et je sors prendre l&#x27;air&quot;,&quot;J&#x27;appelle le 39 89 ou un proche&quot;],&quot;ajuster&quot;:[&quot;Je demande des substituts à mon pharmacien&quot;,&quot;Je change mes routines du café&quot;,&quot;Je prends rendez-vous avec mon médecin&quot;],&quot;prevenir&quot;:[&quot;Un ami proche&quot;,&quot;Mon frère ou ma sœur&quot;,&quot;Mon conjoint ou ma conjointe&quot;,&quot;Un professionnel&quot;,&quot;Personne, je gère seul&quot;]},&quot;events&quot;:[&quot;Soirée avec alcool&quot;,&quot;Pause café&quot;,&quot;Période de stress&quot;,&quot;Repas de famille&quot;,&quot;Vacances&quot;,&quot;Dispute&quot;],&quot;messages&quot;:[&quot;J&#x27;arrête la cigarette ou la vape. Peux-tu me soutenir cette semaine ?&quot;,&quot;Peux-tu éviter de m&#x27;en proposer ? Ça m&#x27;aiderait beaucoup.&quot;],&quot;rules&quot;:[&quot;Garder mes barrières en place&quot;,&quot;Utiliser le bouton SOS à chaque envie&quot;,&quot;Prévoir mes moments à risque&quot;,&quot;Parler à quelqu&#x27;un quand c&#x27;est dur&quot;,&quot;Bouger régulièrement&quot;,&quot;Bien dormir&quot;,&quot;Me récompenser autrement&quot;,&quot;Faire un point chaque mois&quot;,&quot;Aucune bouffée, jamais&quot;,&quot;Appeler le 39 89 si ça devient dur&quot;],&quot;identite&quot;:[&quot;qui décide de son temps&quot;,&quot;qui tient ses engagements&quot;,&quot;qui prend soin de lui&quot;,&quot;qui sait demander de l&#x27;aide&quot;,&quot;qui ose dire non&quot;,&quot;qui se réveille avec de l&#x27;énergie&quot;,&quot;qui choisit ses soirées&quot;,&quot;qui protège son argent&quot;,&quot;qui est présent avec ses proches&quot;,&quot;qui avance sur ses projets&quot;,&quot;qui se respecte&quot;,&quot;qui ne se juge plus durement&quot;],&quot;rewards&quot;:[&quot;Un bon repas au restaurant&quot;,&quot;Une sortie au cinéma&quot;,&quot;Un week-end dans la nature&quot;,&quot;Un vêtement qui me plaît&quot;,&quot;Un moment avec un ami&quot;,&quot;Une journée sans rien faire&quot;,&quot;Un livre ou un jeu&quot;,&quot;Un hammam ou un massage&quot;,&quot;Un petit voyage&quot;,&quot;Un cadeau pour quelqu&#x27;un&quot;],&quot;evening&quot;:[&quot;Fixer l&#x27;heure du coucher&quot;,&quot;Téléphone hors du lit&quot;,&quot;Écrans éteints 30 minutes avant&quot;,&quot;Douche ou tisane&quot;,&quot;Préparer la journée de demain&quot;,&quot;Respirer 2 minutes&quot;],&quot;people&quot;:[&quot;Un ami proche&quot;,&quot;Mon frère ou ma sœur&quot;,&quot;Mon conjoint ou ma conjointe&quot;,&quot;Un parent&quot;,&quot;Un collègue de confiance&quot;,&quot;Mon médecin&quot;],&quot;pause&quot;:[&quot;Lève-toi et étire-toi&quot;,&quot;Bois un verre d&#x27;eau, lentement&quot;,&quot;Regarde loin, par la fenêtre&quot;,&quot;Respire lentement 5 fois&quot;,&quot;Note ce que tu ressens, en une phrase&quot;],&quot;method&quot;:[&quot;Patch nicotinique&quot;,&quot;Gommes ou pastilles&quot;,&quot;Rendez-vous avec mon pharmacien&quot;,&quot;Rendez-vous avec mon médecin&quot;,&quot;Appeler Tabac info service (39 89)&quot;,&quot;Sans substitut, avec mon plan&quot;],&quot;veille&quot;:[&quot;Relire mon pourquoi&quot;,&quot;Jeter ou donner mon matériel&quot;,&quot;Préparer chewing-gums, eau et collations&quot;,&quot;Prévenir 2 personnes&quot;,&quot;Fixer mon heure de coucher&quot;,&quot;Choisir mon premier geste de remplacement&quot;],&quot;geste&quot;:[&quot;Chewing-gum&quot;,&quot;Cure-dent&quot;,&quot;Verre d&#x27;eau&quot;,&quot;Bâtonnet de cannelle&quot;,&quot;Balle antistress&quot;,&quot;Crayon dans les doigts&quot;],&quot;snacks&quot;:[&quot;Fruits&quot;,&quot;Carottes&quot;,&quot;Noix&quot;,&quot;Yaourt&quot;,&quot;Pommes&quot;,&quot;Tisane&quot;],&quot;timeline&quot;:[[&quot;20 minutes&quot;,&quot;La fréquence cardiaque et la tension commencent à redescendre.&quot;],[&quot;24 heures&quot;,&quot;Le monoxyde de carbone quitte progressivement le sang.&quot;],[&quot;2 à 3 jours&quot;,&quot;Le goût et l&#x27;odorat reviennent peu à peu.&quot;],[&quot;2 à 4 semaines&quot;,&quot;Beaucoup de personnes respirent plus facilement et toussent moins.&quot;],[&quot;1 à 3 mois&quot;,&quot;Le souffle et l&#x27;énergie s&#x27;améliorent souvent nettement.&quot;],[&quot;1 an&quot;,&quot;Le risque de maladie cardiaque diminue fortement par rapport à un fumeur.&quot;]]},&quot;days&quot;:[[&quot;Ton pourquoi&quot;,&quot;Avant d&#x27;arrêter, sache pour quoi tu le fais : la santé, le souffle, l&#x27;argent, le sport, la liberté. Ce pourquoi sera ta réserve les jours difficiles.&quot;,&quot;Écris 3 raisons personnelles d&#x27;arrêter. Garde-les en note sur ton écran de verrouillage.&quot;,&quot;choose&quot;,{}],[&quot;Ta consommation réelle&quot;,&quot;On sous-estime presque toujours. Savoir exactement combien tu consommes, c&#x27;est un point de départ réel. Pour la vape, compte aussi la quantité de nicotine.&quot;,&quot;Pendant 3 jours, note chaque cigarette ou chaque session de vape : l&#x27;heure, le lieu, ce qui se passe juste avant. Aujourd&#x27;hui, estime ta consommation habituelle.&quot;,&quot;calc&quot;,{}],[&quot;Ce que ça t&#x27;apporte, ce que ça te coûte&quot;,&quot;La détente ressentie après une bouffée est souvent la fin du manque de nicotine. Le comprendre aide à voir le piège. Ça coûte aussi du souffle, de l&#x27;argent et du temps.&quot;,&quot;Fais deux colonnes : ce que ça t&#x27;apporte / ce que ça te coûte (argent, souffle, santé). Souligne ce qui pèse le plus.&quot;,&quot;balance&quot;,{}],[&quot;Tes déclencheurs&quot;,&quot;Café, pause, après le repas, soirée, alcool, stress, voiture : ce sont des déclencheurs. Quand tu les repères, tu les vois venir.&quot;,&quot;Note tes 5 moments de la journée où l&#x27;envie est la plus forte.&quot;,&quot;heat&quot;,{}],[&quot;Choisir ta méthode et ta date&quot;,&quot;Beaucoup de personnes arrêtent avec de l&#x27;aide : substituts nicotiniques (patchs, gommes), accompagnement d&#x27;un tabacologue, ton médecin. Demande conseil à ton pharmacien ou ton médecin, ou appelle Tabac info service (39 89).&quot;,&quot;Choisis ton jour d&#x27;arrêt, dans 3 jours. Parle à ton pharmacien ou ton médecin de ce qui peut t&#x27;aider.&quot;,&quot;toolbox&quot;,{&quot;src&quot;:&quot;method&quot;,&quot;min&quot;:1,&quot;max&quot;:3,&quot;t&quot;:&quot;Choisis ta méthode&quot;,&quot;i&quot;:&quot;Touche jusqu&#x27;à 3 aides qui te conviennent. Tu peux en parler à ton pharmacien ou au 39 89.&quot;}],[&quot;Préparer le terrain&quot;,&quot;Tu mets toutes les chances de ton côté avant le jour J : pas de stock, pas de tentation facile, un plan pour les moments difficiles.&quot;,&quot;Prévois de jeter ou donner ton matériel le jour J. Nettoie ta voiture et ton appartement. Prépare chewing-gums, eau et collations.&quot;,&quot;checklist&quot;,{&quot;key&quot;:&quot;env&quot;,&quot;t&quot;:&quot;Préparer le terrain&quot;}],[&quot;La veille du jour J&quot;,&quot;Dernière étape avant l&#x27;arrêt. Tu te prépares, tu te reposes, tu te donnes un cadre pour demain.&quot;,&quot;Relis ton pourquoi. Prévois demain : ce que tu feras pour les moments à risque, qui tu préviens, et ce que tu fais de ton matériel.&quot;,&quot;checklist&quot;,{&quot;key&quot;:&quot;veille&quot;,&quot;t&quot;:&quot;La veille du jour J&quot;}],[&quot;Jour J : ta première journée sans&quot;,&quot;Les premi ure, où, avec qui, et ce que tu ressentais juste avant.&quot;,&quot;calc&quot;,{}],[&quot;Ce que ça t&#x27;apporte, ce que ça te coûte&quot;,&quot;Le cannabis te rend service : il détend, il aide à décrocher, il rapproche des amis. Le reconnaître permet de trouver d&#x27;autres façons d&#x27;obtenir la même chose. Ça coûte aussi du sommeil, de la motivation, de l&#x27;argent.&quot;,&quot;Fais deux colonnes sur papier : ce que ça t&#x27;apporte / ce que ça te coûte. Entoure ce que tu pourrais obtenir autrement.&quot;,&quot;balance&quot;,{}],[&quot;Tes déclencheurs&quot;,&quot;Un déclencheur, c&#x27;est ce qui te donne envie sans que tu y penses : rentrer chez toi, un ami, l&#x27;ennui, un morceau de musique, la fin de journée. Quand tu les repères, tu les vois venir.&quot;,&quot;À chaque envie aujourd&#x27;hui, note l&#x27;heure, le lieu et ce que tu ressens juste avant. Vise 5 notes.&quot;,&quot;heat&quot;,{}],[&quot;Préparer ta méthode et ta date&quot;,&quot;Tu mets toutes les chances de ton côté : un jour d&#x27;arrêt, un environnement qui t&#x27;aide, quelqu&#x27;un qui le sait. Rien ne se garde « pour plus tard » : ce qui est à portée de main finit par être utilisé.&quot;,&quot;Choisis ton jour d&#x27;arrêt. Jette ou donne ton stock et ton matériel, supprime les contacts et conversations liés.&quot;,&quot;checklist&quot;,{}],[&quot;Le plan « si… alors… »&quot;,&quot;Un plan précis marche mieux qu&#x27;une bonne intention. Tu décides à l&#x27;avance quoi faire quand le déclencheur arrive, pour ne pas avoir à choisir sous l&#x27;impulsion.&quot;,&quot;Écris 3 phrases : « Si je rentre le soir / si un ami propose / si je n&#x27;arrive pas à dormir, alors je… » avec une action concrète.&quot;,&quot;pairs&quot;,{}],[&quot;Bilan de la semaine 1&quot;,&quot;Une semaine pour comprendre. Tu sais maintenant ce que tu consommes, ce que ça t&#x27;apporte et quand ça se déclenche. C&#x27;est suffisant pour attaquer la suite.&quot;,&quot;Relis tes notes. Complète : « Ce que j&#x27;ai appris sur moi cette semaine, c&#x27;est… ». Choisis un moment à protéger la semaine prochaine.&quot;,&quot;bilan&quot;,{}],[&quot;Comprendre l&#x27;envie&quot;,&quot;L&#x27;envie monte, atteint un pic, puis retombe, même si tu ne fais rien. Savoir que ça passe change tout : une envie n&#x27;est pas un ordre.&quot;,&quot;Quand l&#x27;envie arrive, attends 10 minutes avant d&#x27;agir. Observe : où la sens-tu dans le corps ? Que devient-elle ?&quot;,&quot;wave&quot;,{}],[&quot;Tenir 10 minutes&quot;,&quot;Quand une envie arrive, ne te dis pas « jamais », dis-toi « dans 10 minutes ». Souvent, elle est partie avant. Les premiers jours, on peut être irritable et dormir mal : c&#x27;est fréquent, et ça passe.&quot;,&quot;Utilise le bouton SOS à chaque envie aujourd&#x27;hui. Compte combien sont passées.&quot;,&quot;hold&quot;,{}],[&quot;Respirer pour retomber&quot;,&quot;Une respiration lente, avec un souffle plus long que l&#x27;inspiration, aide à calmer le système nerveux en quelques minutes. C&#x27;est un outil que tu emportes partout.&quot;,&quot;Fais 2 minutes de respiration (inspire 4 secondes, souffle 6), deux fois dans la journée, dont une au moment où tu consommais.&quot;,&quot;breathe&quot;,{}],[&quot;Le rituel du soir&quot;,&quot;Souvent, ce n&#x27;est pas le produit qui manque, c&#x27;est le moment : la pause en rentrant, le geste, le canapé. Tu peux garder le moment et changer le geste.&quot;,&quot;Choisis un nouveau rituel pour ce soir : douche chaude, tisane, série, cuisine, musique. Prépare ce qu&#x27;il te faut avant de rentrer.&quot;,&quot;slot&quot;,{}],[&quot;Stress et anxiété&quot;,&quot;On consomme davantage quand on est stressé ou anxieux : le corps cherche une pause. Si tu t&#x27;accordes de vraies pauses à ces moments, le produit devient moins nécessaire.&quot;,&quot;Prévois 3 pauses de 5 minutes aujourd&#x27;hui : étirements, fenêtre ouverte, verre d&#x27;eau, marche. Note comment tu te sens après.&quot;,&quot;pause&quot;,{}],[&quot;Idées reçues sur le cannabis&quot;,&quot;« Ça aide à dormir », « c&#x27;est naturel », « je gère ». Certaines idées reçues retiennent au même endroit. Les regarder d&#x27;un œil honnête enlève du pouvoir à la routine.&quot;,&quot;Écris l&#x27;idée reçue qui te parle le plus et ce que tu en penses maintenant.&quot;,&quot;myths&quot;,{}],[&quot;Bilan de la semaine 2&quot;,&quot;Tu as appris à voir l&#x27;envie venir, à l&#x27;attendre et à changer le rituel. Chaque jour compte, même imparfait.&quot;,&quot;Regarde ton compteur de jours sans et d&#x27;envies surmontées. Note le moment le plus dur et ce qui t&#x27;a aidé.&quot;,&quot;bilan&quot;,{}],[&quot;Remplacer, pas seulement enlever&quot;,&quot;Quand on enlève une habitude sans rien mettre à la place, le vide la rappelle. Construis ta boîte à outils : des actions simples que tu peux faire à la place.&quot;,&quot;Choisis 3 activités de remplacement et garde-les dans une note. Fais-en une aujourd&#x27;hui, même 10 minutes.&quot;,&quot;toolbox&quot;,{}],[&quot;Bouger&quot;,&quot;Le mouvement change l&#x27;humeur, aide au sommeil et occupe les moments à risque. Pas besoin de sport intense : marcher compte.&quot;,&quot;Fais 20 minutes d&#x27;activité physique aujourd&#x27;hui, de préférence à l&#x27;heure où tu consommais.&quot;,&quot;move&quot;,{}],[&quot;Soirées et week-ends&quot;,&quot;Les soirées entre amis et les week-ends sont des moments à risque. Un plan évite de se retrouver coincé.&quot;,&quot;Regarde les 2 prochains événements. Décide à l&#x27;avance ce que tu feras, avec qui, et ce que tu diras si on te propose.&quot;,&quot;planner&quot;,{}],[&quot;En parler à quelqu&#x27;un&quot;,&quot;Garder ça pour soi entretient la honte. Parler à un proche de confiance, ou à Drogues info service (0 800 23 13 13, gratuit et anonyme), allège.&quot;,&quot;Choisis une personne de confiance et dis-lui que tu veux réduire ou arrêter. Dis-lui ce dont tu as besoin.&quot;,&quot;message&quot;,{}],[&quot;Les pensées-pièges&quot;,&quot;« Juste pour dormir », « c&#x27;est naturel », « demain j&#x27;arrête ». Ces phrases sont normales. Les repérer leur enlève du pouvoir.&quot;,&quot;Écris 3 phrases que tu te dis avant de consommer. À côté de chacune, une réponse honnête et courte.&quot;,&quot;pieges&quot;,{}],[&quot;Te récompenser autrement&quot;,&quot;Ton cerveau aime les petites récompenses. Tu peux en garder sans consommer : un bon repas, un loisir, une sortie avec l&#x27;argent économisé.&quot;,&quot;Choisis une récompense pour chaque semaine tenue. Calcule ce que ça coûte et compare avec ce que tu aurais dépensé.&quot;,&quot;rewards&quot;,{}],[&quot;Bilan de la semaine 3&quot;,&quot;Trois semaines de pratique. Regarde ce qui a changé : sommeil, énergie, humeur, argent, motivation.&quot;,&quot;Écris 3 changements que tu constates, même petits.&quot;,&quot;bilan&quot;,{}],[&quot;Un dérapage n&#x27;est pas une rechute&quot;,&quot;Si tu consommes, ce n&#x27;est pas la fin. C&#x27;est une information : qu&#x27;est-ce qui l&#x27;a déclenché ? Reprends le fil dès que possible, sans te punir.&quot;,&quot;Écris ce que tu feras après un dérapage : t&#x27;arrêter là, noter le déclencheur, le dire à quelqu&#x27;un.&quot;,&quot;scenario&quot;,{}],[&quot;Ton plan en cas de rechute&quot;,&quot;Prévoir le plan B enlève la peur. Qu&#x27;est-ce qui m&#x27;a fait craquer ? Qu&#x27;est-ce que je change ? Qui je préviens ?&quot;,&quot;Rédige un plan en 3 points : ce que je fais dans l&#x27;heure, ce que j&#x27;analyse, ce que j&#x27;ajuste. Note le 0 800 23 13 13.&quot;,&quot;relapse&quot;,{}],[&quot;Ce que ton corps récupère&quot;,&quot;Au fil des semaines, beaucoup de personnes retrouvent des nuits plus profondes, de l&#x27;énergie, de la concentration et de la motivation. Chaque personne a son rythme.&quot;,&quot;Note 3 changements que tu constates depuis le début, même petits.&quot;,&quot;timeline&quot;,{}],[&quot;Les moments à risque à venir&quot;,&quot;Vacances, concerts, soirées, périodes de stress : certains moments vont remettre l&#x27;envie en jeu. Les prévoir, c&#x27;est déjà y être préparé.&quot;,&quot;Liste les 3 prochains moments à risque et ce que tu feras à chaque fois.&quot;,&quot;calendar&quot;,{}],[&quot;Mieux dormir&quot;,&quot;Le sommeil est souvent perturbé les premières semaines, puis s&#x27;améliore. Une routine du soir régulière aide beaucoup.&quot;,&quot;Fixe une heure de coucher. Téléphone hors du lit. Prévois une activité calme avant de dormir.&quot;,&quot;evening&quot;,{}],[&quot;L&#x27;argent économisé&quot;,&quot;Cet argent est ton vrai gain. Le chiffrer le rend concret et motive.&quot;,&quot;Reprends ton chiffre du jour 2. Écris ce que tu veux faire avec cet argent.&quot;,&quot;gain&quot;,{}],[&quot;Ton réseau d&#x27;aide&quot;,&quot;Si tu as du mal à tenir, ou si tu consommais beaucoup depuis longtemps, un professionnel peut t&#x27;aider gratuitement : consultation jeunes consommateurs, ton médecin, Drogues info service.&quot;,&quot;Note le 0 800 23 13 13 et le nom de ton médecin. Si tu vas mal, le 3114 répond 24h/24.&quot;,&quot;support&quot;,{}],[&quot;Lettre à toi-même&quot;,&quot;Ce que tu as fait pendant 30 jours mérite d&#x27;être écrit. Cette lettre te servira les jours où tu auras oublié pourquoi c&#x27;était important.&quot;,&quot;Écris-toi une lettre pour dans 3 mois : ce que tu as appris, ce que tu veux avoir gardé, ce que tu te souhaites.&quot;,&quot;letter&quot;,{}],[&quot;Et maintenant ?&quot;,&quot;30 jours, c&#x27;est un début, pas une fin. Garde les règles qui ont marché, et refais le point une fois par mois.&quot;,&quot;Choisis les 3 règles à garder. Plante un rappel mensuel dans ton agenda.&quot;,&quot;final&quot;,{}]]},&quot;drogues-de-soiree&quot;:{&quot;kit&quot;:{&quot;raisons&quot;:[&quot;Ma santé&quot;,&quot;Mon argent&quot;,&quot;Mon sommeil&quot;,&quot;Mes relations&quot;,&quot;Mon humeur&quot;,&quot;Mon énergie&quot;,&quot;Mes projets&quot;,&quot;Ma confiance en moi&quot;,&quot;Ma liberté&quot;,&quot;Moins de descentes&quot;],&quot;pros&quot;:[&quot;L&#x27;énergie&quot;,&quot;La confiance en moi&quot;,&quot;Appartenir au groupe&quot;,&quot;Faire la fête plus longtemps&quot;,&quot;Oublier mes soucis&quot;,&quot;Me désinhiber&quot;],&quot;cons&quot;:[&quot;Je dépense beaucoup&quot;,&quot;La descente&quot;,&quot;Je dors mal&quot;,&quot;Mon humeur baisse après&quot;,&quot;Mon cœur s&#x27;emballe&quot;,&quot;Je m&#x27;éloigne de mes proches&quot;,&quot;Je perds le contrôle&quot;,&quot;J&#x27;ai peur de ce que je fais&quot;],&quot;calc&quot;:{&quot;q&quot;:&quot;Combien dépenses-tu par mois ?&quot;,&quot;unit&quot;:&quot;€ par mois&quot;,&quot;min&quot;:0,&quot;max&quot;:1000,&quot;step&quot;:10,&quot;def&quot;:150,&quot;mult&quot;:12,&quot;out&quot;:&quot;€ par an&quot;,&quot;div&quot;:0,&quot;divLabel&quot;:&quot;&quot;,&quot;eq&quot;:[500,&quot;week-ends en voyage&quot;],&quot;gain&quot;:&quot;économisés chaque année&quot;},&quot;env&quot;:[&quot;Supprimer les contacts et conversations&quot;,&quot;Prévoir mes soirées à l&#x27;avance&quot;,&quot;Réduire l&#x27;alcool, qui lève les barrières&quot;,&quot;Laisser l&#x27;argent liquide à la maison&quot;,&quot;Prévenir un ami de ma décision&quot;,&quot;Éviter les soirées à risque au début&quot;],&quot;triggers&quot;:[&quot;Les soirées en club&quot;,&quot;Certains amis&quot;,&quot;L&#x27;alcool&quot;,&quot;La fin de semaine&quot;,&quot;Le stress&quot;,&quot;L&#x27;ennui&quot;,&quot;Quand j&#x27;ai de l&#x27;argent sur moi&quot;,&quot;Les festivals&quot;,&quot;Après une dispute&quot;,&quot;Quand je me sens seul&quot;],&quot;actions&quot;:[&quot;Appeler un ami&quot;,&quot;Sortir marcher&quot;,&quot;Respirer lentement&quot;,&quot;Boire de l&#x27;eau&quot;,&quot;Faire du sport&quot;,&quot;Danser sans produit&quot;,&quot;Rentrer plus tôt&quot;,&quot;Écouter de la musique&quot;,&quot;Changer de pièce&quot;,&quot;Écrire ce que je ressens&quot;],&quot;distract&quot;:[&quot;Un ami : « t&#x27;as de quoi ? »&quot;,&quot;Le vendredi soir&quot;,&quot;L&#x27;odeur de la soirée&quot;,&quot;Un message de ton contact&quot;,&quot;Pause toilettes&quot;,&quot;Une chanson qui rappelle des soirées&quot;],&quot;myths&quot;:[[&quot;On a besoin d&#x27;un produit pour s&#x27;amuser.&quot;,false,&quot;La confiance et l&#x27;énergie reviennent peu à peu, avec le sommeil et le sport.&quot;],[&quot;L&#x27;alcool n&#x27;a pas d&#x27;effet sur l&#x27;envie.&quot;,false,&quot;L&#x27;alcool baisse la vigilance et augmente les envies. Réduire l&#x27;alcool aide à tenir.&quot;],[&quot;La descente est normale et ne dure que quelques jours.&quot;,true,&quot;Fatigue et humeur basse sont fréquentes. Dormir, manger et parler aident.&quot;],[&quot;Un dérapage = tout est à refaire.&quot;,false,&quot;Un dérapage est une information. On reprend le fil.&quot;],[&quot;Planifier sa soirée aide à ne pas craquer.&quot;,true,&quot;Heure de départ, boisson, personne de confiance : ça réduit les décisions sous pression.&quot;],[&quot;Il vaut mieux consommer seul pour ne pas se faire repérer.&quot;,false,&quot;Consommer seul est plus risqué. En cas de rechute, ne reste pas seul et appelle le 15 en cas de malaise.&quot;]],&quot;pairs&quot;:[[&quot;Soirée en club&quot;,&quot;Partir à une heure fixée&quot;],[&quot;Un ami propose&quot;,&quot;« Non merci, j&#x27;arrête »&quot;],[&quot;L&#x27;alcool&quot;,&quot;Boisson sans alcool&quot;],[&quot;La descente&quot;,&quot;Dormir et manger&quot;],[&quot;Le vendredi soir&quot;,&quot;Un plan prévu à l&#x27;avance&quot;]],&quot;pieges&quot;:[[&quot;Juste ce soir.&quot;,true,&quot;« Juste ce soir » est la phrase qui relance le cycle.&quot;],[&quot;Tout le monde le fait.&quot;,true,&quot;Beaucoup de gens ne le font pas, et passent de bonnes soirées.&quot;],[&quot;Je peux partir plus tôt si ça devient dur.&quot;,false,&quot;Oui. Un plan de sortie est un super outil.&quot;],[&quot;Je contrôle, une fois ne compte pas.&quot;,true,&quot;Le contrôle se perd souvent d&#x27;un coup. Mieux vaut ne pas tester.&quot;],[&quot;Je peux appeler Drogues info service.&quot;,false,&quot;Oui : 0 800 23 13 13, gratuit et anonyme.&quot;],[&quot;J&#x27;ai besoin de ça pour être drôle.&quot;,true,&quot;Ta personnalité est toujours là. La confiance revient avec le temps.&quot;],[&quot;Un dérapage n&#x27;est pas un échec.&quot;,false,&quot;Exact. Reprends le fil sans te punir.&quot;],[&quot;C&#x27;est le seul moyen de décompresser.&quot;,true,&quot;Le sport, la musique, le sommeil et les amis marchent aussi.&quot;]],&quot;scenarios&quot;:[{&quot;q&quot;:&quot;Vendredi soir, en club. Un ami te propose de partager quelque chose.&quot;,&quot;c&quot;:[[&quot;Je dis « non merci, j&#x27;arrête » et je prends de l&#x27;eau&quot;,2,&quot;Simple et sans justification. Tu protèges ta décision.&quot;],[&quot;J&#x27;accepte juste pour cette fois&quot;,0,&quot;« Juste cette fois » est le piège classique.&quot;],[&quot;Je pars aux toilettes et je réfléchis&quot;,1,&quot;Pause utile, mais prépare ta réponse à l&#x27;avance.&quot;]]},{&quot;q&quot;:&quot;Dimanche, descente : tu es fatigué, triste, et tu penses à reprendre pour te sentir mieux.&quot;,&quot;c&quot;:[[&quot;Je dors, je mange et j&#x27;appelle un ami&quot;,2,&quot;Tu laisses la descente passer et tu t&#x27;appuies sur quelqu&#x27;un.&quot;],[&quot;Je reprends un peu pour remonter&quot;,0,&quot;Ça repousse la descente et relance le cycle.&quot;],[&quot;Je me dis que je suis nul&quot;,1,&quot;Ce jugement fatigue. Parle-toi comme à un ami.&quot;]]},{&quot;q&quot;:&quot;Tu as craqué ce week-end. Tu te sens mal.&quot;,&quot;c&quot;:[[&quot;Je me dis que c&#x27;est foutu&quot;,0,&quot;Un dérapage n&#x27;est pas une rechute. Ne te punis pas.&quot;],[&quot;Je note ce qui m&#x27;a déclenché et je reprends dès aujourd&#x27;hui&quot;,2,&quot;C&#x27;est exactement ça. Et si malaise, appelle le 15.&quot;],[&quot;Je ne dis rien à personne&quot;,1,&quot;Parler à quelqu&#x27;un de confiance aide énormément.&quot;]]}],&quot;relapse&quot;:{&quot;heure&quot;:[&quot;Je ne reste pas seul et je bois de l&#x27;eau&quot;,&quot;En cas de malaise, j&#x27;appelle le 15 ou le 112&quot;,&quot;Je note ce qui s&#x27;est passé&quot;],&quot;ajuster&quot;:[&quot;Je réduis l&#x27;alcool en soirée&quot;,&quot;Je change de lieux ou d&#x27;amis&quot;,&quot;Je consulte une CJC ou mon médecin&quot;],&quot;prevenir&quot;:[&quot;Un ami proche&quot;,&quot;Mon frère ou ma sœur&quot;,&quot;Mon conjoint ou ma conjointe&quot;,&quot;Un professionnel&quot;,&quot;Personne, je gère seul&quot;]},&quot;events&quot;:[&quot;Soirée en club&quot;,&quot;Festival&quot;,&quot;Anniversaire&quot;,&quot;Nouvel an&quot;,&quot;Dimanche de descente&quot;,&quot;Période de stress&quot;],&quot;messages&quot;:[&quot;J&#x27;arrête les produits en soirée. Peux-tu me garder à l&#x27;œil ce week-end ?&quot;,&quot;Je sors ce soir sans rien prendre. Peux-tu me soutenir ?&quot;],&quot;rules&quot;:[&quot;Garder mes barrières en place&quot;,&quot;Utiliser le bouton SOS à chaque envie&quot;,&quot;Prévoir mes moments à risque&quot;,&quot;Parler à quelqu&#x27;un quand c&#x27;est dur&quot;,&quot;Bouger régulièrement&quot;,&quot;Bien dormir&quot;,&quot;Me récompenser autrement&quot;,&quot;Faire un point chaque mois&quot;,&quot;Ne jamais consommer seul&quot;,&quot;Partir à l&#x27;heure prévue&quot;],&quot;identite&quot;:[&quot;qui décide de son temps&quot;,&quot;qui tient ses engagements&quot;,&quot;qui prend soin de lui&quot;,&quot;qui sait demander de l&#x27;aide&quot;,&quot;qui ose dire non&quot;,&quot;qui se réveille avec de l&#x27;énergie&quot;,&quot;qui choisit ses soirées&quot;,&quot;qui protège son argent&quot;,&quot;qui est présent avec ses proches&quot;,&quot;qui avance sur ses projets&quot;,&quot;qui se respecte&quot;,&quot;qui ne se juge plus durement&quot;],&quot;rewards&quot;:[&quot;Un bon repas au restaurant&quot;,&quot;Une sortie au cinéma&quot;,&quot;Un week-end dans la nature&quot;,&quot;Un vêtement qui me plaît&quot;,&quot;Un moment avec un ami&quot;,&quot;Une journée sans rien utrement.&quot;,&quot;balance&quot;,{}],[&quot;Tes déclencheurs&quot;,&quot;Certains lieux, certains amis, l&#x27;alcool, le vendredi soir, la fatigue : ce sont des déclencheurs. Quand tu les repères, tu les vois venir.&quot;,&quot;Pense à tes 3 dernières soirées. À chaque fois, note ce qui t&#x27;a donné envie et à quel moment.&quot;,&quot;heat&quot;,{}],[&quot;Verrouiller l&#x27;accès&quot;,&quot;Moins c&#x27;est facile d&#x27;en avoir, moins tu peux craquer sur un coup de tête. Ton contact, ton argent liquide, tes messages : tout ça peut se couper à l&#x27;avance.&quot;,&quot;Supprime les contacts et les conversations. Décide combien d&#x27;argent liquide tu emportes en soirée : le minimum.&quot;,&quot;checklist&quot;,{}],[&quot;Le plan « si… alors… »&quot;,&quot;Un plan précis marche mieux qu&#x27;une bonne intention. Tu décides à l&#x27;avance quoi faire quand le moment arrive, pour ne pas avoir à choisir sous l&#x27;impulsion, avec du bruit, de la fatigue et de l&#x27;alcool.&quot;,&quot;Écris 3 phrases : « Si on me propose, alors je dis… / si la fatigue arrive, alors je… / si je suis seul, alors je… »&quot;,&quot;pairs&quot;,{}],[&quot;Bilan de la semaine 1&quot;,&quot;Une semaine pour comprendre. Tu sais maintenant ce que tu consommes, ce que ça t&#x27;apporte et ce qui se déclenche. C&#x27;est suffisant pour attaquer la suite.&quot;,&quot;Relis tes notes. Complète : « Ce que j&#x27;ai appris sur moi cette semaine, c&#x27;est… ». Choisis une soirée à préparer cette semaine.&quot;,&quot;bilan&quot;,{}],[&quot;Comprendre l&#x27;envie&quot;,&quot;L&#x27;envie monte, atteint un pic, puis retombe, même si tu ne fais rien. Savoir que ça passe change tout : une envie n&#x27;est pas un ordre.&quot;,&quot;Quand l&#x27;envie arrive, attends 10 minutes avant d&#x27;agir. Observe où tu la sens dans le corps, et ce qu&#x27;elle devient.&quot;,&quot;wave&quot;,{}],[&quot;Tenir 10 minutes&quot;,&quot;Quand une envie arrive, ne te dis pas « jamais », dis-toi « dans 10 minutes ». Souvent, elle est partie avant. Si elle est encore là, tu décides en conscience.&quot;,&quot;Utilise le bouton SOS à chaque envie aujourd&#x27;hui. Compte combien sont passées.&quot;,&quot;hold&quot;,{}],[&quot;Respirer pour retomber&quot;,&quot;Une respiration lente, avec un souffle plus long que l&#x27;inspiration, aide à calmer le corps en quelques minutes. C&#x27;est un outil que tu emportes partout, y compris en soirée.&quot;,&quot;Fais 2 minutes de respiration (inspire 4 secondes, souffle 6), deux fois dans la journée, dont une avant de sortir.&quot;,&quot;breathe&quot;,{}],[&quot;Gérer la descente&quot;,&quot;Fatigue, humeur basse, anxiété : la descente donne envie de reprendre « pour remonter ». Elle passe avec le sommeil, la nourriture et un peu de patience.&quot;,&quot;Prépare ta prochaine descente : un repas, de l&#x27;eau, un film, un ami joignable, un lit propre. Tu n&#x27;as pas à la traverser seul.&quot;,&quot;slot&quot;,{}],[&quot;Stress, fatigue et humeur&quot;,&quot;On consomme davantage quand on est stressé ou fatigué. Si tu t&#x27;accordes de vraies pauses à ces moments, le produit devient moins nécessaire. Si l&#x27;humeur reste très basse, parles-en à un professionnel.&quot;,&quot;Prévois 3 pauses de 5 minutes aujourd&#x27;hui : étirements, fenêtre ouverte, verre d&#x27;eau, marche. Note comment tu te sens après.&quot;,&quot;pause&quot;,{}],[&quot;Idées reçues sur les produits de soirée&quot;,&quot;« Tout le monde en prend », « j&#x27;ai besoin de ça pour m&#x27;amuser », « je contrôle ». Certaines idées reçues retiennent au même endroit. Les regarder d&#x27;un œil honnête enlève du pouvoir à la routine.&quot;,&quot;Écris l&#x27;idée reçue qui te parle le plus et ce que tu en penses maintenant.&quot;,&quot;myths&quot;,{}],[&quot;Bilan de la semaine 2&quot;,&quot;Tu as appris à voir l&#x27;envie venir, à l&#x27;attendre et à préparer la descente. Chaque jour compte, même imparfait.&quot;,&quot;Regarde ton compteur de jours sans et d&#x27;envies surmontées. Note le moment le plus dur et ce qui t&#x27;a aidé.&quot;,&quot;bilan&quot;,{}],[&quot;Faire la fête autrement&quot;,&quot;Danser, rire, rencontrer des gens : tout ça n&#x27;a pas besoin d&#x27;un produit. Construis ta boîte à outils pour sortir sans : une boisson sans alcool en main, un point de départ, un ami de confiance.&quot;,&quot;Choisis 3 actions pour ta prochaine soirée et garde-les dans une note.&quot;,&quot;toolbox&quot;,{}],[&quot;Bouger&quot;,&quot;Le sport aide au sommeil, à l&#x27;humeur et à la confiance. Pas besoin de sport intense : danse, marche, vélo comptent.&quot;,&quot;Fais 20 minutes d&#x27;activité physique aujourd&#x27;hui, de préférence à l&#x27;heure où tu aurais préparé ta soirée.&quot;,&quot;move&quot;,{}],[&quot;Soirées et week-ends&quot;,&quot;Les soirées, les festivals, les anniversaires sont des moments à risque. Un plan évite de se retrouver coincé : qui, où, jusqu&#x27;à quand, avec quel budget.&quot;,&quot;Regarde les 2 prochains événements. Décide à l&#x27;avance ce que tu feras, avec qui, à quelle heure tu pars.&quot;,&quot;planner&quot;,{}],[&quot;En parler à quelqu&#x27;un&quot;,&quot;Garder ça pour soi entretient la honte. Parler à un ami de confiance, ou à Drogues info service (0 800 23 13 13, gratuit et anonyme), allège.&quot;,&quot;Choisis une personne de confiance et dis-lui que tu veux réduire ou arrêter. Dis-lui ce dont tu as besoin.&quot;,&quot;message&quot;,{}],[&quot;Les pensées-pièges&quot;,&quot;« Juste ce soir », « tout le monde le fait », « je contrôle ». Ces phrases sont normales. Les repérer leur enlève du pouvoir.&quot;,&quot;Écris 3 phrases que tu te dis avant de consommer. À côté de chacune, une réponse honnête et courte.&quot;,&quot;pieges&quot;,{}],[&quot;Te récompenser autrement&quot;,&quot;Ton cerveau aime les petites récompenses. Tu peux en garder sans consommer : un bon repas, une sortie, un week-end avec l&#x27;argent économisé.&quot;,&quot;Choisis une récompense pour chaque semaine tenue. Calcule ce que ça coûte et compare avec ce que tu aurais dépensé.&quot;,&quot;rewards&quot;,{}],[&quot;Bilan de la semaine 3&quot;,&quot;Trois semaines de pratique. Regarde ce qui a changé : sommeil, énergie, humeur, argent, relations.&quot;,&quot;Écris 3 changements que tu constates, même petits.&quot;,&quot;bilan&quot;,{}],[&quot;Un dérapage n&#x27;est pas une rechute&quot;,&quot;Si tu consommes, ce n&#x27;est pas la fin. C&#x27;est une information : qu&#x27;est-ce qui l&#x27;a déclenché ? Ne reste pas seul, bois de l&#x27;eau, et reprends le fil dès que possible, sans te punir.&quot;,&quot;Écris ce que tu feras après un dérapage : t&#x27;arrêter là, ne pas rester seul, noter le déclencheur, le dire à quelqu&#x27;un.&quot;,&quot;scenario&quot;,{}],[&quot;Ton plan en cas de rechute&quot;,&quot;Prévoir le plan B enlève la peur. Qu&#x27;est-ce qui m&#x27;a fait craquer ? Qu&#x27;est-ce que je change ? Qui je préviens ? En cas de malaise : 15 ou 112.&quot;,&quot;Rédige un plan en 3 points : ce que je fais dans l&#x27;heure, ce que j&#x27;analyse, ce que j&#x27;ajuste. Note le 0 800 23 13 13 et le 15.&quot;,&quot;relapse&quot;,{}],[&quot;Qui tu deviens&quot;,&quot;Au fil des semaines, tu n&#x27;es plus la même personne qu&#x27;au jour 1. Nommer qui tu deviens rend le changement concret et te donne une direction.&quot;,&quot;Écris une phrase : « Je deviens quelqu&#x27;un qui… ». Relis-la le matin.&quot;,&quot;identity&quot;,{}],[&quot;Les moments à risque à venir&quot;,&quot;Festivals, anniversaires, nouvel an, périodes de stress : certains moments vont remettre l&#x27;envie en jeu. Les prévoir, c&#x27;est déjà y être préparé.&quot;,&quot;Liste les 3 prochains moments à risque et ce que tu feras à chaque fois.&quot;,&quot;calendar&quot;,{}],[&quot;Mieux dormir&quot;,&quot;Le sommeil est souvent perturbé les premières semaines, puis s&#x27;améliore. Une routine du soir régulière aide beaucoup.&quot;,&quot;Fixe une heure de coucher. Téléphone hors du lit. Prévois une activité calme avant de dormir.&quot;,&quot;evening&quot;,{}],[&quot;L&#x27;argent que tu récupères&quot;,&quot;Cet argent est ton vrai gain. Le chiffrer le rend concret et motive.&quot;,&quot;Reprends ton chiffre du jour 2. Écris ce que tu veux faire avec cet argent.&quot;,&quot;gain&quot;,{}],[&quot;Ton réseau d&#x27;aide&quot;,&quot;Si tu as du mal à tenir, un professionnel peut t&#x27;aider gratuitement : consultation jeunes consommateurs, CSAPA, ton médecin, Drogues info service. Ce n&#x27;est pas un échec.&quot;,&quot;Note le 0 800 23 13 13 et le nom de ton médecin. Si tu vas mal, le 3114 répond 24h/24.&quot;,&quot;support&quot;,{}],[&quot;Lettre à toi-même&quot;,&quot;Ce que tu as fait pendant 30 jours mérite d&#x27;être écrit. Cette lettre te servira les jours où tu auras oublié pourquoi c&#x27;était important.&quot;,&quot;Écris-toi une lettre pour dans 3 mois : ce que tu as appris, ce que tu veux avoir gardé, ce que tu te souhaites.&quot;,&quot;letter&quot;,{}],[&quot;Et maintenant ?&quot;,&quot;30 jours, c&#x27;est un début, pas une fin. Garde les règles qui ont marché, et refais le point une fois par mois. Ne reste jamais seul en cas de rechute.&quot;,&quot;Choisis les 3 règles à garder. Plante un rappel mensuel dans ton agenda.&quot;,&quot;final&quot;,{}]]}};
const okPaid = (s: any) =&gt; s.payment_status === &#x27;paid&#x27; || s.payment_status === &#x27;no_payment_required&#x27;;
const PROGS: Record&lt;string, { cents: number; name: string }&gt; = {
  &#x27;ecrans&#x27;: { cents: 999, name: &#x27;Écrans et réseaux (30 jours)&#x27; },
  &#x27;pornographie&#x27;: { cents: 999, name: &#x27;Pornographie (30 jours)&#x27; },
  &#x27;jeux-d-argent&#x27;: { cents: 999, name: &#x27;Jeux d\&#x27;argent et paris (30 jours)&#x27; },
  &#x27;vape-tabac&#x27;: { cents: 999, name: &#x27;Vape et tabac (30 jours)&#x27; },
  &#x27;cannabis&#x27;: { cents: 999, name: &#x27;Cannabis (30 jours)&#x27; },
  &#x27;drogues-de-soiree&#x27;: { cents: 999, name: &#x27;Cocaïne et drogues de soirée (30 jours)&#x27; },
  &#x27;pack&#x27;: { cents: 2499, name: &#x27;Les 6 programmes&#x27; },
};

async function stripe(path: string, body?: URLSearchParams) {
  const r = await fetch(&#x27;https://api.stripe.com/v1/&#x27; + path, {
    method: body ? &#x27;POST&#x27; : &#x27;GET&#x27;, body,
    headers: { Authorization: &#x27;Bearer &#x27; + SK, &#x27;Content-Type&#x27;: &#x27;application/x-www-form-urlencoded&#x27; },
  });
  return r.json();
}

Deno.serve(async (req) =&gt; {
  if (req.method === &#x27;OPTIONS&#x27;) return new Response(&#x27;ok&#x27;, { headers: CORS });
  if (!SK) return json({ error: &#x27;paiement non configuré&#x27; }, 500);
  const body = await req.json().catch(() =&gt; ({}));
  const { action, id, cle, sid } = body;

  if (action === &#x27;prog_checkout&#x27;) {
    const prog = String(body.prog || &#x27;&#x27;), P = PROGS[prog];
    if (!P) return json({ error: &#x27;demande invalide&#x27; }, 400);
    const p = new URLSearchParams({
      mode: &#x27;payment&#x27;, locale: &#x27;fr&#x27;, allow_promotion_codes: &#x27;true&#x27;,
      &#x27;line_items[0][quantity]&#x27;: &#x27;1&#x27;,
      &#x27;line_items[0][price_data][currency]&#x27;: &#x27;eur&#x27;,
      &#x27;line_items[0][price_data][unit_amount]&#x27;: String(P.cents),
      &#x27;line_items[0][price_data][product_data][name]&#x27;: &#x27;Lookmiz · &#x27; + P.name,
      success_url: SITE + &#x27;app/?achat=1&amp;sid={CHECKOUT_SESSION_ID}&#x27;,
      cancel_url: SITE + (prog === &#x27;pack&#x27; ? &#x27;#tarifs&#x27; : &#x27;programmes/&#x27; + prog + &#x27;/#achat&#x27;),
      &#x27;metadata[prog]&#x27;: prog,
    });
    const s = await stripe(&#x27;checkout/sessions&#x27;, p);
    if (!s.url) return json({ error: s.error?.message || &#x27;Stripe a refusé&#x27; }, 502);
    return json({ url: s.url });
  }
  if (action === &#x27;prog_verify&#x27;) {
    if (!/^cs_[A-Za-z0-9_]+$/.test(String(sid || &#x27;&#x27;))) return json({ paid: false });
    const s = await stripe(&#x27;checkout/sessions/&#x27; + sid), prog = s.metadata?.prog;
    return json(okPaid(s) &amp;&amp; prog &amp;&amp; PROGS[prog] ? { paid: true, prog } : { paid: false });
  }
  if (action === &#x27;prog_day&#x27;) {
    const prog = String(body.prog || &#x27;&#x27;), list = Array.isArray(body.sids) ? body.sids.slice(0, 5) : [];
    if (!DAYS[prog]) return json({ error: &#x27;programme inconnu&#x27; }, 400);
    for (const one of list) {
      if (!/^cs_[A-Za-z0-9_]+$/.test(String(one))) continue;
      const s = await stripe(&#x27;checkout/sessions/&#x27; + one), pr = s.metadata?.prog;
      if (okPaid(s) &amp;&amp; (pr === prog || pr === &#x27;pack&#x27;)) return json({ days: DAYS[prog].days, kit: DAYS[prog].kit });
    }
    return json({ error: &#x27;accès refusé&#x27; }, 403);
  }

  if (!/^[a-z0-9]{10,20}$/.test(id || &#x27;&#x27;)) return json({ error: &#x27;carte invalide&#x27; }, 400);
  const { data: carte } = await admin.from(&#x27;cartes&#x27;).select(&#x27;cle, data, paid&#x27;).eq(&#x27;id&#x27;, id).maybeSingle();
  if (!carte) return json({ error: &#x27;carte introuvable&#x27; }, 404);

  if (action === &#x27;checkout&#x27;) {
    if (carte.cle !== cle) return json({ error: &#x27;refusé&#x27; }, 403);
    if (carte.paid) return json({ paid: true });
    const dest = Array.isArray(carte.data?.f?.dest) ? carte.data.f.dest.length : 0;
    const extra = Math.max(0, dest - 1);            // 1,20 € la carte, puis 0,60 € par personne ajoutée
    const p = new URLSearchParams({
      mode: &#x27;payment&#x27;,
      &#x27;line_items[0][quantity]&#x27;: &#x27;1&#x27;,
      &#x27;line_items[0][price_data][currency]&#x27;: &#x27;eur&#x27;,
      &#x27;line_items[0][price_data][unit_amount]&#x27;: &#x27;120&#x27;,
      &#x27;line_items[0][price_data][product_data][name]&#x27;: &#x27;Carte Lookmiz animée&#x27;,
      success_url: SITE + &#x27;?paye=&#x27; + id + &#x27;&amp;sid={CHECKOUT_SESSION_ID}&#x27;,
      cancel_url: SITE + &#x27;#mes-cartes&#x27;,
      &#x27;metadata[carte]&#x27;: id,
    });
    if (extra) { p.set(&#x27;line_items[1][quantity]&#x27;, String(extra)); p.set(&#x27;line_items[1][price_data][currency]&#x27;, &#x27;eur&#x27;); p.set(&#x27;line_items[1][price_data][unit_amount]&#x27;, &#x27;60&#x27;); p.set(&#x27;line_items[1][price_data][product_data][name]&#x27;, &#x27;Personne supplémentaire&#x27;); }
    const s = await stripe(&#x27;checkout/sessions&#x27;, p);
    if (!s.url) return json({ error: s.error?.message || &#x27;Stripe a refusé&#x27; }, 502);
    return json({ url: s.url });
  }

  if (action === &#x27;verify&#x27;) {
    if (carte.paid) return json({ paid: true });
    if (!/^cs_[A-Za-z0-9_]+$/.test(sid || &#x27;&#x27;)) return json({ paid: false });
    const s = await stripe(&#x27;checkout/sessions/&#x27; + sid);
    const ok = s.payment_status === &#x27;paid&#x27; &amp;&amp; s.metadata?.carte === id;
    if (ok) await admin.from(&#x27;cartes&#x27;).update({ paid: true }).eq(&#x27;id&#x27;, id);
    return json({ paid: ok });
  }
  return json({ error: &#x27;demande invalide&#x27; }, 400);
});
